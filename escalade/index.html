<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escalade EPS</title>
<style>
:root{--bg:#eceff0;--ink:#16252d;--card:#fff;--ac:#00747a;--hi:#f2c230;--mut:#5d6e76;--ln:#cfd7da;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:18px/1.45 Verdana,Geneva,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:20px;margin-right:auto}
nav{display:flex;gap:6px;overflow-x:auto;background:var(--ink);padding:0 12px}
nav button{flex:none;background:none;border:0;color:#b9c7cd;font:inherit;font-weight:700;padding:14px 16px;border-bottom:4px solid transparent}
nav button.on{color:#fff;border-color:var(--hi)}
main{max-width:980px;margin:0 auto;padding:16px}
.sub{display:flex;gap:8px;margin-bottom:14px}
.sub button{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;min-height:48px}
.b.g{background:#fff;color:var(--ink);border:2px solid var(--ln)}
.b.on{background:var(--hi);color:var(--ink)}
.b.d{background:var(--bad)}
input,select,textarea{width:100%;padding:11px;border:2px solid var(--ln);border-radius:10px;background:#fff;min-height:48px}
textarea{min-height:90px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--ln)}
h2{font-size:26px;margin:18px 0 6px}h3{font-size:21px;margin:14px 0 4px;color:var(--ac)}
p{margin:6px 0;white-space:pre-wrap}
video{width:100%;max-height:60vh;background:#000;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.row .fix{flex:none}
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;padding:0}.step output{min-width:44px;text-align:center;font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #0004;vertical-align:-4px;margin-right:6px}
label.l{display:block;font-weight:700;margin:14px 0 6px}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tb button{min-height:40px;padding:6px 12px}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--ln);padding:6px;text-align:left}
.qrs{display:flex;gap:14px;flex-wrap:wrap}.qrs figure{margin:0;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border:0;border-radius:18px;color:#fff;text-align:left;padding:22px;min-height:min(30vh,220px);display:flex;flex-direction:column;justify-content:center;font:inherit}
.tile b{font-size:30px;line-height:1.15}.tile span{opacity:.85;font-size:16px}
.tile.wide{grid-column:1/-1;min-height:120px}
.tile.tprof{outline:3px dashed var(--hi);outline-offset:-6px}
.vg{grid-template-columns:repeat(5,1fr)}.vg .b{font-size:26px;min-height:64px}
.colb{display:flex;align-items:center;gap:12px;font-size:22px;min-height:64px;text-align:left}
.colb .dot,.vl .dot{width:30px;height:30px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf{display:flex;align-items:center;gap:18px;border:4px solid var(--ln);border-radius:16px;padding:18px;margin:12px 0;font-size:24px}
.conf .dot{width:56px;height:56px;margin:0}
.cot{font-size:34px;font-weight:700;color:var(--ac)}
.sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#e3f1f2;border-radius:10px;padding:10px 12px;font-weight:700}
.sum .b{min-height:38px;padding:4px 12px;margin-left:auto}
.crit{border-top:1px solid var(--ln);padding:14px 0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.nr{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);background:#f1f4f5;padding:6px 12px;border-radius:999px;cursor:pointer}
.nr input{width:22px;height:22px;min-height:0;margin:0;padding:0}
.crit.off .cv{opacity:.3;pointer-events:none}
.stp{margin:0 0 4px;font-size:15px}
.vl{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--ln);font-size:22px}
.vl b{margin-left:auto;font-size:30px;color:var(--ac)}
.ok{text-align:center;padding:28px 16px}.ok b{font-size:28px;display:block;margin-bottom:16px}
@media(max-width:600px){.tiles{grid-template-columns:1fr}}
small,.mut{color:var(--mut)}
.blk{border-left:4px solid var(--ln);padding-left:10px;margin:10px 0}
@media(max-width:600px){body{font-size:16px}.grid{grid-template-columns:repeat(4,1fr)}}
#logo{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:default}
#tm{display:flex;gap:8px;flex-wrap:wrap}
#tm .b{min-height:40px;padding:6px 12px;font-size:15px}
.prof{background:#fff8e1;border:2px dashed var(--hi)}
.fiche h3{margin-top:0;font-size:24px}
.fiche video{margin:8px 0}
.pick{display:block;text-align:center;cursor:pointer}
.clsb{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;min-height:64px}
.clsb small{color:inherit;opacity:.7;font-weight:400;font-size:14px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln);font-weight:700}
.ckl{display:flex;align-items:center;gap:14px;flex:1;cursor:pointer;min-height:44px}
.rq{flex:none;border:2px solid var(--ln);background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--mut);min-height:40px}
.rq.on{background:var(--bad);border-color:var(--bad);color:#fff}
.rq:disabled{opacity:.35}
.ob{font-size:15px;font-weight:700;color:#fff;background:var(--bad);padding:6px 12px;border-radius:999px}
.crit.miss{background:#fdecea;border-radius:12px;padding:14px 10px;outline:3px solid var(--bad)}
.ck input{width:28px;height:28px;min-height:0;flex:none;margin:0;accent-color:var(--ac)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.names .b{text-align:left;min-height:56px}
.g10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.goal{border-radius:18px;padding:26px 18px;margin:0 0 18px;font-size:clamp(26px,5.2vw,40px);line-height:1.2;font-weight:700;color:#fff;background:var(--ac)}
.goal .n{display:block;font-size:clamp(70px,16vw,130px);line-height:1;margin:6px 0}
.goal.win{background:#2e9e4f}
.ok>.lab{font-size:22px;display:block;margin-bottom:14px}
.ok .lab b{display:inline;font-size:inherit;margin:0}
.dlg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dbox{background:#fff;border-radius:16px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px #0005}
.dbox p{font-size:19px;margin:0 0 14px}.dbox input,.dbox textarea{margin-bottom:14px}
.big{width:100%;min-height:70px;font-size:clamp(20px,4.5vw,28px)}
.lock{text-align:center;padding:40px 16px}.lock h2{margin-bottom:18px}
.vl .cn{font-weight:700}
.ltabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}.ltabs .b{flex:none;min-height:44px;padding:8px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 4px}
.st{background:#f4f8f8;border:1px solid var(--ln);border-radius:12px;padding:12px}
.st b{display:block;font-size:30px;line-height:1.1;color:var(--ac)}.st span{font-size:14px;color:var(--mut)}
.tw{overflow-x:auto}.tw table{font-size:15px;white-space:nowrap}.tw td,.tw th{padding:8px 6px}
.hb{display:inline-block;width:56px;height:10px;background:#e3e9eb;border-radius:5px;vertical-align:middle;margin-right:6px;overflow:hidden}.hb i{display:block;height:100%;background:var(--ac)}
.top{color:#1f7a3d;font-weight:700}
.dr{display:grid;grid-template-columns:58px 1fr;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.dr>b{font-size:20px}.dr small{grid-column:2}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;min-width:16px}.bar i{background:#2e9e4f}.bar u{background:#9fc6ca}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 10px}
.g9{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.g11{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.g9 .tp{font-weight:700}
@media(max-width:600px){.g9{grid-template-columns:repeat(5,1fr)}}
.sea{display:inline-block;background:#e3f1f2;border-radius:999px;padding:4px 14px;font-weight:700;color:var(--ac);margin-bottom:10px}
</style></head><body>
<header><b id="logo">Escalade EPS</b><span id="tm"></span></header>
<nav id="nav"></nav>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LSP='escalade.';
/* reprise des données des anciennes versions (clés sans préfixe), sauf sur le site github.io partagé avec d'autres applis */
try{if(!/github\.io$/.test(location.hostname))for(const k of ['c','w','r','cf','cl','cl0','cl0v'])if(localStorage.getItem(LSP+k)==null&&localStorage.getItem(k)!=null)localStorage.setItem(LSP+k,localStorage.getItem(k))}catch{}
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(LSP+k));return v??d}catch{return d}},SV=(k,v)=>{try{localStorage.setItem(LSP+k,JSON.stringify(v))}catch{}};
const db=new Promise(r=>{try{const q=indexedDB.open('esc',1);q.onupgradeneeded=()=>q.result.createObjectStore('v');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const idb=async(m,k,v)=>{const d=await db;if(!d)return;return new Promise(r=>{const o=d.transaction('v',m=='get'?'readonly':'readwrite').objectStore('v');const q=m=='get'?o.get(k):m=='put'?o.put(v,k):o.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const WDEF=[[['Blanc','6a'],['Jaune','5b']],[['Noir','6a'],['Rouge','6a']],[['Jaune','6c+'],['Orange','5c+'],['Vert','5c']],[['Bleu','6c+'],['Noir','6b+'],['Rouge','6b'],['Violet','6a']],[['Blanc','6b'],['Rose','6a+'],['Jaune','5a']],[['Violet','7a+'],['Noir','6a'],['Vert','6c+']],[['Bleu','5c'],['Rose','6b']],[['Rouge','6c+'],['Jaune','5c'],['Vert','6a']],[['Orange','5a'],['Blanc','5a']],[['Rose','5c'],['Bleu','5a']],[['Vert','4c+'],['Rouge','5a']],[['Blanc','6a']],[['Orange','4'],['Rose','4']]];
const clone=o=>JSON.parse(JSON.stringify(o));
function dlg(o){return new Promise(res=>{const d=document.createElement('div');d.className='dlg';
 d.innerHTML=`<div class="dbox"><p>${esc(o.msg)}</p>${o.input?`<input ${o.pw?'type="password" inputmode="numeric" autocomplete="off"':''}>`:''}${o.area!=null?`<textarea readonly style="min-height:160px">${esc(o.area)}</textarea>`:''}<div class="row">${o.cancel?`<button class="b g" data-r="0">${o.cancel}</button>`:''}<button class="b" data-r="1">${o.ok||'OK'}</button></div></div>`;
 document.body.append(d);const i=d.querySelector('input,textarea');setTimeout(()=>{if(i){i.focus();i.select&&i.select()}else d.querySelector('[data-r="1"]').focus()},30);
 const done=r=>{d.remove();res(o.input?(r?i.value:null):r)};d.querySelectorAll('button').forEach(b=>b.onclick=()=>done(b.dataset.r=='1'));if(o.input)i.onkeydown=e=>{if(e.key=='Enter')done(true)}})}
const say=m=>dlg({msg:m}),ask=(m,ok='Oui',cancel='Annuler')=>dlg({msg:m,ok,cancel}),askT=(m,pw)=>dlg({msg:m,input:true,pw,ok:'Valider',cancel:'Annuler'});
const COL={Rouge:'#d62828',Bleu:'#1d4ed8',Vert:'#2e9e4f',Jaune:'#f2c230',Orange:'#f77f00',Violet:'#7b2cbf',Rose:'#f06ba8',Noir:'#111',Blanc:'#fff',Gris:'#8d99a0',Marron:'#7a4b2a'};
const DEF={
sec:[{t:'h',v:'Règles de sécurité'},{t:'s',v:'Avant de grimper'},{t:'p',v:'• Pas de bijoux, cheveux attachés, chaussons ajustés.\n• Zone de chute dégagée, sol sécurisé.\n• Un seul grimpeur par voie.'},{t:'s',v:'Pendant la grimpe (moulinette)'},{t:'p',v:'• L\'assureur reste attentif, regard sur le grimpeur.\n• Corde toujours tendue (sans tracter le grimpeur), main de freinage jamais lâchée.\n• Communication claire grimpeur / assureur.'},{t:'s',v:'Vidéos'},{t:'p',v:'Utilisez « Modifier » pour ajouter une vidéo de démonstration.'}],
ech:[{t:'h',v:'Échauffement'},{t:'s',v:'Articulaire'},{t:'p',v:'Poignets, épaules, nuque, hanches, chevilles.'},{t:'s',v:'Cardio'},{t:'p',v:'Course légère, montées de genoux, talons-fesses.'},{t:'s',v:'Spécifique'},{t:'p',v:'Traversées basses, voie facile sans dégaine, pose de pieds précise.'}],
enc:[{t:'h',v:"S'encorder"},{t:'s',v:'Étapes'},{t:'p',v:'1. Baudrier ajusté, boucles doublées.\n2. Nœud de huit tressé, longueur de queue ≥ 10 cm.\n3. Assureur : frein, mousqueton à vis verrouillé.\n4. Vérification mutuelle : nœud, baudrier, système d\'assurage, nœud en bout de corde.'},{t:'p',v:'Ajoutez une vidéo du nœud avec « Modifier ».'}],
the:[{t:'h',v:'Thématiques'},{t:'s',v:'Pistes de travail'},{t:'p',v:'• Placement des pieds\n• Lecture de voie\n• Recherche de PME (positions de moindre effort) pour récupérer\n• Confiance dans le matériel'}]};
let C=LS('c',DEF),W=LS('w',clone(WDEF)),R=LS('r',[]),CF=LS('cf',{tab:'Tablette 1'}),CL=LS('cl',[]);
/* dépôt public : aucun nom d'élève. Les classes s'importent sur la tablette (Leçon du jour → + Nouvelle classe). */
const CL0=null;
C.the?.forEach(b=>{if(b.t=='p'&&typeof b.v=='string')b.v=b.v.replace('• Gestion de la chute (PME)','• Recherche de PME (positions de moindre effort) pour récupérer')});
let S={t:'home',s:'ech',e:false,T:false,cv:0,ce:null,free:false},F={},QR=[];
const TABS=[['home','⌂ Accueil'],['prep','Se préparer'],['sec','Sécurité'],['gr','Renseigner une grimpe'],['mr','Mes résultats'],['cot','Cotation'],['the','Thématiques'],['res','Résultats et QRCODE']];
const CRIT=[['m','Prises de mains'],['p','Prises de pieds'],['cp','Changements de pieds effectués'],['h','Hauteur : dernière dégaine dépassée'],['a',"S'est assis dans le baudrier ?"],['pm','PME réalisée ? (Position de Moindre Effort)'],['pof','Utilisation sac à POF'],['k','Commentaire']];
const ALL=CRIT.map(c=>c[0]),today=()=>new Date().toLocaleDateString('fr-CA');
const seaOK=()=>CF.sea&&CF.sea.d==today(),cls=()=>CL.find(c=>c.id==CF.sea?.cl),on=k=>(CF.sea?.cr||ALL).includes(k);
function fresh(){F={step:1,eleve:'',vo:0,c:'',d:'',mains:0,pieds:0,cp:'',h:'',as:false,asV:'',pme:false,pmeV:'',pof:'',com:'',nr:{}};S.free=false}fresh();
const save=()=>{SV('c',C);SV('w',W);SV('r',R);SV('cf',CF);SV('cl',CL)};
function render(){
 if(!S.T){S.e=false;if(S.t=='res'||(S.t=='set'&&seaOK()))S.t='home'}
 if(S.t!='cot')S.cm='';
 if(S.t!='mr'){S.mr='';S.ml=''}
 $('#tm').innerHTML=S.T?(['gr','res','home','set'].includes(S.t)?'':`<button class="b g" onclick="S.e=!S.e;render()">${S.e?'Terminer':'Modifier'}</button>`)+`<button class="b g" onclick="S.t='set';S.ce=null;render()">Leçon</button><button class="b g" onclick="pin()">Code</button><button class="b on" onclick="S.T=false;render()">Quitter mode prof</button>`:`<button class="b g" onclick="unlock('set')">🔒 Enseignant</button>`;
 $('#nav').style.display=['home','set'].includes(S.t)?'none':'';
 $('#nav').innerHTML=TABS.filter(([k])=>k!='res'||S.T).map(([k,n])=>`<button class="${S.t==k?'on':''}" onclick="S.t='${k}';render()">${n}</button>`).join('');
 const m=$('#m');
 if(S.t=='home')m.innerHTML=home();
 else if(S.t=='set')m.innerHTML=S.T?setup():`<div class="card lock"><h2>Escalade EPS</h2><p class="mut">Aucune leçon n'est commencée aujourd'hui sur cette tablette.</p><p><button class="b big" onclick="unlock('set')">🔒 Préparer la leçon du jour</button></p><p class="mut">Réservé à l'enseignant (code demandé).</p></div>`;
 else if(S.t=='sec')m.innerHTML=content('sec');
 else if(S.t=='the')m.innerHTML=(S.T?ficheForm():'')+content('the');
 else if(S.t=='prep')m.innerHTML=`<div class="sub">${[['ech','Échauffement'],['enc',"S'encorder"]].map(([k,n])=>`<button class="b ${S.s==k?'':'g'}" onclick="S.s='${k}';render()">${n}</button>`).join('')}</div>`+content(S.s);
 else if(S.t=='gr')m.innerHTML=grimpe();
 else if(S.t=='cot')m.innerHTML=cotation();
 else if(S.t=='mr')m.innerHTML=mesRes();
 else m.innerHTML=resultats();
 loadVideos();
}
/* ---------- accueil ---------- */
const TILES=[['prep','Se préparer','#00747a'],['sec','Sécurité','#a4262c'],['gr','Renseigner une grimpe','#b5651d'],['mr','Mes résultats','#2e7d4f'],['cot','Cotation','#5b3f8c','wide'],['the','Thématiques','#3d5a80','wide']];
function home(){S.e=false;const t=S.T?[...TILES,['res','Résultats et QRCODE','#16252d','wide tprof']]:TILES;
 return `<h2 style="margin-top:4px">Escalade EPS</h2>${cls()?`<span class="sea">${esc(cls().nom)}</span>`:''}<div class="tiles">${t.map(([k,n,c,x])=>`<button class="tile ${x||''}" style="background:${c}" onclick="S.t='${k}';render()"><b>${n}</b></button>`).join('')}</div>`}
/* ---------- leçon du jour / classes ---------- */
function setup(){
 if(S.ce!=null){const c=CL.find(x=>x.id==S.ce)||{nom:'',el:[]};
  return `<div class="card"><h3 style="margin-top:0">${S.ce=='new'?'Nouvelle classe':'Modifier la classe'}</h3>
  <label class="l">Nom de la classe</label><input id="ceN" value="${esc(c.nom)}" placeholder="Ex. : 2nde 4">
  <label class="l">Élèves (un par ligne)</label>
  <div class="tb"><label class="b g">📄 Importer un fichier Excel<input type="file" accept=".xlsx,.csv,.txt" hidden onchange="impCls(this)"></label></div>
  <textarea id="ceL" style="min-height:280px" placeholder="Un élève par ligne&#10;Ex. : Léa Martin" oninput="cnt()">${esc(c.el.join('\n'))}</textarea>
  <p class="mut" id="ceC">${c.el.length} élève(s)</p>
  <small>Excel (.xlsx) ou CSV : colonnes « Prénom » et « Nom », ou « Élève », ou simplement les noms dans la première colonne. Vous pouvez corriger la liste ici avant d'enregistrer.</small>
  <div class="row" style="margin-top:14px"><button class="b g" onclick="S.ce=null;render()">Annuler</button><button class="b" onclick="saveCls()">Enregistrer la classe</button></div>
  ${S.ce!='new'?`<p><button class="b d" onclick="delCls()">Supprimer cette classe</button></p>`:''}</div>`}
 const sel=CF.sel||'',cr=CF.cr||ALL;
 return `<h2 style="margin-top:4px">Leçon du jour</h2>
 <div class="card"><h3 style="margin-top:0">1. Classe</h3>
 <div class="cols">${CL.map(c=>`<button class="b ${sel==c.id?'on':'g'} clsb" onclick="CF.sel='${c.id}';save();render()">${esc(c.nom)}<small>${c.el.length} élève(s)</small></button>`).join('')}
 <button class="b ${sel?'g':'on'} clsb" onclick="CF.sel='';save();render()">Sans liste<small>l'élève tape son prénom</small></button></div>
 <div class="tb">${CL.some(c=>c.id==sel)?`<button class="b g" onclick="S.ce='${sel}';render()">Modifier la liste</button>`:''}<button class="b g" onclick="S.ce='new';render()">+ Nouvelle classe</button></div></div>
 <div class="card"><h3 style="margin-top:0">2. Éléments travaillés aujourd'hui</h3><p class="mut">Seuls les éléments cochés seront proposés aux élèves pour renseigner leur grimpe.</p>
 <p class="mut" style="margin-top:0">« Obligatoire » : l'élève ne peut pas enregistrer sa grimpe sans renseigner cet élément.</p>
 ${CRIT.map(([k,n])=>{const c=cr.includes(k),q=c&&(CF.req||[]).includes(k);return `<div class="ck"><label class="ckl"><input type="checkbox" ${c?'checked':''} onchange="tgCr('${k}',this.checked)">${n}</label><button class="rq ${q?'on':''}" ${c?'':'disabled'} onclick="tgReq('${k}')">${q?'★ Obligatoire':'Facultatif'}</button></div>`}).join('')}
 <div class="tb"><button class="b g" onclick="CF.cr=[...ALL];save();render()">Tout cocher</button><button class="b g" onclick="CF.cr=[];save();render()">Tout décocher</button></div></div>
