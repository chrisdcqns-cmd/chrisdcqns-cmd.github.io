<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OrienRun EPS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--ink2:#56607a;--paper:#f5f2ea;--card:#fff;--line:#e2dccf;--orange:#f47a20;--orange2:#d9600a;--violet:#c21fbf;--green:#2a9d6f;--red:#e63946;--sun:#ffb703;--blue:#1f4fa3;--r:16px;--cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
h1,h2,h3,.cond{font-family:var(--cond);letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.6em 1.1em;border-radius:999px;font-weight:700;background:var(--ink);color:#fff;min-height:46px;text-decoration:none;white-space:nowrap}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.or{background:var(--orange)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.vi{background:var(--violet)}.btn.sun{background:var(--sun);color:var(--ink)}
.btn.small{min-height:36px;padding:.35em .85em;font-size:.88em}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--ink2)}
small.muted{font-size:.82em}
.panel{background:var(--card);border-radius:var(--r);padding:18px;margin-top:16px;box-shadow:0 1px 0 var(--line)}
.panel h2{margin:0 0 12px;font-size:1.5rem;text-transform:uppercase}
.panel h3{margin:14px 0 8px;font-size:1.2rem;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.inp{border:2px solid var(--line);border-radius:12px;padding:.55em .75em;background:#fff;min-height:46px;width:100%}
.inp:focus{outline:none;border-color:var(--orange)}
textarea.inp{min-height:90px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.82rem;background:var(--paper)}
.chip.ok{background:#d9f2e6;color:#14684a}.chip.ko{background:#fde0e2;color:#a3202b}.chip.wait{background:#fff1c9;color:#7a5600}.chip.vi{background:#f7dcf6;color:#8a1288}.chip.or{background:#ffe3cc;color:#a24600}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-family:var(--cond);text-transform:uppercase;font-size:.9rem;color:var(--ink2);background:#faf8f3;position:sticky;top:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border-radius:12px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:200;transition:.25s;font-weight:600;max-width:92vw;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{background:var(--green)}#toast.ko{background:var(--red)}
/* flag */
.flag{width:46px;height:46px;border-radius:6px;background:linear-gradient(135deg,#fff 50%,var(--orange) 50%);box-shadow:inset 0 0 0 2px #0002;flex:none}
/* home */
#home{max-width:900px;margin:0 auto;padding:26px 18px 60px}
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:28px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:200px;height:200px;background:linear-gradient(135deg,#fff 50%,var(--orange) 50%);transform:rotate(12deg);border-radius:18px;opacity:.95}
.hero h1{font-size:3.1rem;line-height:.9;margin:0 0 8px;text-transform:uppercase;position:relative;z-index:1}
.hero p{margin:0;opacity:.9;position:relative;z-index:1;max-width:28em}
.hero .tag{position:relative;z-index:1;display:inline-block;background:#fff2;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.bigchoice{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.bigchoice button{background:#fff;border-radius:20px;padding:22px;text-align:left;box-shadow:0 1px 0 var(--line);display:flex;gap:14px;align-items:center}
.bigchoice b{font-family:var(--cond);font-size:1.7rem;text-transform:uppercase;display:block}
.bigchoice .ic{font-size:2.4rem}
/* teacher */
#prof header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:8px 14px 0}
.topline{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--cond);font-weight:800;font-size:1.45rem;text-transform:uppercase}
.tabs{display:flex;gap:3px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 15px;font-weight:700;border-radius:12px 12px 0 0;color:#ffffffb8;white-space:nowrap;font-family:var(--cond);font-size:1.15rem;text-transform:uppercase}
.tab.on{background:var(--paper);color:var(--ink)}
.tab .bdg{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;margin-left:4px;font-size:.85rem}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff1f;color:#fff;font-size:1.15rem}
.pmain{max-width:1280px;margin:0 auto;padding:14px 14px 90px}
/* map editor */
.editor{display:grid;grid-template-columns:270px 1fr;gap:10px;height:calc(100vh - 116px);min-height:420px}
@media(max-width:800px){.editor{grid-template-columns:1fr;height:auto}.tools{max-height:none}}
.tools{background:#fff;border-radius:14px;padding:10px;overflow:auto;box-shadow:0 1px 0 var(--line)}
.tools h4{margin:10px 2px 6px;font-family:var(--cond);text-transform:uppercase;color:var(--ink2);font-size:.95rem;letter-spacing:.05em}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.tool{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:10px;background:var(--paper);font-size:.8rem;font-weight:600;text-align:left;min-height:40px;line-height:1.05;overflow-wrap:anywhere;hyphens:auto}
.tool svg{width:26px;height:20px;flex:none}
.tool.on{background:var(--ink);color:#fff}
.tool.on svg *{filter:drop-shadow(0 0 1px #fff)}
.mapwrap{position:relative;background:#d8d3c6;border-radius:14px;overflow:hidden;touch-action:none;min-height:420px}
.mapwrap svg.map{width:100%;height:100%;display:block;cursor:crosshair;user-select:none}
.mapwrap.pan svg.map{cursor:grab}
.mapbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mapbar .info{background:#14213dde;color:#fff;border-radius:12px;padding:8px 12px;font-size:.9rem;font-weight:600}
.zoombtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 2px 8px #0002}
.empty-map{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;pointer-events:none}
.empty-map>div{background:#fffe;border-radius:18px;padding:22px;max-width:440px;pointer-events:auto}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line);flex-wrap:wrap}
.item .num{width:50px;height:50px;border-radius:10px;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:1.6rem;flex:none;background:linear-gradient(135deg,#fff 50%,var(--orange) 50%);box-shadow:inset 0 0 0 2px #0002;text-shadow:0 0 3px #fff,0 0 3px #fff}
.item .num.S{background:none;color:var(--violet);box-shadow:inset 0 0 0 3px var(--violet)}
.item .num.F{background:none;color:var(--violet);box-shadow:inset 0 0 0 3px var(--violet);border-radius:50%}
.item .body{flex:1;min-width:180px}
.item .body b{font-family:var(--cond);font-size:1.2rem}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{min-width:46px;height:42px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-family:var(--cond);font-size:1.2rem;padding:0 8px}
.cchip.on{background:var(--violet);color:#fff;box-shadow:none}
.cchip.found{background:var(--green);color:#fff;box-shadow:none}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;padding:6px;border-radius:12px;background:var(--paper)}
.seq span{background:var(--violet);color:#fff;border-radius:99px;padding:4px 10px;font-weight:700}
.seq span i{opacity:.7;font-style:normal;font-size:.8em;margin-right:4px}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:#14213d99;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--paper);width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 24px}
.sheet.wide{max-width:1150px}
@media(min-width:700px){.sheet{border-radius:22px}}
.sheet .close{float:right;width:42px;height:42px;border-radius:50%;background:#fff;font-size:1.3rem}
.sheet h2{margin:0 0 8px;font-size:1.7rem;text-transform:uppercase}
/* live */
.live{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:12px;height:calc(100vh - 116px)}
@media(max-width:900px){.live{grid-template-columns:1fr;height:auto}.live .mapwrap{height:60vh}}
.runners{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.runner{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 0 var(--line);text-align:left;width:100%;display:flex;gap:10px;align-items:center}
.runner .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px #0003}
.runner .nm{font-weight:700}
.runner .chr{font-family:var(--cond);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto;text-align:right;line-height:1}
.runner.alert{background:#ffe1e3;animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:0 0 0 4px var(--red)}}
.runner.stale .nm:after{content:" · signal perdu";color:var(--red);font-weight:600;font-size:.8em}
.alertbar{background:var(--red);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* student */
#eleve{max-width:640px;margin:0 auto;padding:16px 14px 120px}
.ehead{display:flex;align-items:center;gap:10px}
.ehead h1{margin:0;font-size:1.8rem;text-transform:uppercase}
.chrono{font-family:var(--cond);font-weight:800;font-size:4.2rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.runcard{background:var(--ink);color:#fff;border-radius:22px;padding:16px;margin-top:10px}
.runcard .sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600;font-size:.9rem;opacity:.95}
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block}
.status.ok i{background:#3ddc97}.status.wait i{background:var(--sun)}.status.ko i{background:var(--red)}
.next{background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;margin-top:12px;display:flex;align-items:center;gap:12px}
.next .flag{width:58px;height:58px;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:1.9rem;text-shadow:0 0 3px #fff,0 0 3px #fff}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bigbtns .btn{min-height:64px;font-size:1.1rem;border-radius:18px}
.targets{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.target{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 var(--line)}
.target .n{font-family:var(--cond);font-weight:800;font-size:1.4rem;width:44px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--paper)}
.target.done .n{background:var(--green);color:#fff}.target.wait .n{background:var(--sun)}.target.ko .n{background:var(--red);color:#fff}.target.cur{box-shadow:inset 0 0 0 3px var(--orange)}
.target .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.sos{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 6px 20px #e6394688;z-index:40;display:grid;place-items:center;line-height:1;text-align:center}
.sos .ring{position:absolute;inset:-6px;border-radius:50%;border:6px solid transparent;border-top-color:#fff}
.msgbox{background:var(--sun);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;margin-top:10px}
#scanner{position:fixed;inset:0;background:#000;z-index:150;display:flex;flex-direction:column}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
#scanner .frame{position:absolute;left:50%;top:42%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 2000px #0006}
#scanner .bar{padding:14px;display:flex;gap:10px;justify-content:center;background:#000}
@media print{.noprint{display:none!important}}
</style>
</head>
<body>
<div id="home" class="hidden">
  <div class="hero"><span class="tag">EPS · Course d'orientation</span><h1>OrienRun<br>EPS</h1><p>Cartes, balises à QR code, parcours, suivi GPS en direct et résultats.</p></div>
  <div class="bigchoice">
    <button id="goEleve"><span class="ic">🏃</span><span><b>Je suis élève</b><span class="muted">Scanne le QR code de départ donné par ton enseignant.</span></span></button>
    <button id="goProf"><span class="ic">🧭</span><span><b>Espace enseignant</b><span class="muted">Carte, balises, parcours, tablette de contrôle.</span></span></button>
  </div>
  <div id="homeResume"></div>
  <p class="muted" style="text-align:center;font-size:.8rem;margin-top:26px">OrienRun EPS · v<span id="ver"></span> · symboles d'après les normes IOF (ISOM 2017-2, ISSprOM 2019)</p>
</div>
<div id="prof" class="hidden">
  <header>
    <div class="topline"><div class="flag" style="width:30px;height:30px"></div><div class="logo">OrienRun · Enseignant</div><span class="grow"></span><span id="projName" class="chip" style="background:#ffffff26;color:#fff"></span><button class="iconbtn" id="profHome" title="Accueil">⌂</button></div>
    <nav class="tabs" id="ptabs">
      <button class="tab" data-t="carte">🗺 Carte</button><button class="tab" data-t="balises">🚩 Balises</button><button class="tab" data-t="parcours">〰 Parcours</button><button class="tab" data-t="seance">📡 Leçon live<span class="bdg hidden" id="alertBdg"></span></button><button class="tab" data-t="resultats">🏁 Résultats</button><button class="tab" data-t="reglages">⚙ Réglages</button>
    </nav>
  </header>
  <div id="pview"></div>
</div>
<div id="eleve" class="hidden"></div>
<div id="modalRoot"></div>
<input type="file" id="fileIn" class="hidden">
<script>
// ===== QR code : encodeur autonome (mode octets, versions 1-40, d'après l'algorithme de Nayuki, MIT) =====
const QR = (() => {
  const ECC = { L: [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    M: [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    Q: [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    H: [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30] };
  const BLK = { L: [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    M: [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    Q: [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    H: [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81] };
  const FMT = { L: 1, M: 0, Q: 3, H: 2 };

  function rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  const dataCw = (v, e) => Math.floor(rawModules(v) / 8) - ECC[e][v] * BLK[e][v];

  function gfMul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 255; }
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = gfMul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = gfMul(root, 2); }
    return r;
  }
  function rsRem(data, div) {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= gfMul(c, f)); }
    return r;
  }

  function encode(text, ecl = "M", forceMask) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for (; v <= 40; v++) { const cc = v < 10 ? 8 : 16; if (4 + cc + bytes.length * 8 <= dataCw(v, ecl) * 8) break; }
    if (v > 40) throw new Error("Texte trop long pour un QR code");
    // améliore le niveau de correction si la place le permet
    for (const e of ["M", "Q", "H"]) { if ("LMQH".indexOf(e) > "LMQH".indexOf(ecl)) { const cc = v < 10 ? 8 : 16; if (4 + cc + bytes.length * 8 <= dataCw(v, e) * 8) ecl = e; } }
    const bits = [];
    const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCw(v, ecl) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(""), 2));
    // blocs + correction d'erreurs
    const nb = BLK[ecl][v], ecLen = ECC[ecl][v], raw = Math.floor(rawModules(v) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const blocks = [], div = rsDivisor(ecLen);
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - ecLen + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = rsRem(dat, div); if (i < nShort) dat.push(0); blocks.push(dat.concat(ecc));
    }
    const all = [];

      else if (hf && ED.sel.k === "f" && hf.dataset.f === ED.sel.id) drag = { k: "f", last: toMap(e.clientX, e.clientY) };

function tapMap(q, target) {

async function loadMapImage() {

    let src;
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const v0 = page.getViewport({ scale: 1 }), sc = 2600 / Math.max(v0.width, v0.height), vp = page.getViewport({ scale: sc });
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise; src = cv;
    } else { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Image illisible")); i.src = URL.createObjectURL(f); }); }
    const W = src.naturalWidth || src.width, H = src.naturalHeight || src.height, k = Math.min(1, 2600 / Math.max(W, H));
    const cv = document.createElement("canvas"); cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(src, 0, 0, cv.width, cv.height);
    const had = P.map.img || P.controls.some(c => c.x != null) || P.features.length;
    if (had && !confirm("Remplacer la carte actuelle ? Les balises et dessins restent à leur place (en proportion).")) return;
    const sx = cv.width / P.map.w, sy = cv.height / P.map.h;
    if (had) { P.controls.forEach(c => { if (c.x != null) { c.x *= sx; c.y *= sy; } }); P.calib.forEach(c => { c.x *= sx; c.y *= sy; }); P.features.forEach(f => { if (f.pts) f.pts = f.pts.map(p => [p[0] * sx, p[1] * sy]); else { f.x *= sx; f.y *= sy; } }); }
    P.map.img = cv.toDataURL("image/jpeg", .86); P.map.w = cv.width; P.map.h = cv.height; ED.view = null;

  } catch (e) { toast(e.message, "ko"); }
}

// ---------- 8. alerte d'immobilité (enseignant) ----------
function immobility(R, a) {
  const lim = (+CFG.immo || 0) * 60000; if (!lim || a.statut !== "En course") return null;
  const pos = posOf(R); if (pos.length < 3) return null;
  const last = pos[pos.length - 1]; if (Date.now() - (last.rt || last.t) > (CFG.interval * 3 + 30) * 1000) return null; // signal perdu : signalé ailleurs
  const L = { lat: last.la, lon: last.lo }; let k = pos.length - 1;
  while (k > 0 && haversine({ lat: pos[k - 1].la, lon: pos[k - 1].lo }, L) <= 20 + Math.min(last.ac || 0, 20)) k--;
  const since = pos[k].t, dur = Date.now() - since; if (dur < lim || since < a.start) return null;
  const near = P.controls.filter(c => c.lat != null).some(c => haversine(c, L) <= 30); if (near) return null; // à une balise : normal
  return { since, dur, la: last.la, lo: last.lo };
}

// ---------- 9. appel : présents, partis, rentrés ----------
function runnerForEleve(e) { if (e.r && S.runners[e.r]) return S.runners[e.r]; const k = normName(e.nom); return Object.values(S.runners).find(R => normName(R.nom) === k || normName(R.nom).split(" & ").includes(k) || R.nom.split(" & ").some(x => normName(x) === k)) || null; }

const bearing = (a, b) => { const r = Math.PI / 180, y = Math.sin((b.lon - a.lon) * r) * Math.cos(b.lat * r), x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lon - a.lon) * r); return (Math.atan2(y, x) / r + 360) % 360; };
function openPose() {
  let mode = "pose", me = null, head = null, target = null, watch = null, hasCompass = false;
  const done = c => !!(mode === "pose" ? c.pose : c.ramasse);
  const all = () => P.controls.filter(c => c.lat != null);
  const pick = () => { const L = all().filter(c => !done(c)); if (!L.length) return null; if (!me) return L[0]; return L.slice().sort((a, b) => haversine(me, a) - haversine(me, b))[0]; };
  const m = openModal(`<h2>🧭 Sur le terrain</h2><div class="row" style="margin-bottom:10px"><button class="btn small" data-md="pose">🚩 Pose des balises</button><button class="btn small ghost" data-md="ramasse">🧺 Ramassage</button><span class="grow"></span><button class="btn small ghost" id="poCompass">🧭 Activer la boussole</button></div>
   <div id="poMain"></div><div id="poList" style="margin-top:12px"></div>`, { wide: true, sticky: true, onClose: () => { navigator.geolocation.clearWatch(watch); removeEventListener("deviceorientationabsolute", ori); removeEventListener("deviceorientation", ori); } });
  const ori = e => { let h = e.webkitCompassHeading != null ? e.webkitCompassHeading : e.alpha != null && (e.absolute || e.type === "deviceorientationabsolute") ? (360 - e.alpha) % 360 : null; if (h != null) { head = h; hasCompass = true; drawMain(); } };
  addEventListener("deviceorientationabsolute", ori); addEventListener("deviceorientation", ori);
  $("#poCompass", m).onclick = async () => { try { if (window.DeviceOrientationEvent?.requestPermission) await DeviceOrientationEvent.requestPermission(); toast("Boussole activée : tiens le téléphone à plat"); } catch (e) { toast("Boussole refusée", "ko"); } };
  watch = navigator.geolocation.watchPosition(p => { me = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }; if (!hasCompass && p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > .5) head = p.coords.heading; if (!target || done(target)) target = pick(); drawMain(); }, e => toast(e.message, "ko"), { enableHighAccuracy: true, maximumAge: 2000 });
  let lastBuzz = 0;
  const drawMain = () => {
    const box = $("#poMain", m); if (!box) return;
    const L = all(), n = L.filter(done).length;
    if (!target || done(target)) target = pick();
    if (!target) { box.innerHTML = `<div class="panel" style="margin:0;text-align:center"><h2>✓ Toutes les balises sont ${mode === "pose" ? "posées" : "ramassées"} (${n}/${L.length})</h2></div>`; return drawList(); }
    const d = me ? haversine(me, target) : null, b = me ? bearing(me, target) : null, rot = b != null ? (head != null ? b - head : b) : 0;
    if (d != null && d < 10 && Date.now() - lastBuzz > 8000) { lastBuzz = Date.now(); navigator.vibrate?.([200, 100, 200]); }
    box.innerHTML = `<div class="runcard" style="display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center">
      <div style="width:150px;height:150px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;position:relative">${head == null ? '<span style="position:absolute;top:4px;font-weight:800">N</span>' : ""}<svg viewBox="-50 -50 100 100" style="width:120px;transform:rotate(${rot}deg);transition:transform .3s"><path d="M0,-44 L22,30 L0,16 L-22,30Z" fill="${d != null && d < 15 ? "#3ddc97" : "#f47a20"}"/></svg></div>
      <div><div class="lbl" style="color:#fff">${mode === "pose" ? "Balise à poser" : "Balise à ramasser"} · ${n}/${L.length} faites</div><div style="font-family:var(--cond);font-size:3rem;font-weight:800;line-height:1">${esc(ctrlLabel(target))}</div>
      <div style="font-size:2rem;font-weight:800">${d == null ? "GPS…" : fmtDist(d)}</div><div class="sub">${target.desc ? esc(target.desc) + " · " : ""}${me ? `ta précision ±${Math.round(me.acc)} m` : ""}${head == null ? " · flèche orientée par rapport au nord (active la boussole ou marche)" : ""}</div></div></div>
     <div class="row" style="margin-top:10px"><button class="btn green" id="poDone" style="min-height:58px;flex:1">✓ ${mode === "pose" ? "Posée" : "Ramassée"}</button><button class="btn alt" id="poSkip">Passer</button><a class="btn ghost" target="_blank" href="${gmapsUrl(target.lat, target.lon)}">Google Maps</a></div>
     ${mode === "pose" ? `<label class="row" style="gap:6px;margin-top:8px"><input type="checkbox" id="poUpd"> Remplacer la position GPS de la balise par ma position actuelle (si je la pose ailleurs)</label>` : ""}`;

    $$("[data-po]", m).forEach(b => b.onclick = () => { const c = ctrlById(b.dataset.po); if (done(c)) { if (confirm(`Annuler « ${mode === "pose" ? "posée" : "ramassée"} » pour ${ctrlLabel(c)} ?`)) { delete c[mode === "pose" ? "pose" : "ramasse"]; saveP(); } } else target = c; drawMain(); });

  drawMain();

// ---------- GPS + envoi ----------
function startGps() {

}
function startLoop() {
  stopLoop();
  const r = loadRun(); const iv = Math.max(5, +r.i || 20) * 1000;
  const tick = () => { if (!E.active) return; const r = loadRun(); if (!r || !r.start || r.finish || r.abandon) return stopLoop(); if (E.fix && Date.now() - E.fix.t < iv * 2) { mutRun(r => newEvent(r, "pos")); } flush(); };
  E.timer = setInterval(tick, iv); setTimeout(tick, 1500);
  // un seul onglet envoie (si l'élève a ouvert l'appli plusieurs fois)
  try { E.chan = E.chan || new BroadcastChannel("orienrun"); E.chan.onmessage = m => { if (m.data?.take && m.data.id !== TAB_ID) { E.active = false; } }; E.chan.postMessage({ take: 1, id: TAB_ID }); E.active = true; } catch (e) {}
}
function stopLoop() { clearInterval(E.timer); E.timer = null; }
async function flush(force) {
  const r = loadRun(); if (!r || !r.a) { E.online = r?.a ? E.online : null; updStatus(); return false; }
  if (E.sending && !force) return false; E.sending = true;
  try {
    const ids = r.queue.slice(0, 150); const ev = ids.map(id => r.ev[id]).filter(Boolean).map(e => { const { code, ...x } = e; return x; });
    const j = await apiCall(r.a, "push", { s: r.s, r: r.r, nom: r.nom, cl: r.cl, c: r.c.k, sel: r.sel, ev }, 15000);
    const news = [], decs = [];
    mutRun(x => { x.queue = x.queue.filter(id => !ids.includes(id)); Object.entries(j.dec || {}).forEach(([id, v]) => { if (x.dec[id] !== v && x.ev[id]) decs.push({ e: x.ev[id], v }); x.dec[id] = v; }); (j.msgs || []).forEach(m => { if (!x.msgs.some(o => o.id === m.id)) { x.msgs.push(m); if (!(x.joinT && m.t && m.t < x.joinT - 10000)) news.push(m); else x.seenMsg[m.id] = 1; } }); });
    E.online = true; if ($("#targets")) renderRun();
    incoming(news, decs); renderLobbyMsgs(); flushOld();
    const left = loadRun().queue.length; if (left && ids.length === 150) setTimeout(() => flush(), 500);
    return true;
  } catch (e) { E.online = false; return false; }
  finally { E.sending = false; updStatus(); }
}
async function requestWake() { try { if ("wakeLock" in navigator && !E.wake) { E.wake = await navigator.wakeLock.request("screen"); E.wake.addEventListener("release", () => E.wake = null); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("#chrono")) { requestWake(); try { E.chan?.postMessage({ take: 1, id: TAB_ID }); } catch (e) {} E.active = true; renderRun(); flush(); } });
window.addEventListener("storage", e => { if (e.key === "or." + RUNKEY && $("#targets")) renderRun(); });

function sbeep(freqs) { try { const c = new (window.AudioContext || window.webkitAudioContext)(); freqs.forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.25, c.currentTime + i * .18); o.start(c.currentTime + i * .18); o.stop(c.currentTime + i * .18 + .15); }); } catch (e) {} }
function readMsg(mid) { mutRun(r => { if (!r.seenMsg[mid]) { r.seenMsg[mid] = 1; newEvent(r, "lu", { mid }); } }); flush(); }
function incoming(news, decs) {
  decs.forEach(({ e, v }) => { if (e.k !== "punch") return; if (v === false) feedback(false, `Balise ${e.n} : FAUSSE ✕`, "Ton enseignant t'indique que ce n'est pas la bonne balise. Reprends ta carte !", "", true); else feedback(true, `Balise ${e.n} : JUSTE ✓`, "Confirmé par ton enseignant. Continue !", "", true); });
  if (decs.length && $("#eSms")) endScreen();
  news.forEach(m => {
    if (m.type === "recall") { const r = loadRun(); if (r?.hereT && Date.now() - r.hereT < 30 * 60000) return; showRecall(m); }
    else { navigator.vibrate?.([200, 100, 200, 100, 200]); sbeep([660, 880]); if (!$("#targets")) msgPopup(m); }
  });
}

  } catch (e) { close(); toast("Caméra indisponible : " + (e.name === "NotAllowedError" ? "autorise l'accès à la caméra, ou utilise « Saisir un code »." : e.message), "ko"); return; }
  if ("BarcodeDetector" in window) { try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes("qr_code")) det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) {} }
  if (!det && !window.jsQR) { try { jsQRLoading = jsQRLoading || loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"); await jsQRLoading; } catch (e) { toast("Lecteur QR indisponible hors connexion : utilise l'appareil photo du téléphone ou « Saisir un code ».", "ko"); } }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  const loop = async () => {
    if (stop) return;
    try {
      let txt = null;
      if (det) { const r = await det.detect(video); if (r[0]) txt = r[0].rawValue; }
      else if (window.jsQR && video.videoWidth) { const s = Math.min(1, 800 / video.videoWidth); cv.width = video.videoWidth * s; cv.height = video.videoHeight * s; cx.drawImage(video, 0, 0, cv.width, cv.height); const im = cx.getImageData(0, 0, cv.width, cv.height); const r = jsQR(im.data, im.width, im.height, { inversionAttempts: "dontInvert" }); if (r) txt = r.data; }
      if (txt) { navigator.vibrate?.(60); if (onText(txt) !== false) return close(); await sleep(1200); }
    } catch (e) {}
    setTimeout(loop, 180);
  };
  loop();
}

// ===== Navigation =====
function showScreen(id) { ["home", "prof", "eleve"].forEach(s => $("#" + s).classList.toggle("hidden", s !== id)); window.scrollTo(0, 0); }
function showHome() {
  showScreen("home"); $("#ver").textContent = APP_VERSION;
  const r = loadRun();
  $("#homeResume").innerHTML = r && r.start && !r.finish && !r.abandon ? `<div class="panel" style="background:var(--orange);color:#fff"><b>Course en cours : ${esc(r.c.k)} · ${esc(r.nom)}</b> <button class="btn small alt" id="hRes">Reprendre</button></div>` : "";
  $("#hRes") && ($("#hRes").onclick = () => studentEntry());
}
function route() {
  const h = location.hash;
  let m = h.match(/#go=([\w-]+)/);
  if (m) { try { const g = b64d(m[1]); return studentEntry(g); } catch (e) { toast("QR code de départ illisible", "ko"); } }
  m = h.match(/#b=([\w%-]+)\.([A-Za-z0-9]+)/);
  if (m) {
    history.replaceState(null, "", location.pathname);
    const r = loadRun();
    if (r && r.start && !r.finish && !r.abandon) { showScreen("eleve"); runScreen(); setTimeout(() => handlePunch(decodeURIComponent(m[1]), m[2].toUpperCase(), "photo"), 300); return; }
    if (r && r.s && !r.start && String(decodeURIComponent(m[1])) === String(r.c.dn)) { showScreen("eleve"); readyScreen(); setTimeout(() => startFromCode(m[2].toUpperCase(), "photo"), 300); return; }
    showScreen("eleve"); welcomeScreen(); toast("Balise " + decodeURIComponent(m[1]) + " : ouvre d'abord ton parcours avec le QR de départ.", "ko"); return;
  }
  const r = loadRun();
  if (/#eleve/.test(h)) { history.replaceState(null, "", location.pathname); return studentEntry(); }
  if (r && r.start && !r.finish && !r.abandon) return studentEntry();
  showHome();
}
$("#goEleve").onclick = () => studentEntry();
$("#goProf").onclick = () => tpw() ? openProf() : profLogin();
$("#profHome").onclick = () => { stopMyPos(); showHome(); };
$$("#ptabs .tab").forEach(b => b.onclick = () => setPTab(b.dataset.t));
window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
