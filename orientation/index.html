<title>EPS – Autonomie et Numérique</title>
<!-- Ancienne adresse : renvoie vers la nouvelle en gardant ?… et #… (QR codes déjà imprimés) -->
<script>
(function () {
  var to = "/eps-autonomie-numerique/orientation/" + location.search + location.hash, gone = false;
  function go() { if (!gone) { gone = true; location.replace(to); } }
  try {
    navigator.serviceWorker.getRegistrations().then(function (R) { return Promise.all(R.filter(function (r) { return new URL(r.scope).pathname === '/orientation/'; }).map(function (r) { return r.unregister(); })); }).then(go, go);
  } catch (e) {}
  setTimeout(go, 600);
})();
</script>
