<!DOCTYPE html>
<!-- eps-source-directe : cette page est LA source de l'appli, modifiée directement. Ne jamais la remplacer par une page fabriquée ailleurs (autre conversation, anciens fichiers) : repartir de cette page. Voir CLAUDE.md. -->
<html lang="fr">
<head>
<script src="../eps-lists.js"></script><!-- commun : garde de la simulation, listes -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Guide – EPS Autonomie et numérique</title>
<meta name="theme-color" content="#14171C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#F5F3EE;--ink:#14171C;--muted:#5C616A;--line:#E6E1D6;--app:#0E7490;--act:#14171C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#eps-home{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
.hd{background:var(--ink);color:#fff;box-shadow:inset 0 -4px 0 var(--app);padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd .ic{width:36px;height:36px;border-radius:10px;background:var(--app);display:flex;align-items:center;justify-content:center;flex:none}
.hd h1{margin:0;font-size:20px;font-weight:800;flex:1;min-width:0}
.hb{color:#D5D8DE;text-decoration:none;font-weight:700;font-size:14px;border:1.5px solid #3A3F47;border-radius:10px;padding:0 14px;height:44px;display:inline-flex;align-items:center;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:12px 14px 80px}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;font-weight:800;cursor:pointer}
.btn.p{background:var(--app);border-color:var(--app);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px}
/* choix : niveau, puis activité */
.pick{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.pick .lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.niv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.niv button{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:left;padding:6px 12px;display:flex;align-items:center;gap:10px}
.niv button i{font-style:normal;font-size:22px}
.niv button b{display:block;font-size:15px;line-height:1.15}
.niv button small{color:var(--muted);font-size:13px}
.niv button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.niv button.on small{color:#C9CDD3}
.acts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.acts button{flex:none;min-height:44px;padding:0 12px 0 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.acts button::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.acts button.on{background:var(--c);border-color:var(--c);color:#fff}
.acts button.on::before{background:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.srch{flex:1 1 220px;position:relative}
.srch input{width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px 0 38px;background:#FCFBF8}
.srch::before{content:"🔎";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px}
#res{margin-top:10px;display:grid;gap:6px}
#res button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;min-height:44px;cursor:pointer}
#res button b{display:block;font-size:14px}
#res button span{font-size:13px;color:var(--muted)}
#res mark{background:#FDE68A;color:inherit;border-radius:3px;padding:0 1px}
.pmenu{position:relative}
.pmenu div{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:6px;z-index:5;display:grid;gap:4px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.pmenu div button{min-height:44px;border:0;background:#F5F3EE;border-radius:8px;text-align:left;padding:0 12px;font-weight:700;cursor:pointer}
/* page : sommaire + guide */
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
.som{position:sticky;top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;max-height:calc(100vh - 20px);overflow:auto}
.som summary{font-weight:800;cursor:pointer;min-height:32px;list-style:none}
.som summary::-webkit-details-marker{display:none}
.som a{display:flex;align-items:center;min-height:40px;padding:4px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.2}
.som a:hover,.som a.on{background:#EEF6F8}
.som a.on{font-weight:800;box-shadow:inset 3px 0 0 var(--act)}
.g{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;border-top:6px solid var(--act)}
.g>.kick{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g>h2{margin:2px 0 2px;font-size:26px;font-weight:900;line-height:1.15}
.g>.sub{color:var(--muted);margin:0 0 6px}
.g h3{font-size:18px;font-weight:800;margin:22px 0 8px;padding-top:12px;border-top:2px solid var(--line);scroll-margin-top:12px}
.g p{margin:6px 0}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:8px 0;counter-reset:n}
.flow>div{flex:1 1 140px;background:#F3F7F8;border:1.5px solid #B9D5DC;border-radius:12px;padding:10px 12px;position:relative;min-width:130px;counter-increment:n}
.flow>div::before{content:counter(n);display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--act);color:#fff;font-weight:900;font-size:14px;align-items:center;justify-content:center;margin-bottom:4px}
.flow>div b{display:block;font-size:15px}
.flow>div span{font-size:14px;color:#3B4047}
.flow>div:not(:last-child)::after{content:"➜";position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--act);font-weight:900;z-index:1;background:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;border:1px solid #B9D5DC}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.cols>div{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#FCFBF8}
.cols>div>b{display:block;margin-bottom:4px}
.cols ul{margin:0;padding-left:18px;font-size:14px}
.cols li{margin:3px 0}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.strip span{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-size:14px;flex:1 1 150px}
.strip span b{display:block;font-size:14px}
.strip span small{color:var(--muted);font-size:13px}
ol.steps{margin:8px 0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--line);font-size:15px}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--act);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
figure{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;break-inside:avoid}
figure img{display:block;width:100%;height:auto}
figure.tel{max-width:300px}
figcaption{font-size:13px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#FAF8F3;font-size:13px}
.aide{display:grid;gap:8px;margin:8px 0}
.aide>div{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;break-inside:avoid}
.aide>div b{display:block;margin-bottom:2px}
.aide>div span{font-size:14px;color:#2B3038}
#print{display:none}
@media (max-width:900px){
  .lay{grid-template-columns:1fr}
  .som{position:static;max-height:none}
  .som:not([open]) a{display:none}
}
@media (max-width:560px){
  .niv{grid-template-columns:1fr}
  .niv button{min-height:48px}
  .g{padding:16px 14px}
  .g>h2{font-size:22px}
  .flow>div:not(:last-child)::after{display:none}
}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff;font-size:10.5pt}
  .hd,.pick,.som,#lock,#eps-upd{display:none!important}
  .wrap{max-width:none;padding:0}
  .lay{display:block}
  .g{border:0;border-top:5px solid var(--act);border-radius:0;padding:8px 0 0;margin:0;break-after:page}
  .g:last-child{break-after:auto}
  body.multi #cur{display:none}
  body.multi #print{display:block}
  .g h3{break-after:avoid}
  .flow>div,.cols>div,.strip span,ol.steps li{break-inside:avoid}
  .aide{display:block}.aide>div{margin-bottom:6px}
}
</style>
</head>
<body>
<div class="hd">
  <div class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6M9 12h6"/></svg></div>
  <h1>Guides</h1>
  <span data-eps-upd-slot></span>
  <a class="hb" href="../">← Accueil</a>
</div>
<div class="wrap" id="lock"><div class="card"><h2 style="margin:0 0 4px">Guides réservés à l'enseignant</h2><p style="color:var(--muted);margin:0 0 14px">Saisis ton code enseignant pour les ouvrir.</p><button class="btn p" id="unlock" type="button">Saisir le code</button></div></div>
<div class="wrap" id="app" hidden>
  <div class="pick">
    <div class="lab">1 · Pour qui ?</div>
    <div class="niv" id="niv" role="group" aria-label="Niveau du guide"></div>
    <div class="lab">2 · Quelle activité ?</div>
    <div class="acts" id="acts" role="group" aria-label="Activité"></div>
    <div class="bar">
      <label class="srch"><input id="q" type="search" placeholder="Chercher dans tous les guides" aria-label="Chercher dans tous les guides" autocomplete="off"></label>
      <button type="button" class="btn p" id="p1">🖨 Imprimer ce guide</button>
      <span class="pmenu"><button type="button" class="btn" id="pm" aria-haspopup="true" aria-expanded="false">🖨 Imprimer plus…</button>
        <div id="pmn" hidden>
          <button type="button" data-p="act">Les 3 niveaux de cette activité</button>
          <button type="button" data-p="niv">Ce niveau, toutes les activités</button>
          <button type="button" data-p="tout">Tous les guides</button>
        </div></span>
    </div>
    <div id="res" hidden></div>
  </div>
  <div class="lay">
    <details class="som" id="som" open><summary>Sommaire</summary><nav id="toc"></nav></details>
    <main><div id="cur"></div><div id="print"></div></main>
  </div>
</div>
<script src="../eps-guides.js"></script>
<script src="contenu.js"></script>
<script>
(function () {
  "use strict";
  var D = window.EPS_GUIDE, AID = window.EPS_GUIDES || {}, KEY = "eps.guide.v1";
  /* niveaux : data-niv="a" (élève), data-niv="b" (enseignant, l'essentiel), data-niv="c" (enseignant, détaillé) */
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function slug(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function plain(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function actOf(k) { return D.ACTS.filter(function (a) { return a.k === k; })[0] || D.ACTS[0]; }
  function nivOf(k) { return D.NIV.filter(function (n) { return n.k === k; })[0] || D.NIV[1]; }
  function fig(f, cap) { var tel = /mon-espace/.test(f); return '<figure' + (tel ? ' class="tel"' : "") + '><img src="img/' + esc(f) + '" alt="' + esc(cap) + '" loading="lazy"><figcaption>' + esc(cap) + "</figcaption></figure>"; }
  function aideItems(k) { var a = AID[k]; return Array.isArray(a) ? a : (a && a.items) || []; }
  function bloc(b) {
    var t = b[0];
    if (t === "flow") return '<div class="flow">' + b[1].map(function (x) { return "<div><b>" + esc(x[0]) + "</b><span>" + esc(x[1]) + "</span></div>"; }).join("") + "</div>";
    if (t === "img") return fig(b[1], b[2]);
    if (t === "two") return '<div class="two">' + fig(b[1][0], b[1][1]) + fig(b[2][0], b[2][1]) + "</div>";
    if (t === "strip") return '<div class="strip">' + b[1].map(function (x) { return "<span><b>" + esc(x[0]) + "</b><small>" + esc(x[1]) + "</small></span>"; }).join("") + "</div>";
    if (t === "cols") return '<div class="cols">' + b[1].map(function (x) { return "<div><b>" + esc(x[0]) + "</b><ul>" + x[1].map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul></div>"; }).join("") + "</div>";
    if (t === "steps") return '<ol class="steps">' + b[1].map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ol>";
    if (t === "p") return "<p>" + esc(b[1]) + "</p>";
    if (t === "tab") return '<div class="tw"><table><tr>' + b[1].map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr>" + b[2].map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div>";
    if (t === "aide") return '<div class="aide">' + aideItems(b[1]).map(function (x) { return "<div><b>" + esc(x[0]) + "</b><span>" + esc(x[1]) + "</span></div>"; }).join("") + "</div>";
    return "";
  }
  function titre(n, a) { return a.k === "gen" ? (n.k === "a" ? "Guide de l'élève" : n.k === "b" ? "Guide de l'enseignant · l'essentiel" : "Guide de l'enseignant · détaillé") : a.nom; }
  function rendre(nk, ak, pre) {
    var n = nivOf(nk), a = actOf(ak), S = (D.G[nk] || {})[ak] || [];
    return '<section class="g" data-niv="' + nk + '" data-act="' + ak + '" style="--act:' + a.c + '"><div class="kick">' + n.ico + " " + esc(n.nom + " · " + n.sub) + (a.k === "gen" ? "" : " · " + esc(a.nom)) + "</div><h2>" + esc(titre(n, a)) + '</h2><p class="sub">EPS · Autonomie et numérique' + (nk === "a" ? " · à projeter ou à distribuer" : "") + "</p>" +
      S.map(function (s) { return '<h3 id="' + (pre || "") + slug(s.t) + '">' + esc(s.t) + "</h3>" + s.b.map(bloc).join(""); }).join("") + "</section>";
  }
  var N = "b", A = "gen";
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ n: N, a: A })); history.replaceState(null, "", "#" + N + "/" + A); } catch (e) {} }
  function draw(anchor) {
    var a = actOf(A);
    document.documentElement.style.setProperty("--act", a.c);
    $("#niv").innerHTML = D.NIV.map(function (n) { return '<button type="button" data-n="' + n.k + '" class="' + (n.k === N ? "on" : "") + '" aria-pressed="' + (n.k === N) + '"><i aria-hidden="true">' + n.ico + "</i><span><b>" + esc(n.nom) + "</b><small>" + esc(n.sub) + "</small></span></button>"; }).join("");
    $("#acts").innerHTML = D.ACTS.map(function (x) { return '<button type="button" data-a="' + x.k + '" style="--c:' + x.c + '" class="' + (x.k === A ? "on" : "") + '" aria-pressed="' + (x.k === A) + '">' + esc(x.nom) + "</button>"; }).join("");
    $("#cur").innerHTML = rendre(N, A, "");
    var S = (D.G[N] || {})[A] || [];
    $("#toc").innerHTML = S.map(function (s) { return '<a href="#' + slug(s.t) + '" data-s="' + slug(s.t) + '">' + esc(s.t) + "</a>"; }).join("");
    var on = $("#acts .on"); if (on && on.scrollIntoView) try { on.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) {}
    save();
    if (anchor) { var el = document.getElementById(anchor); if (el) setTimeout(function () { el.scrollIntoView({ block: "start" }); }, 30); }
  }
  $("#niv").addEventListener("click", function (e) { var b = e.target.closest("[data-n]"); if (!b) return; N = b.dataset.n; draw(); });
  $("#acts").addEventListener("click", function (e) { var b = e.target.closest("[data-a]"); if (!b) return; A = b.dataset.a; draw(); });
  $("#toc").addEventListener("click", function (e) { var l = e.target.closest("a[data-s]"); if (!l) return; e.preventDefault(); var el = document.getElementById(l.dataset.s); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); if (innerWidth <= 900) $("#som").open = false; });
  function somFit() { if (innerWidth <= 900 && !somFit.done) { $("#som").open = false; } somFit.done = 1; }
  /* recherche dans tous les guides (les 3 niveaux, toutes les activités) */
  var IDX = null;
  function index() {
    if (IDX) return IDX; IDX = [];
    D.NIV.forEach(function (n) { D.ACTS.forEach(function (a) { ((D.G[n.k] || {})[a.k] || []).forEach(function (s) {
      var txt = [];
      (function walk(x) { if (typeof x === "string") { if (!/\.jpg$/.test(x)) txt.push(x); } else if (Array.isArray(x)) x.slice(typeof x[0] === "string" && /^(flow|img|two|strip|cols|steps|p|tab|aide)$/.test(x[0]) ? 1 : 0).forEach(walk); })(s.b);
      s.b.forEach(function (b) { if (b[0] === "aide") aideItems(b[1]).forEach(function (it) { IDX.push({ n: n.k, a: a.k, s: s.t, t: it[0] + " : " + it[1], p: plain(it[0] + " " + it[1]) }); }); });
      IDX.push({ n: n.k, a: a.k, s: s.t, t: txt.join(" · "), p: plain(s.t + " " + txt.join(" ")) });
    }); }); });
    return IDX;
  }
  function chercher() {
    var q = plain($("#q").value.trim()), R = $("#res");
    if (q.length < 2) { R.hidden = true; R.innerHTML = ""; return; }
    var mots = q.split(/\s+/), H = index().filter(function (x) { return mots.every(function (m) { return x.p.indexOf(m) >= 0; }); }).slice(0, 12);
    R.hidden = false;
    R.innerHTML = H.length ? H.map(function (x, i) { var n = nivOf(x.n), a = actOf(x.a), p = plain(x.t), at = Math.max(0, p.indexOf(mots[0]) - 40), ex = esc(x.t.slice(at, at + 150));
      mots.forEach(function (m) { try { ex = ex.replace(new RegExp("(" + m.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "i"), "<mark>$1</mark>"); } catch (e) {} });
      return '<button type="button" data-i="' + i + '"><b>' + n.ico + " " + esc(a.nom) + " · " + esc(x.s) + "</b><span>" + (at ? "…" : "") + ex + "…</span></button>"; }).join("") : '<p style="color:var(--muted);margin:4px 2px">Aucun résultat pour « ' + esc($("#q").value) + " ».</p>";
    R.onclick = function (e) { var b = e.target.closest("[data-i]"); if (!b) return; var x = H[+b.dataset.i]; N = x.n; A = x.a; R.hidden = true; draw(slug(x.s)); };
  }
  $("#q").addEventListener("input", chercher);
  /* impression : ce guide, ou plusieurs à la suite (un guide par page) */
  function imprimer(mode) {
    var L = [];
    if (mode === "act") D.NIV.forEach(function (n) { L.push([n.k, A]); });
    else if (mode === "niv") D.ACTS.forEach(function (a) { L.push([N, a.k]); });
    else if (mode === "tout") D.NIV.forEach(function (n) { D.ACTS.forEach(function (a) { L.push([n.k, a.k]); }); });
    var multi = L.length > 0, P = $("#print");
    P.innerHTML = multi ? L.map(function (x, i) { return rendre(x[0], x[1], "p" + i + "-"); }).join("") : "";
    document.body.classList.toggle("multi", multi);
    Array.prototype.forEach.call(document.querySelectorAll(".g img"), function (i) { i.loading = "eager"; });
    var imgs = Array.prototype.slice.call(document.querySelectorAll(multi ? "#print img" : "#cur img")), left = imgs.filter(function (i) { return !i.complete; }).length, done = false;
    function go() { if (done) return; done = true; window.print(); }
    if (!left) setTimeout(go, 150); else { imgs.forEach(function (i) { if (!i.complete) i.onload = i.onerror = function () { if (--left <= 0) go(); }; }); setTimeout(go, 4000); }
  }
  window.addEventListener("afterprint", function () { document.body.classList.remove("multi"); $("#print").innerHTML = ""; });
  $("#p1").onclick = function () { imprimer(""); };
  $("#pm").onclick = function (e) { e.stopPropagation(); var m = $("#pmn"); m.hidden = !m.hidden; $("#pm").setAttribute("aria-expanded", String(!m.hidden)); };
  $("#pmn").onclick = function (e) { var b = e.target.closest("[data-p]"); if (!b) return; $("#pmn").hidden = true; imprimer(b.dataset.p); };
  document.addEventListener("click", function () { $("#pmn").hidden = true; $("#pm").setAttribute("aria-expanded", "false"); });
  function start() {
    $("#lock").hidden = true; $("#app").hidden = false;
    var h = (location.hash || "").slice(1).split("/"), s = null; try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    var old = { eleve: "a", prof: "b", bilan: "c" }[h[0]]; /* anciennes adresses #eleve, #prof, #bilan */
    N = old || (D.G[h[0]] ? h[0] : (s && D.G[s.n] ? s.n : "b")); A = (h[1] && D.G[N][h[1]]) ? h[1] : (!h[0] && s && D.G[N][s.a] ? s.a : "gen");
    somFit(); draw();
  }
  function teach() { try { return Date.now() < +(localStorage.getItem("eps.teach.until") || 0); } catch (e) { return false; } }
  function ask(n) { if (teach()) { start(); return; } if (!window.EPSD || !EPSD.askCode) { if ((n || 0) < 40) setTimeout(function () { ask((n || 0) + 1); }, 250); return; } EPSD.askCode().then(function (ok) { if (ok) start(); }); }
  $("#unlock").onclick = function () { ask(0); };
  if (teach()) start(); else window.addEventListener("load", function () { setTimeout(function () { ask(0); }, 400); });
})();
