<script>
"use strict";
// ======================= OrienRun Terrain =======================
// Pose de balises (position GPS contrôlée, photos, Google Maps) et tracé de chemins (pause automatique si le signal se perd).
// Données dans l'iPhone (IndexedDB). Exports : fichier OrienRun (.json), GPX, calque imprimable à l'échelle 1:25 000 / 1:50 000.
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const uid = () => Math.random().toString(36).slice(2, 10);
const fmtT = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtDur = ms => { const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s % 60).padStart(2, "0"); };
const fmtD = m => m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2).replace(".", ",") + " km";
const gmaps = (la, lo) => `https://www.google.com/maps/search/?api=1&query=${la.toFixed(6)},${lo.toFixed(6)}`;
function hav(a, b) { const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r; const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
const numAmbigu = n => { const m = { 0: "0", 1: "1", 6: "9", 8: "8", 9: "6" }, d = String(n); if (![...d].every(c => m[c] != null)) return false; return [...d].reverse().map(c => m[c]).join("") !== d; };
// Symboles (mêmes identifiants que dans OrienRun, codes ISOM 2017-2)
const LINES = { chemin: "Chemin (505)", sentier: "Petit sentier (506)", route: "Route / chemin large (502)", limveg: "Limite de végétation (416)", talus: "Talus (104)", cloture: "Clôture (516)", cloture_inf: "Clôture infranchissable (518)", mur: "Mur (513)", mur_inf: "Mur infranchissable (515)", ruisseau: "Ruisseau / fossé (305)", trace_course: "Autre (tracé violet)" };
const ZONES = { decouvert: "Terrain découvert (401)", semi: "Terrain semi-découvert (403)", vert1: "Forêt : course lente (406)", vert2: "Forêt : course difficile (408)", vert3: "Végétation impénétrable (410)", eau: "Étendue d'eau (301)", bati: "Bâtiment (521)", revetu: "Zone revêtue : cour, parking (501)", interdit: "Zone interdite (520)" };
const TYPES = { ...LINES, ...ZONES };
const isZone = t => !!ZONES[t];
const TYPE_COL = { chemin: "#111", sentier: "#555", route: "#b5651d", limveg: "#2a9d6f", talus: "#c0702c", cloture: "#111", cloture_inf: "#111", mur: "#111", mur_inf: "#111", ruisseau: "#00a0e2", trace_course: "#c21fbf", decouvert: "#ffba35", semi: "#ffdd9a", vert1: "#c9eab8", vert2: "#8ccf7e", vert3: "#3fae4a", eau: "#7fd0f5", bati: "#808080", revetu: "#e9cfae", interdit: "#a6a83b" };
// Densité de la végétation de part et d'autre du chemin (couleurs des cartes de course d'orientation)
const DENS = { blanc: { nom: "Blanc", aide: "forêt, course facile", col: "#ffffff", sym: null }, vert1: { nom: "Vert 1", aide: "course lente", col: "#c9eab8", sym: "vert1" }, vert2: { nom: "Vert 2", aide: "course difficile", col: "#8ccf7e", sym: "vert2" }, vert3: { nom: "Vert 3", aide: "impénétrable", col: "#3fae4a", sym: "vert3" }, jaune: { nom: "Jaune", aide: "découvert", col: "#ffba35", sym: "decouvert" }, jclair: { nom: "Jaune clair", aide: "semi-découvert", col: "#ffdd9a", sym: "semi" } };
// Éléments ponctuels
const ELEM = { rocher: "Rocher", gros_rocher: "Gros rocher", arbre: "Arbre remarquable", buisson: "Buisson remarquable", butte: "Petite butte", depression: "Petite dépression", trou: "Trou", source: "Fontaine / puits", objet_x: "Objet remarquable ×", objet_o: "Objet remarquable ○", poteau: "Grand pylône / tour" };
const ELEM_IC = { rocher: "▲", gros_rocher: "⬟", arbre: "◯", buisson: "●", butte: "•", depression: "◡", trou: "∨", source: "💧", objet_x: "×", objet_o: "○", poteau: "⏚" };
// Éléments remarquables (codes vérifiés sur l'O-Map Wiki de l'IOF : ISOM 2017-2 / ISSprOM 2019-2).
// 530 (○) et 531 (×) = « objet remarquable construit par l'homme » : les deux ont EXACTEMENT le même sens ; c'est l'auteur de la carte
// qui décide ce que chacun représente, et cette définition doit être écrite sur la carte (ex. « × = poubelle, ○ = plot »).
// sym "objet" : × ou ○ selon la légende choisie par l'enseignant (CFG.leg[type]).
const ELTYPES = [
  ["Objets remarquables : × ou ○ (530 / 531), selon ta légende", [["poubelle", "Poubelle", "objet"], ["plot", "Plot en béton / borne", "objet"], ["banc", "Banc", "objet"], ["panneau", "Panneau", "objet"], ["table", "Table", "objet"], ["borne_inc", "Borne incendie", "objet"], ["lampadaire", "Lampadaire", "objet"], ["statue", "Statue / monument", "objet"], ["abri_velo", "Abri / range-vélos", "objet"], ["jeu", "Jeu d'enfants", "objet"], ["autre", "Autre objet", "objet"]]],
  ["Végétation", [["arbre", "Grand arbre remarquable", "arbre"], ["buisson", "Buisson / petit arbre", "buisson"]]],
  ["Rochers et relief", [["rocher", "Rocher", "rocher"], ["gros_rocher", "Gros rocher (+ de 2 m)", "gros_rocher"], ["butte", "Petite butte", "butte"], ["depression", "Petite dépression", "depression"], ["trou", "Trou", "trou"]]],
  ["Eau et grandes constructions", [["source", "Fontaine / puits", "source"], ["poteau", "Grand pylône / tour", "poteau"]]]];
const ELT_BY = Object.fromEntries(ELTYPES.flatMap(g => g[1]).map(([k, nom, sym]) => [k, { nom, sym }]));
const SYMCODE = { objet_x: "531", objet_o: "530", poteau: "524", arbre: "417", buisson: "418", rocher: "204", gros_rocher: "205", butte: "112", depression: "115", trou: "116", source: "311" };
const legOf = k => (CFG.leg || {})[k] || null; // "x" | "o"
const symOf = k => ELT_BY[k].sym === "objet" ? (legOf(k) === "o" ? "objet_o" : "objet_x") : ELT_BY[k].sym;
const legTxt = () => { const L = CFG.leg || {}, by = v => Object.keys(L).filter(k => L[k] === v && ELT_BY[k]).map(k => ELT_BY[k].nom.toLowerCase()); const x = by("x"), o = by("o"); return (x.length ? `× = ${x.join(", ")}` : "") + (x.length && o.length ? " · " : "") + (o.length ? `○ = ${o.join(", ")}` : ""); };
const eltName = e => (e.type && ELT_BY[e.type] ? ELT_BY[e.type].nom : ELEM[e.sym] || e.sym);
const DESCRIPTIONS = ["Angle de bâtiment", "Angle de mur", "Angle de clôture", "Bout de mur", "Arbre", "Buisson", "Rocher", "Banc", "Lampadaire / poteau", "Panneau", "Escalier", "Entrée", "Portail", "Croisement de chemins", "Bout de chemin", "Virage", "Fontaine", "Butte", "Dépression", "Talus", "Limite de végétation", "Lisière (coin)", "Objet particulier"];

// ---------- stockage ----------
const DB = (() => { let p; const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open("orienrun-terrain", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  return { async get(k) { const db = await open(); return new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
    async set(k, v) { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } }; })();
let CFG = Object.assign({ accBalise: 6, accTrace: 15, mesure: 15, pas: 3, useCal: true, bande: 15 }, JSON.parse(localStorage.getItem("terrain.cfg") || "{}"));
const saveCfg = () => localStorage.setItem("terrain.cfg", JSON.stringify(CFG));
let BAL = [], TRC = [], REP = [], CAL = [], ELT = [];
const saveElt = () => DB.set("elements", ELT);
const saveBal = () => DB.set("balises", BAL), saveTrc = () => DB.set("traces", TRC), saveRep = () => DB.set("reperes", REP), saveCal = () => DB.set("calage", CAL);
// ---------- calage de la trace : correction déduite de points dont on connaît la vraie position ----------
// 1 point = décalage ; 2 points = décalage + rotation + échelle ; 3 points et plus = transformation affine + correction locale (chaque point tombe juste)
function makeCorr(pairs) {
  if (!pairs.length) return p => p;
  const la0 = pairs.reduce((s, x) => s + x.src.lat, 0) / pairs.length, lo0 = pairs.reduce((s, x) => s + x.src.lon, 0) / pairs.length;
  const kx = 111320 * Math.cos(la0 * Math.PI / 180), ky = 110540;
  const toM = p => [(p.lon - lo0) * kx, (p.lat - la0) * ky], fromM = (x, y) => ({ lat: la0 + y / ky, lon: lo0 + x / kx });
  const A = pairs.map(x => toM(x.src)), B = pairs.map(x => toM(x.dst));
  let f;
  if (A.length === 1) { const dx = B[0][0] - A[0][0], dy = B[0][1] - A[0][1]; f = (x, y) => [x + dx, y + dy]; }
  else if (A.length === 2) { const za = [A[1][0] - A[0][0], A[1][1] - A[0][1]], zb = [B[1][0] - B[0][0], B[1][1] - B[0][1]], d = za[0] ** 2 + za[1] ** 2 || 1; const c = [(zb[0] * za[0] + zb[1] * za[1]) / d, (zb[1] * za[0] - zb[0] * za[1]) / d]; f = (x, y) => { const dx = x - A[0][0], dy = y - A[0][1]; return [B[0][0] + c[0] * dx - c[1] * dy, B[0][1] + c[1] * dx + c[0] * dy]; }; }
  else { const S = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], bx = [0, 0, 0], by = [0, 0, 0];
    A.forEach((a, i) => { const v = [a[0], a[1], 1]; for (let r = 0; r < 3; r++) { for (let k = 0; k < 3; k++) S[r][k] += v[r] * v[k]; bx[r] += v[r] * B[i][0]; by[r] += v[r] * B[i][1]; } });
    const sol = b => { const m = S.map((r, i) => [...r, b[i]]); for (let c = 0; c < 3; c++) { let p = c; for (let r = c + 1; r < 3; r++) if (Math.abs(m[r][c]) > Math.abs(m[p][c])) p = r; [m[c], m[p]] = [m[p], m[c]]; const dd = m[c][c] || 1e-12; for (let r = 0; r < 3; r++) if (r !== c) { const q = m[r][c] / dd; for (let k = c; k < 4; k++) m[r][k] -= q * m[c][k]; } } return [0, 1, 2].map(i => m[i][3] / (m[i][i] || 1e-12)); };
    const cx = sol(bx), cy = sol(by), aff = (x, y) => [cx[0] * x + cx[1] * y + cx[2], cy[0] * x + cy[1] * y + cy[2]];
    const det = cx[0] * cy[1] - cx[1] * cy[0];
    if (!isFinite(det) || Math.abs(det) < .2) { const dx = B.reduce((s, b, i) => s + b[0] - A[i][0], 0) / A.length, dy = B.reduce((s, b, i) => s + b[1] - A[i][1], 0) / A.length; f = (x, y) => [x + dx, y + dy]; } // points alignés : simple décalage moyen
    else { const res = A.map((a, i) => { const q = aff(a[0], a[1]); return [B[i][0] - q[0], B[i][1] - q[1]]; });
      f = (x, y) => { const q = aff(x, y); let sw = 0, rx = 0, ry = 0; for (let i = 0; i < A.length; i++) { const d2 = (x - A[i][0]) ** 2 + (y - A[i][1]) ** 2; if (d2 < 1e-6) return [B[i][0], B[i][1]]; const w = 1 / d2; sw += w; rx += res[i][0] * w; ry += res[i][1] * w; } return [q[0] + rx / sw, q[1] + ry / sw]; }; } }
  return p => { const m = toM(p), q = f(m[0], m[1]); return { ...p, ...fromM(q[0], q[1]) }; };
}
let CORR = p => p; const recalcCorr = () => { CORR = CFG.useCal && CAL.length ? makeCorr(CAL) : (p => p); };
const cp = p => CORR(p); // position corrigée (ou brute s'il n'y a pas de calage)

// ---------- alertes visibles + son ----------

// ---------- mesure contrôlée d'une position ----------
// On ne garde que des positions récentes et assez précises ; refus (avec explication) plutôt qu'une position fausse.
function measure(seconds, thr, onProg) {

    G.listeners.add(on);

      const el = (Date.now() - t0) / 1000; if (!G.fix || Date.now() - G.fix.t > 5000) lost++;

        clearInterval(tick); G.listeners.delete(on);

        if (spread > thr * 1.6) return resolve({ ok: false, why: `Position instable : les mesures varient de ${Math.round(spread)} m. Reste immobile, téléphone à plat, et réessaie.`, best });
        resolve({ ok: true, lat: r.lat, lon: r.lon, acc: Math.round(Math.max(acc, spread) * 10) / 10, n: pts.length, spread: Math.round(spread * 10) / 10, alt: pts[pts.length - 1].alt, t: Date.now() });

}

    TRC.forEach(t => t.segments.forEach(seg => { if (seg.length < 2) return; L.polyline(seg.map(p => [p.lat, p.lon]), { color: "#666", weight: 3, opacity: .7, dashArray: "4 6" }).addTo(g); if (CAL.length) L.polyline(seg.map(p => { const q = cp(p); return [q.lat, q.lon]; }), { color: "#e63946", weight: 4 }).addTo(g); }));
    ELT.forEach(e => L.marker([e.lat, e.lon], { icon: L.divIcon({ className: "", html: `<div style="font:800 17px system-ui;color:#14213d;background:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;box-shadow:0 0 0 2px #2a9d6f">${ELEM_IC[e.sym]}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(g).bindTooltip(eltName(e), { direction: "top" }).on("click", ev => calClick(ev.latlng)));
    REP.forEach(r => L.circleMarker([r.lat, r.lon], { radius: 9, color: "#fff", weight: 2, fillColor: "#2a9d6f", fillOpacity: 1 }).addTo(g).bindTooltip("📌 " + r.nom, { direction: "top" }));
    CAL.forEach(c => { L.polyline([[c.src.lat, c.src.lon], [c.dst.lat, c.dst.lon]], { color: "#ffb703", weight: 3 }).addTo(g); L.circleMarker([c.dst.lat, c.dst.lon], { radius: 7, color: "#14213d", weight: 3, fillColor: "#ffb703", fillOpacity: 1 }).addTo(g).bindTooltip("🎯 " + c.nom, { permanent: true, direction: "right" }); });
    if (calState.src) L.circleMarker([calState.src.lat, calState.src.lon], { radius: 12, color: "#ffb703", weight: 4, fillOpacity: 0 }).addTo(g);
  }
  const box = $("#calBox"); if (!box) return;
  const st = calState.step;
  box.innerHTML = `${st === "src" ? `<p style="font-weight:800;color:#b45309">1/2 · Touche sur la carte un 📌 repère vert ou un point de ta trace grise.</p>` : st === "dst" ? `<p style="font-weight:800;color:#b45309">2/2 · Touche maintenant l'endroit EXACT où se trouve « ${esc(calState.nom)} » sur la photo aérienne (zoome au maximum).</p>` : ""}
   <div class="row">${st ? `<button class="btn ghost" id="cCancel">Annuler</button>` : `<button class="btn gr grow" id="cAdd">＋ Point de calage</button>`}</div>
   <h2 style="margin-top:14px">Points de calage (${CAL.length})</h2>${CAL.map((c, i) => `<div class="item"><div class="grow"><b>🎯 ${esc(c.nom)}</b><div class="muted" style="font-size:.85rem">correction de ${fmtD(hav(c.src, c.dst))}</div></div><button class="btn small ghost" data-cd="${i}">✕</button></div>`).join("") || '<p class="muted">Aucun. La trace est utilisée telle que le GPS l\'a enregistrée.</p>'}
   ${CAL.length ? `<label class="row" style="gap:8px;margin-top:10px"><input type="checkbox" id="cUse" ${CFG.useCal ? "checked" : ""}> Appliquer le calage aux exports et à l'affichage</label><p class="muted" style="font-size:.85rem">${CAL.length === 1 ? "1 point : toute la trace est simplement décalée." : CAL.length === 2 ? "2 points : décalage + rotation + échelle." : "3 points et plus : correction complète, chaque point tombe juste."} Trace grise = GPS brut, rouge = corrigée.</p>` : ""}`;
  $("#cAdd", box) && ($("#cAdd", box).onclick = () => { if (!calMap) return notify("Il faut internet pour afficher la photo aérienne.", "warn"); calState.step = "src"; calState.src = null; drawCal(); });
  $("#cCancel", box) && ($("#cCancel", box).onclick = () => { calState.step = null; calState.src = null; drawCal(); });
  $$("[data-cd]", box).forEach(b => b.onclick = () => { CAL.splice(+b.dataset.cd, 1); saveCal(); recalcCorr(); drawCal(); });
  $("#cUse", box) && ($("#cUse", box).onchange = e => { CFG.useCal = e.target.checked; saveCfg(); recalcCorr(); drawCal(); });
}
function calClick(ll) {
  if (!calState.step) return;
  const P = calMap.latLngToContainerPoint(ll), near = (p, px = 28) => calMap.latLngToContainerPoint([p.lat, p.lon]).distanceTo(P) <= px;
  if (calState.step === "src") {
    const e = ELT.find(x => near(x, 22)); if (e) { calState.src = { lat: e.lat, lon: e.lon }; calState.nom = eltName(e) + (e.note ? " · " + e.note : ""); calState.step = "dst"; return drawCal(); }
    const r = REP.find(x => near(x)); if (r) { calState.src = { lat: r.lat, lon: r.lon }; calState.nom = r.nom; calState.step = "dst"; return drawCal(); }
    let best = null, bd = 1e9; TRC.forEach(t => t.segments.forEach(seg => seg.forEach(p => { const d = calMap.latLngToContainerPoint([p.lat, p.lon]).distanceTo(P); if (d < bd) { bd = d; best = p; } })));
    if (best && bd <= 28) { calState.src = { lat: best.lat, lon: best.lon }; calState.nom = prompt("Nom de ce point (ce que tu vois sur la photo) :", "Point " + (CAL.length + 1)) || "Point " + (CAL.length + 1); calState.step = "dst"; return drawCal(); }
    notify("Touche plus près d'un repère vert ou de la trace grise (zoome si besoin).", "warn"); return;
  }
  if (calState.step === "dst") { CAL.push({ id: uid(), nom: calState.nom, src: calState.src, dst: { lat: ll.lat, lon: ll.lng } }); saveCal(); recalcCorr(); calState.step = null; calState.src = null; notify(`🎯 Point de calage ajouté (correction de ${fmtD(hav(CAL.at(-1).src, CAL.at(-1).dst))}).`, "ok"); drawCal(); }
}

// ---------- import GPX (Strava, IGNrando, OsmAnd…) ----------
function importGPX() {
  const f = $("#fileIn"); f.value = ""; f.removeAttribute("capture"); f.accept = ".gpx,application/gpx+xml,application/xml,text/xml,*/*";
  f.onchange = async () => { const file = f.files[0]; if (!file) return; try {
    const x = new DOMParser().parseFromString(await file.text(), "application/xml"); let nt = 0, nb = 0;
    const tim = el => { const t = el.querySelector("time")?.textContent; return t ? Date.parse(t) : Date.now(); };
    x.querySelectorAll("trk").forEach(trk => { const segs = [...trk.querySelectorAll("trkseg")].map(sg => [...sg.querySelectorAll("trkpt")].map(p => ({ lat: +p.getAttribute("lat"), lon: +p.getAttribute("lon"), t: tim(p) }))).filter(s => s.length > 1); if (!segs.length) return; TRC.push({ id: uid(), nom: trk.querySelector("name")?.textContent || file.name.replace(/\.gpx$/i, ""), type: "chemin", t0: segs[0][0].t, t1: segs.at(-1).at(-1).t, segments: segs, gaps: [], source: "gpx" }); nt++; });
    x.querySelectorAll("wpt").forEach(w => { const nm = w.querySelector("name")?.textContent || ""; const n = parseInt(nm) || nextN(); if (BAL.some(b => b.n === n)) return; BAL.push({ id: uid(), n, desc: (w.querySelector("desc")?.textContent || "").trim(), lat: +w.getAttribute("lat"), lon: +w.getAttribute("lon"), acc: null, imprecise: false, t: tim(w), photos: [], source: "gpx" }); nb++; });
    BAL.sort((a, b) => a.n - b.n); saveBal(); saveTrc(); notify(`✓ GPX importé : ${nt} tracé(s), ${nb} balise(s).`, "ok"); go(curView);
  } catch (e) { notify("Fichier GPX illisible.", "ko"); } };
  f.click();
}

// ---------- exports ----------
async function shareFile(name, data, type) {
  const file = new File([data], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
function toGPX() {
  const iso = t => new Date(t).toISOString(), x = s => esc(s);
  const BALc = BAL.map(b => ({ ...b, ...cp(b) })), TRCc = TRC.map(t => ({ ...t, segments: t.segments.map(sg => sg.map(cp)) })), REPc = REP.map(r => ({ ...r, ...cp(r) }));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="OrienRun Pose des balises" xmlns="http://www.topografix.com/GPX/1/1">\n` +
    ELT.map(e0 => { const e = cp(e0); return `<wpt lat="${e.lat.toFixed(7)}" lon="${e.lon.toFixed(7)}"><time>${iso(e0.t)}</time><name>${x(eltName(e0))}</name><desc>${x(e0.note || "")} (±${e0.acc} m)</desc><type>${e0.sym}</type></wpt>\n`; }).join("") +
    REPc.map(r => `<wpt lat="${r.lat.toFixed(7)}" lon="${r.lon.toFixed(7)}"><time>${iso(r.t)}</time><name>${x(r.nom)}</name><desc>Repère (±${r.acc} m)</desc><sym>Pin</sym></wpt>\n`).join("") +
    BALc.map(b => `<wpt lat="${b.lat.toFixed(7)}" lon="${b.lon.toFixed(7)}">${b.alt != null ? `<ele>${b.alt}</ele>` : ""}<time>${iso(b.t)}</time><name>${b.n}</name><desc>${x(b.desc || "")}${b.acc ? ` (±${b.acc} m)` : ""}</desc><sym>Flag</sym></wpt>\n`).join("") +
    TRCc.map(t => `<trk><name>${x(t.nom)}</name><type>${x(TYPES[t.type])}</type>${t.segments.map(sg => `<trkseg>${sg.map(p => `<trkpt lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}">${p.alt != null ? `<ele>${p.alt}</ele>` : ""}<time>${iso(p.t)}</time></trkpt>`).join("")}</trkseg>`).join("")}</trk>\n`).join("") + `</gpx>\n`;
}

  $("#eClr").onclick = () => { if (!confirm("Effacer TOUTES les balises et tous les tracés de ce téléphone ? (pense à exporter avant)")) return; if (!confirm("Vraiment tout effacer ?")) return; BAL = []; TRC = []; REP = []; CAL = []; ELT = []; saveBal(); saveTrc(); saveRep(); saveCal(); saveElt(); recalcCorr(); notify("Données effacées.", "warn"); };
}

function toCSV() {
  const rows = [["type", "nom", "morceau", "n°", "heure", "latitude", "longitude", "précision (m)", "UTM zone", "UTM E (m)", "UTM N (m)", "lat. GPS brute", "lon. GPS brute", "densité gauche", "densité droite"]];
  const add = (type, nom, seg, i, p) => { const q = cp(p), u = toUTM(q.lat, q.lon); rows.push([type, nom, seg, i, p.t ? new Date(p.t).toLocaleString("fr-FR") : "", q.lat.toFixed(7), q.lon.toFixed(7), p.acc ?? "", u.zone, u.E.toFixed(1), u.N.toFixed(1), p.lat.toFixed(7), p.lon.toFixed(7), p.g ? DENS[p.g].nom : "", p.d ? DENS[p.d].nom : ""]); };
  TRC.forEach(t => t.segments.forEach((sg, k) => sg.forEach((p, i) => add(isZone(t.type) ? "zone : " + ZONES[t.type] : "trace : " + (LINES[t.type] || t.type), t.nom, k + 1, i + 1, p))));
  ELT.forEach(e => add("élément", eltName(e) + (e.note ? " · " + e.note : ""), "", "", e));
  BAL.forEach(b => add("balise", b.desc || "Balise " + b.n, "", b.n, b)); REP.forEach(r => add("repère", r.nom, "", "", r));
  return "\ufeff" + rows.map(r => r.map(v => /[;"\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(";")).join("\r\n");
}
// ---------- calque à l'échelle : projection Mercator à l'échelle vraie au centre + quadrillage UTM (WGS84) des cartes IGN ----------
function toUTM(lat, lon, zone) {
  const a = 6378137, f = 1 / 298.257223563, k0 = .9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2), r = Math.PI / 180;
  zone = zone || Math.floor((lon + 180) / 6) + 1; const l0 = ((zone - 1) * 6 - 180 + 3) * r, ph = lat * r, la = lon * r;
  const N = a / Math.sqrt(1 - e2 * Math.sin(ph) ** 2), T = Math.tan(ph) ** 2, C = ep2 * Math.cos(ph) ** 2, A = Math.cos(ph) * (la - l0);
  const M = a * ((1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * ph - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * ph) + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * ph) - (35 * e2 ** 3 / 3072) * Math.sin(6 * ph));
  const E = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
  const Nn = k0 * (M + N * Math.tan(ph) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  return { E, N: Nn, zone };
}
function fromUTM(E, N, zone) { // inverse approché par itérations (suffisant au mètre près)
  let lat = N / 111132, lon = (zone - 1) * 6 - 180 + 3;
  for (let i = 0; i < 6; i++) { const u = toUTM(lat, lon, zone), dLat = (N - u.N) / 111132, dLon = (E - u.E) / (111320 * Math.cos(lat * Math.PI / 180)); lat += dLat; lon += dLon; }
  return { lat, lon };
}
const R_EARTH = 6378137, mx = lon => R_EARTH * lon * Math.PI / 180, my = lat => R_EARTH * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
function printCalque(scale, bg, orient) {
  recalcCorr();
  const BALc = BAL.map(b => ({ ...b, ...cp(b) })), TRCc = TRC.map(t => ({ ...t, segments: t.segments.map(sg => sg.map(cp)) })), REPc = REP.map(r => ({ ...r, ...cp(r) }));
  const pts = [...BALc.map(b => ({ lat: b.lat, lon: b.lon })), ...REPc, ...ELT.map(cp), ...TRCc.flatMap(t => t.segments.flat())];
  if (!pts.length) return notify("Rien à imprimer : pose des balises ou trace des chemins d'abord.", "warn");
  const W = orient === "l" ? 277 : 190, H = orient === "l" ? 170 : 257; // zone utile en mm (marges et légende)
  const la0 = (Math.min(...pts.map(p => p.lat)) + Math.max(...pts.map(p => p.lat))) / 2, lo0 = (Math.min(...pts.map(p => p.lon)) + Math.max(...pts.map(p => p.lon))) / 2;
  const k = Math.cos(la0 * Math.PI / 180), mmPerM = 1000 / scale; // 1 m sur le terrain = mmPerM mm sur la feuille
  const cx = mx(lo0), cy = my(la0);
  const P = (lat, lon) => ({ x: W / 2 + (mx(lon) - cx) * k * mmPerM, y: H / 2 - (my(lat) - cy) * k * mmPerM });
  const xs = pts.map(p => P(p.lat, p.lon)), over = xs.some(p => p.x < 0 || p.x > W || p.y < 0 || p.y > H);
  if (over && !confirm(`À cette échelle, tes relevés dépassent la feuille (${(W * scale / 1e6).toFixed(1)} × ${(H * scale / 1e6).toFixed(1)} km). Imprimer quand même le centre ? (sinon choisis 1:50 000 ou le paysage)`)) return;
  // fond Plan IGN : tuiles Web Mercator posées à l'échelle exacte
  let tiles = "";
  if (bg === "plan") {
    const z = scale >= 50000 ? 14 : scale >= 25000 ? 15 : 16, n = 2 ** z, ts = 2 * Math.PI * R_EARTH / n; // taille d'une tuile en mètres Mercator
    const halfW = W / 2 / (k * mmPerM), halfH = H / 2 / (k * mmPerM);
    const tx0 = Math.floor((cx - halfW + Math.PI * R_EARTH) / ts), tx1 = Math.floor((cx + halfW + Math.PI * R_EARTH) / ts), ty0 = Math.floor((Math.PI * R_EARTH - (cy + halfH)) / ts), ty1 = Math.floor((Math.PI * R_EARTH - (cy - halfH)) / ts);
    if ((tx1 - tx0 + 1) * (ty1 - ty0 + 1) > 400) return notify("Zone trop grande pour le fond IGN : choisis « Aucun ».", "warn");
    for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) { const X = tx * ts - Math.PI * R_EARTH, Y = Math.PI * R_EARTH - ty * ts; const x = W / 2 + (X - cx) * k * mmPerM, y = H / 2 - (Y - cy) * k * mmPerM, s = ts * k * mmPerM;
      tiles += `<image href="https://data.geopf.fr/wmts?SERVICE=WMTS&amp;REQUEST=GetTile&amp;VERSION=1.0.0&amp;LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&amp;STYLE=normal&amp;TILEMATRIXSET=PM&amp;TILEMATRIX=${z}&amp;TILEROW=${ty}&amp;TILECOL=${tx}&amp;FORMAT=image/png" x="${x.toFixed(3)}" y="${y.toFixed(3)}" width="${(s + .05).toFixed(3)}" height="${(s + .05).toFixed(3)}" preserveAspectRatio="none" opacity=".75"/>`; }
  }
  // quadrillage UTM (1 km au 1:25 000 et au 1:10 000, 2 km au 1:50 000)
  const zone = Math.floor((lo0 + 180) / 6) + 1, c = toUTM(la0, lo0, zone), step = scale >= 50000 ? 2000 : 1000;
  const spanE = W * scale / 1000 * .7 + 2 * step, spanN = H * scale / 1000 * .7 + 2 * step;
  let grid = "";
  for (let E = Math.floor((c.E - spanE) / step) * step; E <= c.E + spanE; E += step) { const a = fromUTM(E, c.N - spanN, zone), b = fromUTM(E, c.N + spanN, zone), A = P(a.lat, a.lon), B = P(b.lat, b.lon); grid += `<line x1="${A.x.toFixed(2)}" y1="${A.y.toFixed(2)}" x2="${B.x.toFixed(2)}" y2="${B.y.toFixed(2)}" stroke="#1f4fa3" stroke-width=".18"/>`; const L1 = fromUTM(E, c.N, zone), q = P(L1.lat, L1.lon); grid += `<text x="${(q.x + .6).toFixed(1)}" y="3.2" font-size="2.6" fill="#1f4fa3">${String(Math.round(E / 1000)).slice(-3)}</text>`; }
  for (let N = Math.floor((c.N - spanN) / step) * step; N <= c.N + spanN; N += step) { const a = fromUTM(c.E - spanE, N, zone), b = fromUTM(c.E + spanE, N, zone), A = P(a.lat, a.lon), B = P(b.lat, b.lon); grid += `<line x1="${A.x.toFixed(2)}" y1="${A.y.toFixed(2)}" x2="${B.x.toFixed(2)}" y2="${B.y.toFixed(2)}" stroke="#1f4fa3" stroke-width=".18"/>`; const L1 = fromUTM(c.E, N, zone), q = P(L1.lat, L1.lon); grid += `<text x="1" y="${(q.y - .6).toFixed(1)}" font-size="2.6" fill="#1f4fa3">${String(Math.round(N / 1000)).slice(-4)}</text>`; }
  const sw = scale >= 50000 ? .5 : .6;
  const traces = TRCc.filter(t => !isZone(t.type)).map(t => t.segments.filter(s => s.length > 1).map(s => `<polyline points="${s.map(p => { const q = P(p.lat, p.lon); return q.x.toFixed(2) + "," + q.y.toFixed(2); }).join(" ")}" fill="none" stroke="${t.type === "trace_course" ? "#c21fbf" : t.type === "ruisseau" ? "#00a0e2" : "#d01f1f"}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"${t.type === "sentier" ? ' stroke-dasharray="1.2 .8"' : ""}/>`).join("")).join("");
  const r = 2.5;
  const bals = BALc.map(b => { const q = P(b.lat, b.lon); return `<circle cx="${q.x.toFixed(2)}" cy="${q.y.toFixed(2)}" r="${r}" fill="none" stroke="#c21fbf" stroke-width=".35"/><circle cx="${q.x.toFixed(2)}" cy="${q.y.toFixed(2)}" r=".25" fill="#c21fbf"/><text x="${(q.x + r + .6).toFixed(2)}" y="${(q.y - r).toFixed(2)}" font-size="3.4" font-weight="700" fill="#c21fbf">${b.n}</text>`; }).join("");
  // barre d'échelle : 1 km (ou 500 m au 1:10 000)
  const bar = scale <= 10000 ? 500 : 1000, barMm = bar * mmPerM;
  const legende = `<g transform="translate(0,${H + 5})"><rect x="0" y="0" width="${barMm / 2}" height="1.6" fill="#000"/><rect x="${barMm / 2}" y="0" width="${barMm / 2}" height="1.6" fill="#fff" stroke="#000" stroke-width=".25"/><text x="0" y="5" font-size="2.8">0</text><text x="${barMm - 3}" y="5" font-size="2.8">${bar === 1000 ? "1 km" : "500 m"}</text>
    <text x="${barMm + 8}" y="2" font-size="3.6" font-weight="700">Échelle 1 : ${scale.toLocaleString("fr-FR")} — 1 cm = ${scale / 100} m</text><text x="${barMm + 8}" y="6.5" font-size="2.6">Quadrillage bleu : UTM zone ${zone}N (WGS84), ${step / 1000} km, comme sur les cartes IGN.</text>
    <text x="${barMm + 8}" y="10" font-size="2.6">Imprimer à 100 % (taille réelle), sans « ajuster à la page ».</text>
    <text x="${barMm + 8}" y="13.5" font-size="2.6">Centre : ${la0.toFixed(5)}, ${lo0.toFixed(5)} · ${BALc.length} balise(s), ${TRCc.length} tracé(s)${CFG.useCal && CAL.length ? `, trace calée sur ${CAL.length} point(s)` : ""} · ${new Date().toLocaleDateString("fr-FR")}</text></g>`;
  const nord = `<g transform="translate(${W - 8},12)"><path d="M0,-8 L3,2 L0,0 L-3,2Z" fill="#000"/><text x="0" y="6" font-size="3.5" text-anchor="middle" font-weight="700">N</text></g>`;
  let zon = "";
  TRCc.forEach(t => { if (isZone(t.type)) t.segments.forEach(sg => { zon += `<polygon points="${sg.map(p => { const q = P(p.lat, p.lon); return q.x.toFixed(2) + "," + q.y.toFixed(2); }).join(" ")}" fill="${TYPE_COL[t.type]}" fill-opacity=".55" stroke="#14213d" stroke-width=".15"/>`; }); });
  TRC.forEach(t => densBands(t).forEach(b => { if (b.cls === "blanc") return; zon += `<polygon points="${b.poly.map(p => { const q = P(p.lat, p.lon); return q.x.toFixed(2) + "," + q.y.toFixed(2); }).join(" ")}" fill="${DENS[b.cls].col}" fill-opacity=".6"/>`; }));
  const elts = ELT.map(e0 => { const e = cp(e0), q = P(e.lat, e.lon); return `<text x="${q.x.toFixed(2)}" y="${(q.y + 1).toFixed(2)}" font-size="2.8" text-anchor="middle" font-weight="700">${ELEM_IC[e0.sym] === "💧" ? "o" : ELEM_IC[e0.sym]}</text>`; }).join("");
  const reps = REPc.map(r => { const q = P(r.lat, r.lon); return `<path d="M${q.x.toFixed(2)},${(q.y - 1.6).toFixed(2)}l1.4,2.4h-2.8z" fill="#2a9d6f"/><text x="${(q.x + 1.8).toFixed(2)}" y="${(q.y + .8).toFixed(2)}" font-size="2.2" fill="#2a9d6f">${esc(r.nom)}</text>`; }).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H + 18}mm" viewBox="0 0 ${W} ${H + 18}"><defs><clipPath id="cl"><rect width="${W}" height="${H}"/></clipPath></defs><g clip-path="url(#cl)">${tiles}${zon}${grid}${traces}${elts}${reps}${bals}</g><rect width="${W}" height="${H}" fill="none" stroke="#000" stroke-width=".3"/>${nord}${legende}</svg>`;
  const w = window.open("", "_blank");
  if (!w) return notify("Autorise les fenêtres surgissantes pour imprimer.", "ko");
  w.document.write(`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Calque 1:${scale}</title><style>@page{size:A4 ${orient === "l" ? "landscape" : "portrait"};margin:${orient === "l" ? "10mm" : "10mm"}}body{margin:0;font-family:Arial,sans-serif}.bar{position:sticky;top:0;background:#14213d;color:#fff;padding:10px;font-size:14px;display:flex;gap:10px;align-items:center}.bar button{font-size:16px;padding:8px 16px;border-radius:20px;border:0;background:#f47a20;color:#fff;font-weight:700}@media print{.bar{display:none}}svg{display:block}</style></head><body><div class="bar"><button onclick="print()">🖨 Imprimer</button><span>Imprime à 100 % (taille réelle). Vérifie avec une règle : la barre d'échelle doit mesurer ${barMm.toFixed(0)} mm.</span></div>${svg}</body></html>`);
  w.document.close();
}

// ---------- réglages ----------
function vReglages() {
  $("#title").textContent = "Réglages";
  const opt = (id, vals, cur, unit) => `<select class="inp" id="${id}">${vals.map(v => `<option value="${v}" ${+cur === v ? "selected" : ""}>${v} ${unit}</option>`).join("")}</select>`;
  $("#view").innerHTML = `<div class="card"><h2>Précision GPS exigée</h2><label class="lbl">Pour enregistrer une balise</label>${opt("cB", [3, 4, 5, 6, 8, 10, 15], CFG.accBalise, "m maximum")}<label class="lbl">Durée de la mesure d'une balise</label>${opt("cM", [10, 15, 20, 30], CFG.mesure, "secondes")}<label class="lbl">Pour enregistrer un tracé</label>${opt("cT", [8, 10, 15, 20, 30], CFG.accTrace, "m maximum")}<label class="lbl">Un point du tracé tous les…</label>${opt("cP", [2, 3, 5, 10], CFG.pas, "m environ")}<label class="lbl">Largeur notée pour la densité (de chaque côté du chemin)</label>${opt("cW", [5, 10, 15, 20, 30, 50], CFG.bande, "m")}
    <p class="muted" style="font-size:.88rem">Un iPhone à découvert donne en général ±3 à ±8 m. Près des bâtiments et sous les arbres, c'est moins bon : l'appli préfère refuser et prévenir plutôt que d'enregistrer une position fausse.</p><button class="btn gr w100" id="cS">Enregistrer</button></div>
   <div class="card"><h2>Sur iPhone</h2><ul style="padding-left:18px;line-height:1.5"><li>Réglages → Confidentialité → Service de localisation : activé, et pour Safari ou Terrain : « Lorsque l'app est active » + <b>Position exacte</b>.</li><li>Pendant un tracé : laisse l'écran allumé (Réglages → Luminosité → Verrouillage auto. : Jamais, le temps de la sortie).</li><li>Pour tracer écran verrouillé : Strava ou IGNrando, puis « Importer un GPX ».</li></ul></div>`;
  $("#cS").onclick = () => { CFG.accBalise = +$("#cB").value; CFG.mesure = +$("#cM").value; CFG.accTrace = +$("#cT").value; CFG.pas = +$("#cP").value; CFG.bande = +$("#cW").value; saveCfg(); notify("Réglages enregistrés ✓", "ok"); go("home"); };
}

// ---------- démarrage ----------
(async () => {
  BAL = (await DB.get("balises")) || []; TRC = (await DB.get("traces")) || []; REP = (await DB.get("reperes")) || []; CAL = (await DB.get("calage")) || []; ELT = (await DB.get("elements")) || []; recalcCorr();
  const r = await DB.get("rec"); if (r && r.cur) { REC.on = true; REC.cur = r.cur; REC.paused = true; REC.side = r.side || { g: "", d: "" }; REC.cur.segments.push([]); notify("Un tracé était en cours : il est en pause. Ouvre « Tracer un chemin » pour le reprendre ou le terminer.", "warn", true); }
  startGPS(); go("home");
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
