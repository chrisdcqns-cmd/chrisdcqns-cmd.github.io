<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="../eps-lists.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<title>Cross-training · Tablette scindée</title>
<style>
  html,body{margin:0;height:100%;background:#14171C;font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  .barre{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:inset 0 -3px 0 #4D7C0F}
  .barre b{font-size:15px}
  .barre span{color:#A9AEB8;font-size:13px}
  .barre button{margin-left:auto;height:30px;border-radius:8px;border:1.5px solid #3A3F47;background:transparent;color:#D5D8DE;font-weight:700;padding:0 10px}
  .boxes{height:calc(100% - 40px);display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#14171C}
  .box{position:relative;background:#F5F3EE;min-width:0}
  .box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tag{position:absolute;z-index:2;left:50%;top:0;transform:translateX(-50%);background:#4D7C0F;color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:0 0 8px 8px;pointer-events:none}
  .box:nth-child(2) .tag{background:#2F6FDB}
  @media (orientation:portrait){ .boxes{grid-template-columns:1fr;grid-template-rows:1fr 1fr} }
</style>
</head>
<body>
  <div class="barre"><b>Cross-training</b><span>Tablette scindée · 2 boxes</span><span data-eps-upd-slot></span><button id="quitter" title="Quitter la tablette scindée">Quitter</button></div>
  <div class="boxes">
    <div class="box"><span class="tag">Box 1 · bip aigu</span><iframe src="./?box=1" title="Box 1" allow="autoplay; screen-wake-lock; fullscreen"></iframe></div>
    <div class="box"><span class="tag">Box 2 · bip grave</span><iframe src="./?box=2" title="Box 2" allow="autoplay; screen-wake-lock; fullscreen"></iframe></div>
  </div>
<script>
  document.getElementById("quitter").onclick = () => { if (confirm("Quitter la tablette scindée ? Les WOD en cours des deux boxes seront arrêtés.")) location.href = "./"; };
  try { navigator.wakeLock && navigator.wakeLock.request("screen"); } catch (e) {}
</script>
</body>
</html>
