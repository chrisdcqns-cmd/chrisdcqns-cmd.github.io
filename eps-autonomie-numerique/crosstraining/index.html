<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="../eps-lists.js"></script>
<script src="../eps-shell.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<title>Cross-training · EPS Autonomie et Numérique</title>
<style>
:root{
  --fond:#F5F3EE; --carte:#fff; --encre:#14171C; --doux:#6A6F78; --ligne:#E6E1D6;
  --ct:#4D7C0F; --app:#4D7C0F; --ct-clair:#eef5e4; --nuit:#14171C;
  --R:#2f6fdb; --R-c:#e9f0fd; --M:#8a3fd1; --M-c:#f3eafc; --C:#d93a3a; --C-c:#fdeaea;
  --ok:#1e8a4c; --ok-c:#e6f5ec; --ko:#c0392b; --ko-c:#fbeae8;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:84px}

/* Bandeau */
header{position:sticky;top:0;z-index:20;background:#14171C;color:#fff;padding:10px 14px 14px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 -4px 0 var(--app)}
header .mk{width:36px;height:36px;border-radius:10px;background:var(--app);padding:6px;flex:none}
header h1{font-size:20px;margin:0;line-height:1.1;font-weight:800}
header small{display:block;color:#A9AEB8;font-weight:500;font-size:13px}
header [data-eps-bar]{margin-left:auto;display:flex;gap:6px;align-items:center}

/* Onglets bas */
nav.onglets{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--ligne);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.onglets .in{display:flex;width:100%;max-width:620px}
nav.onglets button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:12px;color:var(--doux);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.onglets button b{font-size:20px;line-height:1}
nav.onglets button.actif{color:var(--ct);font-weight:700}
nav.onglets .compteur{background:var(--ct);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;margin-left:2px}

main{padding:14px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.carte{background:var(--carte);border-radius:var(--r);padding:14px;box-shadow:0 1px 0 rgba(0,0,0,.04);border:1px solid var(--ligne);margin-bottom:12px}
.doux{color:var(--doux)}
.petit{font-size:13px}
.ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--nuit);color:#fff}
.btn.ct{background:var(--ct)}
.btn.clair{background:#efece6;color:var(--encre)}
.btn.contour{background:#fff;border:1.5px solid var(--ligne);color:var(--encre)}
.btn.danger{background:var(--ko-c);color:var(--ko)}
.btn.plein{width:100%}
.btn:disabled{opacity:.45}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{width:100%;border:1.5px solid var(--ligne);border-radius:10px;padding:9px 10px;background:#fff}
textarea{min-height:58px;resize:vertical}
label.champ{display:block;font-size:12px;font-weight:700;color:var(--doux);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px}

/* Recherche et filtres */
.recherche{position:relative;margin-bottom:10px}
.recherche input{padding-left:36px;border-radius:12px;height:44px}
.recherche span{position:absolute;left:12px;top:11px;color:var(--doux)}
.filtres{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.puce{flex:none;border:1.5px solid var(--ligne);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.puce.on{background:var(--nuit);border-color:var(--nuit);color:#fff}
.puce.R.on{background:var(--R);border-color:var(--R)} .puce.M.on{background:var(--M);border-color:var(--M)} .puce.C.on{background:var(--C);border-color:var(--C)}

/* Grille d'exercices */
.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ex{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.vign{aspect-ratio:3/4;background:#2a2d34 center/cover no-repeat;position:relative;display:grid;place-items:center;color:#fff}
.vign .sans{font-size:34px;opacity:.5}
.vign .nbv{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);border-radius:99px;padding:2px 8px;font-size:11px}
.vign .fam{position:absolute;left:8px;top:8px;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;background:#fff;color:var(--nuit)}
.vign .acomp{position:absolute;right:8px;top:8px;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800;background:#ffd43b;color:#000}
.ex .txt{padding:9px 10px 11px}
.ex .en{font-weight:800;font-size:15px;line-height:1.2}
.ex .fr{font-size:12px;color:var(--doux)}
.ex .th{display:flex;gap:4px;margin-top:6px}
.dot{width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:800;display:grid;place-items:center;color:#fff}
.dot.R{background:var(--R)} .dot.M{background:var(--M)} .dot.C{background:var(--C)}

/* Fiche */
.voile{position:fixed;inset:0;background:rgba(10,11,14,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.feuille{background:var(--fond);width:100%;max-width:620px;max-height:96vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:90px;animation:monte .22s ease}
@keyframes monte{from{transform:translateY(40px);opacity:0}}
.feuille .tete{position:sticky;top:0;background:var(--fond);z-index:2;padding:14px 14px 8px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--ligne)}
.feuille .tete .t{flex:1}
.feuille .tete .en{font-size:22px;font-weight:800;line-height:1.1}
.fermer{border:0;background:#e6e2da;width:36px;height:36px;border-radius:99px;font-size:18px;flex:none}
.niveaux{display:flex;background:#e9e5de;border-radius:12px;padding:4px;gap:4px;margin:12px 14px 0}
.niveaux button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px;line-height:1.15}
.niveaux button small{display:block;font-weight:500;font-size:11px;color:var(--doux)}
.niveaux button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.corps{padding:12px 14px}

/* Vidéos verticales */
.carrousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.carrousel::-webkit-scrollbar{display:none}
.diapo{flex:none;width:min(62vw,300px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#1f2228 center/cover no-repeat;scroll-snap-align:center;position:relative;display:grid;place-items:center;color:#fff;border:0;padding:0}
.carrousel.seule{justify-content:center}
.diapo iframe,.diapo video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:cover}
.lecture{width:64px;height:64px;border-radius:99px;background:rgba(232,89,12,.92);display:grid;place-items:center;font-size:26px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.diapo .etq{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);border-radius:99px;padding:3px 9px;font-size:12px}
.diapo.vide{background:repeating-linear-gradient(135deg,#e7e3dc 0 12px,#efebe5 12px 24px);color:var(--doux);font-weight:600;text-align:center;padding:20px}
.points{display:flex;justify-content:center;gap:6px;margin-top:8px}
.points i{width:7px;height:7px;border-radius:9px;background:#cfc9bf}
.points i.on{background:var(--ct);width:18px}

.consigne{font-size:16px;font-weight:600;margin:14px 0 10px}
.std{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.std div{border-radius:12px;padding:10px;font-size:13px}
.std b{display:block;font-size:12px;letter-spacing:.3px;margin-bottom:2px}
.std .rep{background:var(--ok-c);color:#174d2f} .std .rep b{color:var(--ok)}
.std .norep{background:var(--ko-c);color:#6d2219} .std .norep b{color:var(--ko)}
.muscles{display:flex;flex-wrap:wrap;gap:6px}
.m{border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
.m.p{background:var(--nuit);color:#fff}
.m.s{background:#fff;border:1.5px dashed #b9b3a8;color:var(--encre)}
.paser{display:grid;gap:6px}
.paser div{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:8px 10px;font-size:14px}
.paser b{flex:none;width:28px;height:28px;border-radius:8px;background:var(--ct);color:#fff;display:grid;place-items:center}
.paser em{font-style:normal;font-weight:700;display:block;font-size:12px;color:var(--doux)}
.alerte{background:#fff7db;border:1px solid #f2dd8f;border-radius:12px;padding:10px;font-size:14px}
.barre-action{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--fond) 30%)}
.barre-action .in{width:100%;max-width:592px;display:flex;gap:8px}
.barre-action .btn{flex:1;padding:14px}

/* Ma leçon */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme{border:2px solid var(--ligne);border-radius:14px;background:#fff;padding:10px 8px;text-align:left}
.theme b{display:block;font-size:15px}
.theme small{display:block;font-size:11px;color:var(--doux);line-height:1.25}
.theme .fc{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.theme.R .fc{background:var(--R-c);color:var(--R)} .theme.M .fc{background:var(--M-c);color:var(--M)} .theme.C .fc{background:var(--C-c);color:var(--C)}
.theme.R.on{border-color:var(--R);background:var(--R-c)} .theme.M.on{border-color:var(--M);background:var(--M-c)} .theme.C.on{border-color:var(--C);background:var(--C-c)}
.formats{display:flex;flex-wrap:wrap;gap:6px}
.formats .puce small{font-weight:500;opacity:.8}
.formats .puce.conseil::after{content:" ★";color:#e0a800}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.params label{font-size:12px;color:var(--doux);font-weight:700}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:8px;margin-bottom:8px}
.item .mini{width:46px;height:62px;border-radius:9px;background:#2a2d34 center/cover;flex:none;display:grid;place-items:center;color:#fff;font-weight:800}
.item .nom{flex:1;min-width:0}
.item .nom b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nom .ligne{gap:4px;margin-top:4px}
.niv-mini{display:flex;border:1.5px solid var(--ligne);border-radius:8px;overflow:hidden}
.niv-mini button{border:0;background:#fff;padding:3px 8px;font-size:12px;font-weight:700}
.niv-mini button.on{background:var(--nuit);color:#fff}
.qte{width:64px!important;padding:5px 6px!important;text-align:center;font-weight:700}
.outils{display:flex;flex-direction:column;gap:4px}
.outils button{border:0;background:#efece6;border-radius:8px;width:30px;height:26px;font-size:13px}
.tableau{background:var(--nuit);color:#f5f5f5;border-radius:var(--r);padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:pre-wrap;line-height:1.55}
.tableau .titre{font-family:system-ui;font-weight:800;font-size:18px;color:#ffb38a}
.bilan{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.bilan div{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:8px;text-align:center}
.bilan b{display:block;font-size:20px}
.bilan .zero{border-color:#f2dd8f;background:#fff7db}
.conseils li{margin-bottom:4px}
.vide-lecon{text-align:center;padding:26px 10px;color:var(--doux);border:2px dashed var(--ligne);border-radius:var(--r)}

/* Enseignant */
.rapport{width:100%;border-collapse:collapse;font-size:13px}
.rapport th,.rapport td{border-bottom:1px solid var(--ligne);padding:6px 4px;text-align:left}
.rapport td.c{text-align:center}
.ok{color:var(--ok);font-weight:800} .ko{color:var(--ko);font-weight:800} .att{color:#b07a00;font-weight:800}
.liste-ex{display:grid;gap:6px}
.liste-ex button{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:8px 10px}
.liste-ex button span{flex:1}
.muscle-choix{display:flex;flex-wrap:wrap;gap:6px}
.muscle-choix button{border:1.5px solid var(--ligne);background:#fff;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:600}
.muscle-choix button.p{background:var(--nuit);border-color:var(--nuit);color:#fff}
.muscle-choix button.s{border-style:dashed;border-color:#8d877c;background:#f6f3ee}
.bloc-niv{border:1.5px solid var(--ligne);border-radius:14px;padding:10px;margin-top:10px;background:#fbfaf8}
.bloc-niv h4{margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--nuit);color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-weight:600;max-width:90vw;text-align:center}
.bandeau-maj{background:#fff7db;border-bottom:1px solid #f2dd8f;padding:8px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.bandeau-maj button{margin-left:auto}
.cache{display:none!important}
</style>
</head>

  <header>
<svg class="mk" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="7"/><path d="M12 10v4l2.5 2"/><path d="M9.5 2h5"/><path d="M12 2v5"/><path d="M19 6l1.5-1.5"/></svg>
    <div><h1>Cross-training<small id="sousTitre">CA5 · S'entraîner</small></h1></div>

  </header>
  <div id="bandeau"></div>
  <main id="vue"></main>
</div>
<nav class="onglets"><div class="in" id="onglets"></div></nav>
<div id="calque"></div>

<script>
/* ======================= RÉGLAGES DE DÉPLOIEMENT =======================
   Collez ici l'URL du script Google (…/exec) avant de publier sur GitHub :
   les téléphones des élèves s'en servent pour lire la bibliothèque.      */
const CONFIG = { SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzMC68J_J-iKj6mCi9sIkxYTQoW8w5Qsool00ng1mwwRN4BVOAu9l0FN8_pVSPp0oh1lQ/exec" }; // script commun par défaut

/* ===== Bibliothèque par défaut : 20 exercices sans matériel × 3 niveaux =====
   famille : G = gymnastique (poids du corps, force) · M = métabolique (cardio)
   mesure  : reps | temps (secondes) | distance (allers-retours)
   impact  : faible | moyen | fort (sauts, bruit, articulations)

const BIBLIO_DEFAUT = {

  prim:["Quadriceps","Fessiers"], sec:["Ischio-jambiers","Adducteurs","Lombaires"],
  paser:{P:"Pieds largeur d'épaules, pointes légèrement ouvertes.",A:"Pli de hanche sous le haut du genou.",S:"Genoux dans l'axe des pieds, poids réparti sur tout le pied.",E:"Souffler en remontant.",R:"Descente contrôlée (2 s), remontée dynamique."},
  secu:"Dos neutre, talons au sol, genoux qui ne rentrent pas vers l'intérieur.",
  niveaux:[
   {nom:"Demi-squat",consigne:"Descendre jusqu'à mi-chemin, cuisses à 45°, bras tendus devant.",rep:"Cuisses à 45° puis hanches et genoux tendus en haut.",norep:"Talons décollés, dos arrondi, pas d'extension en haut."},
   {nom:"Air squat",consigne:"Descendre fesses en arrière jusqu'à passer sous le genou, puis se relever complètement.",rep:"Pli de hanche sous le haut du genou ET hanches + genoux tendus en haut.",norep:"Profondeur insuffisante, talons décollés, pas d'extension complète."},
   {nom:"Squat sauté",consigne:"Air squat complet puis saut, réception amortie pieds à plat.",rep:"Profondeur du squat + les deux pieds quittent le sol.",norep:"Réception jambes tendues ou bruyante, squat trop haut."}]},

{ id:"fente", dossier:"Fente", en:"Lunge", fr:"Fente", famille:"G", mesure:"reps", qte:12, impact:"faible", themes:["R","M"],
  prim:["Quadriceps","Fessiers"], sec:["Ischio-jambiers","Adducteurs","Transverse"],
  paser:{P:"Grand pas, buste droit, mains sur les hanches.",A:"Genou arrière qui effleure le sol.",S:"Alterner les jambes, même amplitude des deux côtés.",E:"Souffler en remontant.",R:"Descente lente, remontée en poussant sur le talon avant."},
  secu:"Genou avant au-dessus de la cheville, sans rentrer vers l'intérieur.",
  niveaux:[
   {nom:"Fente statique",consigne:"Pieds fixes en position de fente, descendre et remonter sur place.",rep:"Genou arrière proche du sol puis jambes tendues.",norep:"Genou arrière trop haut, buste penché en avant."},
   {nom:"Fente alternée",consigne:"Pas en avant, descendre, revenir debout, changer de jambe.",rep:"Genou arrière effleure le sol ET retour pieds joints debout.",norep:"Genou ne descend pas, genou avant qui rentre."},
   {nom:"Fente sautée",consigne:"En fente, sauter et changer de jambe en l'air.",rep:"Genou arrière proche du sol + changement de jambe en l'air.",norep:"Amplitude réduite, réception déséquilibrée."}]},

{ id:"pompe", dossier:"Pompe", en:"Push-up", fr:"Pompe", famille:"G", mesure:"reps", qte:10, impact:"faible", themes:["R","M"],
  prim:["Pectoraux","Triceps"], sec:["Épaules","Transverse","Abdominaux"],
  paser:{P:"Mains un peu plus larges que les épaules, doigts vers l'avant.",A:"Poitrine au sol, bras tendus en haut.",S:"Coudes à 45° du corps, des deux côtés pareil.",E:"Souffler en poussant.",R:"Descente 2 s, poussée dynamique."},
  secu:"Corps gainé en planche : ni bassin qui tombe, ni fesses en l'air.",
  niveaux:[
   {nom:"Pompe sur les genoux",consigne:"Genoux au sol, alignement genoux-hanches-épaules.",rep:"Poitrine proche du sol puis bras tendus, corps aligné.",norep:"Seule la tête descend, bassin cassé."},
   {nom:"Pompe",consigne:"Sur les pieds, corps gainé de la tête aux talons.",rep:"Poitrine touche le sol ET bras tendus en haut.",norep:"Amplitude incomplète, bassin qui tombe ou se lève."},
   {nom:"Pompe explosive",consigne:"Pousser assez fort pour que les mains quittent le sol.",rep:"Poitrine au sol + mains décollées en haut.",norep:"Mains qui ne décollent pas, réception bras tendus."}]},

{ id:"situp", dossier:"Sit-up", en:"Sit-up", fr:"Relevé de buste", famille:"G", mesure:"reps", qte:15, impact:"faible", themes:["R","M"],
  prim:["Abdominaux","Fléchisseurs de hanche"], sec:["Obliques"],
  paser:{P:"Dos au sol, pieds à plat ou plante contre plante.",A:"Épaules au sol en bas, mains devant les pieds en haut.",S:"Monter droit, sans tourner.",E:"Souffler en montant.",R:"Montée dynamique, descente freinée."},
  secu:"Ne pas tirer sur la nuque avec les mains.",
  niveaux:[
   {nom:"Crunch",consigne:"Décoller seulement les épaules, bas du dos au sol.",rep:"Omoplates décollées puis reposées.",norep:"Tirage sur la nuque, épaules qui ne décollent pas."},
   {nom:"Sit-up",consigne:"Dérouler jusqu'à s'asseoir, toucher devant les pieds.",rep:"Épaules touchent le sol ET mains touchent devant les pieds.",norep:"Épaules pas au sol, mains qui n'atteignent pas les pieds."},
   {nom:"V-up",consigne:"Bras et jambes tendus se rejoignent au-dessus des hanches.",rep:"Mains touchent les pieds, bras et jambes tendus.",norep:"Jambes très fléchies, mains loin des pieds."}]},

  paser:{P:"Coudes sous les épaules, regard vers le sol.",A:"Corps aligné tête-épaules-hanches-chevilles.",S:"Poids réparti sur les deux bras.",E:"Respirer calmement, ne pas bloquer.",R:"Tenir sans bouger."},
  secu:"Arrêter si douleur dans le bas du dos.",

function lireNomVideo(nom){
  let m = nom.match(/^n\s?([123])\/(.+)$/i);
  if(m) return {niv:+m[1], cle:m[2].toLowerCase()};
  m = nom.match(/^n\s?([123])\s*(?:[-_ .]?\s*([1-9a-c])|\(\s*(\d)\s*\))?\s*\.[a-z0-9]+$/i);
  if(!m) return null;
  const o = m[2]||m[3]||"1";
  return {niv:+m[1], cle: isNaN(o) ? String("abc".indexOf(o.toLowerCase())+1) : o};
}

    const niv = [[],[],[]];
    for(const f of d.fichiers){
      const l = lireNomVideo(f.nom);
      if(!l){ rap.ignores.push(d.nom+"/"+f.nom); continue; }
      niv[l.niv-1].push({id:f.id, nom:f.nom, cle:l.cle});
      if(f.partage && !/ANYONE/.test(f.partage)) rap.nonPartages.push(d.nom+"/"+f.nom);
    }
    niv.forEach((t,i)=>{ t.sort((a,b)=>a.cle.localeCompare(b.cle,undefined,{numeric:true}));
      if(t.length>3){ rap.tropNombreuses.push(`${d.nom} N${i+1}`); t.length=3; } });
    INDEX[ex.id] = niv;
    rap.lignes.push({nom:d.nom, ex, n:niv.map(t=>t.length)});
  }
  rap.sansDossier = S.fiches.exercices.filter(e=>!INDEX[e.id]).map(e=>e.en);
  S.rapport = rap;
}

const HL = {
  db:null,
  ouvrir(){ return this.db || (this.db = new Promise((ok,ko)=>{ const r=indexedDB.open("ct_videos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("v"); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); })); },
  async op(mode, f){ const db=await this.ouvrir(); return new Promise((ok,ko)=>{ const t=db.transaction("v",mode); const r=f(t.objectStore("v")); t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>ko(t.error); }); },
  get(id){ return this.op("readonly", s=>s.get(id)); },
  put(id,blob){ return this.op("readwrite", s=>s.put(blob,id)); },
  cles(){ return this.op("readonly", s=>s.getAllKeys()); },
  vider(){ return this.op("readwrite", s=>s.clear()); }
};
let PRESENTS = new Set(), TELECH = null;   // ids déjà sur la tablette · progression en cours

function toutesVideos(){ const t=[]; Object.values(INDEX).forEach(n=>n.forEach(l=>l.forEach(v=>v.id&&t.push(v.id)))); return [...new Set(t)]; }
async function telechargerTout(){
  const url=urlScript(); if(!url) return toast("Adresse du script manquante");
  if(!navigator.onLine) return toast("Pas de connexion : connectez la tablette au Wi-Fi");
  try{ navigator.storage?.persist?.(); }catch(e){}
  const manquantes = toutesVideos().filter(id=>!PRESENTS.has(id));
  TELECH = {fait:0, total:manquantes.length, erreurs:0}; rendre();
  for(const id of manquantes){
    try{
      const r = await fetch(url+(url.includes("?")?"&":"?")+"ct=video&id="+encodeURIComponent(id));
      const j = await r.json(); if(!j.ok) throw new Error(j.erreur);
      const blob = await (await fetch(`data:${j.type};base64,${j.b64}`)).blob();
      await HL.put(id, blob); PRESENTS.add(id);
    }catch(e){ TELECH.erreurs++; }
    TELECH.fait++; const z=$("#hlTexte"); if(z) z.textContent=`Téléchargement… ${TELECH.fait}/${TELECH.total}`;
  }
  const err=TELECH.erreurs; TELECH=null; rendre();
  toast(err?`${err} vidéo(s) non téléchargée(s) : relancez`:"Toutes les vidéos sont sur la tablette ✓");
}
function carteHorsLigne(){
  const tot=toutesVideos(), ok=tot.filter(id=>PRESENTS.has(id)).length;
  if(!tot.length) return "";
  if(TELECH) return `<div class="carte ligne"><span id="hlTexte" style="flex:1">Téléchargement… ${TELECH.fait}/${TELECH.total}</span></div>`;
  const complet = ok===tot.length;
  return `<div class="carte ligne" style="padding:10px 12px"><span style="flex:1" class="petit"><b>${complet?"✓ Hors ligne prêt":"Hors ligne"}</b> · ${ok}/${tot.length} vidéos sur la tablette</span>
    ${complet?"":`<button class="btn ct petit" data-act="telecharger" style="padding:8px 12px">Télécharger</button>`}</div>`;
}

async function synchroniser(silencieux){
  const url = urlScript(); if(!url){ if(!silencieux) toast("Aucune adresse de script dans les réglages"); return false; }
  try{
    const r = await fetch(url + (url.includes("?")?"&":"?") + "ct=biblio");

    if(!j.ok) throw new Error(j.erreur||"réponse invalide");
    S.drive = {racine:j.racine, date:j.date, dossiers:j.dossiers};
    if(j.fiches && j.fiches.exercices && !(S.prof && S.nonPublie)) S.fiches = j.fiches;
    indexerDrive(); sauver(); rendre();
    if(!silencieux) toast(`Drive lu : ${j.dossiers.length} dossier(s)`);

function dureeEstimee(l){
  const p=params(l), ex=l.items.map(it=>[it,exParId(it.exId)]).filter(x=>x[1]);
  const t1 = ([it,e]) => e.mesure==="temps"? +it.qte : e.mesure==="distance"? it.qte*15 : it.qte*3;
  switch(l.format){
    case "circuit": return (ex.reduce((a,x)=>a+t1(x)+ +p.recupEx,0)*p.tours + p.recupTour*(p.tours-1))/60;
    case "intervalles": return (+p.travail + +p.repos)*ex.length*p.tours/60;
    case "fortime": return Math.min(+p.cap, ex.reduce((a,x)=>a+t1(x),0)*p.tours/60);
    default: return +p.minutes;
  }

function analyse(l){
  const T=THEMES[l.theme], ex=l.items.map(it=>({it,e:exParId(it.exId)})).filter(x=>x.e);
  const cpt={}; Object.keys(ZONES).forEach(z=>cpt[z]=0); let cardio=0;
  ex.forEach(({e})=>{ zonesDe(e).forEach(z=>cpt[z]++); if(e.famille==="M") cardio++; });
  const c=[];
  const hors = ex.filter(({e})=>!e.themes.includes(l.theme)).map(({e})=>e.en);
  if(hors.length) c.push(`<b>${[...new Set(hors)].join(", ")}</b> ${hors.length>1?"sont":"est"} plutôt conseillé${hors.length>1?"s":""} pour un autre thème que ${T.nom}.`);
  if(ex.length>=3) Object.entries(cpt).filter(([,n])=>!n).forEach(([z])=>{
    const idees=S.fiches.exercices.filter(e=>visibleEleve(e)&&e.themes.includes(l.theme)&&zonesDe(e)[0]===z).slice(0,2).map(e=>e.en);
    c.push(`Aucun exercice pour <b>${z.toLowerCase()}</b>${idees.length?` : pense à ${idees.join(" ou ")}.`:"."}`); });
  if(l.theme==="R"){
    for(let i=1;i<ex.length;i++){ const a=zonesDe(ex[i-1].e)[0], b=zonesDe(ex[i].e)[0];
      if(a&&a===b){ c.push(`${ex[i-1].e.en} puis ${ex[i].e.en} travaillent la même zone (${a.toLowerCase()}) : alterne pour mieux récupérer.`); break; } }
    if(l.format!=="intervalles"){ const peu=ex.filter(({e,it})=>e.mesure==="reps"&&it.qte<12).map(({e})=>e.en);
      if(peu.length) c.push(`Renforcement : vise 12 à 15 répétitions (${peu.join(", ")} en dessous). Si tu en as encore 3 en réserve, passe au niveau supérieur.`); }
  }
  if(l.theme==="C" && cardio < Math.ceil(ex.length/2)) c.push(`Cardio : moins de la moitié des exercices sont métaboliques (M). Ajoute par exemple Burpee ou Jumping jack.`);
  const forts=ex.filter(({e})=>e.impact==="fort").length; if(forts>=3) c.push(`${forts} exercices à fort impact (sauts) : attention aux réceptions, prévois un niveau 1 si besoin.`);
  if(l.format==="emom" && ex.length) c.push(`EMOM : ${ex.length} exercice${ex.length>1?"s":""} à tour de rôle, chacun en début de minute ; le reste de la minute = repos. Si tu ne finis pas en 40 s, baisse le nombre de répétitions.`);
  const d=dureeEstimee(l);
  return `<h3>Bilan de ma leçon</h3>
    <div class="bilan">${Object.entries(cpt).map(([z,n])=>`<div class="${n?"":"zero"}"><b>${n}</b><span class="petit">${z}</span></div>`).join("")}</div>
    <p class="petit doux" style="margin:0 0 8px">Durée estimée : <b>≈ ${Math.round(d)} min</b> · ${cardio} exercice${cardio>1?"s":""} cardio (M)</p>

}
function texteWod(l){
  const T=THEMES[l.theme], F=FORMATS[l.format], p=params(l);
  let tete = {circuit:`Circuit · ${p.tours} tours · récup ${p.recupEx} s / ${p.recupTour} s`, emom:`EMOM ${p.minutes} min`, e2mom:`E2MOM ${p.minutes} min`,
    amrap:`AMRAP ${p.minutes} min · cible ${p.cible} tours`, fortime:`For Time · ${p.tours} tours · time cap ${p.cap} min`,
    intervalles:`Intervalles ${p.travail}/${p.repos} · ${p.tours} tours`}[l.format];
  const lignes = l.items.map((it,i)=>{ const e=exParId(it.exId); if(!e) return "";
    const q = l.format==="intervalles" ? `${p.travail} s` : `${it.qte} ${MESURE[e.mesure]}`;
    const pre = l.format==="emom"?`Min ${i+1}`: l.format==="e2mom"?`${i*2}-${i*2+2} min`:"•";
    return `${pre}  ${q}  ${e.en} (N${it.niv} ${e.niveaux[it.niv-1]?.nom||""})`; });
  return {titre:(l.titre||"Mon WOD")+" · "+T.nom, tete, lignes, fin:`Zone visée : ${T.fc} · ${T.indic}`};
}
function tableauWod(l){ const w=texteWod(l); return `<div class="titre">${h(w.titre)}</div>${h(w.tete)}\n\n${h(w.lignes.join("\n"))}\n\n<span style="color:#9aa0aa">${h(w.fin)}</span>`; }

function validerEdition(){
  const e=EDIT; if(!e.en.trim()) return toast("Le nom culturel est obligatoire");
  if(!e.prim.length) return toast("Choisissez au moins un muscle principal");
  e.aCompleter = !(e.fr.trim() && e.niveaux.every(n=>n.nom.trim()));
  const i=S.fiches.exercices.findIndex(x=>x.id===e.id);
  if(i<0) S.fiches.exercices.push(e); else S.fiches.exercices[i]=e;
  S.nonPublie=true; indexerDrive(); sauver(); fermer(); rendre();
  toast(e.aCompleter?"Fiche enregistrée (encore incomplète : nom français et 3 niveaux)":"Fiche enregistrée ✓");
}

/* ---------- Fichiers ---------- */
function exporter(){
  const blob=new Blob([JSON.stringify({version:1, date:new Date().toISOString(), fiches:S.fiches, drive:S.drive},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bibliotheque-crosstraining.json"; a.click(); URL.revokeObjectURL(a.href);
}
function importerFichier(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ try{
      const j=JSON.parse(rd.result), fiches=j.fiches||j;
      if(!fiches.exercices) throw new Error("pas de liste d'exercices");
      S.fiches=fiches; if(j.drive) S.drive=j.drive; S.nonPublie=true; indexerDrive(); sauver(); rendre();
      toast(`${fiches.exercices.length} fiches importées`);
    }catch(e){ toast("Fichier invalide : "+e.message); } };
  rd.readAsText(f);
}

document.addEventListener("click", ev=>{
  const t=ev.target.closest("button,[data-act]"); if(!t) return;
  const d=t.dataset, l=S.lecon;
  if(d.act==="fermer-fond"){ if(ev.target===t) fermer(); return; }
  if(d.onglet){ S.onglet=d.onglet; fermer(); rendre(); scrollTo(0,0); return; }
  if(d.filtre){ S.filtre[d.filtre] = S.filtre[d.filtre]===d.val ? "" : d.val; vueBiblio(); return; }
  if(d.fiche){ ouvrirFiche(d.fiche, +d.n||2); return; }
  if(d.video!==undefined && t.classList.contains("diapo")){ lancerVideo(t); return; }
  if(d.niv && !d.champ){ FICHE.niv=+d.niv; rendreFiche(); return; }
  if(d.ajout){ const e=exParId(d.ajout); l.items.push({exId:e.id, niv:+d.n, qte: l.theme==="R"&&e.mesure==="reps"?Math.max(12,e.qte):e.qte});
    sauver(); rendre(); rendreFiche(); toast(`${e.en} N${d.n} ajouté · ${l.items.length} exercice(s)`); return; }
  if(d.theme){ l.theme=d.theme; if(!THEMES[d.theme].formats.includes(l.format)) l.format=THEMES[d.theme].formats[0]; sauver(); rendre(); return; }
  if(d.format){ l.format=d.format; sauver(); rendre(); return; }
  if(d.setniv){ l.items[d.item].niv=+d.setniv; sauver(); rendre(); return; }
  if(d.move){ const i=+d.item, j=i+ +d.move; if(j<0||j>=l.items.length) return; [l.items[i],l.items[j]]=[l.items[j],l.items[i]]; sauver(); rendre(); return; }
  if(d.suppr!==undefined){ l.items.splice(+d.item,1); sauver(); rendre(); return; }
  if(d.ouvrir){ S.lecon=JSON.parse(JSON.stringify(S.lecons[d.ouvrir])); S.onglet="lecon"; sauver(); rendre(); return; }
  if(d.dupliquer){ const c=JSON.parse(JSON.stringify(S.lecons[d.dupliquer])); c.id=Date.now().toString(36); c.titre+=" (copie)"; c.date=Date.now(); S.lecons.unshift(c); sauver(); rendre(); return; }
  if(d.effacer){ if(confirm("Supprimer cette leçon ?")){ S.lecons.splice(d.effacer,1); sauver(); rendre(); } return; }
  if(d.edit){ editer(d.edit); return; }
  if(d.etheme){ const a=EDIT.themes; a.includes(d.etheme)? a.splice(a.indexOf(d.etheme),1) : a.push(d.etheme); t.classList.toggle("on"); return; }
  if(d.eechauff!==undefined){ EDIT.echauffement=!EDIT.echauffement; t.classList.toggle("on"); return; }
  if(d.muscle){ const m=d.muscle, P=EDIT.prim, Sc=EDIT.sec;
    if(P.includes(m)){ P.splice(P.indexOf(m),1); Sc.push(m); t.className="s"; }
    else if(Sc.includes(m)){ Sc.splice(Sc.indexOf(m),1); t.className=""; }
    else { P.push(m); t.className="p"; } return; }
  switch(d.act){
    case "fermer": fermer(); break;
    case "enregistrer": { l.date=Date.now(); l.classe=nomClasse(); const i=S.lecons.findIndex(x=>x.id===l.id); const c=JSON.parse(JSON.stringify(l));
      if(i<0) S.lecons.unshift(c); else S.lecons[i]=c; sauver(); toast("Leçon enregistrée ✓"); break; }
    case "copier": { const w=texteWod(l); navigator.clipboard?.writeText(`${w.titre}\n${w.tete}\n\n${w.lignes.join("\n")}\n\n${w.fin}`).then(()=>toast("WOD copié")); break; }
    case "vider": if(confirm("Commencer une nouvelle leçon ?")){ S.lecon=nouvelleLecon(); sauver(); rendre(); } break;
    case "lire": synchroniser(false); break;
    case "dossier": reglerDossier(); break;
    case "partager": envoyer({partager:1}).then(j=>{toast(`${j.partagees} vidéo(s) partagée(s)${j.refus?` · ${j.refus} refus (règles du domaine ?)`:""}`); synchroniser(true);}).catch(e=>toast("Impossible : "+e.message)); break;
    case "telecharger": telechargerTout(); break;
    case "publier": publier(); break;
    case "exporter": exporter(); break;
    case "importer": $("#fichier").click(); break;
    case "nouveau": EDIT={id:"x"+Date.now().toString(36), dossier:"", en:"", fr:"", famille:"G", mesure:"reps", qte:10, impact:"faible", themes:["R"], prim:[], sec:[],
        paser:{P:"",A:"",S:"",E:"",R:""}, secu:"", niveaux:[1,2,3].map(()=>({nom:"",consigne:"",rep:"",norep:""}))}; rendreEditeur(); break;
    case "valider-ex": validerEdition(); break;
    case "supprimer-ex": if(confirm("Supprimer cette fiche ? (les vidéos du Drive ne sont pas touchées)")){
        S.fiches.exercices=S.fiches.exercices.filter(x=>x.id!==EDIT.id); S.nonPublie=true; indexerDrive(); sauver(); fermer(); rendre(); } break;
    case "defaut": if(confirm("Remplacer toutes les fiches par les 20 fiches d'origine ?")){ S.fiches=JSON.parse(JSON.stringify(BIBLIO_DEFAUT)); S.nonPublie=true; indexerDrive(); sauver(); rendre(); } break;
  }
});
