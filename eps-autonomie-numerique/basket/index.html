<html lang="fr">
<head>
<meta charset="utf-8">

<title>Basket-ball · EPS Autonomie et Numérique</title>
<style>
:root{--fond:#F5F3EE;--carte:#fff;--encre:#14171C;--doux:#6A6F78;--ligne:#E6E1D6;--app:#A4161A;--clair:#FBE9E9;--ok:#1E8A4C;--ok-c:#E6F5EC;--or:#B45309;--or-c:#FDF0D9;--ko:#C0392B;--ko-c:#FBEAE8;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#14171C;color:#fff;padding:10px 14px 14px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 -4px 0 var(--app)}
header .mk{width:36px;height:36px;border-radius:10px;background:var(--app);padding:6px;flex:none}
header h1{font-size:20px;margin:0;line-height:1.1;font-weight:800}
header small{display:block;color:#A9AEB8;font-weight:500;font-size:13px}
header [data-eps-bar]{margin-left:auto;display:flex;gap:6px;align-items:center}
html:not(.eps-teach) body.gate main{visibility:hidden}
main{max-width:1040px;margin:0 auto;padding:14px 14px 90px}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:14px;margin-bottom:12px}
.doux{color:var(--doux)}.petit{font-size:14px}
.ligne{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;min-height:44px;padding:10px 16px;font-weight:700;background:var(--encre);color:#fff}
.btn.app{background:var(--app)}.btn.clair{background:#EFECE6;color:var(--encre)}.btn.contour{background:#fff;border:1.5px solid var(--ligne);color:var(--encre)}
.btn.danger{background:var(--ko-c);color:var(--ko)}.btn.plein{width:100%}.btn:disabled{opacity:.45}.btn.gros{min-height:60px;font-size:19px}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--ligne);border-radius:10px;padding:9px 10px;background:#fff;min-height:44px}
textarea{min-height:70px;resize:vertical}
.retour{border:0;background:none;font-weight:700;color:var(--doux);padding:8px 4px;min-height:44px}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tuile{border:1px solid var(--ligne);background:#fff;border-radius:var(--r);padding:16px;text-align:left;display:flex;gap:12px;align-items:center;min-height:84px}
.tuile i{font-style:normal;font-size:30px;flex:none}.tuile b{display:block;font-size:17px}.tuile small{color:var(--doux);font-size:13px}
.tuile.fort{background:var(--app);color:#fff;border-color:var(--app)}.tuile.fort small{color:#F6D5D5}
.pastille{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px;background:var(--clair);color:var(--app)}
.rond{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none;border:1.5px solid rgba(0,0,0,.25)}
.puce{border:1.5px solid var(--ligne);background:#fff;border-radius:99px;padding:7px 13px;font-weight:600;min-height:40px}
.puce.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.bascule{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bascule button{border:2px solid var(--ligne);background:#fff;border-radius:14px;padding:14px;text-align:left;min-height:86px}
.bascule button.on{border-color:var(--app);background:var(--clair)}
.bascule b{font-size:22px;display:block}.bascule small{color:var(--doux)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--doux);padding:6px}
table.t td{padding:8px 6px;border-top:1px solid var(--ligne)}table.t .c{text-align:center}
.eq{border-left:8px solid #999}
/* match */
.marque{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cote{background:#fff;border:1px solid var(--ligne);border-top:10px solid #999;border-radius:var(--r);padding:12px;text-align:center}
.cote .nom{font-weight:800;font-size:19px}.cote .sc{font-size:clamp(64px,13vw,120px);font-weight:900;line-height:1;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.cote .pts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cote .pts button{min-width:76px;min-height:64px;border-radius:14px;border:0;background:var(--encre);color:#fff;font-size:24px;font-weight:900}
.cote .pts button.bo{background:var(--or-c);color:var(--or);font-size:17px}
.cote .fa{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center}
.chrono{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.chrono .tps{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.chrono .poss{font-size:26px;font-weight:900;min-width:60px;text-align:center;border-radius:12px;padding:4px 10px;background:#fff;border:1.5px solid var(--ligne)}
.chrono .poss.fin{background:var(--ko-c);color:var(--ko);border-color:var(--ko)}
/* observation */
.cpts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cpt{border:0;border-radius:var(--r);padding:14px 10px;min-height:118px;background:#fff;border:2px solid var(--ligne);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cpt b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}.cpt span{font-weight:700;text-align:center}
.cpt.v{border-color:var(--ok);background:var(--ok-c)}.cpt.r{border-color:var(--ko);background:var(--ko-c)}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.ind div{border-radius:14px;padding:10px 12px;background:#fff;border:1px solid var(--ligne)}
.ind b{display:block;font-size:26px}.ind small{color:var(--doux);font-size:13px}
.ind .g{background:var(--ok-c);border-color:var(--ok)}.ind .o{background:var(--or-c);border-color:var(--or)}.ind .k{background:var(--ko-c);border-color:var(--ko)}
.terrain{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);padding:8px;max-width:620px;margin:0 auto}
.outils{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.outils button{border:1.5px solid var(--ligne);background:#fff;border-radius:10px;min-height:44px;padding:6px 12px;font-weight:700}
.outils button.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.vign{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vign button{border:1px solid var(--ligne);background:#fff;border-radius:var(--r);padding:8px;text-align:left}
.vign b{display:block;margin:6px 4px 0}.vign small{display:block;margin:0 4px 4px;color:var(--doux)}
/* fenêtre */
#calque:empty{display:none}
#calque{position:fixed;inset:0;z-index:200;background:rgba(20,23,28,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.feuille{background:#fff;border-radius:20px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto}
.feuille h3{font-size:19px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#14171C;color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:400;max-width:92vw;text-align:center}
#impr{display:none}
@media print{body>*:not(#impr){display:none!important}#impr{display:block;padding:0;font-size:12pt}#impr table{width:100%;border-collapse:collapse}#impr td,#impr th{border:1px solid #000;padding:6px;text-align:left}#impr .case{height:46px}#impr h2{margin:8px 0}}
@media (max-width:560px){.cote .pts button{min-width:62px;min-height:56px}.chrono .tps{font-size:32px}}
</style>
</head>
<body>
<header>
  <svg class="mk" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3v18"/><path d="M5.6 5.6c3 3 3 9.8 0 12.8"/><path d="M18.4 5.6c-3 3-3 9.8 0 12.8"/></svg>
  <div><h1>Basket-ball<small id="sousTitre">CA4 · 3 contre 3 et 4 contre 4</small></h1></div>
  <span data-eps-bar></span>
</header>
<main id="vue"></main>
<div id="calque"></div>
<div id="impr"></div>

<script>
"use strict";
/* ======================= BASKET-BALL (CA4) : 3 contre 3 et 4 contre 4 =======================
   Modèle commun des applis EPS (voir ../CLAUDE.md et CLAUDE.md de ce dossier). Code d'appli « bk », dossier « basket ».
   Une tablette par équipe : rencontres du jour, table de marque, fiches d'observation, planche tactique, bilan d'équipe.
   Magasin partagé « bk.v1 » (EPSD.store, préfixe « bk| ») :
     e|<classe>                équipes de la classe {cls, eq:[{id, nom, col, j:[noms]}]}
     j|<classe>|<jour>         leçon du jour {cls, day, mode:'3'|'4', libre, nt, bon:[n° de bonus], r:[rotations]}
     m|<classe>|<jour>|<n°>    match {cls, day, mode, ter, rot, a, b, sa, sb, fa, fb, ev:[], st, t:{d,left,at}, by}
     o|<classe>|<jour>|<n°>    observation {cls, day, mode, ty:'coll'|'ind'|'tir', eq, who, par, c:[], tirs:[[x,y,ok]], st}
     p|<classe>|<équipe>|<n°>  schéma d'une équipe {cls, eq, nom, d:{sport, items}}
     b|<classe>|<jour>|<équipe> bilan d'équipe {cls, day, eq, r:[3 réponses]} */
const COL="#A4161A", DIR="basket", CODE="bk", KST="bk.v1";
const $=s=>document.querySelector(s);
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nk=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"");
const SS={get:k=>{try{return sessionStorage.getItem("bk_"+k)||""}catch(e){return ""}}, set:(k,v)=>{try{sessionStorage.setItem("bk_"+k,v)}catch(e){}}, del:k=>{try{sessionStorage.removeItem("bk_"+k)}catch(e){}}};
const auj=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dateFR=s=>s?new Date(s+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}):"";
const pct=(a,b)=>b?Math.round(a/b*100):null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function estProf(){ if(window.EPS_VUE_ELEVE) return false; try{ return Date.now() < +(localStorage.getItem("eps.teach.until")||0); }catch(e){ return false; } }
function devId(){ try{ const d=JSON.parse(localStorage.getItem("eps.dev.v1")||"null"); if(d&&d.id) return d.id; }catch(e){} let x=SS.get("dev"); if(!x){ x="t"+uid(); SS.set("dev",x); } return x; }
function bip(n){ try{ const C=window.AudioContext||window.webkitAudioContext, a=bip.a||(bip.a=new C()); for(let i=0;i<(n||1);i++){ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.25,a.currentTime+i*.35); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.35+.3); o.start(a.currentTime+i*.35); o.stop(a.currentTime+i*.35+.3); } }catch(e){} }

/* ======================= PARAMÈTRES (tout est réglable : ⚙ Réglages → 🎛 Paramètres) ======================= */
const PRM=d=>{ try{ return window.EPSP?EPSP.p(d):d.def; }catch(e){ return d.def; } };
const DEFS=[
 {id:"m3_duree",sec:"3 contre 3",label:"Durée d'un match (minutes)",type:"number",def:6},
 {id:"m3_cible",sec:"3 contre 3",label:"Score qui arrête le match (0 = au temps seulement)",type:"number",def:21},
 {id:"m3_poss",sec:"3 contre 3",label:"Temps pour tirer en secondes (0 = pas de décompte)",type:"number",def:12},
 {id:"m3_pts",sec:"3 contre 3",label:"Boutons de points (points ; intitulé)",type:"list",def:["1 ; Panier à l'intérieur de l'arc","2 ; Panier derrière l'arc"]},
 {id:"m3_regles",sec:"3 contre 3",label:"Règles affichées aux élèves (une par ligne)",type:"list",def:[
  "Demi-terrain, 1 panier, 3 joueurs sur le terrain (et 1 remplaçant).",
  "Panier à l'intérieur de l'arc : 1 point. Derrière l'arc : 2 points. Lancer franc : 1 point.",
  "Fin du match : au temps, ou dès qu'une équipe atteint le score fixé.",
  "Après un panier encaissé : je repars sous le panier et je ressors le ballon derrière l'arc, en dribble ou par une passe.",
  "Après un rebond défensif ou une interception : je ressors le ballon derrière l'arc avant d'attaquer.",
  "Après une faute ou une sortie : échange de balle entre un défenseur et un attaquant, en haut de l'arc.",
  "12 secondes pour tirer.",
  "Entre-deux : le ballon va à l'équipe qui défendait.",
  "Remplacement : ballon arrêté, je tape dans la main de mon partenaire."]},
 {id:"m4_duree",sec:"4 contre 4",label:"Durée d'un match (minutes)",type:"number",def:8},
 {id:"m4_cible",sec:"4 contre 4",label:"Score qui arrête le match (0 = au temps seulement)",type:"number",def:0},
 {id:"m4_poss",sec:"4 contre 4",label:"Temps pour tirer en secondes (0 = pas de décompte)",type:"number",def:24},
 {id:"m4_pts",sec:"4 contre 4",label:"Boutons de points (points ; intitulé)",type:"list",def:["2 ; Panier","3 ; Panier à 3 points","1 ; Lancer franc"]},
 {id:"m4_regles",sec:"4 contre 4",label:"Règles affichées aux élèves (une par ligne)",type:"list",def:[
  "Tout terrain (ou en largeur), 2 paniers, 4 joueurs sur le terrain (et des remplaçants).",
  "Panier : 2 points. Derrière la ligne à 3 points : 3 points. Lancer franc : 1 point.",
  "Marcher : pas plus de 2 appuis ballon en main.",
  "Reprise de dribble : je ne dribble plus après avoir arrêté mon dribble.",
  "Pas de contact : la faute donne le ballon à l'adversaire, ou des lancers francs sur un tir.",
  "Retour en zone : une fois en zone avant, le ballon ne revient pas en zone arrière.",
  "3 secondes dans la raquette adverse, 5 secondes quand je suis serré de près, 8 secondes pour passer le milieu, 24 secondes pour tirer.",
  "Remise en jeu derrière la ligne, là où le ballon est sorti."]},
 {id:"bonus",sec:"Points bonus",label:"Règles de points bonus (intitulé ; points). Tu choisis celles du jour dans Séquence.",type:"list",def:["Panier après une passe décisive ; 1","Panier en contre-attaque ; 1","Tous les joueurs ont touché le ballon avant le tir ; 1","Ballon gagné en défense puis panier ; 1"]},
 {id:"obs_coll",sec:"Fiches d'observation",label:"Fiche collective : intitulés des 4 compteurs",type:"list",fixed:4,def:["Panier marqué","Tir manqué","Balle perdue","Ballon gagné en défense"]},
 {id:"obs_ind",sec:"Fiches d'observation",label:"Fiche joueur : intitulés des 6 compteurs",type:"list",fixed:6,def:["Tir réussi","Tir manqué","Passe réussie","Balle perdue","Ballon gagné (interception, rebond)","Passe décisive"]},
 {id:"seuil_tir",sec:"Fiches d'observation",label:"Possessions qui arrivent au tir, en % (seuil orange ; seuil vert)",type:"text",def:"50 ; 70"},
 {id:"seuil_reu",sec:"Fiches d'observation",label:"Réussite au tir, en % (seuil orange ; seuil vert)",type:"text",def:"30 ; 50"},
 {id:"seuil_eff",sec:"Fiches d'observation",label:"Efficacité du joueur, en % (seuil orange ; seuil vert)",type:"text",def:"50 ; 70"},
 {id:"chasubles",sec:"Équipes",label:"Chasubles (nom ; couleur)",type:"list",def:["Rouges ; #D64545","Bleus ; #2F6FDB","Jaunes ; #E0A800","Verts ; #2E9E5B","Orange ; #E8701A","Violets ; #8A3FD1","Noirs ; #14171C","Blancs ; #C9CDD3"]},
 {id:"class_pts",sec:"Équipes",label:"Points au classement (victoire ; nul ; défaite)",type:"text",def:"3 ; 2 ; 1"},
 {id:"bilan_q",sec:"Bilan d'équipe",label:"Les 3 questions du bilan d'équipe",type:"list",fixed:3,def:["Ce qui a bien marché","Ce qu'on doit améliorer","Notre projet pour le prochain match"]},
 {id:"echauf",sec:"Échauffement",label:"Étapes de l'échauffement (une par ligne)",type:"list",def:[
  "Mobilisation articulaire : chevilles, genoux, hanches, épaules, poignets, doigts (2 min)",
  "Courses sur demi-terrain : talons-fesses, montées de genoux, pas chassés défensifs, course arrière (3 min)",
  "Dribble : main forte, main faible, changements de main, sur un aller-retour (3 min)",
  "Passes à deux en mouvement : à terre, directe, sans dribble (3 min)",
  "Tir en course à droite puis à gauche : deux colonnes, un tireur, un rebondeur (4 min)",
  "Tir à l'arrêt près du panier, puis 1 contre 1 (3 min)"]}
];
const D0={}; DEFS.forEach(d=>{ D0[d.id]=d; PRM(d); });
const P=id=>PRM(D0[id]);
const duo=(s,a,b)=>{ const x=String(s||"").split(";").map(v=>parseFloat(String(v).replace(",","."))); return [isFinite(x[0])?x[0]:a, isFinite(x[1])?x[1]:b]; };
const paire=s=>{ const i=String(s||"").indexOf(";"); return i<0?[String(s||"").trim(),""]:[s.slice(0,i).trim(), s.slice(i+1).trim()]; };
const MODES={ "3":{id:"3",nom:"3 contre 3",court:"basket3",n:3,sub:"Demi-terrain · 1 panier"}, "4":{id:"4",nom:"4 contre 4",court:"basket",n:4,sub:"Tout terrain · 2 paniers"} };
function modeCfg(m){ m=MODES[m]?m:"3"; const pts=P("m"+m+"_pts").map(paire).map(x=>({v:parseFloat(String(x[0]).replace(",",".")),l:x[1]})).filter(x=>isFinite(x.v)&&x.v>0);
  return Object.assign({}, MODES[m], {duree:Math.max(0,+P("m"+m+"_duree")||0), cible:Math.max(0,+P("m"+m+"_cible")||0), poss:Math.max(0,+P("m"+m+"_poss")||0), pts:pts.length?pts:[{v:1,l:"Panier"}], regles:P("m"+m+"_regles")}); }
const bonusList=()=>P("bonus").map(paire).map(x=>({l:x[0], v:parseFloat(String(x[1]).replace(",","."))||1}));
const chasubles=()=>P("chasubles").map(paire).map(x=>({nom:x[0], col:/^#[0-9a-f]{3,8}$/i.test(x[1])?x[1]:"#6A6F78"}));

/* ======================= DONNÉES PARTAGÉES ENTRE TABLETTES ======================= */
function stLd(){ let v=null; try{ v=JSON.parse(localStorage.getItem(KST)||"null"); }catch(e){} if(!v||typeof v!=="object"||!v.items||typeof v.items!=="object") v={items:{},pend:{},since:0}; v.pend=v.pend||{}; return v; }
function stPut(id,obj){ const v=stLd(); obj.id=id; obj.u=Math.max(Date.now(),((v.items[id]||{}).u||0)+1); v.items[id]=obj; v.pend[id]=obj.u; try{ localStorage.setItem(KST,JSON.stringify(v)); }catch(e){ toast("Mémoire de la tablette pleine"); } try{ window.EPSD&&EPSD.syncSoon&&EPSD.syncSoon(); }catch(e){} }
const stGet=id=>{ const o=stLd().items[id]; return o&&!o.del?o:null; };
const stDel=id=>{ const o=stLd().items[id]; if(o) stPut(id,{del:1,cls:o.cls}); };
const stItems=pre=>Object.entries(stLd().items).filter(([k,o])=>k.startsWith(pre)&&o&&!o.del).map(x=>x[1]);
(function brancher(n){ if(window.EPSD&&EPSD.store){ EPSD.store({pre:"bk|", key:KST, onChange:()=>{ const f=document.activeElement, saisie=f&&/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName); if(!$("#calque").innerHTML && !saisie && ["prof","home","prog","eq"].includes(S.vue)) rendre(); else if(S.vue==="match"){ const m=matchCur(); if(m&&m.by!==devId()) rendre(); } }}); } else if(n<60) setTimeout(()=>brancher(n+1),250); })(0);

/* relevé rapide (toutes les 6 s, comme la leçon en cours) : scores, équipes et rencontres arrivent sans attendre le relevé général */
setInterval(()=>{ try{ if(document.visibilityState!=="hidden"&&!window.EPS_SIM&&window.EPSD&&EPSD.syncOne) EPSD.syncOne(KST); }catch(e){} },6000);
/* ======================= CLASSES, ÉLÈVES, ÉQUIPES ======================= */
function classesBK(){ try{ return (window.EPSL?EPSL.items():[]).filter(it=>it&&it.nom&&!it.del&&!(it.demo&&!(window.EPSD&&EPSD.demo&&EPSD.demo.on()))&&!(it.off||[]).includes(CODE)); }catch(e){ return []; } }
const S={classe:SS.get("classe"), eq:SS.get("eq"), vue:"home", pick:"", mid:SS.get("mid"), oid:"", pid:"", sys:"", obsTy:"coll", bilC:"", bilJ:""};
const aClasse=()=>!!S.classe&&S.classe!=="-";
const clsObj=()=>classesBK().find(x=>x.id===S.classe)||null;

/* rencontres : toutes les équipes se rencontrent ; à chaque rotation, les équipes qui ne jouent pas arbitrent et observent un terrain */
function rencontres(ids,nt){
  const T=ids.slice(); if(T.length<2) return []; if(T.length%2) T.push(null);
  const n=T.length, M=[]; for(let r=0;r<n-1;r++){ for(let i=0;i<n/2;i++){ const a=T[i], b=T[n-1-i]; if(a&&b) M.push(r%2?[b,a]:[a,b]); } T.splice(1,0,T.pop()); }
  const R=[], repos={}; ids.forEach(i=>repos[i]=0);
  while(M.length){ const rot={m:[],off:[]}, pris=new Set();
    M.sort((x,y)=>(repos[y[0]]+repos[y[1]])-(repos[x[0]]+repos[x[1]]));
    for(let i=0;i<M.length&&rot.m.length<nt;){ const x=M[i]; if(!pris.has(x[0])&&!pris.has(x[1])){ rot.m.push(x); pris.add(x[0]); pris.add(x[1]); M.splice(i,1); } else i++; }
    ids.forEach(i=>{ if(pris.has(i)) repos[i]=0; else repos[i]++; });
    ids.filter(i=>!pris.has(i)).forEach((i,k)=>rot.off.push([i,(k%rot.m.length)+1])); R.push(rot); }
  return R;
}
const matchId=(cls,d,ri,mi)=>"m|"+nk(cls)+"|"+d+"|r"+ri+"t"+mi;
const matchsDe=(cls,d)=>stItems("m|"+nk(cls)+"|"+(d?d+"|":"")).filter(m=>m.a&&m.b);
const matchCur=()=>S.mid?stGet(S.mid):null;
function score(m){ let a=0,b=0,fa=0,fb=0; (m.ev||[]).forEach(e=>{ if(e.k==="f"){ if(e.e) fb++; else fa++; } else { if(e.e) b+=e.v; else a+=e.v; } }); return {a:a,b:b,fa:fa,fb:fb}; }
function mLeft(m){ const t=m.t||{}; if(!t.d) return null; return Math.max(0, t.at?t.left-(Date.now()-t.at)/1000:t.left); }
const mmss=s=>{ s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
function classement(cls,d){ const E=eqs(cls), [pv,pn,pd]=(()=>{ const x=String(P("class_pts")).split(";").map(v=>parseFloat(v)); return [isFinite(x[0])?x[0]:3, isFinite(x[1])?x[1]:2, isFinite(x[2])?x[2]:1]; })();
  const R={}; E.forEach(e=>R[e.id]={id:e.id,nom:e.nom,col:e.col,j:0,v:0,n:0,d:0,p:0,c:0,pts:0});
  matchsDe(cls,d).filter(m=>m.st===1).forEach(m=>{ const s=score(m), A=R[m.a], B=R[m.b]; if(!A||!B) return; A.j++; B.j++; A.p+=s.a; A.c+=s.b; B.p+=s.b; B.c+=s.a;
    if(s.a>s.b){ A.v++; B.d++; A.pts+=pv; B.pts+=pd; } else if(s.a<s.b){ B.v++; A.d++; B.pts+=pv; A.pts+=pd; } else { A.n++; B.n++; A.pts+=pn; B.pts+=pn; } });
  return Object.values(R).sort((x,y)=>y.pts-x.pts||(y.p-y.c)-(x.p-x.c)||y.p-x.p); }
function marqueurs(cls,d,eq){ const T={}; matchsDe(cls,d).forEach(m=>(m.ev||[]).forEach(e=>{ if(e.k==="f"||!e.j) return; const id=e.e?m.b:m.a; if(eq&&id!==eq) return; T[e.j]=(T[e.j]||0)+e.v; })); return Object.entries(T).sort((a,b)=>b[1]-a[1]); }

function zoneTir(x,y){ if(x<=58&&y>=50.5&&y<=99.5) return 0; return (Math.hypot(x-16,y-75)>67.5||y<9||y>141)?2:1; }
const ZONES=["Raquette","Mi-distance","Derrière l'arc"];
function indic(o){ const c=o.c||[], n=i=>+c[i]||0;
  if(o.ty==="coll"){ const poss=n(0)+n(1)+n(2), tirs=n(0)+n(1); return [{l:"Possessions",v:poss,u:""},{l:"Arrivent au tir",v:pct(tirs,poss),u:"%",c:couleur(pct(tirs,poss),P("seuil_tir"))},{l:"Réussite au tir",v:pct(n(0),tirs),u:"%",c:couleur(pct(n(0),tirs),P("seuil_reu"))},{l:"Balles perdues",v:n(2),u:""},{l:"Ballons gagnés",v:n(3),u:""}]; }
  if(o.ty==="ind"){ const joues=n(0)+n(1)+n(2)+n(3)+n(5), bons=n(0)+n(2)+n(5); return [{l:"Ballons joués",v:joues,u:""},{l:"Efficacité",v:pct(bons,joues),u:"%",c:couleur(pct(bons,joues),P("seuil_eff"))},{l:"Réussite au tir",v:pct(n(0),n(0)+n(1)),u:"%",c:couleur(pct(n(0),n(0)+n(1)),P("seuil_reu"))},{l:"Ballons gagnés",v:n(4),u:""}]; }
  const T=Array.isArray(o.tirs)?o.tirs:[], Z=[0,1,2].map(z=>{ const t=T.filter(x=>zoneTir(x[0],x[1])===z); return {l:ZONES[z],v:pct(t.filter(x=>x[2]).length,t.length),u:"%",n:t.length,c:couleur(pct(t.filter(x=>x[2]).length,t.length),P("seuil_reu"))}; });
  return [{l:"Tirs",v:T.length,u:""},{l:"Réussite",v:pct(T.filter(x=>x[2]).length,T.length),u:"%",c:couleur(pct(T.filter(x=>x[2]).length,T.length),P("seuil_reu"))}].concat(Z.map(z=>({l:z.l+" ("+z.n+")",v:z.v,u:"%",c:z.c}))); }

let ED=null;
function rendre(){
  const prof=estProf(), V=$("#vue"); document.body.classList.toggle("gate",!prof&&!S.classe); ED=null;
  if(prof&&["home","eq"].includes(S.vue)) S.vue="prof";
  if(!prof&&S.vue==="prof") S.vue="home";
  if(!prof&&!S.classe){ V.innerHTML=""; return; }
  if(!prof&&aClasse()&&!clsObj()){ S.classe=""; SS.del("classe"); V.innerHTML=""; return; }
  if(!prof&&aClasse()&&!eqDe(nomClasse(),S.eq)&&!["regles","sys","echauf","planEd"].includes(S.vue)) S.vue="eq";
  if(!prof&&!aClasse()&&!["regles","sys","echauf","planEd"].includes(S.vue)) S.vue="regles";
  const f={prof:vProf,eq:vEq,home:vHome,prog:vProg,match:vMatch,obs:vObs,obsRun:vObsRun,plan:vPlan,planEd:vPlanEd,sys:vSys,regles:vRegles,echauf:vEchauf,bilan:vBilan}[S.vue]||vHome;
  V.innerHTML=f(); if(S.vue==="planEd") monterEditeur(); if(S.vue==="match") tic();

   :`<div class="carte"><b>Les équipes ne sont pas encore faites.</b><p class="doux">Ton enseignant les prépare : reviens dans un instant.</p></div>`)+
   `<p style="margin-top:14px"><button class="btn contour" data-act="aller" data-v="regles">📏 Les règles</button> <button class="btn contour" data-act="aller" data-v="echauf">🔥 L'échauffement</button></p>`; }
function prochain(cls,eq){ const j=jour(cls); if(!j.r) return null;
  for(let ri=0;ri<j.r.length;ri++){ const rot=j.r[ri]; if(!rot||!Array.isArray(rot.m)) continue; const tous=rot.m.every((x,mi)=>{ const m=stGet(matchId(cls,j.day,ri,mi)); return m&&m.st===1; }); if(tous) continue;
    const mi=rot.m.findIndex(x=>x[0]===eq||x[1]===eq); if(mi>=0) return {ri:ri,mi:mi,ter:mi+1,a:rot.m[mi][0],b:rot.m[mi][1],joue:true};
    const o=(rot.off||[]).find(x=>x[0]===eq); if(o&&rot.m[o[1]-1]) return {ri:ri,mi:o[1]-1,ter:o[1],a:rot.m[o[1]-1][0],b:rot.m[o[1]-1][1],joue:false};
    return {ri:ri,repos:true}; }
  return {fini:true}; }
