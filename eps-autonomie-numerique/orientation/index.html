<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OrienRun EPS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--ink2:#56607a;--paper:#f5f2ea;--card:#fff;--line:#e2dccf;--orange:#E8701A;--orange2:#C45A0E;--violet:#c21fbf;--green:#2a9d6f;--red:#e63946;--sun:#ffb703;--blue:#1f4fa3;--r:16px;--cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
h1,h2,h3,.cond{font-family:var(--cond);letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.6em 1.1em;border-radius:999px;font-weight:700;background:var(--ink);color:#fff;min-height:46px;text-decoration:none;white-space:nowrap}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.or{background:var(--orange)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.vi{background:var(--violet)}.btn.sun{background:var(--sun);color:var(--ink)}
.btn.small{min-height:36px;padding:.35em .85em;font-size:.88em}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--ink2)}
small.muted{font-size:.82em}
.panel{background:var(--card);border-radius:var(--r);padding:18px;margin-top:16px;box-shadow:0 1px 0 var(--line)}
.panel h2{margin:0 0 12px;font-size:1.5rem;text-transform:uppercase}
.panel h3{margin:14px 0 8px;font-size:1.2rem;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.inp{border:2px solid var(--line);border-radius:12px;padding:.55em .75em;background:#fff;min-height:46px;width:100%}
.inp:focus{outline:none;border-color:var(--orange)}
textarea.inp{min-height:90px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.82rem;background:var(--paper)}
.chip.ok{background:#d9f2e6;color:#14684a}.chip.ko{background:#fde0e2;color:#a3202b}.chip.wait{background:#fff1c9;color:#7a5600}.chip.vi{background:#f7dcf6;color:#8a1288}.chip.or{background:#ffe3cc;color:#a24600}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-family:var(--cond);text-transform:uppercase;font-size:.9rem;color:var(--ink2);background:#faf8f3;position:sticky;top:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border-radius:12px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:200;transition:.25s;font-weight:600;max-width:92vw;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{background:var(--green)}#toast.ko{background:var(--red)}
/* flag */
.flag{width:46px;height:46px;border-radius:6px;background:linear-gradient(135deg,#fff 50%,var(--orange) 50%);box-shadow:inset 0 0 0 2px #0002;flex:none}
/* home */
#home{max-width:900px;margin:0 auto;padding:26px 18px 60px}
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:28px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:200px;height:200px;background:linear-gradient(135deg,#fff 50%,var(--orange) 50%);transform:rotate(12deg);border-radius:18px;opacity:.95}
.hero h1{font-size:3.1rem;line-height:.9;margin:0 0 8px;text-transform:uppercase;position:relative;z-index:1}
.hero p{margin:0;opacity:.9;position:relative;z-index:1;max-width:28em}
.hero .tag{position:relative;z-index:1;display:inline-block;background:#fff2;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.bigchoice{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.bigchoice button{background:#fff;border-radius:20px;padding:22px;text-align:left;box-shadow:0 1px 0 var(--line);display:flex;gap:14px;align-items:center}
.bigchoice b{font-family:var(--cond);font-size:1.7rem;text-transform:uppercase;display:block}
.bigchoice .ic{font-size:2.4rem}
/* teacher */
#prof header{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:8px 14px 0}
.topline{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--cond);font-weight:800;font-size:1.45rem;text-transform:uppercase}
.tabs{display:flex;gap:3px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 15px;font-weight:700;border-radius:12px 12px 0 0;color:#ffffffb8;white-space:nowrap;font-family:var(--cond);font-size:1.15rem;text-transform:uppercase}
.tab.on{background:var(--paper);color:var(--ink)}
.tab .bdg{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;margin-left:4px;font-size:.85rem}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ffffff1f;color:#fff;font-size:1.15rem}
.pmain{max-width:1280px;margin:0 auto;padding:14px 14px 90px}
/* map editor */
.editor{display:grid;grid-template-columns:270px 1fr;gap:10px;height:calc(100vh - 116px);min-height:420px}
@media(max-width:800px){.editor{grid-template-columns:1fr;height:auto}.tools{max-height:none}}
.tools{background:#fff;border-radius:14px;padding:10px;overflow:auto;box-shadow:0 1px 0 var(--line)}
.tools h4{margin:10px 2px 6px;font-family:var(--cond);text-transform:uppercase;color:var(--ink2);font-size:.95rem;letter-spacing:.05em}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.tool{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:10px;background:var(--paper);font-size:.8rem;font-weight:600;text-align:left;min-height:40px;line-height:1.05;overflow-wrap:anywhere;hyphens:auto}
.tool svg{width:26px;height:20px;flex:none}
.tool.on{background:var(--ink);color:#fff}
.tool.on svg *{filter:drop-shadow(0 0 1px #fff)}
.mapwrap{position:relative;background:#d8d3c6;border-radius:14px;overflow:hidden;touch-action:none;min-height:420px}
.mapwrap svg.map{width:100%;height:100%;display:block;cursor:crosshair;user-select:none}
.mapwrap.pan svg.map{cursor:grab}
.mapbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mapbar .info{background:#14213dde;color:#fff;border-radius:12px;padding:8px 12px;font-size:.9rem;font-weight:600}
.zoombtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.3rem;font-weight:800;box-shadow:0 2px 8px #0002}
.empty-map{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;pointer-events:none}
.empty-map>div{background:#fffe;border-radius:18px;padding:22px;max-width:440px;pointer-events:auto}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line);flex-wrap:wrap}
.item .num{width:50px;height:50px;border-radius:10px;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:1.6rem;flex:none;background:linear-gradient(135deg,#fff 50%,var(--orange) 50%);box-shadow:inset 0 0 0 2px #0002;text-shadow:0 0 3px #fff,0 0 3px #fff}
.item .num.S{background:none;color:var(--violet);box-shadow:inset 0 0 0 3px var(--violet)}
.item .num.F{background:none;color:var(--violet);box-shadow:inset 0 0 0 3px var(--violet);border-radius:50%}
.item .body{flex:1;min-width:180px}
.item .body b{font-family:var(--cond);font-size:1.2rem}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{min-width:46px;height:42px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-weight:800;font-family:var(--cond);font-size:1.2rem;padding:0 8px}
.cchip.on{background:var(--violet);color:#fff;box-shadow:none}
.cchip.found{background:var(--green);color:#fff;box-shadow:none}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;padding:6px;border-radius:12px;background:var(--paper)}
.seq span{background:var(--violet);color:#fff;border-radius:99px;padding:4px 10px;font-weight:700}
.seq span i{opacity:.7;font-style:normal;font-size:.8em;margin-right:4px}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:#14213d99;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--paper);width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 24px}
.sheet.wide{max-width:1150px}
@media(min-width:700px){.sheet{border-radius:22px}}
.sheet .close{float:right;width:42px;height:42px;border-radius:50%;background:#fff;font-size:1.3rem}
.sheet h2{margin:0 0 8px;font-size:1.7rem;text-transform:uppercase}
/* live */
.live{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:12px;height:calc(100vh - 116px)}
@media(max-width:900px){.live{grid-template-columns:1fr;height:auto}.live .mapwrap{height:60vh}}
.runners{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.runner{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 1px 0 var(--line);text-align:left;width:100%;display:flex;gap:10px;align-items:center}
.runner .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px #0003}
.runner .nm{font-weight:700}
.runner .chr{font-family:var(--cond);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto;text-align:right;line-height:1}
.runner.alert{background:#ffe1e3;animation:blink 1s infinite}
@keyframes blink{50%{box-shadow:0 0 0 4px var(--red)}}
.runner.stale .nm:after{content:" · signal perdu";color:var(--red);font-weight:600;font-size:.8em}
.alertbar{background:var(--red);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* student */
#eleve{max-width:640px;margin:0 auto;padding:16px 14px 120px}
.ehead{display:flex;align-items:center;gap:10px}
.ehead h1{margin:0;font-size:1.8rem;text-transform:uppercase}
.chrono{font-family:var(--cond);font-weight:800;font-size:4.2rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.runcard{background:var(--ink);color:#fff;border-radius:22px;padding:16px;margin-top:10px}
.runcard .sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600;font-size:.9rem;opacity:.95}
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block}
.status.ok i{background:#3ddc97}.status.wait i{background:var(--sun)}.status.ko i{background:var(--red)}
.next{background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;margin-top:12px;display:flex;align-items:center;gap:12px}
.next .flag{width:58px;height:58px;display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:1.9rem;text-shadow:0 0 3px #fff,0 0 3px #fff}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bigbtns .btn{min-height:64px;font-size:1.1rem;border-radius:18px}
.targets{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.target{background:#fff;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 var(--line)}
.target .n{font-family:var(--cond);font-weight:800;font-size:1.4rem;width:44px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--paper)}
.target.done .n{background:var(--green);color:#fff}.target.wait .n{background:var(--sun)}.target.ko .n{background:var(--red);color:#fff}.target.cur{box-shadow:inset 0 0 0 3px var(--orange)}
.target .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.sos{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 6px 20px #e6394688;z-index:40;display:grid;place-items:center;line-height:1;text-align:center}
.sos .ring{position:absolute;inset:-6px;border-radius:50%;border:6px solid transparent;border-top-color:#fff}
.msgbox{background:var(--sun);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;margin-top:10px}
#scanner{position:fixed;inset:0;background:#000;z-index:150;display:flex;flex-direction:column}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
#scanner .frame{position:absolute;left:50%;top:42%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 2000px #0006}
#scanner .bar{padding:14px;display:flex;gap:10px;justify-content:center;background:#000}
@media print{.noprint{display:none!important}}

/* ===== Charte EPS : barre sombre commune, liseré et accents à la couleur de l'appli ===== */
:root{--app:#E8701A}
.ebar{background:#14171C;color:#fff;box-shadow:inset 0 -4px 0 var(--app);padding:calc(env(safe-area-inset-top) + 12px) 22px 16px;display:flex;align-items:center;gap:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ei{width:36px;height:36px;border-radius:10px;background:var(--app);display:inline-grid;place-items:center;flex:none}.ei svg{width:22px;height:22px}
.ebar b{font-size:20px;font-weight:800}.ebar small{color:#A9AEB8;font-weight:600;font-size:14px;flex:1}
body:has(#home.hidden) .homebar{display:none}
#prof header{background:#14171C;box-shadow:inset 0 -4px 0 var(--app);padding:10px 14px 4px}
#prof .topline .logo{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;font-weight:800;text-transform:none}
#profHome{display:none}
.tab{color:#B9BEC7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-transform:none;font-size:15px;border-radius:10px 10px 0 0}
.tab.on{background:var(--app);color:#fff}
html:not(.eps-teach) #goProf{display:none}
.epse-open{height:40px;border-radius:10px;border:1.5px solid #3A3F47;background:transparent;color:#D5D8DE;font:700 14px system-ui,sans-serif;padding:0 12px;cursor:pointer;white-space:nowrap}
</style>
</head>

<header class="ebar homebar"><span class="ei"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3"/><path d="M6 4h13v10H6z"/><path d="M6 4l13 10"/></svg></span><b>OrienRun</b><small>CA2 · Course d'orientation</small><span data-eps-bar></span></header>
<div id="home" class="hidden">
  <div class="hero"><span class="tag">EPS · Course d'orientation</span><h1>OrienRun<br>EPS</h1><p>Cartes, balises à QR code, parcours, suivi GPS en direct et résultats.</p></div>
  <div class="bigchoice">
    <button id="goEleve"><span class="ic">🏃</span><span><b>Je suis élève</b><span class="muted">Scanne le QR code de départ donné par ton enseignant.</span></span></button>
    <button id="goProf"><span class="ic">🧭</span><span><b>Espace enseignant</b><span class="muted">Carte, balises, parcours, tablette de contrôle.</span></span></button>

  <div id="homeResume"></div>
  <p class="muted" style="text-align:center;font-size:.8rem;margin-top:26px">OrienRun EPS · v<span id="ver"></span> · symboles d'après les normes IOF (ISOM 2017-2, ISSprOM 2019)</p>
</div>
<div id="prof" class="hidden">
  <header>
    <div class="topline"><span class="ei"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3"/><path d="M6 4h13v10H6z"/><path d="M6 4l13 10"/></svg></span><div class="logo">OrienRun · Enseignant</div><span class="grow"></span><span id="projName" class="chip" style="background:#ffffff26;color:#fff"></span><button class="iconbtn" id="profHome" title="Accueil">⌂</button><button class="epse-open" onclick="window.EPST&&EPST.openVue()">👁 Vue élève</button><button class="epse-open" onclick="window.EVORI&&EVORI.open()">📋 Évaluation</button><button class="epse-open" onclick="window.EPSLC&&EPSLC.open('lec')">📝 Fiches de leçon</button><button class="epse-open" onclick="window.EPSLC&&EPSLC.open('live')">📡 Leçon en cours</button><span data-eps-bar></span></div>

      <button class="tab" data-t="carte">🗺 Carte</button><button class="tab" data-t="balises">🚩 Balises</button><button class="tab" data-t="parcours">〰 Parcours</button><button class="tab" data-t="biblio">📚 Bibliothèque</button><button class="tab" data-t="seance">📡 Leçon live<span class="bdg hidden" id="alertBdg"></span></button><button class="tab" data-t="resultats">🏁 Résultats</button><button class="tab" data-t="reglages">⚙ Réglages</button>
    </nav>
  </header>
  <div id="pview"></div>
</div>
<div id="eleve" class="hidden"></div>
<div id="modalRoot"></div>
<input type="file" id="fileIn" class="hidden">

<script>
// ===== QR code : encodeur autonome (mode octets, versions 1-40, d'après l'algorithme de Nayuki, MIT) =====
const QR = (() => {
  const ECC = { L: [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    M: [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    Q: [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    H: [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30] };
  const BLK = { L: [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    M: [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    Q: [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    H: [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81] };
  const FMT = { L: 1, M: 0, Q: 3, H: 2 };

  function rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;

async function loadMapImage() {
  const f = await pickFile("image/*,application/pdf"); if (!f) return;
  toast("Chargement de la carte…");
  try {
    let src;
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; const page = await pdf.getPage(1);
      const v0 = page.getViewport({ scale: 1 }), sc = 2600 / Math.max(v0.width, v0.height), vp = page.getViewport({ scale: sc });
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise; src = cv;
    } else { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Image illisible")); i.src = URL.createObjectURL(f); }); }
    const W = src.naturalWidth || src.width, H = src.naturalHeight || src.height, k = Math.min(1, 2600 / Math.max(W, H));
    const cv = document.createElement("canvas"); cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(src, 0, 0, cv.width, cv.height);
    const had = P.map.img || P.controls.some(c => c.x != null) || P.features.length;
    if (had && !confirm("Remplacer la carte actuelle ? Les balises et dessins restent à leur place (en proportion).")) return;
    const sx = cv.width / P.map.w, sy = cv.height / P.map.h;
    if (had) { P.controls.forEach(c => { if (c.x != null) { c.x *= sx; c.y *= sy; } }); P.calib.forEach(c => { if (c.x == null) return; c.x *= sx; c.y *= sy; }); P.features.forEach(f => { if (f.pts) f.pts = f.pts.map(p => [p[0] * sx, p[1] * sy]); else { f.x *= sx; f.y *= sy; } }); }
    dropScale();
    P.map.img = cv.toDataURL("image/jpeg", .86); P.map.w = cv.width; P.map.h = cv.height; ED.view = null;
    saveP(true); renderEditor(); $("#emptyMap")?.classList.add("hidden"); toast("Carte chargée ✓", "ok");
  } catch (e) { toast(e.message, "ko"); }
}

// ===== Analyse d'itinéraire, fiche bilan, progression, immobilité, appel, listes de classe, pose des balises =====
const normName = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9& ]+/g, " ").split(/\s+/).filter(Boolean).sort().join(" ");

// Arrêts : positions restées dans un rayon de 15 m pendant au moins 1 minute

  const out = []; let i = 0;
  while (i < pos.length) {
    let j = i; while (j + 1 < pos.length && haversine({ lat: pos[i].la, lon: pos[i].lo }, { lat: pos[j + 1].la, lon: pos[j + 1].lo }) <= rad) j++;

function legRanges(a) { return a.legs.filter(l => l.t != null && l.split != null).map(l => ({ ...l, t0: l.t - l.split, t1: l.t })); }

  if (course) [course.depart, ...course.ctrl, course.arrivee].map(id => proj.controls.find(c => c.id === id)).filter(c => c && c.x != null).forEach(c => { xs.push(c.x); ys.push(c.y); });

// ---------- 8. alerte d'immobilité (enseignant) ----------
function immobility(R, a) {
  const lim = (+CFG.immo || 0) * 60000; if (!lim || a.statut !== "En course") return null;
  const pos = posOf(R); if (pos.length < 3) return null;
  const last = pos[pos.length - 1]; if (Date.now() - (last.rt || last.t) > (CFG.interval * 3 + 30) * 1000) return null; // signal perdu : signalé ailleurs
  const L = { lat: last.la, lon: last.lo }; let k = pos.length - 1;
  while (k > 0 && haversine({ lat: pos[k - 1].la, lon: pos[k - 1].lo }, L) <= 20 + Math.min(last.ac || 0, 20)) k--;
  const since = pos[k].t, dur = Date.now() - since; if (dur < lim || since < a.start) return null;
  const near = P.controls.filter(c => c.lat != null).some(c => haversine(c, L) <= 30); if (near) return null; // à une balise : normal
  return { since, dur, la: last.la, lo: last.lo };
}

// ---------- 12. pose et ramassage des balises (guidage sur le terrain) ----------
const bearing = (a, b) => { const r = Math.PI / 180, y = Math.sin((b.lon - a.lon) * r) * Math.cos(b.lat * r), x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lon - a.lon) * r); return (Math.atan2(y, x) / r + 360) % 360; };
function openPose() {
  let mode = "pose", me = null, head = null, target = null, watch = null, hasCompass = false;
  const done = c => !!(mode === "pose" ? c.pose : c.ramasse);
  const all = () => P.controls.filter(c => c.lat != null);
  const pick = () => { const L = all().filter(c => !done(c)); if (!L.length) return null; if (!me) return L[0]; return L.slice().sort((a, b) => haversine(me, a) - haversine(me, b))[0]; };
  const m = openModal(`<h2>🧭 Sur le terrain</h2><div class="row" style="margin-bottom:10px"><button class="btn small" data-md="pose">🚩 Pose des balises</button><button class="btn small ghost" data-md="ramasse">🧺 Ramassage</button><span class="grow"></span><button class="btn small ghost" id="poCompass">🧭 Activer la boussole</button></div>
   <div id="poMain"></div><div id="poList" style="margin-top:12px"></div>`, { wide: true, sticky: true, onClose: () => { navigator.geolocation.clearWatch(watch); removeEventListener("deviceorientationabsolute", ori); removeEventListener("deviceorientation", ori); } });
  const ori = e => { let h = e.webkitCompassHeading != null ? e.webkitCompassHeading : e.alpha != null && (e.absolute || e.type === "deviceorientationabsolute") ? (360 - e.alpha) % 360 : null; if (h != null) { head = h; hasCompass = true; drawMain(); } };
  addEventListener("deviceorientationabsolute", ori); addEventListener("deviceorientation", ori);
  $("#poCompass", m).onclick = async () => { try { if (window.DeviceOrientationEvent?.requestPermission) await DeviceOrientationEvent.requestPermission(); toast("Boussole activée : tiens le téléphone à plat"); } catch (e) { toast("Boussole refusée", "ko"); } };
  watch = navigator.geolocation.watchPosition(p => { me = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }; if (!hasCompass && p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > .5) head = p.coords.heading; if (!target || done(target)) target = pick(); drawMain(); }, e => toast(e.message, "ko"), { enableHighAccuracy: true, maximumAge: 2000 });
  let lastBuzz = 0;
  const drawMain = () => {
    const box = $("#poMain", m); if (!box) return;
    const L = all(), n = L.filter(done).length;
    if (!target || done(target)) target = pick();
    if (!target) { box.innerHTML = `<div class="panel" style="margin:0;text-align:center"><h2>✓ Toutes les balises sont ${mode === "pose" ? "posées" : "ramassées"} (${n}/${L.length})</h2></div>`; return drawList(); }
    const d = me ? haversine(me, target) : null, b = me ? bearing(me, target) : null, rot = b != null ? (head != null ? b - head : b) : 0;
    if (d != null && d < 10 && Date.now() - lastBuzz > 8000) { lastBuzz = Date.now(); navigator.vibrate?.([200, 100, 200]); }
    box.innerHTML = `<div class="runcard" style="display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center">
      <div style="width:150px;height:150px;border-radius:50%;background:#ffffff14;display:grid;place-items:center;position:relative">${head == null ? '<span style="position:absolute;top:4px;font-weight:800">N</span>' : ""}<svg viewBox="-50 -50 100 100" style="width:120px;transform:rotate(${rot}deg);transition:transform .3s"><path d="M0,-44 L22,30 L0,16 L-22,30Z" fill="${d != null && d < 15 ? "#3ddc97" : "#E8701A"}"/></svg></div>
      <div><div class="lbl" style="color:#fff">${mode === "pose" ? "Balise à poser" : "Balise à ramasser"} · ${n}/${L.length} faites</div><div style="font-family:var(--cond);font-size:3rem;font-weight:800;line-height:1">${esc(ctrlLabel(target))}</div>
      <div style="font-size:2rem;font-weight:800">${d == null ? "GPS…" : fmtDist(d)}</div><div class="sub">${target.desc ? esc(target.desc) + " · " : ""}${me ? `ta précision ±${Math.round(me.acc)} m` : ""}${head == null ? " · flèche orientée par rapport au nord (active la boussole ou marche)" : ""}</div></div></div>
     <div class="row" style="margin-top:10px"><button class="btn green" id="poDone" style="min-height:58px;flex:1">✓ ${mode === "pose" ? "Posée" : "Ramassée"}</button><button class="btn alt" id="poSkip">Passer</button><a class="btn ghost" target="_blank" href="${gmapsUrl(target.lat, target.lon)}">Google Maps</a></div>
     ${mode === "pose" ? `<label class="row" style="gap:6px;margin-top:8px"><input type="checkbox" id="poUpd"> Remplacer la position GPS de la balise par ma position actuelle (si je la pose ailleurs)</label>` : ""}`;
    $("#poDone", m).onclick = () => { if (mode === "pose" && $("#poUpd", m)?.checked && me) { target.lat = me.lat; target.lon = me.lon; target.acc = Math.round(me.acc); } target[mode === "pose" ? "pose" : "ramasse"] = Date.now(); saveP(); toast(`${ctrlLabel(target)} ${mode === "pose" ? "posée" : "ramassée"} ✓`, "ok"); target = pick(); drawMain(); };
    $("#poSkip", m).onclick = () => { const L2 = all().filter(c => !done(c) && c !== target); if (L2.length) { target = me ? L2.sort((a, b) => haversine(me, a) - haversine(me, b))[0] : L2[0]; } drawMain(); };
    drawList();
  };
  const drawList = () => { const L = all(), sans = P.controls.filter(c => c.lat == null);
    $("#poList", m).innerHTML = `<div class="cchips">${L.map(c => `<button class="cchip ${done(c) ? "found" : target === c ? "on" : ""}" data-po="${c.id}" title="${done(c) ? "fait à " + fmtHeure(c[mode === "pose" ? "pose" : "ramasse"]) : ""}">${esc(c.type === "C" ? c.n : c.type === "S" ? "▲" : "◎")}</button>`).join("")}</div>
     ${sans.length ? `<p class="muted">Sans GPS (non guidées) : ${sans.map(c => esc(ctrlLabel(c))).join(", ")}</p>` : ""}<button class="btn small ghost" id="poReset" style="margin-top:8px">Tout remettre à « ${mode === "pose" ? "à poser" : "à ramasser"} »</button>`;
    $$("[data-po]", m).forEach(b => b.onclick = () => { const c = ctrlById(b.dataset.po); if (done(c)) { if (confirm(`Annuler « ${mode === "pose" ? "posée" : "ramassée"} » pour ${ctrlLabel(c)} ?`)) { delete c[mode === "pose" ? "pose" : "ramasse"]; saveP(); } } else target = c; drawMain(); });
    $("#poReset", m).onclick = () => { if (!confirm("Tout remettre à zéro pour ce mode ?")) return; P.controls.forEach(c => delete c[mode === "pose" ? "pose" : "ramasse"]); saveP(); target = null; drawMain(); };
  };
  $$("[data-md]", m).forEach(b => b.onclick = () => { mode = b.dataset.md; $$("[data-md]", m).forEach(x => x.className = "btn small " + (x === b ? "" : "ghost")); target = null; drawMain(); });
  drawMain();
}

const blib = () => DB.get("biblio").then(x => x || []);
const blibNiv = () => LS.get("biblioNiv", "pro");
const attendus = (L, niv) => niv === "gt" ? (L.afl || []).map(i => ({ k: "AFL" + i, t: AFL[i] })) : (L.aflp || []).map(i => ({ k: "AFLP" + i, t: AFLP[i] }));

async function viewBiblio(v) {
  const mine = await blib(), niv = blibNiv(), filt = LS.get("biblioFilt", "cycle");
  const all = [...BIBLIO, ...mine];
  const list = all.filter(L => filt === "tout" || (filt === "mes" ? L.mine : L.cat === filt && !L.mine));
  v.innerHTML = `<div class="pmain"><div class="panel" style="margin-top:0"><h2>📚 Bibliothèque de leçons</h2>
    <p class="muted" style="margin-top:-6px">Un cycle de course d'orientation au format fiche de leçon (CA2 : adapter son déplacement à des environnements variés et/ou incertains), des situations courtes, et tes propres leçons. Chaque fiche peut créer le parcours OrienRun déjà réglé.</p>
    <div class="row"><div class="cchips">${[["cycle", "Cycle (10 leçons)"], ["situation", "Situations courtes"], ["mes", `Mes leçons (${mine.length})`], ["tout", "Tout"]].map(([k, l]) => `<button class="btn small ${filt === k ? "" : "ghost"}" data-f="${k}">${l}</button>`).join("")}</div><span class="grow"></span>
     <div class="cchips"><button class="btn small ${niv === "pro" ? "vi" : "ghost"}" data-niv="pro">Bac pro (AFLP)</button><button class="btn small ${niv === "gt" ? "vi" : "ghost"}" data-niv="gt">Bac GT (AFL)</button></div></div>
    <div class="row" style="margin-top:10px"><button class="btn or" id="blNew">＋ Nouvelle leçon</button><button class="btn alt" id="blPlan">🖨 Plan de cycle</button><button class="btn ghost" id="blExp">⬇ Exporter mes leçons</button><button class="btn ghost" id="blImp">⬆ Importer</button></div></div>
    <div class="grid2" style="margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${list.map(L => `<button class="panel" data-l="${esc(L.id)}" style="margin:0;text-align:left;display:flex;flex-direction:column;gap:6px;border-left:6px solid ${L.mine ? "var(--violet)" : L.cat === "situation" ? "var(--sun)" : "var(--orange)"}">
      <div class="row" style="gap:6px"><span class="chip ${L.cat === "situation" ? "wait" : "or"}">${L.n ? "Leçon " + L.n : L.cat === "situation" ? "Situation" : "Leçon"}</span><span class="chip">${esc(L.duree || "")}</span>${L.mine ? '<span class="chip vi">Ma leçon</span>' : ""}</div>
      <b style="font-family:var(--cond);font-size:1.4rem;line-height:1.05">${esc(L.titre)}</b><span class="muted">${esc(L.theme || "")}</span>
      <div class="cchips">${attendus(L, niv).map(a => `<span class="chip vi" title="${esc(a.t)}">${a.k}</span>`).join("")}${L.o ? '<span class="chip ok">〰 parcours prêt</span>' : ""}</div></button>`).join("") || '<div class="panel muted">Aucune leçon ici pour l\'instant.</div>'}</div></div>`;
  $$("[data-f]", v).forEach(b => b.onclick = () => { LS.set("biblioFilt", b.dataset.f); setPTab("biblio"); });
  $$("[data-niv]", v).forEach(b => b.onclick = () => { LS.set("biblioNiv", b.dataset.niv); setPTab("biblio"); });
  $$("[data-l]", v).forEach(b => b.onclick = () => openFiche(all.find(L => L.id === b.dataset.l)));
  $("#blNew").onclick = () => editLecon({ id: "M" + uid(5), mine: true, cat: "cycle", titre: "", theme: "", duree: "1 h 50", aflp: [1], afl: [1], objectif: "", echauffement: "", sit: { nom: "", but: "", dispositif: "", organisation: "", consignes: [], reussite: [], realisation: [], simplifier: [], complexifier: [], roles: "" }, bilan: "", securite: [], materiel: [], o: null }, true);
  $("#blPlan").onclick = () => printPlan(all.filter(L => L.cat === "cycle" && (filt !== "mes" || L.mine)).sort((a, b) => (a.n || 99) - (b.n || 99)));
  $("#blExp").onclick = () => download("OrienRun_mes_lecons.json", JSON.stringify(mine, null, 1), "application/json");
  $("#blImp").onclick = async () => { const f = await pickFile(".json,application/json"); if (!f) return; try { const L = JSON.parse(await f.text()); if (!Array.isArray(L)) throw new Error("Fichier non reconnu"); const M = await blib(); L.forEach(x => { x.mine = true; x.id = x.id && !M.some(m => m.id === x.id) ? x.id : "M" + uid(5); M.push(x); }); await DB.set("biblio", M); toast(L.length + " leçon(s) importée(s) ✓", "ok"); setPTab("biblio"); } catch (e) { toast(e.message, "ko"); } };
}

function shrinkData(src, max = 640, q = .72) { return new Promise(res => { const i = new Image(); i.onload = () => { const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", q)); }; i.onerror = () => res(null); i.src = src; }); }
// Simplification d'une ligne (Douglas-Peucker) en pixels de la carte
function simplify(pts, tol) {
  if (pts.length < 3) return pts;
  const d = (p, a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy; if (!L) return Math.hypot(p[0] - a[0], p[1] - a[1]); const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); };
  let im = 0, dm = 0; for (let i = 1; i < pts.length - 1; i++) { const x = d(pts[i], pts[0], pts[pts.length - 1]); if (x > dm) { dm = x; im = i; } }
  return dm > tol ? simplify(pts.slice(0, im + 1), tol).slice(0, -1).concat(simplify(pts.slice(im), tol)) : [pts[0], pts[pts.length - 1]];
}
// Densité notée de part et d'autre du chemin (appli Terrain) → bandes de végétation
const DENS_SYM = { vert1: "vert1", vert2: "vert2", vert3: "vert3", jaune: "decouvert", jclair: "semi" };
function offsetGeo(pts, dist) { // dist > 0 : à gauche dans le sens de la marche
  const la0 = pts[0].lat, kx = 111320 * Math.cos(la0 * Math.PI / 180), ky = 110540;
  return pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)]; let dx = (b.lon - a.lon) * kx, dy = (b.lat - a.lat) * ky; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L; return { lat: p.lat + dx * dist / ky, lon: p.lon - dy * dist / kx }; });
}
function densBandsGeo(t) {
  const out = [], w = t.bande || 15;
  (t.segments || []).forEach(seg => ["g", "d"].forEach(side => {
    let run = [];
    const flush = () => { if (run.length > 1 && run[0][side]) { const off = offsetGeo(run, side === "g" ? w : -w); out.push({ cls: run[0][side], poly: [...run, ...off.reverse()].map(p => [+(+p.lat).toFixed(7), +(+p.lon).toFixed(7)]) }); } run = []; };
    seg.forEach(p => { if (run.length && (p[side] || "") !== (run[run.length - 1][side] || "")) { const last = run[run.length - 1]; flush(); if (p[side]) run.push({ ...last, [side]: p[side] }); } run.push(p); });
    flush();
  }));
  return out;
}
const isAreaType = t => SYMI[t.type]?.k === "area";
function convertTraces(list) {
  const g = georef(); if (!g) return 0; const mm = mapMM(P); let n = 0;
  const toPx = gps => gps.map(([la, lo]) => { const q = g.toPx(la, lo); return [q.x, q.y]; });
  const gpsOf = seg => seg.map(p => [+(+p.lat).toFixed(7), +(+p.lon).toFixed(7)]);
  (list || P.gpsTraces || []).forEach(t => {
    if (isAreaType(t)) { t.segments.forEach(seg => { if (seg.length < 3) return; const gps = gpsOf(seg); P.features.push({ id: uid(6), sym: t.type, pts: simplify(toPx(gps), mm * .15), src: "terrain", gps }); n++; }); return; }
    densBandsGeo(t).forEach(b => { const sym = DENS_SYM[b.cls]; if (sym) P.features.push({ id: uid(6), sym, pts: simplify(toPx(b.poly), mm * .15), src: "terrain", gps: b.poly, dens: 1 }); });
    t.segments.forEach(seg => { if (seg.length < 2) return; const gps = gpsOf(seg); P.features.push({ id: uid(6), sym: SYMI[t.type] ? t.type : "chemin", pts: simplify(toPx(gps), mm * .15), src: "terrain", gps }); n++; });
  });

}
function convertElts(list) {
  const g = georef(); if (!g) return 0; let n = 0;
  (list || P.gpsElts || []).forEach(e => { if (!SYMI[e.sym]) return; const q = g.toPx(e.lat, e.lon); P.features.push({ id: uid(6), sym: e.sym, x: q.x, y: q.y, src: "terrain", gpsPt: [+(+e.lat).toFixed(7), +(+e.lon).toFixed(7)], note: e.note || "" }); n++; });

function recalTraces() { const g = georef(); if (!g) return null; const mm = mapMM(P); let n = 0; P.features.filter(f => f.gps?.length > 1).forEach(f => { f.pts = simplify(f.gps.map(([la, lo]) => { const q = g.toPx(la, lo); return [q.x, q.y]; }), mm * .15); n++; }); P.features.filter(f => f.gpsPt).forEach(f => { const q = g.toPx(f.gpsPt[0], f.gpsPt[1]); f.x = q.x; f.y = q.y; n++; }); return n; }

function gpsExtent() {
  const pts = [];
  (P.gpsTraces || []).forEach(t => t.segments.forEach(sg => sg.forEach(p => pts.push([p.lat, p.lon]))));
  (P.gpsTraces || []).forEach(t => densBandsGeo(t).forEach(b => b.poly.forEach(q => pts.push(q))));
  (P.gpsElts || []).forEach(e => pts.push([e.lat, e.lon]));
  P.features.forEach(f => { (f.gps || []).forEach(q => pts.push(q)); if (f.gpsPt) pts.push(f.gpsPt); });
  P.controls.forEach(c => { if (c.lat != null) pts.push([c.lat, c.lon]); });
  P.calib.forEach(c => { if (c.lat != null) pts.push([c.lat, c.lon]); });

}

// photo aérienne IGN (BD ORTHO) sous la carte : tuiles Web Mercator positionnées dans le cadre
function makeUnderlay() {

  $("#mAb", m).onclick = () => { if (!confirm("Abandonner ? Ton enseignant sera prévenu.")) return; mutRun(r => { r.abandon = Date.now(); newEvent(r, "abandon"); }); m.close(); stopLoop(); flush(); endScreen(); };
}
function smsRunData(r) {
  const P = Object.values(r.ev).filter(e => e.k === "punch").sort((a, b) => a.t - b.t);
  const last = E.fix ? { lat: E.fix.lat, lon: E.fix.lon } : null;
  return { s: r.s, c: r.c, r: r.r, nom: r.nom, cl: r.cl, start: r.start, finish: r.finish, punches: P, last };
}

// ---------- SOS ----------
function initSOS(btn) {
  let h = null, t0 = 0;
  const down = e => { e.preventDefault(); t0 = Date.now(); btn.innerHTML = `<span class="ring"></span><span>Maintiens…</span>`; h = setTimeout(() => { btn.innerHTML = "<span>SOS</span>"; sendAlert(); }, 1200); };
  const upf = () => { if (h) clearTimeout(h); h = null; btn.innerHTML = "<span>SOS</span>"; if (Date.now() - t0 < 1100) toast("Maintiens le bouton SOS appuyé pour envoyer une alerte"); };
  btn.addEventListener("pointerdown", down); btn.addEventListener("pointerup", upf); btn.addEventListener("pointerleave", () => { if (h) { clearTimeout(h); h = null; btn.innerHTML = "<span>SOS</span>"; } });
}
function sendAlert() {
  navigator.vibrate?.([300, 100, 300]);
  const ev = mutRun(r => newEvent(r, "alert", { txt: "" }));
  const r = loadRun(); const last = Object.values(r.ev).filter(e => e.la != null).sort((a, b) => b.t - a.t)[0];
  const pos = E.fix || (last ? { lat: last.la, lon: last.lo, acc: last.ac } : null);
  const sms = `🆘 ALERTE OrienRun – ${r.nom} (${r.c.k}) à ${fmtHeure(Date.now())}${pos ? ` – position : ${gmapsUrl(pos.lat, pos.lon)} (±${Math.round(pos.acc || 0)} m)` : ""}\nOR1;S=${r.s};C=${r.c.k};R=${r.r};N=${r.nom.replace(/[;=]/g, " ")};T=${Math.round(Date.now() / 1000)}${pos ? `;A=${pos.lat.toFixed(5)},${pos.lon.toFixed(5)}` : ""}`;
  const m = openModal(`<h2 style="color:var(--red)">🆘 Alerte</h2><p id="aSt"><b>Envoi de l'alerte à ton enseignant…</b></p>
   <div class="lbl">Que se passe-t-il ?</div><div class="cchips" style="margin:6px 0 12px">${["Je suis perdu(e)", "Je suis blessé(e)", "Mon équipier est blessé", "Autre problème"].map(t => `<button class="btn small alt" data-t="${t}">${t}</button>`).join("")}</div>
   <div style="display:flex;flex-direction:column;gap:10px">${r.t ? `<a class="btn red" href="${smsHref(r.t, sms)}">📩 Envoyer aussi l'alerte par SMS</a><a class="btn alt" href="tel:${esc(r.t.replace(/[^\d+]/g, ""))}">📞 Appeler mon enseignant</a>` : ""}</div>
   <p class="muted">Reste où tu es si tu es perdu(e) ou blessé(e) : ton enseignant voit ta position.</p>`, { sticky: true });
  $$("[data-t]", m).forEach(b => b.onclick = () => { mutRun(r => newEvent(r, "alert", { txt: b.dataset.t })); flush(true); $$("[data-t]", m).forEach(x => x.classList.toggle("on", x === b)); b.className = "btn small red"; });
  flush(true).then(ok => { const st = $("#aSt", m); if (st) st.innerHTML = ok ? "<b style='color:var(--green)'>✓ Alerte reçue par le serveur. Ton enseignant est prévenu.</b>" : "<b style='color:var(--red)'>⚠ Pas de réseau internet : envoie l'alerte par SMS ou appelle ton enseignant !</b>"; });
}

// ---------- GPS + envoi ----------
function startGps() {
  if (E.watch != null || !navigator.geolocation) return;
  E.watch = navigator.geolocation.watchPosition(p => { E.fix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; updStatus(); }, e => { if (e.code === 1) toast("Localisation refusée : ton enseignant ne peut pas te suivre", "ko"); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
}
function startLoop() {
  stopLoop();
  const r = loadRun(); const iv = Math.max(5, +r.i || 20) * 1000;
  const tick = () => { if (!E.active) return; const r = loadRun(); if (!r || !r.start || r.finish || r.abandon) return stopLoop(); if (E.fix && Date.now() - E.fix.t < iv * 2) { mutRun(r => newEvent(r, "pos")); } flush(); };
  E.timer = setInterval(tick, iv); setTimeout(tick, 1500);
  // un seul onglet envoie (si l'élève a ouvert l'appli plusieurs fois)
  try { E.chan = E.chan || new BroadcastChannel("orienrun"); E.chan.onmessage = m => { if (m.data?.take && m.data.id !== TAB_ID) { E.active = false; } }; E.chan.postMessage({ take: 1, id: TAB_ID }); E.active = true; } catch (e) {}
}
function stopLoop() { clearInterval(E.timer); E.timer = null; }
async function flush(force) {
  const r = loadRun(); if (!r || !r.a) { E.online = r?.a ? E.online : null; updStatus(); return false; }
  if (E.sending && !force) return false; E.sending = true;
  try {
    const ids = r.queue.slice(0, 150); const ev = ids.map(id => r.ev[id]).filter(Boolean).map(e => { const { code, ...x } = e; return x; });
    const j = await apiCall(r.a, "push", { s: r.s, r: r.r, nom: r.nom, cl: r.cl, c: r.c.k, sel: r.sel, ev }, 15000);
    const news = [], decs = [];
    mutRun(x => { x.queue = x.queue.filter(id => !ids.includes(id)); Object.entries(j.dec || {}).forEach(([id, v]) => { if (x.dec[id] !== v && x.ev[id]) decs.push({ e: x.ev[id], v }); x.dec[id] = v; }); (j.msgs || []).forEach(m => { if (!x.msgs.some(o => o.id === m.id)) { x.msgs.push(m); if (!(x.joinT && m.t && m.t < x.joinT - 10000)) news.push(m); else x.seenMsg[m.id] = 1; } }); });
    E.online = true; if ($("#targets")) renderRun();
    incoming(news, decs); renderLobbyMsgs(); flushOld();
    const left = loadRun().queue.length; if (left && ids.length === 150) setTimeout(() => flush(), 500);
    return true;
  } catch (e) { E.online = false; return false; }
  finally { E.sending = false; updStatus(); }
}
async function requestWake() { try { if ("wakeLock" in navigator && !E.wake) { E.wake = await navigator.wakeLock.request("screen"); E.wake.addEventListener("release", () => E.wake = null); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("#chrono")) { requestWake(); try { E.chan?.postMessage({ take: 1, id: TAB_ID }); } catch (e) {} E.active = true; renderRun(); flush(); } });
window.addEventListener("storage", e => { if (e.key === "or." + RUNKEY && $("#targets")) renderRun(); });
window.addEventListener("online", () => flush());

// ---------- carte sur le téléphone ----------
async function fetchMap() {
  const r = loadRun(); if (!r.c.mp || !r.a || E.mapProj) return;
  const cached = await DB.get("map:" + r.s); if (cached) { E.mapProj = cached; return; }
  try { const j = await apiCall(r.a, "getSession", { s: r.s }, 30000); if (j.data?.proj) { E.mapProj = j.data.proj; DB.set("map:" + r.s, j.data.proj); if (!$("#bMap") && $("#targets")) runScreen(); } } catch (e) {}
}
function showStudentMap() {
  const r = loadRun(), pr = E.mapProj;
  if (!pr) return toast("Carte pas encore téléchargée (il faut du réseau)", "ko");
  const k = pr.courses.find(x => x.k === r.c.k); if (k && !k.carte) return toast("Ton enseignant n'a pas partagé la carte", "ko");
  const course = k ? { ...k, ctrl: r.sel && k.mode !== "ordre" ? k.ctrl.filter(id => r.sel.includes(+pr.controls.find(c => c.id === id)?.n)) : k.ctrl } : null;
  let z = 1;
  const m = openModal(`<h2>Carte · ${esc(r.c.k)}</h2><div class="row" style="margin-bottom:8px"><button class="btn small alt" id="zp">＋</button><button class="btn small alt" id="zm">－</button></div><div style="overflow:auto;max-height:72vh;border-radius:12px;background:#ddd"><svg id="smap" viewBox="0 0 ${pr.map.w} ${pr.map.h}" style="width:100%;display:block">${mapSVG(pr, { course, noCode: true })}</svg></div>`, { wide: true });
  const set = () => $("#smap", m).style.width = (100 * z) + "%";
  $("#zp", m).onclick = () => { z = Math.min(5, z * 1.5); set(); }; $("#zm", m).onclick = () => { z = Math.max(1, z / 1.5); set(); };
}

// ---------- fin ----------
function endScreen() {
  const r = loadRun(); if (!r) return welcomeScreen();
  stopLoop(); clearInterval(E.tick);
  if (E.watch != null) { navigator.geolocation.clearWatch(E.watch); E.watch = null; }
  const a = anaS(r);
  $("#eleve").innerHTML = `<div class="ehead"><div class="flag"></div><h1>${r.abandon ? "Course arrêtée" : "Bravo !"}</h1></div>
   <div class="runcard"><div class="chrono">${fmtDur(a.temps)}</div><div class="sub" style="justify-content:center"><span>${a.found}/${a.total} balises${a.pending ? ` (+${a.pending} à valider)` : ""}</span>${r.c.m === "score" && fbOn(r) ? `<span>· ${a.score} pts${a.penal ? ` (−${a.penal} retard)` : ""}</span>` : ""}${a.dist ? `<span>· ${fmtDist(a.dist)}</span>` : ""}</div></div>
   <div class="panel"><h2>Mes temps</h2><div class="tw"><table class="t"><thead><tr><th>Poste</th><th class="num">Temps inter.</th><th class="num">Cumul</th></tr></thead><tbody>${a.legs.map(l => `<tr><td><b>${esc(l.de)} → ${esc(l.n)}</b>${fbOn(r) && !l.ordre ? ' <span class="chip ko">ordre</span>' : ""}${r.dec[l.id] === true ? ' <span class="chip ok">✓ juste</span>' : ""}${l.status === "attente" && fbOn(r) ? ' <span class="chip wait">à valider</span>' : ""}</td><td class="num">${fmtDur(l.split)}</td><td class="num">${fmtDur(l.cumul)}</td></tr>`).join("")}</tbody></table></div>
    ${a.manquants.length ? `<p><b>Balises manquantes :</b> ${a.manquants.join(", ")}</p>` : ""}</div>
   <div class="panel"><p id="endSync" class="muted"></p><div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn" id="eAna">🗺 Revoir mon itinéraire</button><button class="btn alt" id="eBil">📄 Ma fiche bilan (PDF)</button>
    <button class="btn or" id="eSms">📩 Envoyer mes résultats par SMS</button><button class="btn alt" id="eRetry">↻ Renvoyer par internet</button><button class="btn ghost" id="eNew">Nouvelle course</button></div></div>`;
  const upd = () => { const r = loadRun(); if (!$("#endSync")) return; $("#endSync").innerHTML = !r.a ? "Pas de connexion à la tablette prévue : <b>envoie tes résultats par SMS</b>." : r.queue.length ? `⚠ ${r.queue.length} donnée(s) pas encore reçue(s) par la tablette. Reste près du réseau ou envoie par SMS.` : "<b style='color:var(--green)'>✓ Résultats reçus par la tablette de l'enseignant.</b>"; };
  upd();
  const getTrace = async () => {
    const r = loadRun(); if (!r.a) throw new Error("Pas de connexion à la tablette prévue");
    await flush(true);
    let proj = E.mapProj || await DB.get("map:" + r.s); if (!proj) { const j = await apiCall(r.a, "getSession", { s: r.s }, 30000); proj = j.data?.proj; if (proj) DB.set("map:" + r.s, proj); }
    const t = await apiCall(r.a, "trace", { s: r.s, r: r.r }, 20000);
    return { proj, geo: t.geo, R: { ...r, c: r.c.k, ev: r.ev }, course: r.c, a: anaS(r), lesson: r.u };
  };
  $("#eAna").onclick = async () => { try { openAnalysis(await getTrace()); } catch (e) { toast(e.message, "ko"); } };
  $("#eBil").onclick = async () => { try { printBilans([await getTrace()]); } catch (e) { toast(e.message, "ko"); } };
  $("#eSms").onclick = () => { location.href = smsHref(r.t, smsResultat(smsRunData(loadRun()))); mutRun(r => r.smsSent = Date.now()); };
  $("#eRetry").onclick = async () => { await flush(true); upd(); };
  $("#eNew").onclick = () => { const r = loadRun(); if (r.queue.length && !r.smsSent && !confirm("Tes résultats ne sont pas encore arrivés. Continuer quand même ?")) return; mutRun(r => r.done = true); welcomeScreen(); };
  if (r.queue.length) flush(true).then(upd);
  clearInterval(E.endPoll); if (r.a && Date.now() - r.start < 4 * 3600000) E.endPoll = setInterval(() => { const x = loadRun(); if (!x || x.done || !$("#endSync")) return clearInterval(E.endPoll); flush(true).then(upd); }, 20000);
  const pend = (r.msgs || []).filter(m => !r.seenMsg[m.id] && m.type !== "recall"); if (pend.length) msgPopup(pend[pend.length - 1]);
}

// ---------- messages, rappel général, décisions de l'enseignant ----------
function sbeep(freqs) { try { const c = new (window.AudioContext || window.webkitAudioContext)(); freqs.forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.25, c.currentTime + i * .18); o.start(c.currentTime + i * .18); o.stop(c.currentTime + i * .18 + .15); }); } catch (e) {} }
function readMsg(mid) { mutRun(r => { if (!r.seenMsg[mid]) { r.seenMsg[mid] = 1; newEvent(r, "lu", { mid }); } }); flush(); }
function incoming(news, decs) {
  decs.forEach(({ e, v }) => { if (e.k !== "punch") return; if (v === false) feedback(false, `Balise ${e.n} : FAUSSE ✕`, "Ton enseignant t'indique que ce n'est pas la bonne balise. Reprends ta carte !", "", true); else feedback(true, `Balise ${e.n} : JUSTE ✓`, "Confirmé par ton enseignant. Continue !", "", true); });
  if (decs.length && $("#eSms")) endScreen();
  news.forEach(m => {
    if (m.type === "recall") { const r = loadRun(); if (r?.hereT && Date.now() - r.hereT < 30 * 60000) return; showRecall(m); }
    else { navigator.vibrate?.([200, 100, 200, 100, 200]); sbeep([660, 880]); if (!$("#targets")) msgPopup(m); }
  });
}
function msgPopup(m) {
  const d = openModal(`<h2>💬 Message de ton enseignant</h2><p style="font-size:1.3rem;font-weight:700">${esc(m.txt)}</p><button class="btn or" id="mOkB" style="width:100%">OK, j'ai lu</button>`, { sticky: true });
  $("#mOkB", d).onclick = () => { readMsg(m.id); d.close(); };
}
function showRecall(m) {
  $$("#recallOv").forEach(x => x.remove());
  navigator.vibrate?.([800, 200, 800, 200, 800]); sbeep([880, 660, 880, 660, 880]);
  const d = document.createElement("div"); d.id = "recallOv"; d.className = "modal"; d.style.alignItems = "center"; d.style.zIndex = 160;
  d.innerHTML = `<div class="sheet" style="max-width:460px;background:var(--red);color:#fff;text-align:center;border-radius:24px"><div style="font-size:3.5rem">📢</div><h2 style="margin:0">Retour au point !</h2><p style="font-size:1.25rem;font-weight:700">${esc(m.txt)}</p>
    <div style="display:flex;flex-direction:column;gap:10px"><button class="btn alt" id="rcOn" style="min-height:58px">🏃 J'ai compris, j'arrive</button><button class="btn green" id="rcHere" style="min-height:64px;font-size:1.2rem">✅ J'y suis</button></div></div>`;
  document.body.appendChild(d);
  const banner = () => { $$("#recallBan").forEach(x => x.remove()); const b = document.createElement("div"); b.id = "recallBan"; b.style.cssText = "position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:90;background:var(--red);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:700;box-shadow:0 6px 20px #0004";
    b.innerHTML = `<span style="flex:1">📢 Retour au point demandé</span><button class="btn green small" id="rcHere2">✅ J'y suis</button>`; document.body.appendChild(b); $("#rcHere2").onclick = here; };
  const here = () => { mutRun(r => { r.hereT = Date.now(); r.seenMsg[m.id] = 1; newEvent(r, "lu", { mid: m.id }); newEvent(r, "here", { mid: m.id }); }); flush(true); d.remove(); $$("#recallBan").forEach(x => x.remove()); toast("✓ Ton enseignant sait que tu es au point de retour", "ok"); };
  $("#rcOn", d).onclick = () => { mutRun(r => { if (!r.seenMsg[m.id]) { r.seenMsg[m.id] = 1; newEvent(r, "lu", { mid: m.id }); } }); flush(true); d.remove(); banner(); };
  $("#rcHere", d).onclick = here;
}

// Sans retour immédiat (option du parcours) : l'élève voit « enregistrée » tant que l'enseignant n'a pas notifié juste / fausse
const fbOn = r => !!r.c.fb;
function dispRun(r) { if (fbOn(r)) return r; const ev = {}; Object.values(r.ev).forEach(e => ev[e.id] = e.k === "punch" && r.dec[e.id] !== false ? { ...e, ok: true } : e); return { ...r, ev }; }
const anaS = r => analyseRun(dispRun(r), r.c, null, r.dec);

// Départ déclenché par la balise DÉPART scannée avec l'appareil photo
function startFromCode(code, via) {
  const r = loadRun(); if (!r || r.start) return; const c = r.c;
  if (codeHash(r.z, c.dn, code) !== c.hS) return toast("Code de départ incorrect", "ko");
  const l = c.prep && r.prepStart ? c.prep * 60000 - (Date.now() - r.prepStart) : 0;
  if (l > 0) return toast(`Encore ${fmtDur(l)} de préparation avant de partir`, "ko");
  mutRun(r => { r.start = Date.now(); newEvent(r, "start", { via }); }); stopLobby(); runScreen(); flush();
}

// ===== Scanner de QR code (caméra) =====
let jsQRLoading = null;
async function openScanner(onText) {
  const d = document.createElement("div"); d.id = "scanner";
  d.innerHTML = `<video playsinline muted></video><div class="frame"></div><div class="bar"><button class="btn alt" id="scClose">Fermer</button><button class="btn sun" id="scTorch" class="hidden">🔦</button></div><p style="position:absolute;top:12px;left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 4px #000">Vise le QR code de la balise</p>`;
  document.body.appendChild(d);
  const video = d.querySelector("video"); let stream = null, stop = false, det = null;
  const close = () => { stop = true; stream?.getTracks().forEach(t => t.stop()); d.remove(); };
  d.querySelector("#scClose").onclick = close;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false });
    video.srcObject = stream; await video.play();
    const track = stream.getVideoTracks()[0]; const caps = track.getCapabilities?.() || {};
    const tb = d.querySelector("#scTorch"); if (caps.torch) { let on = false; tb.onclick = () => { on = !on; track.applyConstraints({ advanced: [{ torch: on }] }); }; } else tb.remove();
  } catch (e) { close(); toast("Caméra indisponible : " + (e.name === "NotAllowedError" ? "autorise l'accès à la caméra, ou utilise « Saisir un code »." : e.message), "ko"); return; }
  if ("BarcodeDetector" in window) { try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes("qr_code")) det = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) {} }
  if (!det && !window.jsQR) { try { jsQRLoading = jsQRLoading || loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"); await jsQRLoading; } catch (e) { toast("Lecteur QR indisponible hors connexion : utilise l'appareil photo du téléphone ou « Saisir un code ».", "ko"); } }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  const loop = async () => {
    if (stop) return;
    try {
      let txt = null;
      if (det) { const r = await det.detect(video); if (r[0]) txt = r[0].rawValue; }
      else if (window.jsQR && video.videoWidth) { const s = Math.min(1, 800 / video.videoWidth); cv.width = video.videoWidth * s; cv.height = video.videoHeight * s; cx.drawImage(video, 0, 0, cv.width, cv.height); const im = cx.getImageData(0, 0, cv.width, cv.height); const r = jsQR(im.data, im.width, im.height, { inversionAttempts: "dontInvert" }); if (r) txt = r.data; }
      if (txt) { navigator.vibrate?.(60); if (onText(txt) !== false) return close(); await sleep(1200); }
    } catch (e) {}
    setTimeout(loop, 180);
  };
  loop();
}

// ===== Navigation =====
function showScreen(id) { ["home", "prof", "eleve"].forEach(s => $("#" + s).classList.toggle("hidden", s !== id)); window.scrollTo(0, 0); }
function showHome() {
  showScreen("home"); $("#ver").textContent = APP_VERSION;
  const r = loadRun();
  $("#homeResume").innerHTML = r && r.start && !r.finish && !r.abandon ? `<div class="panel" style="background:var(--orange);color:#fff"><b>Course en cours : ${esc(r.c.k)} · ${esc(r.nom)}</b> <button class="btn small alt" id="hRes">Reprendre</button></div>` : "";
  $("#hRes") && ($("#hRes").onclick = () => studentEntry());
}
function route() {
  const h = location.hash;
  let m = h.match(/#go=([\w-]+)/);
  if (m) { try { const g = b64d(m[1]); return studentEntry(g); } catch (e) { toast("QR code de départ illisible", "ko"); } }
  m = h.match(/#b=([\w%-]+)\.([A-Za-z0-9]+)/);
  if (m) {
    history.replaceState(null, "", location.pathname);
    const r = loadRun();
    if (r && r.start && !r.finish && !r.abandon) { showScreen("eleve"); runScreen(); setTimeout(() => handlePunch(decodeURIComponent(m[1]), m[2].toUpperCase(), "photo"), 300); return; }
    if (r && r.s && !r.start && String(decodeURIComponent(m[1])) === String(r.c.dn)) { showScreen("eleve"); readyScreen(); setTimeout(() => startFromCode(m[2].toUpperCase(), "photo"), 300); return; }
    showScreen("eleve"); welcomeScreen(); toast("Balise " + decodeURIComponent(m[1]) + " : ouvre d'abord ton parcours avec le QR de départ.", "ko"); return;
  }
  const r = loadRun();
  if (/#eleve/.test(h)) { history.replaceState(null, "", location.pathname); return studentEntry(); }
  if (r && r.start && !r.finish && !r.abandon) return studentEntry();
  showHome();
}
$("#goEleve").onclick = () => studentEntry();
$("#goProf").onclick = () => tpw() ? openProf() : profLogin();
$("#profHome").onclick = () => { stopMyPos(); showHome(); };
$$("#ptabs .tab").forEach(b => b.onclick = () => setPTab(b.dataset.t));
window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
