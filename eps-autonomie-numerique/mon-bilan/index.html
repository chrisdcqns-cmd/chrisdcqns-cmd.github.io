<html lang="fr">
<head>

<style>
  :root { --app: #0369A1; --ok: #1E6B3A; --no: #B3261E; --line: #E6E1D6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: #F5F3EE; color: #14171C; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.4; }
  .bar { background: #14171C; color: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 16px; box-shadow: inset 0 -4px 0 var(--app); }
  .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--app); display: grid; place-items: center; flex: none; }
  .bar b { font-size: 20px; } .bar small { color: #A9AEB8; display: block; font-size: 13px; }
  .bar button { margin-left: auto; width: auto; height: 40px; margin-top: 0; background: none; border: 1.5px solid #3A3F47; color: #D5D8DE; font-size: 14px; border-radius: 10px; padding: 0 12px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 90px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 12px; }
  h1 { font-size: 22px; margin: 0 0 6px; } h2 { font-size: 18px; margin: 0 0 8px; }
  .mut { color: #6A6F78; font-size: 14px; margin: 4px 0; }
  input#code { width: 100%; height: 60px; border: 2px solid var(--line); border-radius: 14px; font: 800 26px ui-monospace, monospace; letter-spacing: .3em; text-align: center; text-transform: uppercase; background: #FBFAF7; }
  input:focus { outline: none; border-color: var(--app); }
  :focus-visible { outline: 3px solid #1F5F8B; outline-offset: 2px; }
  label.l { display: block; font-weight: 800; margin: 10px 0 6px; }
  button { min-height: 52px; border-radius: 14px; border: 0; background: var(--app); color: #fff; font: 800 17px system-ui, sans-serif; padding: 0 18px; cursor: pointer; width: 100%; margin-top: 12px; }
  button.s { background: #fff; color: #14171C; border: 2px solid var(--line); min-height: 46px; font-size: 15px; }
  button[disabled] { opacity: .5; }
  .err { color: var(--no); font-weight: 700; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
  .tabs button { margin: 0; background: #fff; color: #14171C; border: 2px solid var(--line); }
  .tabs button.on { background: #14171C; border-color: #14171C; color: #fff; }
  .tk { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; color: #14171C; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 8px; min-height: 64px; font-weight: 700; }
  .tk .i { font-size: 24px; flex: none; } .tk span.t { flex: 1; } .tk small { display: block; color: #6A6F78; font-weight: 500; }
  .tk.done { background: #EAF5EC; border-color: var(--ok); }
  .act { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; color: #14171C; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 8px; min-height: 64px; }
  .act b { font-size: 17px; display: block; } .act small { color: #6A6F78; }
  .bar2 { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 6px 0 10px; } .bar2 i { display: block; height: 100%; background: var(--ok); }
  .q { margin: 10px 0; } .q b { display: block; font-size: 13px; color: #6A6F78; }
  .kp { display: flex; gap: 8px; flex-wrap: wrap; } .kp span { background: #F6F3EC; border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 700; }
  .qt { font-size: 20px; font-weight: 800; margin: 8px 0 12px; }
  .ch { background: #fff; color: #14171C; border: 2px solid var(--line); text-align: left; font-size: 17px; margin-top: 8px; padding: 12px 14px; }
  .ch.ok { border-color: var(--ok); background: #EAF5EC; } .ch.ko { border-color: var(--no); background: #FBEDEC; }
  .fb { border-radius: 12px; padding: 10px 12px; margin: 10px 0 0; font-weight: 700; } .fb.ok { background: #EAF5EC; color: var(--ok); } .fb.ko { background: #FBEDEC; color: var(--no); } .fb span { display: block; color: #14171C; font-weight: 500; }
  select.sel { width: 100%; min-height: 52px; border: 2px solid var(--line); border-radius: 14px; padding: 0 12px; font: 700 17px system-ui, sans-serif; background: #fff; color: #14171C; }
  .score { font-size: 48px; font-weight: 900; text-align: center; margin: 6px 0; }
  #st { position: fixed; left: 0; right: 0; bottom: 0; background: #14171C; color: #fff; font-size: 14px; font-weight: 700; text-align: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---- Mode ordinateur : la liste passe sur 2 colonnes, les vues détail restent sur 1 ---- */
  @media (min-width: 880px) {
    main { max-width: 900px; }
    #login { max-width: 560px; margin-left: auto; margin-right: auto; }
    #res:has(.tabs) { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; align-items: start; }
    #res:has(.tabs) .tabs { grid-column: 1 / -1; margin: 0 0 4px; }
    #res:has(.tabs) > .card { grid-column: 1 / -1; }
    #res:has(.tabs) .tk, #res:has(.tabs) .act { margin: 0; }
  }
</style>
</head>
<body>
<div class="bar"><div class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2M10 7h4M10 10.5h4"/></svg></div><div><b>Mon espace EPS</b><small id="who">À faire · mes activités · mes bilans</small></div><button type="button" id="cult" hidden aria-label="Culture des activités" title="Culture des activités" style="margin-left:auto;min-width:44px;min-height:44px;border-radius:10px;border:1.5px solid #3A3F47;background:none;color:#fff;font-size:18px">📖</button><button type="button" id="out" hidden>Quitter</button></div>
<main>
  <div class="card" id="login">
    <h1>Bonjour !</h1>
    <p class="mut">Entre le code personnel donné par ton enseignant. Il est à toi : ne le partage pas.</p>
    <label class="l" for="code">Mon code (6 caractères)</label>
    <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    <button type="button" id="go">Ouvrir mon espace</button>
    <p id="msg" class="mut" role="status" aria-live="polite"></p>
  </div>
  <div id="res"></div>
</main>
<div id="st" hidden role="status" aria-live="polite"></div>
<script src="../eps-culture.js"></script>
<script>
/* Espace élève (téléphone). Tout arrive chiffré avec le code personnel : fiches PDF publiées par les applis ({app, classe, date, pdf})
   et l'espace publié par l'enseignant ({kind:"espace", eleve, classe, todo, quiz, acts, rid, rk}). Les retours (quiz faits, tâches cochées)
   repartent chiffrés avec la clé rk dans le dépôt « dan|E<rid> » du script commun. Le code n'est jamais gardé sur le téléphone. */
(function () {
  var S = (/[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash) || [])[1] || "";
  var url = S ? "https://script.google.com/macros/s/" + S + "/exec" : (function () { var m = /[#&]u=([^&]+)/.exec(location.hash), u = m ? decodeURIComponent(m[1]) : ""; return /^http:\/\/(127\.0\.0\.1|localhost):\d+\//.test(u) && /^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? u : ""; })() /* essais automatiques seulement */;
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), res = $("res"), ESP = null, PDF = [], AUTO = [], ME = { quiz: {}, fait: {}, obs: {}, at: 0 }, HID = "", TAB = "todo", RUN = null, ACT = null, MIS = null;
  /* 👁 Aperçu enseignant (28/11/2026, demande de l'enseignant : voir l'espace EPS d'un élève depuis la console ou une tablette, avec un élève fictif
     ou en choisissant classe + élève, sans son code). ?apercu=1 (tablette : bouton de la page Espace élève) ou ?console=1 (outil de la console).
     Réservé au mode enseignant (code à 4 chiffres). Lecture seule : rien n'est envoyé (pas de dépôt dan|E…) ni gardé sur l'appareil. */
  var APERCU = /[?&](apercu|console)=1\b/.test(location.search), SIMU = null;
  if (!url && !APERCU) msg.innerHTML = '<span class="err">Lien incomplet : ouvre le lien envoyé par ton enseignant (sur Pronote).</span>';
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function flat(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, ""); }
  function b64url(u8) { var x = ""; for (var i = 0; i < u8.length; i += 0x8000) x += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(x).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function unb64(t) { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; var s = atob(t), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function jsonp(params) { return new Promise(function (ok, ko) { var cb = "mb" + Date.now() + Math.floor(Math.random() * 1e4), sc = document.createElement("script"), t = setTimeout(function () { fin(null); }, 30000);
    function fin(d) { clearTimeout(t); try { delete window[cb]; } catch (e) {} sc.remove(); d ? ok(d) : ko(new Error("connexion")); }
    window[cb] = fin; sc.onerror = function () { fin(null); }; sc.src = url + "?" + Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&") + "&callback=" + cb; document.head.appendChild(sc); }); }
  async function hid(code) { return b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("eps-bilan|" + code)))).slice(0, 22); }
  async function key(code, h) { var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: new TextEncoder().encode("eps-bilan|" + h), iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function okQ(q) { return q && typeof q.t === "string" && Array.isArray(q.c) && q.ok >= 0 && q.ok < q.c.length; }

  /* ---- retours vers l'enseignant ---- */
  function meLoad() { try { var v = JSON.parse(localStorage.getItem("eps.espace.me." + HID) || "null"); if (v && typeof v === "object") ME = { quiz: v.quiz || {}, fait: v.fait || {}, obs: v.obs || {}, at: +v.at || 0 }; } catch (e) {} }
  var sendT = 0, pend = false, busy = false, encore = false;
  function st(t, ms) { var e = $("st"); e.textContent = t; e.hidden = !t; if (ms) setTimeout(function () { if (e.textContent === t) e.hidden = true; }, ms); }
  function meSave() { ME.at = Date.now(); if (APERCU) return; try { localStorage.setItem("eps.espace.me." + HID, JSON.stringify(ME)); } catch (e) {} pend = true; clearTimeout(sendT); sendT = setTimeout(envoyer, 600); }
  /* un seul envoi à la fois : une saisie faite pendant l'envoi relance un envoi juste après (sinon le contrôle comparerait deux versions) */
  async function envoyer() { if (APERCU || !ESP || !ESP.rid || !ESP.rk || !pend) return; if (busy) { encore = true; return; } busy = true; encore = false; var vu = ME.at; st("Envoi à ton enseignant…");
    try { var k = await crypto.subtle.importKey("raw", unb64(ESP.rk), "AES-GCM", false, ["encrypt"]), iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, new TextEncoder().encode(JSON.stringify(ME)))), all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
      var x = b64url(all), dk = "dan|E" + ESP.rid; if (x.length > 7900) throw new Error("trop long");
      await fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ drop: { k: dk, x: x } }) });
      var ok = false; for (var i = 0; i < 3 && !ok; i++) { await new Promise(function (r) { setTimeout(r, 1200); }); try { ok = (await jsonp({ dropchk: dk })).drop === x.slice(0, 16); } catch (e) {} }
      if (ok && ME.at === vu) { pend = false; st("✓ Envoyé à ton enseignant", 2500); } else if (!ok && !encore) { st("Pas encore envoyé : nouvel essai dans un instant.", 4000); setTimeout(function () { if (pend) envoyer(); }, 15000); }
    } catch (e) { st("Pas encore envoyé : nouvel essai au retour du réseau.", 4000); }
    busy = false; if (pend && (encore || ME.at !== vu)) { encore = false; envoyer(); } }
  window.addEventListener("online", function () { if (pend) envoyer(); });

  /* ---- connexion ---- */
  /* lit et déchiffre tout ce qui est publié pour un code : {h, out} (out = null : rien pour ce code) */
  async function lire(code) {
    var h = await hid(code), r = await jsonp({ bil: h });
    if (r.bilErr) throw new Error("serveur");
    var L = r.bil || []; if (!L.length) return { h: h, out: null };
    var k = await key(code, h), out = [];
    for (var i = 0; i < L.length; i++) { try { var b = unb64(L[i].parts.join("")), pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, k, b.slice(12)); out.push(JSON.parse(new TextDecoder().decode(pt))); } catch (e) {} }
    if (!out.length) throw new Error("code");
    return { h: h, out: out }; }
  async function go() {
    var code = $("code").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 6) { msg.innerHTML = '<span class="err">Le code a 6 caractères.</span>'; return; }
    if (!url) return;
    $("go").disabled = true; msg.textContent = "Ouverture de ton espace…";
    try {
      var lu = await lire(code), h = lu.h, out = lu.out;
      if (!out) { msg.innerHTML = '<span class="err">Rien pour ce code. Vérifie-le (O et 0, I et 1 n\'existent pas dans les codes) ou demande à ton enseignant.</span>'; $("go").disabled = false; return; }
      ESP = out.filter(function (o) { return o && o.kind === "espace"; })[0] || null; PDF = out.filter(function (o) { return o && o.pdf; }); AUTO = out.filter(function (o) { return o && o.kind === "auto" && /^https?:\/\//.test(String(o.url || "")); });
      HID = h; meLoad(); msg.textContent = ""; $("code").value = ""; $("login").hidden = true; $("out").hidden = false;
      $("who").textContent = ((ESP && ESP.eleve) || (PDF[0] && PDF[0].eleve) || (AUTO[0] && AUTO[0].eleve) || "") + ((ESP && ESP.classe) ? " · " + ESP.classe : "");
      TAB = (ESP && ((ESP.todo || []).length || (ESP.mis || []).length)) || autos().length ? "todo" : "acts"; draw(); if (pend) envoyer();
    } catch (e) { msg.innerHTML = '<span class="err">' + (e.message === "connexion" ? "Pas de connexion. Réessaie." : "Impossible d'ouvrir ton espace avec ce code.") + "</span>"; }
    $("go").disabled = false;
  }
  $("go").onclick = go; $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  $("out").onclick = function () { ESP = null; PDF = []; AUTO = []; RUN = null; ACT = null; MIS = null; CUL = false; try { $("cult").hidden = true; } catch (e) {} res.innerHTML = ""; $("login").hidden = false; $("out").hidden = true; $("who").textContent = "À faire · mes activités · mes bilans"; };

  /* ---- affichage : deux onglets seulement ---- */
  function acts() { var A = (ESP && Array.isArray(ESP.acts)) ? ESP.acts.slice() : []; PDF.forEach(function (p) { if (!A.some(function (a) { return flat(a.nom) === flat(p.app); })) A.push({ nom: p.app, lec: 0, pc: null, n: 0, comm: "", apr: "", apm: "" }); }); return A; }
  function blob(o) { return new Blob([unb64(String(o.pdf).replace(/\+/g, "-").replace(/\//g, "_"))], { type: "application/pdf" }); }
  /* 📖 Culture des activités (demande de l'enseignant, 28/11/2026) : une petite icône dans le bandeau, à consulter quand on veut ; rien dans « À faire ».
     Les activités de l'élève d'abord, dépliables ; le texte vient d'eps-culture.js (repères généraux, les mêmes que dans les applis). */
  var CUL = false;
  function culture() { var A = acts().map(function (a) { return window.EPSCULT ? EPSCULT.dossier(a.nom) : ""; }).filter(function (d, i, T) { return d && T.indexOf(d) === i; }), tous = window.EPSCULT ? EPSCULT.noms().map(function (x) { return x.dir; }) : [];
    var L = A.concat(tous.filter(function (d) { return A.indexOf(d) < 0; }));
    var h = '<button type="button" class="s" id="cb" style="margin:0 0 12px">← Retour</button><div class="card"><h2 style="margin:0 0 4px">📖 Culture des activités</h2><p class="mut" style="margin:0">Quelques repères sur chaque activité : d\'où elle vient, ses règles, où la pratiquer.</p></div>' +
      L.map(function (d, i) { return '<details class="card"' + (i === 0 && A.length ? " open" : "") + '><summary style="cursor:pointer;font-weight:800;font-size:18px;min-height:44px;display:flex;align-items:center">' + esc(EPSCULT.data[d].nom) + (A.indexOf(d) >= 0 ? ' <small class="mut" style="font-weight:600;margin-left:8px">une de mes activités</small>' : "") + '</summary><div style="margin-top:10px">' + EPSCULT.html(d) + "</div></details>"; }).join("");
    res.innerHTML = h; var b = document.getElementById("cb"); if (b) b.onclick = function () { CUL = false; draw(); window.scrollTo(0, 0); }; }
  function draw() { var cu = document.getElementById("cult"); if (cu) { cu.hidden = !window.EPSCULT; cu.onclick = function () { CUL = true; RUN = null; ACT = null; MIS = null; draw(); window.scrollTo(0, 0); }; }
    if (CUL && window.EPSCULT) return culture();
    if (RUN) return quiz(); if (ACT) return fiche(); if (MIS) return mission();
    var AU = autos(), MI = (ESP && Array.isArray(ESP.mis)) ? ESP.mis : [], T = (ESP && ESP.todo) || [], reste = AU.filter(function (a) { return !ME.fait["auto|" + a.app]; }).length + T.filter(function (t) { return !fait(t); }).length + MI.filter(function (m) { return !ME.obs[m.id]; }).length;
    var h = '<div class="tabs" role="tablist"><button type="button" role="tab" data-tab="todo" class="' + (TAB === "todo" ? "on" : "") + '" aria-selected="' + (TAB === "todo") + '">À faire' + (reste ? " (" + reste + ")" : "") + '</button><button type="button" role="tab" data-tab="acts" class="' + (TAB === "acts" ? "on" : "") + '" aria-selected="' + (TAB === "acts") + '">Mes activités</button></div>';
    if (TAB === "todo") { MI.forEach(function (m, i) { var d = !!ME.obs[m.id]; h += '<button type="button" class="tk' + (d ? " done" : "") + '" data-mi="' + i + '"><span class="i" aria-hidden="true">' + (d ? "✅" : "🎯") + '</span><span class="t">' + esc(m.t) + "<small>Ma mission du jour · " + (m.ty === "cpt" ? "j'observe et je compte" : "ma fiche de rôle") + (d ? " · envoyée" : "") + "</small></span></button>"; });
      AU.forEach(function (a, i) { var d = !!ME.fait["auto|" + a.app]; h += '<button type="button" class="tk' + (d ? " done" : "") + '" data-au="' + i + '"><span class="i" aria-hidden="true">' + (d ? "✅" : "🎯") + '</span><span class="t">M\'auto-positionner en ' + esc(a.act || a.app) + "<small>" + (d ? "Ouvert · rouvrir ma grille" : "Ouvrir ma grille") + (a.jusqua ? " · jusqu'au " + esc(a.jusqua.split("-").reverse().join("/")) : "") + "</small></span></button>"; });
      if (!T.length && !MI.length && !AU.length) h += '<div class="card"><p class="mut">Rien à faire pour l\'instant. Reviens quand ton enseignant te le dira.</p></div>';
      T.forEach(function (t, i) { var d = fait(t), q = t.ty === "quiz" ? ME.quiz[t.qz] : null;
        h += '<button type="button" class="tk' + (d ? " done" : "") + '" data-k="' + i + '"><span class="i" aria-hidden="true">' + (d ? "✅" : t.ty === "quiz" ? "❓" : t.ty === "lien" ? "▶️" : "✏️") + '</span><span class="t">' + esc(t.t || "") + "<small>" + (t.ty === "quiz" ? (q ? "Mon score : " + q.s + " / " + q.n + " · recommencer" : "Répondre au quiz") : t.ty === "lien" ? (d ? "Vu · revoir" : "Ouvrir") : (d ? "Fait · toucher pour annuler" : "Toucher quand c'est fait")) + "</small></span></button>"; }); }
    else { var A = acts(); if (!A.length) h += '<div class="card"><p class="mut">Tes activités apparaîtront ici après tes premières leçons.</p></div>';
      A.forEach(function (a, i) { h += '<button type="button" class="act" data-a="' + i + '"><span style="flex:1"><b>' + esc(a.nom) + "</b><small>" + (a.pc != null ? "Réussite : " + a.pc + " %" : a.lec ? a.lec + " leçon" + (a.lec > 1 ? "s" : "") : PDF.some(function (p) { return flat(p.app) === flat(a.nom); }) ? "Bilan disponible" : a.soon ? "À venir" : "") + '</small></span><span aria-hidden="true" style="font-weight:900;color:var(--app)">›</span></button>'; }); }
    res.innerHTML = h;
    res.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { TAB = b.dataset.tab; draw(); }; });

  function quiz() { var R = RUN, h;

  /* ---- Simulation (démonstration). N'accède à AUCUNE donnée réelle et ne contacte pas le réseau.

  /* ---- 👁 Aperçu enseignant : choix « élève fictif » ou classe + élève (code retrouvé dans eps.codes.v1, partagé entre les tablettes enseignant) ---- */
  (function () {
    if (!APERCU) return;

    function prof() { try { return Date.now() < +(localStorage.getItem("eps.teach.until") || 0); } catch (e) { return false; } }

    function nk(t) { return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean).sort().join(" "); }

    function codeDe(cls, full) { var I = (jget("eps.codes.v1", {}) || {}).items || {}, r = ""; Object.keys(I).forEach(function (id) { var o = I[id]; if (o && !o.del && o.c && flat(o.cls) === flat(cls) && nk(o.n) === nk(full)) r = String(o.c); }); return r; }
    /* ce que l'élève a déjà fait (retours relevés par l'enseignant) : tâches, missions, quiz */
    function etat(cls, full) { var M = { quiz: {}, fait: {}, obs: {}, at: 0 }, E = (jget("eps.espace.v1", {}) || {}).items || {}, Q = (jget("eps.quiz.v1", {}) || {}).items || {};

      Object.keys(Q).forEach(function (k) { var o = Q[k]; if (o && !o.del && o.k === "res" && o.qz && flat(o.cls) === flat(cls) && nk(o.nom) === nk(full)) M.quiz[o.qz] = { s: o.s, n: o.n, a: o.a || [], d: o.d, nb: o.nb }; });
      return M; }
    var SEL = { cls: (/[?&]cls=([^&]+)/.exec(location.search) || [])[1] ? decodeURIComponent(/[?&]cls=([^&]+)/.exec(location.search)[1]) : "", el: "" };
    function bandeau(nom) { var e = $("st"); e.hidden = false; e.style.background = "#0369A1"; e.textContent = "👁 Aperçu enseignant · " + nom + " · rien n'est envoyé ni enregistré"; }
    function choisir() {

      $("who").textContent = "Aperçu enseignant · ce que voit l'élève";

      if (P.indexOf(SEL.el) < 0) SEL.el = P[0] || "";
      res.innerHTML = '<div class="card"><h1>👁 Espace EPS d\'un élève</h1><p class="mut">Tu vois exactement ce que voit l\'élève, sans son code. Rien n\'est envoyé ni enregistré.</p>' +
        '<button type="button" id="ap-demo">🧪 Élève fictif (démonstration)</button></div>' +
        '<div class="card"><h2>Un de mes élèves</h2>' + (C.length ?
          '<label class="l" for="ap-c">Classe</label><select class="sel" id="ap-c">' + C.map(function (o) { return "<option" + (o.nom === SEL.cls ? " selected" : "") + ">" + esc(o.nom) + "</option>"; }).join("") + "</select>" +
          '<label class="l" for="ap-e">Élève</label><select class="sel" id="ap-e">' + P.map(function (n) { return '<option value="' + esc(n) + '"' + (n === SEL.el ? " selected" : "") + ">" + esc(n) + (codeDe(SEL.cls, n) ? "" : " · pas encore de code") + "</option>"; }).join("") + "</select>" +
          '<button type="button" id="ap-go"' + (P.length ? "" : " disabled") + '>Ouvrir son espace</button>' : '<p class="mut">Aucune liste de classe sur cet appareil.</p>') +
        '<p id="ap-m" class="mut" role="status" aria-live="polite"></p></div>';

      var sc = $("ap-c"), se = $("ap-e"), bg = $("ap-go");

      if (se) se.onchange = function () { SEL.el = se.value; };

    }
    async function ouvrir(cls, full) {
