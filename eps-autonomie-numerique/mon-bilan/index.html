<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mon bilan d'EPS</title>
<style>
  :root { --app: #14213D; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F5F3EE; color: #14171C; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { background: #14171C; color: #fff; display: flex; align-items: center; gap: 12px; padding: 12px 16px; box-shadow: inset 0 -4px 0 var(--app); }
  .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--app); display: grid; place-items: center; }
  .bar b { font-size: 20px; } .bar small { color: #A9AEB8; display: block; font-size: 13px; }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 60px; }
  .card { background: #fff; border: 1px solid #E6E1D6; border-radius: 18px; padding: 18px; margin: 0 0 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; } p { line-height: 1.45; }
  .mut { color: #6A6F78; font-size: 14px; }
  input { width: 100%; height: 60px; border: 2px solid #E6E1D6; border-radius: 14px; font: 800 28px ui-monospace, monospace; letter-spacing: .3em; text-align: center; text-transform: uppercase; background: #FBFAF7; }
  input:focus { outline: none; border-color: var(--app); }
  :focus-visible { outline: 3px solid #1F5F8B; outline-offset: 2px; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  label.l { display: block; font-weight: 800; margin: 10px 0 6px; }
  @media (max-width: 420px) { main { padding: 16px 12px 80px; } .card { padding: 14px; } button.s { width: 100%; margin: 8px 0 0; height: 48px; } input { font-size: 24px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  button { height: 52px; border-radius: 14px; border: 0; background: var(--app); color: #fff; font: 800 17px system-ui, sans-serif; padding: 0 18px; cursor: pointer; width: 100%; margin-top: 12px; }
  button.s { background: #fff; color: #14171C; border: 2px solid #E6E1D6; width: auto; height: 44px; margin: 8px 8px 0 0; font-size: 15px; }
  .b { border-left: 6px solid var(--c, #14213D); }
  .err { color: #B3261E; font-weight: 700; }
</style>
</head>
<body>
<div class="bar"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/></svg></div><div><b>Mon bilan d'EPS</b><small>Fiches d'évaluation</small></div></div>
<main>
  <div class="card" id="login">
    <h1>Entre ton code</h1>
    <p class="mut">Ton professeur t'a donné un code personnel de 6 caractères. Il est le même pour toutes les activités. Ne le donne à personne.</p>
    <label class="l" for="code">Mon code personnel</label>
    <input id="code" maxlength="6" aria-describedby="msg" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="······">
    <button id="go">Voir mes bilans</button>
    <p id="msg" class="mut" role="status" aria-live="polite"></p>
  </div>
  <div id="res" aria-live="polite"></div>
</main>
<script>
(function () {
  var S = (/[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash) || [])[1] || "";
  var url = S ? "https://script.google.com/macros/s/" + S + "/exec" : "";
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), res = $("res");
  if (!url) msg.innerHTML = '<span class="err">Lien incomplet : ouvre le lien envoyé par ton professeur (sur Pronote).</span>';
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function b64url(u8) { var x = ""; for (var i = 0; i < u8.length; i += 0x8000) x += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(x).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function unb64(t) { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; var s = atob(t), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function jsonp(params) { return new Promise(function (ok, ko) { var cb = "mb" + Date.now() + Math.floor(Math.random() * 1e4), sc = document.createElement("script"), t = setTimeout(function () { fin(null); }, 30000);
    function fin(d) { clearTimeout(t); try { delete window[cb]; } catch (e) {} sc.remove(); d ? ok(d) : ko(new Error("connexion")); }
    window[cb] = fin; sc.onerror = function () { fin(null); }; sc.src = url + "?" + Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&") + "&callback=" + cb; document.head.appendChild(sc); }); }
  async function hid(code) { return b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("eps-bilan|" + code)))).slice(0, 22); }
  async function key(code, h) { var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: new TextEncoder().encode("eps-bilan|" + h), iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); }
  async function go() {
    var code = $("code").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 6) { msg.innerHTML = '<span class="err">Le code a 6 caractères.</span>'; return; }
    if (!url) return;
    $("go").disabled = true; msg.textContent = "Recherche de tes bilans…"; res.innerHTML = "";
    try {
      var h = await hid(code), r = await jsonp({ bil: h });
      if (r.bilErr) throw new Error("serveur");
      var L = r.bil || [];
      if (!L.length) { msg.innerHTML = '<span class="err">Aucun bilan pour ce code. Vérifie-le (O et 0, I et 1 n\'existent pas dans les codes) ou demande à ton professeur.</span>'; $("go").disabled = false; return; }
      var k = await key(code, h), out = [];
      for (var i = 0; i < L.length; i++) { try { var b = unb64(L[i].parts.join("")), pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, k, b.slice(12)); out.push(JSON.parse(new TextDecoder().decode(pt))); } catch (e) {} }
      if (!out.length) throw new Error("code");
      msg.textContent = "";
      res.innerHTML = '<p class="mut">Bonjour ' + esc(out[0].eleve) + ' ! Voici tes fiches d\'évaluation.</p>' + out.map(function (o, i) {
        return '<div class="card b" style="--c:' + esc(o.color || "#14213D") + '"><b style="font-size:18px">' + esc(o.app) + '</b><div class="mut">' + esc(o.classe) + " · publiée le " + esc(o.date) + '</div><button class="s" data-o="' + i + '" aria-label="Ouvrir ma fiche ' + esc(o.app) + '">📄 Ouvrir ma fiche</button><button class="s" data-d="' + i + '" aria-label="Télécharger ma fiche ' + esc(o.app) + '">⬇ Télécharger</button></div>'; }).join("");
      function blob(o) { var u = unb64(o.pdf.replace(/\+/g, "-").replace(/\//g, "_")); return new Blob([u], { type: "application/pdf" }); }
      res.querySelectorAll("[data-o]").forEach(function (b) { b.onclick = function () { window.open(URL.createObjectURL(blob(out[+b.dataset.o])), "_blank"); }; });
      res.querySelectorAll("[data-d]").forEach(function (b) { b.onclick = function () { var o = out[+b.dataset.d], a = document.createElement("a"); a.href = URL.createObjectURL(blob(o)); a.download = "Bilan_" + o.app.replace(/[^A-Za-z0-9]+/g, "_") + ".pdf"; document.body.appendChild(a); a.click(); a.remove(); }; });
    } catch (e) { msg.innerHTML = '<span class="err">' + (e.message === "connexion" ? "Pas de connexion. Réessaie." : "Impossible d'ouvrir tes bilans avec ce code.") + "</span>"; }
    $("go").disabled = false;
  }
  $("go").onclick = go; $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
})();
</script>
<!-- 🔄 bouton Mettre à jour (comme dans les autres applis) -->
<button type="button" id="eps-upd" aria-label="Mettre à jour" title="Mettre à jour" onclick="(async()=>{this.disabled=true;try{if(navigator.serviceWorker){const R=await navigator.serviceWorker.getRegistrations();await Promise.race([Promise.all(R.map(r=>r.update().catch(()=>{}))),new Promise(r=>setTimeout(r,4000))])}}catch(e){}location.reload()})()" style="position:fixed;z-index:2147483300;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(12px + env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:0;padding:0;background:rgba(31,95,139,.9);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 4M20 20v-4h-4"/></svg></button>
</body>
</html>
