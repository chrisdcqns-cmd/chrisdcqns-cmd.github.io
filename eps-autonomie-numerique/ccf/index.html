<script>
/* ================== PROTOCOLES (textes officiels de l'établissement, recopiés à la lettre ; modifiables dans Réglages → Modifier le protocole) ==================
   Structure commune (Bac pro et, plus tard, Bac général) :
   {id, act, voie, apsa, ca, session, etab, ref, oe, principe:[…],
    fin:{titre, afl:[{id, code, pts, off, decl, regles:[…], ajust, degAj, auto, deg:[{t, min, max}×4]}]},
    fil:{titre, pts, reps:['4-4','6-2','2-6'], bareme:{2:[…4],4:[…4],6:[…4]}, retenus:[idX,idY], rappel, note, afl:[{id, code, off, decl, regles, deg:[t×4]}]},
    jeu:{paramètres de la forme de pratique}} */
const RAPPEL_PRO="Notée sur 8 points, l'évaluation au fil de la séquence porte sur 2 AFLP retenus par l'équipe pédagogique parmi les 4. La répartition des 8 points est au choix des élèves avec trois possibilités de répartition : AFLX = 4 pts / AFLY = 4 pts ; AFLX = 6 pts / AFLY = 2 pts ; AFLX = 2 pts / AFLY = 6 pts.\nAvant l'évaluation de fin de séquence, le candidat choisit la répartition des points qu'il souhaite attribuer pour chacun de ces 2 AFLP. Le passage du degré 2 au degré 3 permet l'attribution de la moitié des points dévolus à l'AFLP. Le choix doit être un objet d'enseignement travaillé au fil de la séquence.";
const FIL_NOTE_PRO="Seuls les deux AFLP Bac Pro retenus par l'équipe pédagogique sont évalués pour constituer cette partie de la note sur 8 points. Les points de chaque AFLP Bac Pro seront répartis sur les 4 degrés de positionnement. Les « points » dans les tableaux sont à définir par l'équipe EPS.";
const BAREME_PRO={2:[0.5,1,1.5,2],4:[0.5,1.5,2.5,4],6:[0.5,2,4,6]};
const R7=[[0,1],[1.5,3],[3.5,5],[5.5,7]],R5=[[0,0.5],[1,2],[2.5,4],[4.5,5]];
const dg=(T,R)=>T.map((t,i)=>({t,min:R[i][0],max:R[i][1]}));
const AJUST_P1="Pour l'AFLP Bac Pro 1, l'évaluateur positionne l'élève dans un degré puis ajuste la note en fonction du niveau de difficulté/complexité de la prestation réalisée par l'élève (exemples : nombre d'éléments A, B, C ou D en gymnastique ou acrosport, nombre ou variété des paramètres du mouvement ou procédés de composition en danse).";
const FIN_TITRE="Situation d'évaluation de fin de séquence",FIL_TITRE="Évaluation au fil de la séquence";
const ETAB0="LP Camille Claudel · Fourmies";

const PROTOS={
'esc-pro':{id:'esc-pro',act:'esc',voie:'pro',apsa:'Escalade',ca:'CA2',session:'2024',etab:ETAB0,ref:'FCE_BacPro_CA2_Escalade_LP_CamilleClaudel_Fourmies_0590083V_Session_2024',
 oe:"Sur 2 voies différentes, marquer collectivement de manière sécuritaire le plus de points possibles en déterminant différents paramètres : hauteur et prises. Grimper de manière dynamique grâce à une poussée des jambes efficiente afin d'atteindre ses objectifs.",
 principe:["Équipe de 4 hétérogène : grimpeur, assureur, contre-assureur, observateur",
  "Échauffement : 45 s sur la corde de la voie tirée au sort (utilisation de toutes les couleurs de prises)",
  "20 minutes par équipe pour réaliser les 4 passages de la cordée",
  "Voie tirée au sort en fonction des niveaux des élèves. La voie est accessible au meilleur du groupe. 2 voies différentes à réaliser",
  "Mur divisé en 4 zones. La zone est validée lorsque le bassin dépasse la dégaine : Sol à D2 = 10 points ; D2 à D4 = 20 points ; D4 à D7 = 30 points ; D7 à TOP = 40 points ; TOP = 100 points supplémentaires",
  "2 prises de départ mains identifiées"],
 fin:{titre:FIN_TITRE,afl:[
  {id:'p1',code:'AFLP1',pts:7,off:"Accomplir une prestation animée d'une intention dans la perspective d'être jugé et/ou apprécié.",decl:"Planifier son trajet pour atteindre son objectif personnel en fonction de ses ressources",
   regles:["Atteindre son projet individuel","Si le grimpeur n'atteint pas ou dépasse sa zone = les points de la zone ne comptent pas","L'observateur vérifie l'utilisation des prises bonus et l'atteinte de l'objectif personnel de hauteur"],
   ajust:AJUST_P1,degAj:"Selon l'APSA support, niveau de difficulté/complexité des paramètres",auto:'esc-projet',
   deg:dg(["Projet trop/pas assez ambitieux (loin de la hauteur annoncée)","Projet proche de ± 2 dégaines","Projet proche ± 1 dégaine","Projet respecté"],R7)},
  {id:'p2',code:'AFLP2',pts:5,off:"Mobiliser des techniques de plus en plus complexes pour rendre plus fluide la prestation et pour l'enrichir de formes corporelles variées et maitrisées",decl:"Rechercher une utilisation des jambes optimales pour progresser efficacement dans la voie",
   regles:["Action des jambes"],ajust:"",degAj:"",
   deg:dg(["Poussée des jambes faible avec une grosse action des bras","Poussée des jambes aléatoire (en fonction des prises sous les pieds)","Recherche à progresser en poussant sur les jambes","Poussée efficace permettant d'atteindre des prises hors d'atteinte"],R5)}]},
 fil:{titre:FIL_TITRE,pts:8,reps:['4-4','6-2','2-6'],bareme:BAREME_PRO,retenus:['p4','p5'],rappel:RAPPEL_PRO,note:FIL_NOTE_PRO,afl:[
  {id:'p3',code:'AFLP3',off:"Composer et organiser dans le temps et l'espace le déroulement des moments forts et faibles de sa prestation pour se produire devant des spectateurs/juges",decl:'',regles:[],deg:['','','','']},
  {id:'p4',code:'AFLP4',off:"Assumer les rôles inhérents à la pratique artistique et acrobatique notamment en exprimant et en écoutant des arguments sur la base de critères partagés, pour situer une prestation",decl:"Maitriser les techniques d'assurage et contre-assurage pour faire évoluer ses partenaires en toute sécurité sur le mur",
   regles:["Passage dans les 2 rôles obligatoire","Fusibles sur la corde à ne pas faire sauter"],auto:'esc-roles',
   deg:["Assurage hésitant","Assurage maitrisé","Assurage tendu, boucle cassée pendant la grimpe","Assurage dynamique et boucle maintenue"]},
  {id:'p5',code:'AFLP5',off:"Se préparer et s'engager pour présenter une prestation optimale et sécurisée à une échéance donnée",decl:"Identifier son trajet pour réaliser des choix judicieux sur les prises à utiliser utiles à la progression",
   regles:["10 minutes : projet points d'équipe à prévoir en début de leçon : points de la hauteur de grimpe + 2 prises bonus (+ ordre de passage)","Choix de 2 prises bonus (1 si la zone 1 est la zone à atteindre) : prise en Z1 = ×1 ; prise en Z2 = ×2 ; prise en Z3 = ×3 ; prise en Z4 = ×4","Au cours de la grimpe, si la prise est utilisée, elle vaudra 10 × le coef zone ; si elle n'est pas prise/oubliée, elle vaudra −10 × coef zone","Régulation possible pendant 4 minutes après le passage du premier grimpeur"],auto:'esc-prises',
   deg:["Projet individuel aléatoire (prises et hauteur)","Projet individuel réfléchi sur la hauteur mais mauvais choix de prises","Projet individuel réfléchi mais 1 erreur de prise","Projet individuel concerté collectivement pour le valider dans sa totalité"]},

/* ================== DONNÉES (partagées entre tablettes par eps-home.js : EPSD.store) ==================
   localStorage « eps.ccf.v1 » = {items:{id:{…, u}}, pend:{id:u}, since}. Le plus récent l'emporte, élément par élément.
   pr:<act>-<voie>        protocole modifié par l'enseignant (sinon PROTOS)
   ss:<act>:<classe>      session de CCF de la classe : voie, date, ouverte aux élèves, équipes [{id,nom,el:[clé élève],g}]
   tm:<act>:<classe>:<éq> feuille d'équipe (écrite par les élèves) : projet + passages (escalade), séance + production (cross training)
   ix:<act>:<classe>:<él> feuille individuelle (élève) : répartition choisie, panel de stratégies, ressentis…
   ev:<act>:<classe>:<él> évaluation (enseignant) : statut, degrés, positions, répartition, commentaire
   mt:<classe>:<match>    match de badminton ; rs:<act> ressources ajoutées dans le CCF */
const KEY='eps.ccf.v1';
function ld(){let v=null;try{v=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!v||!v.items)v={items:{},pend:{},since:0};v.pend=v.pend||{};return v}
let DB=ld();
function sv(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Mémoire de la tablette pleine')}}
function get(id){return DB.items[id]&&!DB.items[id].del?DB.items[id]:null}
function put(id,o){DB=ld();const prev=DB.items[id];o.u=Math.max(Date.now(),((prev&&prev.u)||0)+1);DB.items[id]=o;DB.pend[id]=o.u;sv();try{window.EPSD&&EPSD.syncSoon&&EPSD.syncSoon()}catch(e){}}
function del(id){const o=get(id);if(!o)return;put(id,{del:1})}
function items(pre){return Object.keys(DB.items).filter(k=>k.indexOf(pre)===0&&DB.items[k]&&!DB.items[k].del).map(k=>DB.items[k])}
function upd(id,def,f){const o=clone(get(id)||def);f(o);put(id,o);return o}

/* ================== PROTOCOLES ================== */
function protoId(act,voie){return act+'-'+voie}
function hasProto(act,voie){return !!(get('pr:'+protoId(act,voie))||PROTOS[protoId(act,voie)])}
function proto(act,voie){const id=protoId(act,voie),o=get('pr:'+id)||PROTOS[id];if(!o)return null;const P=clone(o);const D=PROTOS[id];if(D){P.jeu=Object.assign({},D.jeu,P.jeu||{})}return P}
function protoModifie(act,voie){return !!get('pr:'+protoId(act,voie))}
function aflFil(P,id){return P.fil.afl.find(a=>a.id===id)}
function repPts(rep){const m=/^(\d+)\s*-\s*(\d+)$/.exec(rep||'');return m?[+m[1],+m[2]]:[4,4]}

/* ================== CLASSES ET ÉLÈVES (listes communes, eps-lists.js) ================== */
function lists(){try{return window.EPSL?EPSL.items():[]}catch(e){return[]}}
function clsById(id){return lists().find(o=>o.id===id)||null}
function people(o){if(!o)return[];try{return EPSL.people(o).map(p=>({k:p.k,prenom:p.prenom||'',nom:p.nom||'',full:p.full}))}catch(e){return[]}}
function pname(o,k){const p=people(o).find(x=>x.k===k);return p?p.full:'?'}
function pfirst(o,k){const p=people(o).find(x=>x.k===k);return p?(p.prenom||p.full):'?'}
function classesFor(act,all){const c=act;return lists().filter(o=>all||!(o.off||[]).includes(c)).sort((a,b)=>a.nom.localeCompare(b.nom,'fr',{numeric:true}))}
function guessVoie(nom){const n=String(nom||'').replace(/\s+/g,'').toUpperCase();return /^(2|SECONDE|2NDE)|^[1T](G|GT|STMG|STI2D|STL|ST2S|STD2A|STAV|STHR)/.test(n)?'gt':'pro'}
function sesId(act,cls){return 'ss:'+act+':'+cls}
function ses(act,cls){const o=get(sesId(act,cls));if(o)return o;const c=clsById(cls);return {act,cls,voie:guessVoie(c&&c.nom),date:today(),open:false,eq:[]}}
function sesPut(act,cls,f){return upd(sesId(act,cls),ses(act,cls),f)}
function teamOf(S,k){return (S.eq||[]).find(t=>(t.el||[]).includes(k))||null}
function dispOf(clsNom,full){try{const d=window.EPSD&&EPSD.find(clsNom||'',full);return d?EPSD.label(d):''}catch(e){return''}}

/* ================== MODE ENSEIGNANT (code commun à toutes les applis) ================== */
let unlockedUntil=0;
function hashCode(c){let h=5381,s='relais:'+c;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
function hubTeach(){try{return Date.now()<+(localStorage.getItem('eps.teach.until')||0)}catch(e){return false}}
function isT(){if(window.EPS_VUE_ELEVE)return false;return Date.now()<unlockedUntil||hubTeach()}
window.epsIsTeacher=()=>isT();
async function unlock(){
 const pin=window.epsPin,done=()=>{unlockedUntil=Date.now()+60*60000;try{localStorage.setItem('eps.teach.until',String(unlockedUntil))}catch(e){}try{window.EPSG&&EPSG.close()}catch(e){}render()};
 let stored=null;try{stored=JSON.parse(localStorage.getItem('relais-vitesse-code-v1')||'null')}catch(e){}
 if(!pin){const v=prompt('Code enseignant');if(v==null)return;if(!stored||hashCode(v)===stored){if(!stored)try{localStorage.setItem('relais-vitesse-code-v1',JSON.stringify(hashCode(v)))}catch(e){}done()}else alert('Code incorrect');return}
 if(stored){const v=await pin({title:'🔒 Code enseignant',min:4,max:12,check:v=>hashCode(v)===stored});if(v!==null)done();return}
 const v=await pin({title:'🔒 Crée ton code enseignant',text:'4 chiffres, pour toutes les applications.',len:4});if(v===null)return;
 const w=await pin({title:'🔒 Confirme le code',text:'Tape le même code une 2e fois.',len:4,check:w=>w===v||'Les deux codes sont différents.'});if(w===null)return;
 try{localStorage.setItem('relais-vitesse-code-v1',JSON.stringify(hashCode(v)))}catch(e){}done()}
function lockApp(){unlockedUntil=0;try{localStorage.setItem('eps.teach.until','0')}catch(e){}render()}
window.epsTeacherEntry=()=>{if(!isT())unlock()};

/* ================== MINUTEURS ================== */
const TM={};/* id → {dur (s), end (ms) | left (s), run, up (chrono), cb} */
function tmFmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tmLeft(t){if(t.up)return t.run?(Date.now()-t.start)/1000+(t.acc||0):(t.acc||0);return t.run?(t.end-Date.now())/1000:(t.left!=null?t.left:t.dur)}
function tmHtml(id,label,dur,up){const t=TM[id]||(TM[id]={dur,up:!!up,run:false,acc:0});if(!t.run&&t.dur!==dur&&!up&&t.left==null)t.dur=dur;
 return `<div class="tmr" data-tm="${id}"><span class="tl">${esc(label)}</span><b class="tv">${tmFmt(tmLeft(t))}</b><button class="b s" data-tmgo="${id}">${t.run?'⏸':'▶'}</button><button class="b s" data-tmrs="${id}">↺</button></div>`}
function tmToggle(id){const t=TM[id];if(!t)return;if(t.run){if(t.up)t.acc=tmLeft(t);else t.left=tmLeft(t);t.run=false}else{if(t.up)t.start=Date.now();else t.end=Date.now()+1000*(t.left!=null?t.left:t.dur);t.run=true;try{beep.a&&beep.a.resume()}catch(e){}}tmPaint()}
function tmReset(id){const t=TM[id];if(!t)return;t.run=false;t.left=null;t.acc=0;t.lastMin=0;tmPaint()}
function tmPaint(){Object.keys(TM).forEach(id=>{const t=TM[id],L=tmLeft(t);if(!t.up&&t.run&&L<=0){t.run=false;t.left=0;beep(3);if(t.cb)try{t.cb()}catch(e){}}
 if(t.up&&t.run&&t.minute){const m=Math.floor(L/60);if(m>(t.lastMin||0)){t.lastMin=m;beep(1);if(t.onMin)try{t.onMin(m)}catch(e){}}}
 $$(`[data-tm="${id}"]`).forEach(el=>{el.querySelector('.tv').textContent=tmFmt(tmLeft(t));const b=el.querySelector('[data-tmgo]');if(b)b.textContent=t.run?'⏸':'▶';el.classList.toggle('end',!t.up&&tmLeft(t)<=0);el.classList.toggle('run',!!t.run)})})}
setInterval(tmPaint,250);
document.addEventListener('click',e=>{const g=e.target.closest('[data-tmgo]');if(g){tmToggle(g.dataset.tmgo);return}const r=e.target.closest('[data-tmrs]');if(r)tmReset(r.dataset.tmrs)});

/* ================== TERRAIN DE BADMINTON : demi-terrain découpé en 6 zones (comme le protocole) ==================
   Vue de dessus, fond du terrain à gauche, filet à droite. 1 2 3 en haut (du fond vers le filet), 6 5 4 en bas. */
function zoneOrder(){return [[1,2,3],[6,5,4]]}
function courtSvg(J,o){o=o||{};const sel=o.sel||[],W=320,H=190,x0=12,y0=12,cw=W-2*x0-14,ch=H-2*y0,c1=cw*(J.c1||34)/100,c2=cw*(J.c2||67)/100,cols=[[0,c1],[c1,c2],[c2,cw]],Z=zoneOrder();
 const m=v=>v/6.70*cw,w=v=>v/6.10*ch;let s=`<svg class="court${o.click?' ck':''}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
 s+=`<rect x="${x0}" y="${y0}" width="${cw}" height="${ch}" fill="#2f7d5b" stroke="#fff" stroke-width="2.5"/>`;
 Z.forEach((row,r)=>row.forEach((z,c)=>{const on=sel.includes(z),x=x0+cols[c][0],y=y0+r*ch/2,ww=cols[c][1]-cols[c][0];
  s+=`<g data-z="${z}"><rect x="${x}" y="${y}" width="${ww}" height="${ch/2}" fill="${on?(o.color||'#F2C94C'):'transparent'}" fill-opacity="${on?.85:0}"/>`+
  `<text x="${x+ww/2}" y="${y+ch/4+9}" text-anchor="middle" font-size="26" font-weight="800" fill="${on?'#14171C':'#fff'}" font-family="system-ui,sans-serif">${z}</text></g>`}));
 /* lignes du terrain (mètres) : service long double à 0,76 du fond, service court à 1,98 du filet, couloirs 0,46 */
 const L=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="1.5" opacity=".75"/>`;
 s+=L(x0+m(.76),y0,x0+m(.76),y0+ch)+L(x0+cw-m(1.98),y0,x0+cw-m(1.98),y0+ch)+L(x0,y0+w(.46),x0+cw,y0+w(.46))+L(x0,y0+ch-w(.46),x0+cw,y0+ch-w(.46))+L(x0,y0+ch/2,x0+cw-m(1.98),y0+ch/2);
 /* découpe des zones : pointillés rouges, comme le schéma du protocole */
 s+=`<line x1="${x0+c1}" y1="${y0}" x2="${x0+c1}" y2="${y0+ch}" stroke="#ff4d4d" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="${x0+c2}" y1="${y0}" x2="${x0+c2}" y2="${y0+ch}" stroke="#ff4d4d" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="${x0}" y1="${y0+ch/2}" x2="${x0+cw}" y2="${y0+ch/2}" stroke="#ff4d4d" stroke-width="2.5" stroke-dasharray="7 5"/>`;
 s+=`<line x1="${x0+cw+5}" y1="${y0-6}" x2="${x0+cw+5}" y2="${y0+ch+6}" stroke="#14171C" stroke-width="3"/><circle cx="${x0+cw+5}" cy="${y0-6}" r="4" fill="#14171C"/><circle cx="${x0+cw+5}" cy="${y0+ch+6}" r="4" fill="#14171C"/>`;
 s+=`<text x="${x0+4}" y="${H-1}" font-size="10" fill="#6A6F78" font-family="system-ui">fond</text><text x="${x0+cw-4}" y="${H-1}" text-anchor="end" font-size="10" fill="#6A6F78" font-family="system-ui">filet</text>`;
 return s+'</svg>'}
function zonesTxt(z){return (z||[]).length?'zone'+(z.length>1?'s ':' ')+[...z].sort((a,b)=>a-b).join(', '):'aucune zone'}
function sameSet(a,b){a=[...(a||[])].sort().join(',');b=[...(b||[])].sort().join(',');return a===b&&a!==''}

/* ================== CALCULS DE LA FORME DE PRATIQUE ================== */
/* ESCALADE — zone atteinte d'après la dernière dégaine dépassée par le bassin (TOP = nDeg + 1) */
function escZoneOf(J,dg){if(dg==null||dg==='')return null;dg=+dg;if(dg>J.nDeg)return 4;if(dg>=J.b3)return 3;if(dg>=J.b2)return 2;if(dg>=J.b1)return 1;return 0}
function escZoneBorne(J,z){return z>=4?J.nDeg+1:[0,J.b1,J.b2,J.b3][z]}
function escNbBonus(J,z){return +z===1?1:(J.bonusN||2)}
function escPts(J,p){/* p = passage {zone, bonus:[{z, ok}], dg} */
 const zp=[0,J.z1,J.z2,J.z3,J.z4];let pz=0;const zr=escZoneOf(J,p.dg);
 if(p.dg!=null&&p.dg!==''&&+zr===+p.zone)pz=zp[+p.zone]+(+p.zone===4?J.top:0);
 let pb=0;(p.bonus||[]).slice(0,escNbBonus(J,p.zone)).forEach(b=>{if(!b||!b.z)return;if(b.ok===true)pb+=J.bonusVal*b.z;else if(b.ok===false)pb-=J.bonusVal*b.z});
 return {zone:pz,bonus:pb,tot:pz+pb,zr}}
function escPrevu(J,p){const zp=[0,J.z1,J.z2,J.z3,J.z4];return (p.zone?zp[+p.zone]+(+p.zone===4?J.top:0):0)+(p.bonus||[]).slice(0,escNbBonus(J,p.zone)).reduce((s,b)=>s+(b&&b.z?J.bonusVal*b.z:0),0)}
/* BADMINTON — score stratégique d'un match ; stratégie active d'un camp à un point donné */
function badStratAt(m,side,i){const L=(m.strat&&m.strat[side])||[];let s=null;L.forEach(x=>{if(x.i<=i)s=x});return s}
function badCalc(J,m){const R={sets:[],a:0,b:0,sa:0,sb:0,setsA:0,setsB:0,dev:{a:false,b:false},fini:!!m.fin,used:{a:[],b:[]}};
 let set=0,ca=0,cb=0;(m.pts||[]).forEach((p,i)=>{const w=p.w,st=badStratAt(m,w,i);let v=J.pFaute;if(p.k==='d')v=st&&(st.z||[]).includes(+p.z)?J.pDirect:J.pHors;
  if(w==='a'){ca++;R.a+=v}else{cb++;R.b+=v}
  if(ca>=J.pts||cb>=J.pts){R.sets.push([ca,cb]);if(ca>cb)R.setsA++;else R.setsB++;ca=0;cb=0;set++}});
 if(ca||cb)R.sets.push([ca,cb]);R.cur=[ca,cb];R.set=set;
 ['a','b'].forEach(s=>{((m.strat&&m.strat[s])||[]).forEach(x=>{if(!R.used[s].some(y=>sameSet(y,x.z)))R.used[s].push(x.z)})});
 const o={a:'b',b:'a'};['a','b'].forEach(s=>{const g=m.guess&&m.guess[s];if(g&&R.used[o[s]].some(z=>sameSet(z,g))){R.dev[s]=true;if(s==='a')R.a+=J.pDevine;else R.b+=J.pDevine}});
 R.over=R.set>=J.sets;
 R.win=!R.over?null:R.setsA>R.setsB?'a':R.setsB>R.setsA?'b':(+J.nul?(R.a>R.b?'a':R.b>R.a?'b':'='):'=');
 R.changes={a:Math.max(0,((m.strat&&m.strat.a)||[]).length-1),b:Math.max(0,((m.strat&&m.strat.b)||[]).length-1)};
 return R}
function badMatches(cls){return items('mt:'+cls+':').sort((a,b)=>(a.t||0)-(b.t||0))}
function badStatsEl(J,cls,k){const M=badMatches(cls),st={j:0,v:0,pts:0,coach:0,chg:0,dev:0,arb:0};
 M.forEach(m=>{const R=badCalc(J,m);['a','b'].forEach(s=>{const x=m[s]||{};if(x.j===k&&R.over){st.j++;if(R.win===s)st.v++;st.pts+=s==='a'?R.a:R.b}if(x.c===k){st.coach++;st.chg+=R.changes[s];if(R.dev[s])st.dev++}});if(m.arb===k)st.arb++});return st}
function badRanking(J,S,cls){const T={};(S.eq||[]).forEach(t=>T[t.id]={t,j:0,v:0,n:0,pts:0});
 badMatches(cls).forEach(m=>{const R=badCalc(J,m);if(!R.over)return;['a','b'].forEach(s=>{const x=T[(m[s]||{}).eq];if(!x)return;x.j++;if(R.win===s)x.v++;else if(R.win==='=')x.n++;x.pts+=s==='a'?R.a:R.b})});
 return Object.values(T).sort((a,b)=>b.v-a.v||b.pts-a.pts)}

/* ================== NOTES DU CCF ==================
   Fin de séquence : chaque AFLP noté (degré d 0-3 + valeur v dans la fourchette du degré, au 0,25).
   Fil de séquence : 2 AFLP retenus, répartition choisie par l'élève (4-4, 6-2, 2-6), degré → points du barème. */
const evId=(act,cls,k)=>'ev:'+act+':'+cls+':'+k, ixId=(act,cls,k)=>'ix:'+act+':'+cls+':'+k;
function evOf(act,cls,k){return get(evId(act,cls,k))||{}}
function ixOf(act,cls,k){return get(ixId(act,cls,k))||{}}
function repOf(P,ev,ix){const r=ev.rep||ix.rep;return P&&P.fil.reps.includes(r)?r:null}
function q25(x){return Math.round(x*4)/4}
function finV(a,x){if(!x||x.d==null)return null;const g=a.deg[x.d];if(!g)return null;let v=x.v==null?g.max:+x.v;return Math.min(g.max,Math.max(g.min,v))}
function filV(P,ev,ix,i){const id=P.fil.retenus[i],x=ev.fil&&ev.fil[id];if(!x||x.d==null)return null;const rep=repOf(P,ev,ix)||P.fil.reps[0],pts=repPts(rep)[i],B=P.fil.bareme[pts];return B?B[x.d]:null}
function notes(P,ev,ix){const R={fin:0,fil:0,tot:null,ok:true,aff:[],stat:ev.st||''};if(!P)return R;
 P.fin.afl.forEach(a=>{const v=finV(a,ev.fin&&ev.fin[a.id]);R.aff.push(v);if(v==null)R.ok=false;else R.fin+=v});
 [0,1].forEach(i=>{const v=filV(P,ev,ix,i);R.aff.push(v);if(v==null)R.ok=false;else R.fil+=v});
 R.tot=R.ok?q25(R.fin+R.fil):null;R.part=R.fin+R.fil;return R}
function finMax(P){return P.fin.afl.reduce((s,a)=>s+(+a.pts||0),0)}

/* ================== AIDES AU POSITIONNEMENT (données de la forme de pratique) ================== */
function escPassOf(act,cls,S,k){const t=teamOf(S,k);if(!t)return null;const F=get('tm:'+act+':'+cls+':'+t.id);if(!F)return null;return {F,p:(F.pass||[]).find(x=>x.el===k)||null}}
function escSuggest(J,p){if(!p||p.dg==null||p.dg===''||!p.zone)return null;const zr=escZoneOf(J,p.dg);if(+zr===+p.zone)return {d:3,t:'zone annoncée atteinte : projet respecté'};
 const diff=Math.abs(+p.dg-escZoneBorne(J,+p.zone));return {d:diff<=1?2:diff<=2?1:0,t:'écart de '+diff+' dégaine'+(diff>1?'s':'')+' avec la hauteur annoncée'}}
function dgTxt(J,dg){return dg==null||dg===''?'—':+dg>J.nDeg?'TOP':+dg===0?'sous D1':'D'+dg}
function aideHtml(auto,P,ctx){const J=P.jeu,{act,cls,S,k}=ctx,c=clsById(cls);
 if(auto==='esc-projet'){const x=escPassOf(act,cls,S,k),p=x&&x.p;if(!p)return '<p class="mut">Pas encore de passage enregistré pour cet élève.</p>';
  const r=escPts(J,p),sg=escSuggest(J,p);return `<p>Zone annoncée : <b>Z${p.zone||'?'}</b> (${p.zone?dgTxt(J,escZoneBorne(J,+p.zone)):''}) · atteint : <b>${dgTxt(J,p.dg)}</b> (zone ${r.zr==null?'—':r.zr}) · points : <b>${r.tot}</b></p>${sg?`<p>Suggestion : <b>degré ${sg.d+1}</b> (${esc(sg.t)}) <button class="b s" onclick="ficheDeg('${P.fin.afl[0].id}',${sg.d})">Choisir</button></p>`:''}`}
 if(auto==='esc-prises'){const x=escPassOf(act,cls,S,k),p=x&&x.p;if(!p)return '<p class="mut">Pas encore de passage enregistré.</p>';const B=(p.bonus||[]).slice(0,escNbBonus(J,p.zone)).filter(b=>b&&b.z);
  return `<p>Prises bonus : ${B.map(b=>`Z${b.z} ${esc(b.rep||'')} ${b.ok===true?'✅ utilisée':b.ok===false?'❌ oubliée':'…'}`).join(' · ')||'aucune'}${x.F.regu?' · régulation : '+esc(x.F.regu):''}</p>`}
 if(auto==='esc-roles'){const t=teamOf(S,k);if(!t)return '<p class="mut">Pas d\'équipe.</p>';const F=get('tm:'+act+':'+cls+':'+t.id)||{};let a=0,cc=0,o=0,fu=0;(F.pass||[]).forEach(p=>{if(p.asr===k){a++;fu+=+p.fus||0}if(p.cas===k)cc++;if(p.obs===k)o++});
  return `<p>Assureur : <b>${a}</b> fois · contre-assureur : <b>${cc}</b> · observateur : <b>${o}</b> · fusibles sautés en assurant : <b>${fu}</b>${a&&cc?'':' · <span class="warn">⚠ les 2 rôles sont obligatoires</span>'}</p>`}
 if(auto==='bad-gain'){const s=badStatsEl(J,cls,k);if(!s.j)return '<p class="mut">Aucun match terminé comme joueur.</p>';const a=P.fin.afl[0];
  return `<p>Matchs gagnés : <b>${s.v} / ${s.j}</b> · points marqués : <b>${s.pts}</b>. <button class="b s" onclick="ficheGain(${s.v},${s.j})">Placer dans le degré selon les matchs gagnés</button></p>`}
 if(auto==='bad-strat'){const s=badStatsEl(J,cls,k);return `<p>Comme coach : <b>${s.coach}</b> match${s.coach>1?'s':''} · changements de stratégie : <b>${s.chg}</b> · stratégies adverses devinées : <b>${s.dev}</b>${s.arb?' · arbitre : '+s.arb:''}</p>`}
 if(auto==='bad-orga'){const t=teamOf(S,k);if(!t)return '<p class="mut">Pas de binôme.</p>';const M=badMatches(cls).filter(m=>(m.a||{}).eq===t.id||(m.b||{}).eq===t.id);
  return `<p>Matchs du binôme : ${M.map(m=>{const R=badCalc(J,m),me=(m.a||{}).eq===t.id?'a':'b',ot=me==='a'?'b':'a',on=(S.eq.find(x=>x.id===(m[ot]||{}).eq)||{}).nom||'?';return `${esc(on)} ${R.over?(R.win===me?'✅':R.win==='='?'=':'❌'):'…'}`}).join(' · ')||'aucun'}</p>`}
 if(auto==='ct-donnees'||auto==='ct-regul'||auto==='ct-muscles'){const t=teamOf(S,k),F=t?get('tm:'+act+':'+cls+':'+t.id)||{}:{},I=ixOf(act,cls,k),fc=(I.fc||[]).length+((F.log||[]).filter(l=>l.k===k&&l.fc).length);
  if(auto==='ct-donnees')return `<p>FC relevées : <b>${fc}</b> · ressentis : ${['mus','resp','fat'].map(x=>I[x]?['','musculaire','respiratoire','fatigue'][['','mus','resp','fat'].indexOf(x)]+' '+I[x]+'/10':'').filter(Boolean).join(' · ')||'non remplis'}${(F.log||[]).some(l=>l.rech)?' · réchappe utilisée':''}</p>`;
  if(auto==='ct-regul')return `<p>Objectif : ${esc((F.obj||{})[k]||'—')} · FC cible : ${esc((F.fcc||{})[k]||'—')} · atteint (élève) : <b>${{oui:'oui',non:'non',part:'en partie'}[I.atteint]||'—'}</b>${(F.log||[]).filter(l=>l.rech).map(l=>' · réchappe : '+esc(l.t||'')).join('')}</p>`;
  return `<p>Exercices et muscles notés par le binôme : ${(F.ex||[]).map(e=>`<b>${esc(e.n)}</b> (${esc(e.m||'?')})`).join(' · ')||'—'}</p>`}
 return ''}
/* résumé de la pratique d'un élève (fiche enseignant, PDF) */
function pratiqueTxt(act,P,cls,S,k){const J=P.jeu,out=[];
 if(act==='esc'){const x=escPassOf(act,cls,S,k);if(x&&x.p){const p=x.p,r=escPts(J,p);out.push(`Voie ${p.voie||'?'} · zone annoncée Z${p.zone||'?'} · atteint ${dgTxt(J,p.dg)} · ${r.tot} pts (zone ${r.zone}, bonus ${r.bonus>=0?'+':''}${r.bonus})`);
  const T=(x.F.pass||[]).reduce((s,q)=>s+escPts(J,q).tot,0);out.push('Total de l\'équipe : '+T+' pts')}}
 if(act==='bad'){const s=badStatsEl(J,cls,k);out.push(`Joueur : ${s.v}/${s.j} matchs gagnés, ${s.pts} points marqués · coach : ${s.coach} match(s), ${s.chg} changement(s) de stratégie, ${s.dev} stratégie(s) devinée(s)`)}
 if(act==='ct'){const t=teamOf(S,k),F=t?get('tm:'+act+':'+cls+':'+t.id)||{}:{},I=ixOf(act,cls,k);if(F.forme)out.push(`${F.forme}${F.duree?' · '+F.duree+' min':''} · ${(F.ex||[]).length} exercice(s) · objectif : ${(F.obj||{})[k]||'—'} · FC cible ${(F.fcc||{})[k]||'—'}`);
  const tours=(F.log||[]).filter(l=>l.k===k&&l.tour).length;if(tours)out.push(tours+' tour(s) réalisé(s)');if(I.atteint)out.push('Objectif atteint : '+({oui:'oui',non:'non',part:'en partie'}[I.atteint]))}
 return out}

let EDP=null;
function editScreen(m){const v=T.pv||'pro';if(!EDP||EDP.id!==protoId(T.act,v))EDP=proto(T.act,v);const P=EDP;

 const ta=(path,val,r)=>`<textarea rows="${r||2}" data-p="${path}">${esc(val)}</textarea>`,inp=(path,val,t)=>`<input type="${t||'text'}" data-p="${path}" value="${esc(val)}"${t==='number'?' step="0.25"':''}>`;
 let h=`<div class="wrap ed"><div class="row wrapf"><button class="b" onclick="EDP=null;go('proto')">← Protocole</button><h2 class="h2" style="flex:1;margin:0">✏️ ${esc(P.apsa)} · ${esc(VOIES[v])}</h2><button class="b" onclick="edReset()">↺ Revenir au texte d'origine</button><button class="b p" onclick="edSave()">✓ Enregistrer</button></div>
 <p class="mut">Tout est modifiable. Une ligne = une puce. Les notes des élèves sont recalculées avec le protocole enregistré.</p>
 <div class="card"><h3 class="h3">En-tête</h3><div class="g3"><label>APSA${inp('apsa',P.apsa)}</label><label>Champ d'apprentissage${inp('ca',P.ca)}</label><label>Session${inp('session',P.session)}</label></div><label>Établissement${inp('etab',P.etab)}</label>
 <label>Objectif de l'épreuve (OE)${ta('oe',P.oe,3)}</label><label>Principe d'élaboration de l'épreuve (une ligne par puce)${ta('principe',P.principe.join('\n'),7)}</label></div>

 P.fin.afl.forEach((a,i)=>{h+=`<div class="eda"><div class="g3"><label>Code${inp(`fin.afl.${i}.code`,a.code)}</label><label>Noté sur (points)${inp(`fin.afl.${i}.pts`,a.pts,'number')}</label><label>Texte de l'aide à l'ajustement${inp(`fin.afl.${i}.degAj`,a.degAj||'')}</label></div>
  <label>AFLP officiel${ta(`fin.afl.${i}.off`,a.off)}</label><label>AFLP décliné dans l'activité${ta(`fin.afl.${i}.decl`,a.decl)}</label><label>Règles de l'épreuve (une ligne par puce)${ta(`fin.afl.${i}.regles`,a.regles.join('\n'),3)}</label><label>Ajustement dans le degré${ta(`fin.afl.${i}.ajust`,a.ajust||'')}</label>
  <div class="g4">${a.deg.map((g,d)=>`<div class="edd d${d}"><b>Degré ${d+1}</b>${ta(`fin.afl.${i}.deg.${d}.t`,g.t,4)}<div class="row">de${inp(`fin.afl.${i}.deg.${d}.min`,g.min,'number')}à${inp(`fin.afl.${i}.deg.${d}.max`,g.max,'number')}</div></div>`).join('')}</div></div>`});
 h+=`</div><div class="card"><h3 class="h3">${esc(P.fil.titre)}</h3><div class="g3"><label>Titre${inp('fil.titre',P.fil.titre)}</label><label>Noté sur${inp('fil.pts',P.fil.pts,'number')}</label><label>Répartitions (séparées par des virgules)${inp('fil.reps',P.fil.reps.join(', '))}</label></div>
 <b>Barème (points par degré)</b><table class="tbl"><tbody>${Object.keys(P.fil.bareme).map(n=>`<tr><td>Note sur ${n}</td>${P.fil.bareme[n].map((x,d)=>`<td>${inp(`fil.bareme.${n}.${d}`,x,'number')}</td>`).join('')}</tr>`).join('')}</tbody></table>
 <p class="mut sm">AFLP retenus par l'équipe : coche exactement 2 AFLP (le 1er coché = AFLX, le 2e = AFLY).</p>`;
 P.fil.afl.forEach((a,i)=>{const r=P.fil.retenus.indexOf(a.id);h+=`<div class="eda${r>=0?'':' off'}"><div class="row"><label class="tg big"><input type="checkbox" data-ret="${a.id}" ${r>=0?'checked':''}> Retenu ${r>=0?'('+(r?'AFLY':'AFLX')+')':''}</label>${inp(`fil.afl.${i}.code`,a.code)}</div>
  <label>AFLP officiel${ta(`fil.afl.${i}.off`,a.off)}</label><label>AFLP décliné dans l'activité${ta(`fil.afl.${i}.decl`,a.decl)}</label><label>Règles (une ligne par puce)${ta(`fil.afl.${i}.regles`,(a.regles||[]).join('\n'),2)}</label>
  <div class="g4">${a.deg.map((g,d)=>`<div class="edd d${d}"><b>Degré ${d+1}</b>${ta(`fil.afl.${i}.deg.${d}`,g,3)}</div>`).join('')}</div></div>`});
 h+=`<label>Rappels${ta('fil.rappel',P.fil.rappel,5)}</label><label>Note de l'équipe EPS${ta('fil.note',P.fil.note||'',2)}</label></div>
 <div class="card"><h3 class="h3">Forme de pratique (tablettes des élèves)</h3><div class="g3">${(JEU_LAB[P.act]||[]).map(([k,l])=>`<label>${esc(l)}${inp('jeu.'+k,P.jeu[k],'number')}</label>`).join('')}</div></div>
 <div class="row end"><button class="b p" onclick="edSave()">✓ Enregistrer le protocole</button></div></div>`;
 m.innerHTML=h;
 m.querySelectorAll('[data-p]').forEach(el=>el.onchange=()=>edSet(el.dataset.p,el.value,el.type));
 m.querySelectorAll('[data-ret]').forEach(el=>el.onchange=()=>{const id=el.dataset.ret,R=EDP.fil.retenus.filter(x=>x!==id);if(el.checked)R.push(id);EDP.fil.retenus=R;editScreen(m)})}
function edSet(path,val,type){const ks=path.split('.');let o=EDP;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];const k=ks[ks.length-1];
 if(['principe','regles'].includes(k))val=lines(val);else if(k==='reps')val=val.split(',').map(x=>x.trim().replace(/\s*-\s*/,'-')).filter(x=>/^\d+-\d+$/.test(x));else if(type==='number')val=val===''?0:+String(val).replace(',','.');
 o[k]=val;
 if(k==='reps')val.forEach(r=>repPts(r).forEach(n=>{if(!EDP.fil.bareme[n])EDP.fil.bareme[n]=[0,0,0,0]}))}
function edSave(){const P=EDP;if(P.fil.retenus.length!==2){toast('Coche exactement 2 AFLP retenus');return}
 for(const a of P.fin.afl)for(const g of a.deg)if(!(g.min<=g.max)){toast(a.code+' : vérifie les fourchettes (de ≤ à)');return}
 if(!P.fil.reps.length){toast('Indique au moins une répartition');return}
 put('pr:'+P.id,clone(P));toast('Protocole enregistré et partagé');EDP=null;go('proto')}
function edReset(){if(!confirm('Revenir au texte d\'origine du protocole ? Tes modifications seront perdues.'))return;if(get('pr:'+protoId(T.act,T.pv||'pro')))del('pr:'+protoId(T.act,T.pv||'pro'));EDP=null;toast('Texte d\'origine rétabli');go('proto')}

/* ================== 📚 RESSOURCES : celles de l'appli de l'activité + celles ajoutées ici ==================
   Escalade : contenus de l'appli Escalade (« escalade.c »). Badminton : fiches techniques (« eps_badminton_v1 »).
   Toute appli (dont une future appli Cross training) peut publier ses ressources dans localStorage « eps.res.<code> » = [{titre, texte, lien, img}]. */
function appRes(act,teach){const R=[];
 try{if(act==='esc'){const C=JSON.parse(localStorage.getItem('escalade.c')||'null');if(C){const N={sec:'Sécurité',ech:'Échauffement',enc:"S'encorder",ass:'Assurage',the:'Thématiques'};
  Object.keys(N).forEach(s=>{const B=C[s]||[];let t='',v=0;B.forEach(b=>{if(b.t==='h')return;if(b.t==='s')t+=(t?'\n':'')+'■ '+b.v;else if(b.t==='p')t+='\n'+b.v;else if(b.t==='vgs')v+=(b.items||[]).length;else if(b.t==='v'||b.t==='f')v++});if(t||v)R.push({titre:N[s],texte:t.trim()+(v?`\n(${v} vidéo${v>1?'s':''} dans l'appli Escalade)`:''),src:'Appli Escalade',lien:'../escalade/'})})}}
 if(act==='bad'){const B=JSON.parse(localStorage.getItem('eps_badminton_v1')||'null');((B&&B.tech)||[]).forEach(f=>R.push({titre:f.nom,texte:[f.but,(f.cr||[]).length?'Critères de réalisation :\n• '+f.cr.join('\n• '):'',(f.err||[]).length?'Erreurs fréquentes :\n• '+f.err.join('\n• '):'',f.astuce?'💡 '+f.astuce:''].filter(Boolean).join('\n'),img:f.img||'',lien:f.video||'',src:'Appli Badminton · '+(f.cat||'')}))}
 const X=JSON.parse(localStorage.getItem('eps.res.'+act)||'null');(Array.isArray(X)?X:[]).forEach(r=>R.push(Object.assign({src:'Appli '+ACTS[act].nom},r)))}catch(e){}
 if(act==='ct'){if(teach)R.push({titre:'Exercices sans matériel et muscles travaillés',texte:EXOS.map(e=>'• '+e[0]+' : '+e[1]).join('\n'),src:'CCF · visible par toi seulement (les muscles sont évalués : AFLP6)'});R.push({titre:'Formes de travail',texte:Object.keys(FORMES).map(k=>'■ '+k+'\n'+FORMES[k]).join('\n'),src:'CCF'},{titre:'Prendre sa fréquence cardiaque',texte:"Deux doigts (index et majeur) sur l'artère du cou ou du poignet, jamais le pouce. Compte les battements pendant 15 secondes et multiplie par 4.\nFC maximale théorique ≈ 220 − âge.",src:'CCF'})}
 return R}
function ownRes(act){return ((get('rs:'+act)||{}).list||[])}
function resHtml(act,teach){const A=appRes(act,teach),O=ownRes(act);
 const card=(r,i)=>`<div class="res"><div class="rh"><b>${esc(r.titre)}</b><small>${esc(r.src||'Ajoutée dans le CCF')}</small>${teach&&i!=null?`<button class="b s" onclick="resEdit(${i})">✏️</button>`:''}</div>${r.img?`<img src="${esc(r.img)}" alt="">`:''}<p>${nl2br(r.texte||'')}</p>${r.lien?`<a class="b s" href="${esc(r.lien)}" target="_blank" rel="noopener">${/^\.\.\//.test(r.lien)?'Ouvrir l\'appli':'▶ Ouvrir le lien'}</a>`:''}</div>`;
 return `<div class="ress">${O.map((r,i)=>card(r,i)).join('')}${A.map(r=>card(r,null)).join('')}</div>`+(A.length+O.length?'':'<p class="mut">Aucune ressource pour l\'instant.</p>')}

 const rd=d.querySelector('#rd');if(rd)rd.onclick=()=>{if(!confirm('Supprimer cette ressource ?'))return;upd('rs:'+T.act,{list:[]},o=>{o.list.splice(i,1)});d.remove();render()}}
function shrink(file,max){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let w=im.width,h=im.height,q=.8;const c=document.createElement('canvas'),x=c.getContext('2d');let out='';
 for(let s=Math.min(1,max/Math.max(w,h));s>.1;s*=.8){c.width=Math.round(w*s);c.height=Math.round(h*s);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<30000)break;q=Math.max(.5,q-.1)}URL.revokeObjectURL(u);res(out)};im.src=u})}

const ESC_SUB=[['projet','1 · Projet d\'équipe'],['grimpe','2 · Passages'],['score','3 · Score']];

 ks.forEach(k=>{if(!F.pass.some(p=>p.el===k))F.pass.push({el:k,voie:'A',zone:null,bonus:[{z:null,rep:'',ok:null},{z:null,rep:'',ok:null}],dg:null,asr:'',cas:'',obs:'',fus:0,done:false})});
 F.pass=F.pass.filter(p=>ks.includes(p.el));return F}
function escRegLeft(F){const J=PX.J;if(!F.t1)return null;return F.t1+J.regul*60000-Date.now()}

 const zl=z=>['','Sol → D'+J.b1,'D'+J.b1+' → D'+J.b2,'D'+J.b2+' → D'+J.b3,'D'+J.b3+' → TOP'][z];
 const zp=z=>[0,J.z1,J.z2,J.z3,J.z4][z]+(z===4?' + '+J.top:'');
 if(s==='projet'){const L=escRegLeft(F);
  h+=`<div class="row wrapf">${tmHtml('escp','Projet d\'équipe',J.projet*60)}${tmHtml('esct','Temps de l\'équipe',J.dureeEq*60)}</div>
  ${L!=null?`<div class="card ${L>0||F.unlock?'soft':'warn'}">${L>0?`⏱ Régulation : il reste <b data-reg>${tmFmt(L/1000)}</b> pour modifier les projets de ceux qui n'ont pas grimpé.`:F.unlock?'🔓 Projets rouverts par l\'enseignant.':'🔒 Temps de régulation terminé : les projets sont verrouillés.'}</div>`:''}
  <div class="card"><b>Voies tirées au sort</b><div class="g2"><label>Voie A<input value="${esc(F.voies.A)}" placeholder="ex. corde 3, bleue" onchange="escSet(F=>F.voies.A=this.value)"></label><label>Voie B<input value="${esc(F.voies.B)}" placeholder="ex. corde 5, jaune" onchange="escSet(F=>F.voies.B=this.value)"></label></div></div>
  <p class="mut">Pour chaque grimpeur, dans l'ordre de passage : la voie, la zone à atteindre et ${J.bonusN} prises bonus (1 seule si la zone 1 est visée). Points de la zone seulement si la zone est atteinte exactement ; prise bonus utilisée = +${J.bonusVal} × coef de sa zone, oubliée = −${J.bonusVal} × coef.</p>`;
  F.pass.forEach((p,i)=>{const ed=escCanEdit(F,p),nb=escNbBonus(J,p.zone);
   h+=`<div class="card pj${p.done?' done':''}"><div class="row"><b class="num">${i+1}</b><b style="flex:1">${esc(pname(PX.c,p.el))}</b>${ed&&!p.done?`<button class="b s" onclick="escMove(${i},-1)" ${i?'':'disabled'}>↑</button><button class="b s" onclick="escMove(${i},1)" ${i<F.pass.length-1?'':'disabled'}>↓</button>`:''}${p.done?'<span class="pill ok">a grimpé</span>':''}</div>
