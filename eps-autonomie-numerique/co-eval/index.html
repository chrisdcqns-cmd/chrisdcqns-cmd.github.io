<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--nv);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}

header{position:sticky;top:0;z-index:20;background:var(--nv);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}

.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.04)}

.muted{color:var(--mu)}.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:800;min-height:48px;background:var(--nv);color:#fff}
.btn.or{background:var(--or)}.btn.gr{background:var(--gr)}.btn.ko{background:var(--ko)}.btn.vi{background:var(--vi)}
.btn.gh{background:#fff;color:var(--nv);box-shadow:inset 0 0 0 2px var(--li)}
.btn.big{width:100%;min-height:64px;font-size:1.25rem;border-radius:18px}
.btn:disabled{opacity:.4}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.inp{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:13px;border:2px solid var(--li);background:#fff;color:var(--nv)}

label.l{display:block;font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:12px 0 5px}

.prof{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof button{border:2px solid var(--li);background:#fff;border-radius:14px;padding:14px 8px;font-weight:800;color:var(--nv)}

.pc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#fff;border:2px solid var(--li);margin-bottom:10px;width:100%;text-align:left;color:var(--nv)}
.pc .n{width:46px;height:46px;border-radius:13px;background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.2rem;flex:none}
.pc.done{border-color:#bfe6d3}.pc.done .n{background:var(--gr)}
.pc.cur{border-color:var(--or)}.pc.cur .n{background:var(--or)}

.mapv{position:relative;overflow:hidden;border-radius:14px;background:#ddd;touch-action:none;height:46vh;min-height:260px}
.mapv .in{position:absolute;left:0;top:0;transform-origin:0 0}

.mapv svg.ov{position:absolute;left:0;top:0;pointer-events:none}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zb button{width:40px;height:40px;border-radius:11px;border:0;background:#fff;font-weight:900;font-size:1.2rem;box-shadow:0 1px 4px rgba(0,0,0,.25);color:var(--nv)}
/* choix des balises */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
.bgrid button{height:54px;border-radius:50%;border:3px solid var(--vi);background:#fff;color:var(--vi);font-weight:900;font-size:1.1rem;aspect-ratio:1;justify-self:center;width:54px;padding:0;position:relative}
.bgrid button.on{background:var(--vi);color:#fff}
.bgrid button.ob::after{content:"★";position:absolute;right:-5px;top:-7px;font-size:.85rem;color:var(--or);background:#fff;border-radius:50%;width:18px;height:18px;line-height:18px}
.bgrid button.used{border-style:dashed;opacity:.55}
.bgrid button .tg{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#1d4ed8;color:#fff;border-radius:99px;font-size:.62rem;padding:1px 5px;white-space:nowrap;line-height:1.3}
.bgrid{row-gap:14px}
.sl{list-style:none;margin:0;padding:0;position:relative}
.sl li{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--li);border-radius:14px;padding:6px 6px 6px 10px;margin-bottom:7px;touch-action:none;user-select:none;-webkit-user-select:none}
.sl li .o{font-weight:900;color:var(--mu);width:22px;text-align:right}
.sl li .bn{width:42px;height:42px;border-radius:50%;border:3px solid var(--vi);color:var(--vi);display:grid;place-items:center;font-weight:900;flex:none;background:#fff}
.sl li .h{margin-left:auto;width:52px;height:46px;display:grid;place-items:center;font-size:1.5rem;color:var(--mu);border-radius:10px;background:#f5f2ea;touch-action:none}

.sl li.st,.sl li.fi{background:#f7f3ff;border-style:dashed;touch-action:auto}
.timer{font-variant-numeric:tabular-nums;font-weight:900}
.prep{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--nv);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:12px;position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:10}

.prep.low{background:var(--ko)}

.bigb{width:150px;height:150px;border-radius:50%;border:9px solid var(--vi);display:grid;place-items:center;margin:8px auto 4px;font-size:3.4rem;font-weight:900;color:var(--vi);background:#fff}
.boxes{display:flex;justify-content:center;gap:10px;margin:14px 0 10px}
.boxes div{width:64px;height:74px;border-radius:14px;border:3px solid var(--li);background:#fff;display:grid;place-items:center;font-size:2.3rem;font-weight:900}
.boxes div.cur{border-color:var(--or);box-shadow:0 0 0 4px #ffe2c9}
.kb{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.kb button{height:52px;border:0;border-radius:10px;background:#fff;font-weight:800;font-size:1.15rem;color:var(--nv);box-shadow:0 2px 0 var(--li);padding:0}
.kb button:active{background:var(--li)}
.kb .w2{grid-column:span 2}.kb .w3{grid-column:span 3}
.steps{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.steps span{min-width:30px;height:30px;padding:0 4px;border-radius:15px;display:grid;place-items:center;font-size:.8rem;font-weight:900;border:2px solid var(--vi);color:var(--vi);background:#fff}

.flash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--nv);color:#fff;padding:18px 26px;border-radius:18px;font-weight:900;font-size:1.2rem;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:fl .9s forwards;pointer-events:none}

/* bilan */
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--li);text-align:left}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.kpi div{background:#f7f4ec;border-radius:13px;padding:10px}
.kpi b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--mu);font-weight:700;text-transform:uppercase}
.bar{height:12px;border-radius:6px;background:var(--or)}
.opts button{border:2px solid var(--li);background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;color:var(--nv);margin:0 6px 6px 0}

.ref{font-size:.7rem;color:#b9b2a3;text-align:right;margin-top:6px}

@media print{header,.noprint,#eps-home-btn{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;padding:10px}.pb{break-before:page}}

.net{font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14)}
.net.ok{background:#2a9d6f}.net.ko{background:#d62839}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick button{border:2px solid var(--li);background:#fff;border-radius:14px;padding:12px 8px;font-weight:800;color:var(--nv);min-height:58px;line-height:1.15}
.pick button small{display:block;font-weight:600;color:var(--mu);font-size:.78rem;margin-top:2px}

/* éditeur de tracé */
.dr{position:fixed;inset:0;z-index:60;background:#222;display:flex;flex-direction:column}
.dr .dbar{background:var(--nv);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dr .dbar.bot{padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.dr .mapv{flex:1;border-radius:0;height:auto;min-height:0}
.tb{border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;padding:7px 9px;font-size:.84rem;min-height:40px}
body:has(.dr) #eps-home-btn{display:none!important}
.dr,.dr *,.mapv,.mapv *{touch-action:none}.dr{overscroll-behavior:none}
html:has(.dr),body:has(.dr){overscroll-behavior:none;touch-action:none}
.sw{flex:none}.wd{flex:none}
.tb.on{background:var(--or)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.25);padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--or)}
.wd{width:42px;height:42px;border-radius:10px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;padding:0}

.wd i{display:block;background:#fff;border-radius:9px;width:24px}
.sec{border-top:1px solid var(--li);margin-top:12px;padding-top:12px}
.cls{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#f7f4ec;margin-bottom:6px}
.pub{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:9;margin:-4px 0 10px;padding:8px 12px;border-radius:12px;font-size:.85rem;font-weight:700;background:#d5f0e3;color:#11643f}
.pub.wait{background:#fff1d6;color:#7a4b00}.pub.ko{background:#fbd5d9;color:#8c1020}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
</style>

<body>
<header><img src="icon-192.png" alt="" style="width:34px;height:34px;border-radius:9px;flex:none"><h1 id="hT">Course d'orientation</h1><span class="net noprint" id="net">…</span><button class="hb noprint" id="hProf" title="Espace enseignant">🔒</button></header>
<main id="app"></main>
<script>
"use strict";
const QR = (() => {
  const ECC = { L: [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    M: [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    Q: [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    H: [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30] };
  const BLK = { L: [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    M: [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    Q: [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    H: [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81] };
  const FMT = { L: 1, M: 0, Q: 3, H: 2 };

  function rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  const dataCw = (v, e) => Math.floor(rawModules(v) / 8) - ECC[e][v] * BLK[e][v];

  function gfMul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 255; }
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = gfMul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = gfMul(root, 2); }
    return r;
  }
  function rsRem(data, div) {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= gfMul(c, f)); }
    return r;
  }

  function encode(text, ecl = "M", forceMask) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    for (; v <= 40; v++) { const cc = v < 10 ? 8 : 16; if (4 + cc + bytes.length * 8 <= dataCw(v, ecl) * 8) break; }
    if (v > 40) throw new Error("Texte trop long pour un QR code");
    // améliore le niveau de correction si la place le permet
    for (const e of ["M", "Q", "H"]) { if ("LMQH".indexOf(e) > "LMQH".indexOf(ecl)) { const cc = v < 10 ? 8 : 16; if (4 + cc + bytes.length * 8 <= dataCw(v, e) * 8) ecl = e; } }
    const bits = [];
    const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    const cap = dataCw(v, ecl) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xEC; bits.length < cap; p ^= 0xEC ^ 0x11) put(p, 8);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(""), 2));
    // blocs + correction d'erreurs
    const nb = BLK[ecl][v], ecLen = ECC[ecl][v], raw = Math.floor(rawModules(v) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const blocks = [], div = rsDivisor(ecLen);
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - ecLen + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = rsRem(dat, div); if (i < nShort) dat.push(0); blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - ecLen || j >= nShort) all.push(b[i]); });
    // matrice
    const size = v * 4 + 17;
    const M = Array.from({ length: size }, () => new Array(size).fill(false));
    const F = Array.from({ length: size }, () => new Array(size).fill(false));
    const set = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy; if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = [];
    if (v > 1) { const n = Math.floor(v / 7) + 2, step = Math.floor((v * 8 + n * 3 + 5) / (n * 4 - 4)) * 2; for (let i = n - 1, p = size - 7; i >= 1; i--, p -= step) al.unshift(p); al.unshift(6); }
    al.forEach((a, i) => al.forEach((b, j) => { if (!((i === 0 && j === 0) || (i === 0 && j === al.length - 1) || (i === al.length - 1 && j === 0))) for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    const drawFormat = (mask) => {
      const d = FMT[ecl] << 3 | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = (d << 10 | r) ^ 0x5412, g = i => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) set(8, i, g(i));
      set(8, 7, g(6)); set(8, 8, g(7)); set(7, 8, g(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, g(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, g(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, g(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (v >= 7) {
      let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = v << 12 | r;
      for (let i = 0; i < 18; i++) { const bit = ((b >>> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, bit); set(c, a, bit); }
    }
    // données en zigzag
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && i < all.length * 8) { M[y][x] = ((all[i >>> 3] >>> (7 - (i & 7))) & 1) !== 0; i++; }
      }
    }

// glisser-déposer au doigt (poignée ≡)
function sortable(ul, onMove) {
  let drag = null;
  ul.addEventListener("pointerdown", e => {
    const h = e.target.closest(".h"); if (!h) return; const li = h.closest("li"); e.preventDefault();
    const items = $$("li[data-i]", ul), rects = items.map(x => x.getBoundingClientRect());
    drag = { li, from: +li.dataset.i, to: +li.dataset.i, y0: e.clientY, sy: scrollY, items, rects, hgt: rects[+li.dataset.i].height + 7 };
    li.classList.add("drag"); h.setPointerCapture(e.pointerId); vib(15);

  });
  ul.addEventListener("pointermove", e => {
    if (!drag) return; e.preventDefault(); const dy = e.clientY - drag.y0 + (scrollY - drag.sy); drag.li.style.transform = `translateY(${dy}px)`;
    const c = drag.rects[drag.from].top + drag.rects[drag.from].height / 2 + dy; let to = drag.from;
    drag.rects.forEach((r, i) => { if (i < drag.from && c < r.top + r.height / 2) to = Math.min(to, i); if (i > drag.from && c > r.top + r.height / 2) to = Math.max(to, i); });
    if (to !== drag.to) { drag.to = to; vib(8); }
    drag.items.forEach((x, i) => { if (x === drag.li) return; x.style.transform = drag.from < to && i > drag.from && i <= to ? `translateY(${-drag.hgt}px)` : drag.from > to && i >= to && i < drag.from ? `translateY(${drag.hgt}px)` : ""; });
    if (e.clientY < 110) window.scrollBy(0, -8); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 8);
  });
  const end = () => { if (!drag) return; const { from, to } = drag; drag.items.forEach(x => { x.style.transform = ""; x.classList.remove("anim", "drag"); }); drag = null; if (from !== to) onMove(from, to); };
  ul.addEventListener("pointerup", end); ul.addEventListener("pointercancel", end);
}

// Saisie d'un code : rien n'est signalé à l'élève, l'analyse est gardée pour l'enseignant
function punch(r, code) {
  const i = r.idx || 0, hit = C.balises.find(b => String(b.code).toUpperCase() === code);
  const s = { t: now(), code, attendu: r.plan[i], bal: hit ? +hit.n : null }, j = hit ? r.plan.indexOf(+hit.n) : -1;
  if (hit && j === i) { s.st = "ok"; r.idx = i + 1; }
  else if (hit && j > i) { s.st = "saut"; r.idx = j + 1; }       // a sauté des balises de son parcours
  else if (hit && j >= 0) { s.st = "retour"; }                    // balise sautée, récupérée plus tard
  else if (hit) { s.st = "hors"; r.idx = i + 1; }                 // balise qui n'est pas dans son parcours
  else { s.st = "faux"; r.idx = i + 1; }                          // code inexistant
  r.saisies.push(s);
}
function analyse(r) {
  const p = P(r.k) || {}, plan = r.plan, ok = new Set(), retards = new Set();
  r.saisies.forEach(s => { if (s.st === "ok" || s.st === "saut") ok.add(+s.bal); if (s.st === "retour") retards.add(+s.bal); });
  const oublis = plan.filter(n => !ok.has(+n));
  const passees = r.saisies.filter(s => s.st === "passe").map(s => s.attendu);
  const faux = r.saisies.filter(s => s.st === "faux" || s.st === "hors").length;
  const obligOk = !p.oblig || ok.has(+p.oblig) || retards.has(+p.oblig);
  const chrono = (r.fin || now()) - r.debut;
  const over = p.max ? Math.max(0, chrono - p.max * 60000) : 0;
  const pen = (oublis.length * C.penOubli + (obligOk ? 0 : C.penOblig) + (over ? Math.ceil(over / 60000) * C.penRetard : 0)) * 1000;
  let prev = r.debut; const legs = r.saisies.map(s => { const d = s.t - prev; prev = s.t; return { ...s, leg: d, cum: s.t - r.debut }; });
  return { chrono, pen, final: chrono + pen, oublis, passees, faux, obligOk, nErr: oublis.length, over, legs, retour: r.fin ? r.fin - prev : null, ordre: oublis.length === 0 && r.saisies.every(s => s.st === "ok") };
}

// ---------- Résultats : envoi au serveur + secours par QR code ----------
function packRun(r) { return { k: r.k, d: r.duo || 0, p: r.plan, v: r.prevu, t0: r.debut, t1: r.fin, s: r.saisies.map(s => [s.t - r.debut, s.code, s.attendu, s.st, s.bal]), q: r.ress || {}, tr: r.trace || [] }; }
function unpackRun(x) { return x ? { k: x.k, duo: x.d || null, plan: x.p, prevu: x.v, debut: x.t0, fin: x.t1, saisies: (x.s || []).map(s => ({ t: x.t0 + s[0], code: s[1], attendu: s[2], st: s[3], bal: s[4] })), ress: x.q || {}, trace: x.tr || [] } : null; }
const KEY = "orienrun-eps";
function enc(o) { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ""; b.forEach((v, i) => s += String.fromCharCode(v ^ KEY.charCodeAt(i % KEY.length))); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function dec(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); const bin = atob(s), b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length); return JSON.parse(new TextDecoder().decode(b)); }
function sendResults() {
  // QR compact (sans le tracé dessiné)
  const o = { m: ME, r: RUNS.map(r => r?.fin ? { ...packRun(r), tr: 0, s: r.saisies.map(s => s.st === "ok" ? [Math.round((s.t - r.debut) / 1000), s.code] : [Math.round((s.t - r.debut) / 1000), s.code, s.attendu, s.st, s.bal]), z: 1 } : 0) };
  const url = location.origin + location.pathname + "#r=" + enc(o);
  let svg = ""; try { svg = QR.svg(url, { ecl: "L", border: 2 }); } catch (e) { svg = "<p>Trop de données pour un QR code.</p>"; }
  const m = modal(`<h2 style="margin:0 0 6px">📤 Envoyer mes résultats</h2><p class="muted small" style="margin-top:0">Tes résultats partent automatiquement dès qu'il y a du réseau. Si ton enseignant te le demande, montre-lui ce QR code : il le scanne avec l'appareil photo de son téléphone.</p><div style="background:#fff;padding:10px;border-radius:14px;max-width:420px;margin:0 auto">${svg}</div>
   <div class="row" style="margin-top:12px"><button class="btn grow" id="sX">Fermer</button></div>`);
  $("#sX", m).onclick = m.close;
}
function unpackQR(o) { return o.r.map(x => { if (!x) return null; const r = unpackRun({ ...x, s: [] }); let i = 0; r.saisies = x.s.map(s => { const z = x.z ? 1000 : 1; const q = s.length > 2 ? { t: x.t0 + s[0] * z, code: s[1], attendu: s[2], st: s[3], bal: s[4] } : { t: x.t0 + s[0] * z, code: s[1], attendu: x.p[i], st: "ok", bal: x.p[i] }; if (q.st === "ok" || q.st === "saut") i = x.p.indexOf(+q.bal) + 1; else if (q.st !== "retour") i++; return q; }); return r; }); }
function receiveResults(code) {
  try {
    const o = dec(code), R = LS.get("res", {}); R[o.m.id] = { me: o.m, runs: unpackQR(o).map(r => r && packRun(r)), recu: now() }; LS.set("res", R);
    history.replaceState(null, "", location.pathname);
    $("#app").innerHTML = `<div class="card" style="text-align:center"><div style="font-size:3rem">✅</div><h2>Résultats reçus</h2><p><b>${esc(studentName(o.m))}</b> (${esc(o.m.classe || "")} · ${esc(o.m.prof)}) · ${o.r.filter(Boolean).length} parcours</p><p class="muted small">Ils sont rangés dans l'espace enseignant (🔒) de ce téléphone.</p><button class="btn big or" id="rcP">Voir tous les résultats</button></div>`;
    $("#rcP").onclick = openProf; return true;
  } catch (e) { return false; }
}

function allStudents() {
  const S = {}, get = me => S[me.id] = S[me.id] || { me, runs: [null, null, null] };
  const put = (me, k, r, t) => { if (!me?.id) return; me = moved(me); if (r.duo?.id) r = { ...r, duo: moved(r.duo) }; const x = get(me); if (!x.runs[k] || (x.runs[k]._t || 0) <= t) x.runs[k] = { ...r, _t: t }; };
  SRV.rows.forEach(row => { const d = row.d; if (!d?.me || !d.run) return; const r = unpackRun(d.run); put(d.me, row.k, r, row.t); if (r.duo?.id) put(r.duo, row.k, { ...r, duo: d.me }, row.t - 1); });
  Object.values(LS.get("res", {})).forEach(o => (o.runs || []).forEach((x, k) => { if (!x) return; const r = unpackRun(x); put(o.me, k, r, o.recu - 5); if (r.duo?.id) put(r.duo, k, { ...r, duo: o.me }, o.recu - 6); }));
  Object.entries(C.listes || {}).forEach(([prof, cl]) => Object.entries(cl).forEach(([classe, L]) => L.forEach(([nom, prenom]) => { const me = { prenom, nom, classe, prof }; me.id = studentId(me); get(me); })));
  Object.values(S).forEach(x => x.abs = isAbs(x.me));
  return Object.values(S);
}

function parseSheets(sheets, base) {
  const res = {}, names = Object.keys(sheets);
  names.forEach(sn => { const rows = sheets[sn].filter(r => r.some(c => String(c).trim())); if (!rows.length) return;
    const hi = rows.slice(0, 10).findIndex(r => r.some(c => /^(nom|prenom|eleve|classe|division)/.test(norm(c))));
    const head = hi >= 0 ? rows[hi].map(norm) : [], data = rows.slice(hi + 1);
    const col = re => head.findIndex(h => re.test(h));
    let cE = col(/^(eleve|nom.*prenom|identite)/), cN = col(/^nom(?!.*prenom)/), cP = col(/^prenom/), cC = col(/^(classe|division|groupe)/);
    if (hi < 0) { cN = 0; cP = rows[0].length > 1 ? 1 : -1; }
    const fallback = names.length > 1 || !/^(feuil|sheet)\d*$/i.test(sn) ? sn : base;
    data.forEach(r => { let nom = "", prenom = "";
      if (cN >= 0 && cP >= 0) { nom = String(r[cN] || "").trim(); prenom = String(r[cP] || "").trim(); }
      else { const full = String(r[cE >= 0 ? cE : cN >= 0 ? cN : 0] || "").trim().replace(/\s+/g, " "); const w = full.split(" "); let k = 0; while (k < w.length - 1 && w[k] === w[k].toUpperCase() && /\p{L}/u.test(w[k])) k++; if (!k) k = 1; nom = w.slice(0, k).join(" "); prenom = w.slice(k).join(" "); }
      if (!nom && !prenom) return; const cl = (cC >= 0 ? String(r[cC] || "").trim() : "") || fallback;
      (res[cl] = res[cl] || []).push([nom.toUpperCase(), prenom]); });
  });
  return res;
}

function readCSV(t) { const lines = t.replace(/\r/g, "").split("\n"), sep = [";", "\t", ","].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0]; return lines.map(l => l.split(sep).map(c => c.replace(/^"|"$/g, "").trim())); }
// lecteur .xlsx minimal (zip + XML), sans bibliothèque externe
async function readXLSX(buf) {
  const dv = new DataView(buf), td = new TextDecoder(); let e = buf.byteLength - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--; if (e < 0) throw new Error("ce n'est pas un fichier .xlsx");
  const n = dv.getUint16(e + 10, true), files = {}; let o = dv.getUint32(e + 16, true);
  for (let i = 0; i < n; i++) { const meth = dv.getUint16(o + 10, true), cs = dv.getUint32(o + 20, true), nl = dv.getUint16(o + 28, true), el = dv.getUint16(o + 30, true), cl = dv.getUint16(o + 32, true), lo = dv.getUint32(o + 42, true); files[td.decode(new Uint8Array(buf, o + 46, nl))] = { meth, cs, lo }; o += 46 + nl + el + cl; }
  const get = async name => { const f = files[name]; if (!f) return null; const ln = dv.getUint16(f.lo + 26, true), le = dv.getUint16(f.lo + 28, true), data = new Uint8Array(buf, f.lo + 30 + ln + le, f.cs); if (!f.meth) return td.decode(data); const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer(); return td.decode(out); };
  const X = s => new DOMParser().parseFromString(s, "application/xml"), T = (el, tag) => [...el.getElementsByTagName(tag)];
  const ssx = await get("xl/sharedStrings.xml"), ss = ssx ? T(X(ssx), "si").map(si => T(si, "t").map(t => t.textContent).join("")) : [];
  const wb = X(await get("xl/workbook.xml")), rels = X(await get("xl/_rels/workbook.xml.rels")), rmap = {};
  T(rels, "Relationship").forEach(r => rmap[r.getAttribute("Id")] = r.getAttribute("Target"));
  const out = {};
  for (const sh of T(wb, "sheet")) {
    const rid = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id"); let tg = rmap[rid] || ""; tg = tg.startsWith("/") ? tg.slice(1) : "xl/" + tg.replace(/^\.\//, "");
    const x = await get(tg); if (!x) continue; const rows = [];
    T(X(x), "row").forEach(row => { const r = []; T(row, "c").forEach(c => { const ref = c.getAttribute("r") || "", col = ref.replace(/\d+/g, "").split("").reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1, t = c.getAttribute("t"), v = T(c, "v")[0]?.textContent ?? ""; r[col >= 0 ? col : r.length] = t === "s" ? ss[+v] ?? "" : t === "inlineStr" ? T(c, "t").map(z => z.textContent).join("") : v; }); rows.push(Array.from(r, v => v ?? "")); });
    out[sh.getAttribute("name")] = rows;
  }
  return out;
}

function shrink(f) { return new Promise(res => { const i = new Image(); i.onload = () => { const k = Math.min(1, 2600 / Math.max(i.width, i.height)), c = document.createElement("canvas"); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(i, 0, 0, c.width, c.height); let q = .85, u = c.toDataURL("image/jpeg", q); while (u.length > 1.4e6 && q > .5) { q -= .1; u = c.toDataURL("image/jpeg", q); } res(u); }; i.src = URL.createObjectURL(f); }); }
