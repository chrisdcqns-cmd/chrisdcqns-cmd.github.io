<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--nv);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}

.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.card h2{margin:0 0 8px;font-size:1.15rem}
.muted{color:var(--mu)}.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:800;min-height:48px;background:var(--nv);color:#fff}

.btn.gh{background:#fff;color:var(--nv);box-shadow:inset 0 0 0 2px var(--li)}
.btn.big{width:100%;min-height:64px;font-size:1.25rem;border-radius:18px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.inp{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:13px;border:2px solid var(--li);background:#fff;color:var(--nv)}

.pc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#fff;border:2px solid var(--li);margin-bottom:10px;width:100%;text-align:left;color:var(--nv)}

.pc.done{border-color:#bfe6d3}.pc.done .n{background:var(--gr)}
.pc.cur{border-color:var(--or)}.pc.cur .n{background:var(--or)}
.pc b{display:block;font-size:1.05rem}
/* carte */
.mapv{position:relative;overflow:hidden;border-radius:14px;background:#ddd;touch-action:none;height:46vh;min-height:260px}
.mapv .in{position:absolute;left:0;top:0;transform-origin:0 0}

.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
.bgrid button{height:54px;border-radius:50%;border:3px solid var(--vi);background:#fff;color:var(--vi);font-weight:900;font-size:1.1rem;aspect-ratio:1;justify-self:center;width:54px;padding:0;position:relative}

.bgrid{row-gap:14px}

.timer{font-variant-numeric:tabular-nums;font-weight:900}
.prep{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--nv);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:12px;position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:10}

.bigb{width:150px;height:150px;border-radius:50%;border:9px solid var(--vi);display:grid;place-items:center;margin:8px auto 4px;font-size:3.4rem;font-weight:900;color:var(--vi);background:#fff}

.kb{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}

.steps{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0}

.flash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--nv);color:#fff;padding:18px 26px;border-radius:18px;font-weight:900;font-size:1.2rem;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:fl .9s forwards;pointer-events:none}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-40%)}15%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0}}
/* bilan */
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--li);text-align:left}
table.t th{font-size:.72rem;text-transform:uppercase;color:var(--mu);letter-spacing:.03em}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.kpi div{background:#f7f4ec;border-radius:13px;padding:10px}
.kpi b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.76rem;color:var(--mu);font-weight:700;text-transform:uppercase}
.bar{height:12px;border-radius:6px;background:var(--or)}
.opts button{border:2px solid var(--li);background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;color:var(--nv);margin:0 6px 6px 0}
.opts button.on{border-color:var(--or);background:#fff4ea}
.ref{font-size:.7rem;color:#b9b2a3;text-align:right;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(20,33,61,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.hide{display:none!important}
h2.fold{cursor:pointer;user-select:none}h2.fold::before{content:attr(data-f) " ";color:var(--mu)}
.scanner{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}.scanner video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.scanner .frame{position:relative;width:64vmin;height:64vmin;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px #0007}.scanner p{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-weight:700}.scanner .bar{position:absolute;bottom:18px;left:0;right:0;display:flex;gap:8px;justify-content:center}.scanner .bar .btn{background:#fff}
.simview{position:fixed;inset:0;z-index:48;background:#14171Cee;display:flex;flex-direction:column}.simview .sv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#fff;padding:8px 12px}.simview .sv-h .small{color:#c9ccd3}.simview .sv-b{flex:1;display:flex;justify-content:center;align-items:center;padding:6px 6px 12px;min-height:0}.simview iframe{width:min(420px,100%);height:min(860px,100%);border:10px solid #000;border-radius:34px;background:#f5f2ea;box-shadow:0 10px 40px #0008}
.simbar{position:sticky;margin:6px 6px 0;z-index:19;display:flex;align-items:center;gap:5px;background:#fff7d6;border:2px dashed #d9a400;border-radius:12px;padding:4px 6px;font-size:.8rem;box-shadow:0 4px 14px #0002}.simbar .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.simbar button{flex:none;border:1px solid #d9a400;background:#fff;border-radius:8px;padding:4px 7px;font:inherit;font-weight:700;cursor:pointer}.simbar .cd{font-family:monospace;font-weight:900;color:var(--vi);font-size:1rem}
body.sun{background:#fff}body.sun .card{border:2px solid #000;box-shadow:none}body.sun .muted,body.sun .small.muted{color:#111!important}body.sun .chrono{font-size:4.2rem}body.sun .bigb{width:180px;height:180px;font-size:4.4rem;border-width:11px}body.sun .kb button{height:62px;font-size:1.5rem;border:2px solid #000;color:#000}body.sun .boxes div{border-width:3px;border-color:#000}body.sun .btn{border:2px solid #000}
@media print{header,.noprint,#eps-home-btn{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;padding:10px}.pb{break-before:page}}

.net{font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14)}
.net.ok{background:#2a9d6f}.net.ko{background:#d62839}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick button{border:2px solid var(--li);background:#fff;border-radius:14px;padding:12px 8px;font-weight:800;color:var(--nv);min-height:58px;line-height:1.15}
.pick button small{display:block;font-weight:600;color:var(--mu);font-size:.78rem;margin-top:2px}
.pick button:active{border-color:var(--or);background:#fff4ea}
.pick.big button{min-height:70px;font-size:1.1rem}
.crumb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.crumb button{border:0;background:var(--li);border-radius:99px;padding:6px 12px;font-weight:800;color:var(--nv);font-size:.85rem}
/* éditeur de tracé */
.dr{position:fixed;inset:0;z-index:60;background:#222;display:flex;flex-direction:column}
.dr .dbar{background:var(--nv);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dr .dbar.bot{padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.dr .mapv{flex:1;border-radius:0;height:auto;min-height:0}
.tb{border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;padding:7px 9px;font-size:.84rem;min-height:40px}

html,body,button,input,a,label,.card,.pc,.kb,.boxes{touch-action:manipulation}html{-webkit-text-size-adjust:100%}
.dr,.dr *,.mapv,.mapv *{touch-action:none}.dr{overscroll-behavior:none}

.sw{flex:none}.wd{flex:none}
.tb.on{background:var(--or)}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.25);padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--or)}
.wd{width:42px;height:42px;border-radius:10px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;padding:0}
.wd.on{background:var(--or)}
.wd i{display:block;background:#fff;border-radius:9px;width:24px}
.sec{border-top:1px solid var(--li);margin-top:12px;padding-top:12px}
.cls{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#f7f4ec;margin-bottom:6px}
.pub{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:9;margin:-4px 0 10px;padding:8px 12px;border-radius:12px;font-size:.85rem;font-weight:700;background:#d5f0e3;color:#11643f}
.pub.wait{background:#fff1d6;color:#7a4b00}.pub.ko{background:#fbd5d9;color:#8c1020}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.retb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:10px;border:2px solid #fbd5d9}
.alarm{position:fixed;inset:0;z-index:90;background:rgba(214,40,57,.96);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:pul 1s infinite alternate}.alarm.mini{bottom:auto;padding:8px 12px calc(10px);animation:none;box-shadow:0 6px 20px #0005}.alarm.mini>div:first-child{font-size:1.5rem!important}.alarm.mini h1{font-size:1.1rem;margin:2px 0}.alarm.mini p{margin:2px 0;font-size:.9rem}.alarm.mini #alOk{margin-top:6px!important;padding:8px;min-height:0}

.alarm h1{font-size:2.4rem;margin:8px 0}.alarm p{font-size:1.2rem;max-width:520px}
@keyframes pul{from{filter:brightness(1)}to{filter:brightness(1.15)}}
.retour{background:#fff4ea;border:2px solid var(--or);border-radius:12px;padding:6px 10px;font-weight:800;font-size:.9rem;margin-top:6px}
.tg{cursor:pointer;display:inline-block;border-radius:8px;padding:2px 4px;margin:-2px -4px}.tg:hover,.tg:focus-visible{background:var(--li)}
.modal.big{align-items:stretch}.modal.big>div{max-width:none;max-height:none;height:100%;border-radius:0;padding:14px 18px calc(80px + env(safe-area-inset-bottom))}
.evk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.evk>div{background:#fff;border-radius:12px;padding:8px 12px}.evk span{display:block;font-size:.75rem;color:var(--mu);font-weight:700}.evk b{font-size:1.3rem}.evk small{display:block;color:var(--mu)}.evk .evn{border:3px solid var(--nv)}.evk .evn b{font-size:1.7rem}.evk .evn b small{display:inline;font-size:1rem}
.evg{overflow:auto}.evgt{width:100%;min-width:820px;border-collapse:separate;border-spacing:6px;table-layout:fixed}.evgt th,.evgt td{vertical-align:top;text-align:left}
.evgt thead th{font-size:.8rem;font-weight:900;padding:0 6px}.evgt tbody th{background:#fff;border-radius:12px;padding:10px;font-weight:400;font-size:.88rem}.evgt tbody th b{display:block;font-size:.95rem}.evgt tbody th small{display:block;color:var(--mu);margin-top:2px}
.evw{margin-top:6px;font-size:.82rem;background:var(--bg);border-radius:8px;padding:5px 7px}
.evc{position:relative;background:#fff;border:2px solid var(--li);border-radius:12px;padding:12px 10px 10px;cursor:pointer;font-size:.9rem;line-height:1.3}.evc small{display:block;color:var(--mu);margin-top:6px;font-weight:800}
.evc.on{border:3px solid var(--dc);background:var(--db);font-weight:700}.evc.on small{color:var(--dc)}.evc.pp{border:2px dashed var(--dc)}

.evp{background:#fff;border-radius:12px;text-align:center!important;vertical-align:middle!important;border:3px solid var(--dc,var(--nv))}.evp b{display:block;font-size:1.5rem}.evp small{display:block;color:var(--mu);font-size:.75rem}
.geg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.geg label{display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--dc);padding-top:6px}.geg label b{color:var(--dc);font-size:.85rem}.geg textarea{padding:8px;font-size:.88rem;resize:vertical}.geg small{font-size:.75rem}@media(max-width:760px){.geg{grid-template-columns:1fr 1fr}}

<script>
"use strict";
const QR = (() => {

  box.innerHTML = `<div class="card"><h2>📱 Cet appareil</h2><p class="small">Élève : <b>${ME ? esc(studentName(ME)) + " · " + esc(ME.classe || "") + " · " + esc(ME.prof) : "aucun"}</b> · ${RUNS.filter(r => r?.fin).length} parcours terminé(s)${RUNS.some(r => r && !r.fin) ? " · 1 parcours en cours" : ""}</p>
   ${RUNS.map((r, k) => r?.fin ? `<button class="btn sm gh" data-tb2="${k}" style="margin:0 6px 6px 0">Bilan détaillé ${esc(P(k).nom)}</button>` : "").join("")}
   <div class="row" style="margin-top:10px">${RUNS.map((r, k) => r ? `<button class="btn sm gh" data-rz="${k}">↺ Refaire ${esc(P(k).nom)}</button>` : "").join("")}</div>
   <button class="btn ko" id="dAll" style="margin-top:12px">Nouvel élève (tout effacer sur cet appareil)</button>
   <button class="btn gh" id="dOut" style="margin-top:12px">Se déconnecter de l'espace enseignant</button>
   <p class="small muted">Pour un test : fais un parcours, puis « Nouvel élève ». Les résultats déjà envoyés restent dans ta Google Sheet.</p></div>`;
  $$("[data-tb2]").forEach(b => b.onclick = () => go("bilan", +b.dataset.tb2, true));
  $$("[data-rz]").forEach(b => b.onclick = async () => { if (await ask("Refaire ce parcours ?", "Le parcours sera effacé sur cet appareil.", "Effacer", "ko")) { RUNS[+b.dataset.rz] = null; saveRuns(); go("prof", "dev"); } });
  $("#dAll").onclick = async () => { if (await ask("Tout effacer ?", "L'identité et les parcours de cet appareil seront effacés.", "Effacer", "ko")) { ME = null; RUNS = emptyRuns(); LS.del("me"); LS.del("out"); saveRuns(); go("home"); } };
  $("#dOut").onclick = () => { TPW = ""; LS.del("tpw"); go("home"); };
}

// pas de zoom de la page (double-tape, pincement hors carte) : gênant pendant la saisie des codes
document.addEventListener("gesturestart", e => { if (!e.target.closest?.(".mapv")) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
let lastTouch = 0; document.addEventListener("touchend", e => { const t = Date.now(); if (t - lastTouch < 350 && !e.target.closest(".mapv,.kb,.sl,input,textarea,select")) { e.preventDefault(); e.target.closest("button")?.click(); } lastTouch = t; }, { passive: false });
setInterval(checkAlerts, 3000); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkAlerts(); });
// Barre de simulation : code de la balise attendue, avance rapide du temps, recommencer
function simBar() {
  const d = document.createElement("div"); d.className = "simbar noprint"; const hd = $("header"); hd.after(d); const top = () => d.style.top = (hd.offsetHeight + 4) + "px"; top(); addEventListener("resize", top);
  const off = () => +(localStorage.getItem("coesim.off") || 0);
  const draw = () => {
    const k = CUR.v === "run" ? CUR.a[0] : null, r = k != null ? RUNS[k] : null, i = r ? r.idx || 0 : 0, n = r && i < r.plan.length ? r.plan[i] : null, b = n != null ? balise(n) : null;
    const k2 = CUR.v === "prep" ? CUR.a[0] : null, r2 = k2 != null ? RUNS[k2] : null;
    d.innerHTML = `<span class="tx">🧪 ${b ? `Balise <b>${esc(n)}</b> → <b class="cd">${esc(b.code)}</b>` : r2 && r2.plan.length ? r2.plan.map(x => `${esc(x)} <span class="cd">${esc((balise(x) || {}).code || "?")}</span>`).join(" · ") : "<b>Simulation</b> : rien n'est envoyé"}</span><button data-s="codes" title="Codes de toutes les balises">🔑</button><button data-s="ff" title="Avancer le temps d'1 minute">⏩ 1 min${off() ? ` <small>(+${Math.round(off() / 60000)})</small>` : ""}</button><button data-s="ff5" title="Avancer le temps de 5 minutes">+5</button><button data-s="rz" title="Recommencer la simulation">↺</button>`;
  };
  d.onclick = async e => {
    const t = e.target.closest("[data-s]")?.dataset.s; if (!t) return;
    if (t === "ff" || t === "ff5") { localStorage.setItem("coesim.off", off() + (t === "ff" ? 60000 : 300000)); draw(); flash(t === "ff" ? "⏩ +1 min" : "⏩ +5 min"); }
    if (t === "codes") { const m = modal(`<div class="row" style="margin-bottom:6px"><h2 style="margin:0" class="grow">🔑 Codes des balises</h2><button class="btn sm gh" id="scX">Fermer</button></div><p class="small muted" style="margin-top:0">Pour la simulation seulement : tape le bon code pour valider une balise, ou un autre pour voir une erreur.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px">${C.balises.map(b => `<div class="card" style="margin:0;padding:6px;text-align:center"><b style="color:var(--vi);font-size:1.2rem">${esc(b.n)}</b><br><span style="font-family:monospace;font-weight:800">${esc(b.code)}</span></div>`).join("")}</div>`); $("#scX", m).onclick = m.close; }
    if (t === "rz") { if (await ask("Recommencer la simulation ?", "L'élève fictif, ses parcours et ses saisies de simulation sont effacés.", "↺ Recommencer", "ko")) window.simReset(); }
  };
  draw(); setInterval(draw, 700);
}

$("#hProf").onclick = openProf; document.body.classList.toggle("sun", !!LS.get("sun", false)); if (SIM) $("#hProf").remove();
(async () => {
  $("#hT").textContent = C.titre; await loadMap(); setNet();
  if (location.hash.startsWith("#r=") && receiveResults(location.hash.slice(3))) { sync(); return; }
  const reopen = LS.get("reopen", ""); LS.del("reopen"); if (/maj=/.test(location.search)) history.replaceState(null, "", location.pathname);
  if (reopen && TPW) { go("prof", reopen); sync().then(() => { if (CUR.v === "prof") go("prof", CUR.a[0]); flash("✓ Appli et données à jour"); }); setInterval(sync, SYNC_MS); document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); }); addEventListener("online", sync); return; }
  if (await recoverLocal()) flash("✓ Tes saisies ont été récupérées sur ce téléphone");
  evCheck();
  if (SIM) simBar(); else try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => setTimeout(checkOffline, 500)).catch(() => {}); } catch (e) {}
  checkOffline(); setTimeout(checkOffline, 8000);
  go("home");
  /* enseignant (console ordinateur, ou mode enseignant commun ouvert sur cet appareil) : directement l'espace enseignant, jamais « Qui es-tu ? »
     (demande de l'enseignant, 27/11/2026) ; console : onglet 📋 Résultats. Le téléphone d'un élève n'a pas le mode enseignant : écran élève. */
  const inConsole = /[?&]console=/.test(location.search);
  if (!SIM && (inConsole || hubT())) openProf(inConsole ? "res" : "suivi");
  if (ME && !RUNS.some(Boolean)) restore().then(() => { if (RUNS.some(Boolean) && ["home", "ident"].includes(CUR.v)) go("home"); });
  sync(); setInterval(sync, SYNC_MS); setInterval(fastSync, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
  addEventListener("online", sync); addEventListener("focus", sync);
})();
