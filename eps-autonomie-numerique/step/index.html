<!DOCTYPE html>
<!-- eps-source-directe : cette page est LA source de l'appli, modifiée directement. Ne jamais la remplacer par une page fabriquée ailleurs (autre conversation, anciens fichiers) : repartir de cette page. Voir CLAUDE.md. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="../eps-lists.js"></script>
<script src="../eps-eval.js"></script>
<script src="../eps-shell.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<title>Step · EPS Autonomie et Numérique</title>
<style>
:root{--fond:#F5F3EE;--carte:#fff;--encre:#14171C;--doux:#6A6F78;--ligne:#E6E1D6;--app:#A21CAF;--app-c:#FAE8FF;--G:#D92D20;--D:#16A34A;--ok:#1E8A4C;--ko:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:#14171C;color:#fff;padding:10px 14px 14px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 -4px 0 var(--app)}
header .mk{width:36px;height:36px;border-radius:10px;background:var(--app);padding:6px;flex:none}
header h1{font-size:20px;margin:0;line-height:1.1;font-weight:800}
header small{display:block;color:#A9AEB8;font-weight:500;font-size:13px}
header [data-eps-bar]{margin-left:auto;display:flex;gap:6px;align-items:center}
nav.onglets{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--ligne);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.onglets .in{display:flex;width:100%;max-width:1100px}
nav.onglets button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:12px;color:var(--doux);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
nav.onglets button b{font-size:20px;line-height:1}
nav.onglets button.actif{color:var(--app);font-weight:700}
main{padding:16px}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.doux{color:var(--doux)}.petit{font-size:13px}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:18px;padding:14px;margin:0 0 14px;box-shadow:0 2px 6px rgba(20,23,28,.04)}
.btn{border:1px solid var(--ligne);background:#fff;border-radius:12px;min-height:44px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--app);border-color:var(--app);color:#fff}
.btn.plein{width:100%}
.btn.on{background:var(--app-c);border-color:var(--app);color:var(--app)}
.btn.dng{color:var(--ko)}
.btn:disabled{opacity:.45}
.ic{min-width:44px;padding:8px}
.rang{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pas{background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:8px;text-align:center;display:block;width:100%}
.pas b{display:block;font-size:15px;margin-top:4px}
.pas small{color:var(--doux)}
.pas.off{opacity:.4}
svg.sch{display:block;width:100%;height:auto;border-radius:10px;background:#EEF0F3;touch-action:none}
.champ{display:grid;gap:4px;margin:0 0 10px;font-weight:600;font-size:13px}
.champ input,.champ select,.champ textarea,select.s,input.s{border:1px solid var(--ligne);border-radius:10px;min-height:44px;padding:8px 10px;background:#fff;font-weight:500;font-size:15px;width:100%}
.ligne{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:8px;margin:0 0 8px}
.ligne .n{width:28px;height:28px;border-radius:9px;background:var(--app-c);color:var(--app);font-weight:800;display:grid;place-items:center;flex:none}
.ligne .mini{width:74px;flex:none}
.ligne .tx{flex:1;min-width:0}
.ligne .tx b{display:block}
.puce{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--app-c);color:var(--app)}
.puce.g{background:#EEF0F3;color:#3A3F47}
.jauge{height:10px;border-radius:99px;background:#EEF0F3;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--app)}
.jauge.trop i{background:var(--ko)}
.info{background:var(--app-c);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.tempo{display:flex;align-items:center;gap:10px}
.tempo output{font-weight:800;font-size:22px;min-width:84px;text-align:center}
.tempo input[type=range]{flex:1;min-height:44px;accent-color:var(--app)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14171C;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;max-width:90vw}
/* fenêtres */
.voile{position:fixed;inset:0;z-index:90;background:rgba(20,23,28,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
.feuille{background:var(--fond);border-radius:20px;width:100%;max-width:820px;padding:16px;margin:auto}
.f-haut{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.f-haut h2{margin:0;flex:1}
.temps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.temps figure{margin:0;background:#fff;border:2px solid var(--ligne);border-radius:12px;padding:5px;position:relative}
.temps figure.on{border-color:var(--app);box-shadow:0 0 0 3px var(--app-c)}
.temps figcaption{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:8px;background:#14171C;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.temps .mot{display:block;text-align:center;font-size:12px;font-weight:700;color:var(--doux);min-height:16px}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600;margin:8px 0}
.legende i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px}
/* lecteur */
.pl{background:#14171C;color:#fff;border-radius:20px;width:100%;max-width:820px;margin:auto;overflow:hidden}
/* lecteur en plein écran : support visuel à suivre pendant la réalisation, lisible à distance */
.voile.plein{padding:0;background:#14171C}
.voile.plein .pl{max-width:none;min-height:100vh;border-radius:0;display:flex;flex-direction:column}
.voile.plein .pl-corps{flex:1;min-height:0}
#plSvg{width:min(100%,calc((100vh - 390px)*1.25));min-width:200px;margin:auto}
.pl-prog{height:8px;background:#2A2F37}.pl-prog i{display:block;height:100%;width:0;background:var(--app)}
.pl-suiv{display:flex;align-items:center;gap:10px}
.pl-suiv .mini{width:86px;flex:none;opacity:.9}
.pl-haut{display:flex;align-items:center;gap:10px;padding:12px 14px;box-shadow:inset 0 -4px 0 var(--app)}
.pl-haut b{flex:1;font-size:clamp(34px,7vw,72px);font-weight:900;line-height:1.05;letter-spacing:-.01em}
.pl-haut span{color:#A9AEB8;font-weight:700;font-size:13px}
/* nom du pas centré (demande de l'enseignant) : la marge de gauche équilibre le bouton ✕ de droite */
.pl-titre{flex:1;min-width:0;text-align:center;padding-left:54px}
.pl-titre b{display:block}
.pl-x{border:1px solid #3A3F47;background:none;color:#D5D8DE;border-radius:10px;min-width:44px;min-height:44px;font-size:18px}
.pl-corps{display:grid;grid-template-columns:1fr 130px;gap:12px;padding:12px 14px;align-items:center}
.pl-k{font-size:96px;font-weight:900;text-align:center;line-height:1}
.pl-k small{display:block;font-size:13px;color:#A9AEB8;font-weight:700}
.pl-k.flash{color:#F0ABFC}
.pl-dots{display:flex;gap:6px;padding:0 14px;flex-wrap:wrap}
.pl-dots i{flex:1;min-width:22px;height:30px;border-radius:8px;background:#2A2F37;color:#A9AEB8;font-style:normal;font-weight:800;display:grid;place-items:center;font-size:14px}
.pl-dots i.on{background:var(--app);color:#fff}
.pl-suiv{padding:8px 14px;color:#D5D8DE;font-weight:700;font-size:17px;min-height:42px}
.pl-bas{display:flex;gap:8px;align-items:center;padding:0 14px 14px;flex-wrap:wrap}
.pl-bas .btn{background:#2A2F37;border-color:#3A3F47;color:#fff}
.pl-bas .btn.on{background:var(--app);border-color:var(--app)}
.pl-bas output{font-weight:800;font-size:20px;min-width:92px;text-align:center}
/* éditeur de pas */
.ed{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.ed-t{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ed-t button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--ligne);background:#fff;font-weight:800;position:relative}
.ed-t button.on{background:#14171C;color:#fff;border-color:#14171C}
.ed-t button.a::after{content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--app)}
.pied{display:flex;align-items:center;gap:8px}
.pied i{width:18px;height:18px;border-radius:50%;flex:none}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--ligne);padding:8px 6px;text-align:left;vertical-align:top}
.obs3{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){#plSvg{width:min(100%,calc((100vh - 460px)*1.25))}.pl-suiv .mini{width:64px}.ed{grid-template-columns:1fr}.temps{grid-template-columns:repeat(2,1fr)}.pl-corps{grid-template-columns:1fr}.pl-k{font-size:64px}.ligne .mini{width:56px}}
@media print{header,nav.onglets,.f-haut .btn,.no-print{display:none!important}.voile{position:static;background:none;padding:0}.app{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="mk" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h6v-5h6v-5h6"/><circle cx="7" cy="7" r="2.5"/></svg>
    <div><h1>Step<small id="sousTitre">CA5 · S'entraîner</small></h1></div>
    <span data-eps-bar></span>
  </header>
  <main id="vue"></main>
</div>
<nav class="onglets"><div class="in" id="onglets"></div></nav>
<div id="calque"></div>

<script>
"use strict";
/* ======================= STEP (CA5) =======================
   Pas (créés par l'enseignant : pieds posés temps par temps) · métronome · blocs des groupes · observation.
   Données partagées entre tablettes : magasin « step.v1 » (EPSD.store, préfixe « sp| »). Notes : step/CLAUDE.md */
const KST="step.v1", COL="#A21CAF";
const ICONE='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h6v-5h6v-5h6"/><circle cx="7" cy="7" r="2.5"/></svg>';
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
/* nombre saisi : virgule acceptée, champ vide ou non numérique refusé (valeur de repli) */
const num=(v,d)=>{ const t=String(v==null?"":v).replace(",",".").trim(); if(!t) return d; const x=Number(t); return isFinite(x)?x:d; };
const borne=(x,a,b)=>Math.min(b,Math.max(a,x));
const auj=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
const SS={ get:k=>{ try{ return sessionStorage.getItem("step_"+k); }catch(e){ return null; } }, set:(k,v)=>{ try{ sessionStorage.setItem("step_"+k,v); }catch(e){} }, del:k=>{ try{ sessionStorage.removeItem("step_"+k); }catch(e){} } };
function estProf(){ if(window.EPS_VUE_ELEVE) return false; try{ return Date.now() < +(localStorage.getItem("eps.teach.until")||0); }catch(e){ return false; } }

/* ======================= PARAMÈTRES RÉGLABLES (⚙ Réglages → 🎛 Paramètres) ======================= */
const P_=d=>{ try{ return window.EPSP?EPSP.p(d):d.def; }catch(e){ return d.def; } };
const PRM={
  bpmMin:P_({id:"bpm_min",sec:"Métronome",label:"Tempo le plus lent (battements par minute)",type:"number",def:80}),
  bpmMax:P_({id:"bpm_max",sec:"Métronome",label:"Tempo le plus rapide (battements par minute)",type:"number",def:150}),
  bpmDef:P_({id:"bpm_def",sec:"Métronome",label:"Tempo proposé au départ",type:"number",def:120}),
  dec:P_({id:"decompte",sec:"Métronome",label:"Temps de décompte avant le départ (« 5, 6, 7, 8 »)",type:"number",def:4}),
  blocT:P_({id:"bloc_temps",sec:"Blocs",label:"Nombre de temps d'un bloc",type:"number",def:32,aide:"La jauge du bloc de l'élève se remplit jusqu'à ce nombre."}),
  grpMax:P_({id:"grp_max",sec:"Blocs",label:"Nombre d'élèves maximum par groupe",type:"number",def:6}),
  durees:P_({id:"durees",sec:"Pas",label:"Durées possibles d'un pas (en temps)",type:"list",def:["4","8","16"]}),
  etats:P_({id:"etats",sec:"Pas",label:"Intitulés des 5 appuis (posé, pointe, levé, talon, demi-appui)",type:"list",fixed:5,def:["Posé","Pointe","Levé","Talon","Demi-appui"],aide:"Demi-appui : le pied se pose sans que le corps monte dessus (mambo)."}),
  fcDuree:P_({id:"fc_duree",sec:"Fréquence cardiaque",label:"Durée du comptage du pouls (secondes)",type:"number",def:15,aide:"Le nombre de battements comptés est ramené à la minute (15 s : × 4)."}),
  obsCrit:P_({id:"obs_crit",sec:"Observation",label:"Critères de la fiche d'observation",type:"list",def:["Le groupe est en rythme avec le métronome","Les pas sont complets (pied à plat sur le step)","L'enchaînement est mémorisé, sans arrêt","Le groupe est ensemble","Le bloc est réalisé des deux côtés"]}),
  obsNiv:P_({id:"obs_niv",sec:"Observation",label:"Intitulés des 3 réponses (oui, en partie, pas encore)",type:"list",fixed:3,def:["Oui","En partie","Pas encore"]})
};
const BPM_MIN=borne(Math.round(+PRM.bpmMin)||80,30,300), BPM_MAX=Math.max(BPM_MIN+5,borne(Math.round(+PRM.bpmMax)||150,40,300));
const BPM_DEF=borne(Math.round(+PRM.bpmDef)||120,BPM_MIN,BPM_MAX), DEC=borne(Math.round(+PRM.dec)||0,0,16);
const BLOC_T=borne(Math.round(+PRM.blocT)||32,4,256), GRP_MAX=borne(Math.round(+PRM.grpMax)||6,1,12);
const DUREES=(()=>{ const L=(Array.isArray(PRM.durees)?PRM.durees:[]).map(x=>Math.round(num(x,0))).filter(x=>x>=1&&x<=32); return L.length?[...new Set(L)]:[4,8,16]; })();
const ETATS=["Posé","Pointe","Levé","Talon","Demi-appui"].map((d,i)=>String((PRM.etats||[])[i]||d));
const FC_D=borne(Math.round(+PRM.fcDuree)||15,6,60);
const OBS_CRIT=(Array.isArray(PRM.obsCrit)?PRM.obsCrit:[]).map(String).filter(x=>x.trim());
const OBS_NIV=["Oui","En partie","Pas encore"].map((d,i)=>String((PRM.obsNiv||[])[i]||d));

/* ======================= DONNÉES PARTAGÉES ENTRE TABLETTES =======================
   p|<id> pas · j|<classe>|<date> leçon du jour · b|<classe>|<groupe>|<id> bloc d'un groupe · o|<classe>|<id> observation
   f|<classe>|<id> mesure de fréquence cardiaque · t|<classe>|<groupe> où en est le groupe (tablette de contrôle) */
/* 👁 Vue élève de l'enseignant : tout fonctionne, mais rien n'est enregistré ni envoyé (gardé en mémoire le temps de l'aperçu) */
const VUE=!!window.EPS_VUE_ELEVE, VUEMEM={};
function stLd(){ let v=null; try{ v=JSON.parse(localStorage.getItem(KST)||"null"); }catch(e){} if(!v||typeof v!=="object"||!v.items||typeof v.items!=="object") v={items:{},pend:{},since:0}; if(!v.pend||typeof v.pend!=="object") v.pend={}; if(VUE) Object.assign(v.items,VUEMEM); return v; }
function stSv(v){ try{ localStorage.setItem(KST,JSON.stringify(v)); return true; }catch(e){ toast("Mémoire de la tablette pleine : rien n'a été enregistré."); return false; } }
function stPut(id,obj){ if(VUE){ obj.u=Date.now(); VUEMEM[id]=obj; return true; } const v=stLd(); obj.u=Math.max(Date.now(),((v.items[id]||{}).u||0)+1); v.items[id]=obj; v.pend[id]=obj.u; const ok=stSv(v); try{ window.EPSD&&EPSD.syncSoon&&EPSD.syncSoon(); }catch(e){} return ok; }
function stDel(id){ const v=stLd(), o=v.items[id]; if(!o) return; stPut(id,{del:1,c:o.c||""}); }
const stItems=pre=>Object.entries(stLd().items).filter(([k,o])=>k.startsWith(pre)&&o&&typeof o==="object"&&!o.del);
(function brancher(n){ if(window.EPSD&&EPSD.store){ EPSD.store({pre:"sp|", key:KST, onChange:()=>{ if(!$("#calque").innerHTML) rendre(); }}); } else if(n<40) setTimeout(()=>brancher(n+1),250); })(0);
window.epsSyncNow=function(){ try{ return EPSD.syncOne(KST); }catch(e){} };

/* ======================= PAS =======================
   {id, nom, n (temps), d (repère), c:[{L:{x,y,a,s}, R:{…}, t}]} · un temps ne note que le ou les pieds qui bougent.
   Schéma vu de dessus (100 × 80) : le step en haut, l'élève en bas, face au step. a = angle en degrés (0 = pointe vers le step).
   s = 0 posé · 1 pointe · 2 levé · 3 talon · 4 demi-appui (pied posé sans monter dessus, ex. mambo). j = 1 : temps sauté.
   Pied gauche rouge (G), pied droit vert (D). */
const DEPART={L:{x:44,y:60,a:0,s:0}, R:{x:56,y:60,a:0,s:0}};
const HAUT=27, BAS=60, XG=44, XD=56;
const T=(L,R,t)=>{ const o={}; if(L) o.L={x:L[0],y:L[1],a:L[2]||0,s:L[3]||0}; if(R) o.R={x:R[0],y:R[1],a:R[2]||0,s:R[3]||0}; if(t) o.t=t; return o; };
const SRC_GRE="Répertoire step, académie de Grenoble (I. Boulnois, P. Kogut, 2007)";
const SRC_DEF="Pas de base : définitions, académie de Grenoble";
/* Pas de départ : seulement ceux dont le déroulé temps par temps est écrit dans une source institutionnelle (vérifiés le 26/11/2026).
   Départ pied droit (« de l'autre côté » = départ pied gauche). Les pas de profil, à cheval, tournants ou sautés ne sont pas fournis :
   leur placement n'est pas décrit avec assez de précision dans ces sources ; l'enseignant les crée avec l'éditeur. */
const lift=(nom,mot,yl,d)=>({id:"v-"+norm(nom),nom,n:4,d,src:SRC_GRE,c:[T(0,[XD,HAUT]),T([XG,yl,0,2],0,mot),T([XG,BAS]),T(0,[XD,BAS])]});
const PAS_EXEMPLES=[
 {id:"v-basic",nom:"Basic",n:4,d:"Face au step. Monter au milieu, dans l'axe, puis redescendre du même pied.",src:SRC_GRE,
  c:[T(0,[XD,HAUT]),T([XG,HAUT]),T(0,[XD,BAS]),T([XG,BAS])]},
 {id:"v-vstep",nom:"V step",n:4,d:"Face au step. En montant on écarte les appuis, en descendant on les resserre.",src:SRC_GRE,
  c:[T(0,[68,HAUT,20]),T([32,HAUT,-20]),T(0,[XD,BAS]),T([XG,BAS])]},
 {id:"v-astep",nom:"A step",n:4,d:"Face au step. En montant, appuis au centre ; en descendant, on les écarte.",src:SRC_GRE,
  c:[T(0,[XD,HAUT]),T([XG,HAUT]),T(0,[68,BAS]),T([32,BAS])]},
 lift("Genou","Genou",HAUT,"Monter au milieu, dans l'axe. En appui sur une jambe, monter le genou de l'autre, puis redescendre."),
 lift("Coup de pied","Kick",12,"Monter au milieu, dans l'axe. En appui sur une jambe, coup de pied avant de l'autre, puis redescendre."),
 lift("Talon-fesse","Talon",40,"Monter au milieu, dans l'axe. En appui sur une jambe, ramener le talon de l'autre vers la fesse, puis redescendre."),
 lift("Dégagé haut","Dégagé",47,"Monter au milieu, dans l'axe. En appui sur une jambe, l'autre jambe tendue derrière, puis redescendre."),
 {id:"v-tapehaut",nom:"Tape haut",n:4,d:"Monter un pied, taper le haut du step avec l'autre, puis redescendre.",src:SRC_GRE,
  c:[T(0,[XD,HAUT]),T([XG,HAUT,0,1],0,"Tape"),T([XG,BAS]),T(0,[XD,BAS])]},
 {id:"v-tapebas",nom:"Tape bas",n:4,d:"Monter, monter, descendre, puis taper le sol sans poser : on repart de ce pied. Sert à changer de pied de départ.",src:SRC_GRE,
  c:[T(0,[XD,HAUT]),T([XG,HAUT]),T(0,[XD,BAS]),T([XG,BAS,0,1],0,"Tape")]},

/* ---------- Lecteur : pas après pas, au métronome ---------- */
let PL=null;
/* l'écran reste allumé pendant la lecture (les élèves suivent le support sans toucher la tablette) */
let VEILLE=null;
function veille(on){ try{ if(on){ if(navigator.wakeLock&&!VEILLE) navigator.wakeLock.request("screen").then(w=>{ VEILLE=w; w.addEventListener("release",()=>{ if(VEILLE===w) VEILLE=null; }); },()=>{}); } else if(VEILLE){ const w=VEILLE; VEILLE=null; w.release().catch(()=>{}); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&PL&&!PL.pause) veille(true); });
function lancer(items,o){ o=o||{}; const I=items.map(x=>({p:pasId(x.p),m:x.m?1:0,b:x.b||"",bpm:+x.bpm||0})).filter(x=>x.p); if(!I.length) return toast("Aucun pas à lancer.");
  const seq=[]; I.forEach((x,i)=>{ for(let k=1;k<=x.p.n;k++) seq.push({i,k}); });
  PL={I,seq,dec:DEC,bpm:borne(o.bpm||S.bpm,30,300),verrou:!!o.verrou,boucle:o.boucle!==false,titre:o.titre||"",pause:false,base:0,src:o.src||"",joue:false,manuel:false};
  veille(true);
  if(PL.src==="bloc") etatTab("lance",PL.titre,true); else if(PL.src==="pas") etatTab("fiche",I[0].p.nom);
  $("#calque").innerHTML=`<div class="voile plein"><div class="pl">
    <div class="pl-prog" aria-hidden="true"><i id="plProg"></i></div>
    <div class="pl-haut"><div class="pl-titre"><span id="plPos"></span><br><b id="plNom">Prêt ?</b></div><button type="button" class="pl-x" data-act="fermer" aria-label="Arrêter et fermer">✕</button></div>
    <div class="pl-corps"><div id="plSvg"></div><div class="pl-k" id="plK">–<small id="plMot"></small></div></div>
    <div class="pl-dots" id="plDots"></div><div class="pl-suiv" id="plSuiv"></div>
    <div class="pl-bas"><button type="button" class="btn ic" data-act="plBpm" data-d="-5" ${PL.verrou?"disabled":""} aria-label="Moins vite">−</button><output id="plBpm">${PL.bpm} bpm</output><button type="button" class="btn ic" data-act="plBpm" data-d="5" ${PL.verrou?"disabled":""} aria-label="Plus vite">+</button>
      <button type="button" class="btn" data-act="plPause" id="plPause">⏸ Pause</button><button type="button" class="btn ${PL.boucle?"on":""}" data-act="plBoucle" id="plBoucle">🔁 En boucle</button><button type="button" class="btn ${MT.son?"on":""}" data-act="plSon" id="plSon">🔊 Son</button><button type="button" class="btn" data-act="plDebut">⏮ Début</button></div></div></div>`;
  plDepart(0); }
function plDepart(base,sansDec){ if(!PL) return; PL.base=base; PL.pause=false; PL.fin=false; PL.suivI=-1; veille(true); const pp=$("#plPause"); if(pp) pp.textContent="⏸ Pause";
  const d=sansDec?0:PL.dec, n=PL.seq.length;
  mtStart(PL.bpm,i=>plBat(i,d),i=>{ if(i<d) return 0; const s=PL.seq[(base+i-d)%n]; return s.k===1?2:s.k%4===1?1:0; }); }
function plBat(i,d){ if(!PL) return; const n=PL.seq.length;
  if(i<d){ const x=PL.I[0]; $("#plPos").textContent=PL.titre||"Décompte"; $("#plNom").textContent="Prêt ?"; $("#plK").firstChild.textContent=String(8-d+i+1>0?8-d+i+1:i+1); $("#plMot").textContent="décompte"; $("#plSvg").innerHTML=schema(x.p,0,x.m,{tout:1}); PL.pos=null; $("#plDots").innerHTML=""; $("#plSuiv").textContent="Départ : "+x.p.nom; $("#plProg").style.width="0"; return; }
  PL.joue=true; const j=PL.base+i-d; if(j>=n&&!PL.boucle){ mtStop(); PL.pause=true; PL.fin=true; PL.base=0; $("#plNom").textContent="Terminé 👏"; $("#plK").firstChild.textContent="✓"; $("#plMot").textContent=""; $("#plSuiv").textContent=""; const pp=$("#plPause"); if(pp) pp.textContent="▶ Recommencer"; return; }
  const s=PL.seq[j%n], x=PL.I[s.i], e=etat(x.p,s.k,x.m), suiv=PL.I[(s.i+1)%PL.I.length]; PL.cur=j%n;
  /* chorégraphie : chaque bloc garde son tempo, sauf tempo imposé ou réglé à la main pendant la lecture */
  if(s.k===1&&x.bpm&&!PL.verrou&&!PL.manuel&&x.bpm!==PL.bpm){ PL.bpm=borne(x.bpm,30,300); MT.bpm=PL.bpm; $("#plBpm").textContent=PL.bpm+" bpm"; }
  $("#plProg").style.width=((j%n+1)/n*100).toFixed(1)+"%";
  $("#plPos").textContent=(x.b||PL.titre?(x.b||PL.titre)+" · ":"")+"Pas "+(s.i+1)+" sur "+PL.I.length+(x.m?" · de l'autre côté":"");
  $("#plNom").textContent=x.p.nom; const K=$("#plK"); K.firstChild.textContent=String(s.k); K.classList.toggle("flash",s.k===1); $("#plMot").textContent=(e.mot||"")+(e.saut?(e.mot?" · ":"")+"sauté":"");
  plDessin(x.p,s.k,x.m);
  $("#plDots").innerHTML=Array.from({length:x.p.n},(_,q)=>`<i class="${q+1===s.k?"on":""}">${q+1}</i>`).join("");
  if(PL.suivI!==s.i){ PL.suivI=s.i; const dernier=s.i+1>=PL.I.length&&!PL.boucle; /* aperçu du pas suivant : redessiné seulement au changement de pas */
    $("#plSuiv").innerHTML=PL.I.length>1||PL.boucle?(dernier?"Dernier pas":`<span class="mini">${schema(suiv.p,1,suiv.m)}</span><span>Ensuite : ${h(suiv.p.nom)}${suiv.m?" (de l'autre côté)":""}${suiv.b&&suiv.b!==x.b?" · "+h(suiv.b):""}</span>`):""; }
}
function plPause(){ if(!PL) return; if(PL.pause){ plDepart(PL.base,!PL.fin); return; } mtStop(); veille(false); PL.pause=true; const s=PL.seq[PL.cur||0]; PL.base=Math.max(0,(PL.cur||0)-(s.k-1)); /* reprise au début du pas en cours, sans décompte */ $("#plPause").textContent="▶ Reprendre"; }
function itemsBloc(b){ const A=b.items.map(x=>({p:x.p,m:x.m,b:b.nom,bpm:b.bpm})); return b.sym?A.concat(A.map(x=>({p:x.p,m:x.m?0:1,b:b.nom+" · autre côté",bpm:b.bpm}))):A; }
/* ⬇ Export (PDF ou vidéo, bloc par bloc ou en entier) : step/export.js, chargé à la demande ; rien n'est envoyé, le fichier est fabriqué sur l'appareil */

/* ---------- Enseignant : groupes en direct (tablette de contrôle du step) ----------
   ctlHtml(classe, court) sert à l'écran « Groupes en direct » et à la 🖥 Tablette de contrôle commune (window.epsCtlApp, sans boutons). */
function ctlHtml(cls,court){ const B=blocsDe(cls), J=jourDe(cls), T={}, G={}, F=fcDe(cls).filter(f=>f.d===auj()), O=obsDe(cls), jour=auj();
  stItems("t|"+cls+"|").forEach(([,o])=>{ if(o.gk) T[String(o.gk)]=o; });
  B.forEach(b=>(G[b.gk]=G[b.gk]||{noms:b.noms,blocs:[]}).blocs.push(b));
  Object.keys(T).forEach(k=>{ if(T[k].d===jour&&!G[k]) G[k]={noms:Array.isArray(T[k].noms)?T[k].noms.map(String):[],blocs:[]}; });
  const actif=k=>T[k]&&T[k].d===jour, K=Object.keys(G).sort((a,b)=>(actif(b)?1:0)-(actif(a)?1:0)||String(G[a].noms[0]||"").localeCompare(String(G[b].noms[0]||""),"fr"));
  const enG=new Set(); K.filter(actif).forEach(k=>G[k].noms.forEach(n=>enG.add(norm(n)))); const P=presents(cls), sans=P.filter(n=>!enG.has(norm(n)));
  const complets=B.filter(b=>tempsBloc(b)===BLOC_T).length, oj=O.filter(o=>o.d===jour).length;
  let hh=`<div class="rang" style="margin-bottom:12px"><span class="puce">👥 ${K.filter(actif).length} groupe(s) aujourd'hui</span><span class="puce g">🙋 ${P.length-sans.length} / ${P.length} élèves en groupe</span><span class="puce g">🧱 ${complets} bloc(s) complet(s)</span><span class="puce g">❤️ ${F.length} mesure(s)</span><span class="puce g">👀 ${oj} observation(s)</span></div>`;
  if(sans.length&&K.some(actif)) hh+=`<div class="info" style="background:#FFF4E5"><b>⏳ Pas encore dans un groupe : </b>${sans.map(h).join(", ")}</div>`;
  hh+=K.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(${court?260:320}px,1fr));gap:12px;align-items:start">${K.map(k=>{ const g=G[k], t=T[k], on=actif(k), frais=on&&Date.now()-(+t.at||0)<5*60000, f=F.filter(x=>x.gk===k), o=O.filter(x=>x.gk===k), fait=O.filter(x=>x.d===jour&&norm((Array.isArray(x.de)?x.de:[]).join("+"))===norm(g.noms.join("+"))).length;
      const der={}; f.slice().reverse().forEach(x=>Object.keys(x.v).forEach(n=>der[n]=x.v[n]));
      return `<div class="carte" style="margin:0;border-left:6px solid ${frais?"#1E8A4C":on?"#E67E22":"#C9C3B6"}"><h3 style="margin-bottom:4px">👥 ${h(g.noms.map(prenom).join(", ")||"Groupe")}</h3>
       <div class="petit" style="margin-bottom:6px">${on?`<b>${h(ETAT_TXT[t.e]||"connecté")}${t.x?" « "+h(t.x)+" »":""}</b> <span class="doux">· ${depuis(t.at)}${+t.n?" · "+(+t.n)+" lancement(s)":""}</span>`:`<span class="doux">Pas connecté aujourd'hui</span>`}</div>
       ${g.blocs.map(b=>{ const tt=tempsBloc(b); return `<div style="border-top:1px solid var(--ligne);padding:8px 0"><div class="rang" style="justify-content:space-between"><b>${h(b.nom)}</b><span class="rang"><span class="puce ${tt===BLOC_T?"":"g"}">${tt} / ${BLOC_T} temps</span><span class="puce g">${b.bpm} bpm</span>${court?"":`<button type="button" class="btn" data-act="suiviJouer" data-id="${h(b.id)}" ${b.items.length?"":"disabled"}>▶ Voir</button><button type="button" class="btn ic" data-act="suiviFiche" data-id="${h(b.id)}" ${b.items.length?"":"disabled"} aria-label="Fiche du bloc">📄</button>`}</span></div><div class="petit">${b.items.map(x=>{ const p=pasId(x.p); return h(p?p.nom:"?")+(x.m?" ⇄":""); }).join(" → ")||"<span class='doux'>vide</span>"}${b.sym?" · puis de l'autre côté":""}</div></div>`; }).join("")||`<div class="petit doux">Aucun bloc pour l'instant.</div>`}
       ${!court&&g.blocs.some(b=>b.items.length)?`<button type="button" class="btn plein" data-act="suiviExport" data-gk="${h(k)}" style="margin:2px 0 8px">⬇ Exporter la chorégraphie (PDF ou vidéo)</button>`:""}
       ${Object.keys(der).length?`<div style="border-top:1px solid var(--ligne);padding:8px 0"><div class="petit doux">❤️ Dernière mesure (${f.length} aujourd'hui)</div><div class="rang" style="margin-top:4px">${Object.keys(der).map(n=>fcPuce(J,n,der[n])).join("")}</div></div>`:J&&J.fc&&on?`<div class="petit doux" style="border-top:1px solid var(--ligne);padding-top:8px">❤️ Pas encore de mesure</div>`:""}
       ${o.length||fait?`<div class="petit" style="border-top:1px solid var(--ligne);padding-top:8px">👀 ${o.length} observation(s) reçue(s)${fait?" · "+fait+" faite(s) aujourd'hui":""}${o[0]&&o[0].com?`<br><span class="doux">Dernier conseil reçu : ${h(o[0].com)}</span>`:""}</div>`:""}</div>`; }).join("")}</div>`
    :`<p class="doux">Aucun groupe pour cette classe. Les groupes arrivent ici dès qu'une tablette choisit ses élèves.</p>`;
  return hh; }

function edOuvrir(id){ const p=id?pasId(id):null; S.ed={p:p?JSON.parse(JSON.stringify(p)):{id:"p"+uid(),nom:"",n:DUREES.includes(8)?8:DUREES[0],d:"",c:[],o:500,ex:0},k:1,cote:"R",neuf:!p}; edCaler(); edRendre(); }
function edCaler(){ const E=S.ed, p=E.p; p.c=Array.from({length:p.n},(_,i)=>p.c[i]&&typeof p.c[i]==="object"?p.c[i]:{}); E.k=borne(E.k,1,p.n); }
function edRendre(){ const E=S.ed, p=E.p, t=p.c[E.k-1], f=t[E.cote], D=[...new Set(DUREES.concat([p.n]))].sort((a,b)=>a-b);

     ${schema(p,E.k,0,{id:"edSvg",sel:E.cote})}

   </div><div>
     <label class="champ">Nom du pas<input id="edNom" maxlength="40" autocomplete="off" value="${h(p.nom)}"></label>

     <button type="button" class="btn plein ${t.j?"on":""}" data-act="edSaut" aria-pressed="${t.j?"true":"false"}" style="margin-bottom:10px">⤴ Temps sauté ${t.j?"· oui":"· non"}</button>
     <label class="champ">Mot affiché à ce temps (facultatif)<input id="edMot" maxlength="24" autocomplete="off" value="${h(t.t||"")}" placeholder="Genou, Pointe…"></label>

   </div></div>
   <label class="champ" style="margin-top:12px">Repère pour l'élève (comment faire)<textarea id="edD" rows="2" maxlength="300" data-eps-comment>${h(p.d)}</textarea></label>
   <div class="rang" style="margin-bottom:10px"><button type="button" class="btn" data-act="edCopie" data-m="0" ${p.n%2===0?"":"disabled"}>⧉ Recopier la 1re moitié sur la 2e</button><button type="button" class="btn" data-act="edCopie" data-m="1" ${p.n%2===0?"":"disabled"}>⇄ … de l'autre côté</button></div>
   <div class="rang"><button type="button" class="btn p" data-act="edOk" style="flex:1">✓ Enregistrer le pas</button><button type="button" class="btn" data-act="edEssai">▶ Essayer</button>${E.neuf?"":`<button type="button" class="btn dng" data-act="edSuppr">🗑 Supprimer</button>`}</div>
  </div></div>`;
  edBrancher(); }
function edPoint(ev,svg){ const r=svg.getBoundingClientRect(); return {x:borne(Math.round((ev.clientX-r.left)/r.width*100),3,97),y:borne(Math.round((ev.clientY-r.top)/r.height*80),4,76)}; }
function edBrancher(){ const svg=$("#edSvg"); if(!svg) return; let tire=false;
  const poser=ev=>{ const E=S.ed, t=E.p.c[E.k-1], pt=edPoint(ev,svg), e=etat(E.p,E.k,0)[E.cote]; t[E.cote]=Object.assign({a:e.a,s:t[E.cote]?t[E.cote].s:0},t[E.cote]||{},pt); };
  svg.addEventListener("pointerdown",ev=>{ ev.preventDefault(); const g=ev.target.closest("[data-pied]"); if(g&&g.dataset.pied!==S.ed.cote&&S.ed.p.c[S.ed.k-1][g.dataset.pied]){ S.ed.cote=g.dataset.pied; edRendre(); return; } tire=true; try{ svg.setPointerCapture(ev.pointerId); }catch(e){} poser(ev); edDessin(); });
  svg.addEventListener("pointermove",ev=>{ if(!tire) return; poser(ev); edDessin(); });
  const fin=()=>{ if(!tire) return; tire=false; edRendre(); }; svg.addEventListener("pointerup",fin); svg.addEventListener("pointercancel",fin); }
function edDessin(){ const svg=$("#edSvg"), E=S.ed; if(!svg) return; const tmp=document.createElement("div"); tmp.innerHTML=schema(E.p,E.k,0,{sel:E.cote}); svg.innerHTML=tmp.firstChild.innerHTML; }
function edLire(){ const E=S.ed; if(!E) return; const a=$("#edNom"), d=$("#edD"), m=$("#edMot"); if(a) E.p.nom=a.value; if(d) E.p.d=d.value; if(m){ const t=E.p.c[E.k-1]; const v=m.value.trim(); if(v) t.t=v; else delete t.t; } }

  metro(){ metroSeul(); },

  chgClasse(){ S.classe=null; S.groupe=null; S.choix=[]; SS.del("classe"); SS.del("groupe"); rendre(); try{ window.EPSG&&EPSG.open(); }catch(e){} },
  chgGroupe(){ S.choix=S.groupe?S.groupe.noms.slice():[]; S.groupe=null; SS.del("groupe"); S.bid=null; rendre(); },
  blChoix(b){ const L=blocsDe(nomClasse(),S.groupe.k), x=L[+b.dataset.i]; if(x){ S.bid=x.id; rendre(); } },
  blNouveau(){ const L=blocsDe(nomClasse(),S.groupe.k), b=okBloc({id:uid(),c:nomClasse(),gk:S.groupe.k,noms:S.groupe.noms,nom:"Bloc "+(L.length+1),items:[],bpm:bpmImpose()||S.bpm,d:auj()}); stPut(cleBloc(b),b); S.bid=b.id; rendre(); },
  blAjout(){ choisirPas(); },
  blAdd(b){ const B=blocCourant(); if(!B||!pasId(b.dataset.id)) return; B.items.push({p:b.dataset.id,m:0}); sauverBloc(B); fermer(); rendre(); },
  blRm(b){ const B=blocCourant(); B.items.splice(+b.dataset.i,1); sauverBloc(B); rendre(); },
  blMir(b){ const B=blocCourant(), x=B.items[+b.dataset.i]; if(x){ x.m=x.m?0:1; sauverBloc(B); rendre(); } },
  blUp(b){ const B=blocCourant(), i=+b.dataset.i; if(i>0){ B.items.splice(i-1,0,B.items.splice(i,1)[0]); sauverBloc(B); rendre(); } },
  blDn(b){ const B=blocCourant(), i=+b.dataset.i; if(i<B.items.length-1){ B.items.splice(i+1,0,B.items.splice(i,1)[0]); sauverBloc(B); rendre(); } },
  blSym(){ const B=blocCourant(); B.sym=B.sym?0:1; sauverBloc(B); rendre(); },
  blJouer(){ const B=blocCourant(), v=bpmImpose(); lancer(itemsBloc(B),{bpm:v||B.bpm,verrou:!!v,titre:B.nom,src:"bloc"}); },
  blChore(){ const L=blocsDe(nomClasse(),S.groupe.k), v=bpmImpose(), I=choregraphie(L); lancer(I,{bpm:v||(I[0]||{}).bpm||S.bpm,verrou:!!v,titre:"Chorégraphie",src:"bloc"}); },
  blExport(){ exporter(nomClasse(),S.groupe.k); },
  suiviExport(b){ exporter(S.clsP,b.dataset.gk); },
  fcMes(){ const B=blocCourant(); fcOuvrir(fcMode()||"fin",B?B.nom:"",B?B.bpm:0); },
  fcGo(){ fcGo(); }, fcOk(){ fcOk(); }, fcPasser(){ fermer(); rendre(); },
  blFiche(){ ficheBloc(blocCourant()); },
  blNom(){ const B=blocCourant(), n=prompt("Nom du bloc :",B.nom); if(n&&n.trim()){ B.nom=n.trim().slice(0,30); sauverBloc(B); rendre(); } },
  blSuppr(){ const B=blocCourant(); if(!confirm("Supprimer « "+B.nom+" » ?")) return; stDel(cleBloc(B)); S.bid=null; rendre(); },
  plBpm(b){ if(!PL||PL.verrou) return; PL.manuel=true; PL.bpm=borne(PL.bpm+(+b.dataset.d||0),BPM_MIN,BPM_MAX); MT.bpm=PL.bpm; $("#plBpm").textContent=PL.bpm+" bpm"; },
  plPause(){ plPause(); },
  plBoucle(b){ if(PL){ PL.boucle=!PL.boucle; b.classList.toggle("on",PL.boucle); } },
  plSon(b){ MT.son=!MT.son; b.classList.toggle("on",MT.son); },
  plDebut(){ if(PL) plDepart(0); },
  obsChoix(b){ S.obs={bid:b.dataset.id,r:OBS_CRIT.map(()=>null),com:""}; rendre(); },
  obsRetour(){ S.obs=null; rendre(); },
  obsR(b){ const c=$("#obsCom"); if(c) S.obs.com=c.value; const i=+b.dataset.i, v=+b.dataset.v; S.obs.r[i]=S.obs.r[i]===v?null:v; rendre(); },
  obsJouer(){ const b=blocsDe(nomClasse()).find(x=>x.id===S.obs.bid); if(b) lancer(itemsBloc(b),{bpm:b.bpm,verrou:true,titre:b.nom}); },
  obsOk(){ const b=blocsDe(nomClasse()).find(x=>x.id===S.obs.bid), c=$("#obsCom"); if(!b) return; if(S.obs.r.every(x=>x==null)) return toast("Réponds à au moins un critère.");
    stPut("o|"+nomClasse()+"|"+uid(),{c:nomClasse(),de:S.groupe.noms,gk:b.gk,noms:b.noms,bid:b.id,bloc:b.nom,crit:OBS_CRIT,r:S.obs.r,com:c?c.value.trim().slice(0,300):"",d:auj()}); S.obs=null; toast("Observation envoyée au groupe 👍"); rendre(); },
  jPas(b){ const J=jourLire(); if(!J) return; const L=tousPas().map(p=>p.id); let P=Array.isArray(J.pas)&&J.pas.length?J.pas.filter(x=>L.includes(x)):L.slice(); const i=P.indexOf(b.dataset.id); if(i>=0) P.splice(i,1); else P.push(b.dataset.id); if(!P.length) return toast("Garde au moins un pas."); J.pas=P.length===L.length?[]:P; stPut("j|"+S.clsP+"|"+auj(),J); rendre(); },
  jOk(){ const J=jourLire(); if(!J) return; stPut("j|"+S.clsP+"|"+auj(),J); toast("Leçon du jour enregistrée pour "+S.clsP); rendre(); },
  jSuppr(){ if(!confirm("Retirer la leçon du jour de "+S.clsP+" ?")) return; stDel("j|"+S.clsP+"|"+auj()); rendre(); },
  suiviJouer(b){ const x=blocsDe(S.clsP).find(y=>y.id===b.dataset.id); if(x) lancer(itemsBloc(x),{bpm:x.bpm,titre:x.nom}); },
  suiviFiche(b){ const x=blocsDe(S.clsP).find(y=>y.id===b.dataset.id); if(x) ficheBloc(x); },
  edNouveau(){ edOuvrir(null); },
  edOuvrir(b){ edOuvrir(b.dataset.id); },
  edFermer(){ S.ed=null; fermer(); rendre(); },
  edK(b){ edLire(); S.ed.k=+b.dataset.i; edRendre(); },
  edPrec(){ edLire(); S.ed.k--; edCaler(); edRendre(); },
  edSuiv(){ edLire(); S.ed.k++; edCaler(); edRendre(); },
  edCote(b){ edLire(); S.ed.cote=b.dataset.c==="L"?"L":"R"; edRendre(); },
  edRot(b){ edLire(); const f=S.ed.p.c[S.ed.k-1][S.ed.cote]; if(f){ f.a=(((f.a||0)+(+b.dataset.d||0))%360+360)%360; edRendre(); } },
  edEtat(b){ edLire(); const f=S.ed.p.c[S.ed.k-1][S.ed.cote]; if(f){ f.s=borne(+b.dataset.v||0,0,4); edRendre(); } },
  edSaut(){ edLire(); const t=S.ed.p.c[S.ed.k-1]; if(t.j) delete t.j; else t.j=1; edRendre(); },
  edOter(){ edLire(); delete S.ed.p.c[S.ed.k-1][S.ed.cote]; edRendre(); },
  edCopie(b){ edLire(); const p=S.ed.p, n=p.n/2, m=b.dataset.m==="1"; for(let i=0;i<n;i++){ const s=p.c[i], o={}; if(m){ const mi=f=>({x:100-f.x,y:f.y,a:(360-f.a)%360,s:f.s}); if(s.R) o.L=mi(s.R); if(s.L) o.R=mi(s.L); } else { if(s.L) o.L=Object.assign({},s.L); if(s.R) o.R=Object.assign({},s.R); } if(s.t) o.t=s.t; if(s.j) o.j=1; p.c[n+i]=o; } toast("2e moitié recopiée"); edRendre(); },
  edEssai(){ edLire(); const p=okPas(S.ed.p); ESSAI=p; lancer([{p:p.id,m:0}],{bpm:S.bpm,titre:"Essai"}); },
  edOk(){ edLire(); const p=S.ed.p; if(!String(p.nom).trim()) return toast("Donne un nom au pas."); if(!p.c.some(t=>t.L||t.R)) return toast("Pose au moins un pied sur le schéma.");
    const q=okPas(p); q.nom=String(p.nom).trim().slice(0,40); q.ex=0; q.src=""; /* pas modifié : ce n'est plus la version de la source */ if(stPut("p|"+q.id,q)){ S.ed=null; fermer(); rendre(); toast("Pas enregistré : il arrive sur les autres tablettes."); } },
  edSuppr(){ const p=S.ed.p, n=stItems("b|").filter(([,o])=>Array.isArray(o.items)&&o.items.some(x=>x&&x.p===p.id)).length; if(!confirm("Supprimer le pas « "+p.nom+" » ?"+(n?"\n"+n+" bloc(s) d'élèves l'utilisent : il y apparaîtra comme « pas supprimé ».":""))) return; stDel("p|"+p.id); S.ed=null; fermer(); rendre(); }
};
function blocVue(){ return !S.prof&&S.onglet==="bloc"&&S.groupe?blocCourant():null; }
function regBpm(v){ if(bpmImpose()) return; v=borne(Math.round(v)||BPM_DEF,BPM_MIN,BPM_MAX); const B=blocVue(); if(B){ B.bpm=v; sauverBloc(B); } S.bpm=v; const r=$("#bpmR"), o=$("#bpmO"); if(r) r.value=v; if(o) o.textContent=v+" bpm"; if(MT.on&&!PL) MT.bpm=v; const j=document.querySelector(".carte .jauge"); if(B&&j) j.parentNode.innerHTML=jaugeHtml(B); }
document.addEventListener("click",ev=>{ const o=ev.target.closest("[data-onglet]"); if(o){ aller(o.dataset.onglet); return; }
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(!f) return;
  if(S.ed&&b.dataset.act==="fermer"){ /* fin d'un essai : retour à l'éditeur */ mtStop(); PL=null; edRendre(); return; }
  try{ f(b); }catch(e){ console.error(e); toast("Un problème est survenu : réessaie."); } });
document.addEventListener("input",ev=>{ const t=ev.target; if(t.id==="bpmR") regBpm(+t.value); });
document.addEventListener("change",ev=>{ const t=ev.target;
  if(t.id==="clsP"){ S.clsP=t.value; rendre(); }
  else if(t.id==="edN"&&S.ed){ edLire(); S.ed.p.n=borne(Math.round(num(t.value,8)),1,32); edCaler(); edRendre(); } });

/* ======================= ENSEIGNANT : panneaux communs ======================= */
function panneauClasses(el){ const L=classes();
  el.innerHTML=`<h2>👥 Classe</h2><p class="mut">Classes du step (listes communes à toutes les applis).</p>`+
    (L.length?`<div class="epst-grid">${L.map(c=>`<div class="epst-card" style="cursor:default"><i>👥</i><span><b>${h(c.nom)}</b><small>${(c.el||[]).length} élèves · ${Object.keys(blocsDe(c.nom).reduce((a,b)=>(a[b.gk]=1,a),{})).length} groupe(s)</small></span></div>`).join("")}</div>`:`<p class="mut">Aucune classe n'est attribuée au step pour l'instant.</p>`)+
    `<div class="epst-grid"><button type="button" class="epst-card" data-x="edit"><i>✏️</i><span><b>Listes d'élèves</b><small>Renommer, corriger, choisir les activités</small></span></button><button type="button" class="epst-card" data-x="imp"><i>📥</i><span><b>Importer une liste</b><small>Excel ou CSV</small></span></button></div>`;
  el.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ if(!window.EPSD) return; b.dataset.x==="edit"?EPSD.editLists():EPSD.importList(); }); }
function panneauBilans(el){ const C=classes(); if(!C.some(c=>c.nom===S.clsP)) S.clsP=(C[0]||{}).nom||null;
  const B=S.clsP?blocsDe(S.clsP):[], O=S.clsP?obsDe(S.clsP):[], P=S.clsP?personnes(S.clsP):[], FCs=S.clsP?fcDe(S.clsP):[];
  const ligne=n=>{ const k=norm(n), mes=B.filter(b=>b.noms.some(x=>norm(x)===k)), vu=O.filter(o=>(Array.isArray(o.noms)?o.noms:[]).some(x=>norm(x)===k)), fait=O.filter(o=>(Array.isArray(o.de)?o.de:[]).some(x=>norm(x)===k)); const best=mes.reduce((m,b)=>Math.max(m,tempsBloc(b)),0);
    const fc=FCs.map(f=>{ const q=Object.keys(f.v).find(x=>norm(x)===k); return q?Math.round(+f.v[q])||0:0; }).filter(Boolean);
    return `<tr><td><b>${h(n)}</b></td><td>${mes.length?mes.map(b=>h(b.nom)).join(", "):"—"}</td><td>${mes.length?best+" temps":"—"}</td><td>${fc.length?fc.length+" · moy. "+Math.round(fc.reduce((a,b)=>a+b,0)/fc.length)+" · max "+Math.max(...fc):"—"}</td><td>${vu.length||"—"}</td><td>${fait.length||"—"}</td></tr>`; };
  el.innerHTML=`<h2>📄 Bilans</h2><p class="mut">Blocs composés et observations, puis évaluation : fiches PDF, .zip, Pronote, bilans en ligne.</p>
   <div class="epse-row" style="margin-bottom:10px"><select id="bilC" class="epst-b" aria-label="Classe">${C.map(c=>`<option ${c.nom===S.clsP?"selected":""}>${h(c.nom)}</option>`).join("")}</select></div>
   <div class="carte" style="overflow:auto"><b>🧱 Blocs et observations · ${h(S.clsP||"")}</b><table class="t"><tr><th>Élève</th><th>Blocs</th><th>Bloc le plus long</th><th>❤️ Mesures (bpm)</th><th>Observations reçues</th><th>Observations faites</th></tr>${P.map(ligne).join("")||`<tr><td colspan="6" class="doux">Aucun élève.</td></tr>`}</table></div>
   <div class="carte"><b>⬇ Chorégraphies des élèves</b><p class="petit doux" style="margin:4px 0 10px">Chaque groupe exporte la sienne en PDF ou en vidéo depuis « Mon bloc » ; toi, depuis « Groupes en direct ». Publiées dans l'espace élève, elles se revoient et s'exportent sur le téléphone.</p><a class="btn p" href="../espace/">🌐 Publier dans l'espace élève</a></div><div id="bil-ev"></div>`;
  el.querySelector("#bilC").onchange=e=>{ S.clsP=e.target.value; panneauBilans(el); };
  if(window.EVST&&S.clsP) EVST.mount(el.querySelector("#bil-ev"),["bilan"],S.clsP); }
/* ✅ « Tout est prêt ? » : vérifications propres au step */
window.epsCheck=function(cls){ const R=[], n=tousPas().length;
  R.push(n?{ok:true,t:"Step : "+n+" pas dans la bibliothèque"}:{ok:false,t:"Aucun pas dans la bibliothèque",d:"Crée au moins un pas.",fix:{label:"👣 Les pas",go:()=>aller("pas")}});
  if(cls){ const c=classes().find(x=>norm(x.nom)===norm(cls)); if(!c) R.push({ok:false,t:"Classe "+cls+" absente du step",d:"Vérifie ses activités (👥 Classe → Listes d'élèves)."});
    else { const J=jourDe(c.nom); R.push(J?{ok:true,t:"Leçon du jour prête pour "+c.nom+(J.bpm?" · "+J.bpm+" bpm":"")+(J.fc?" · fréquence cardiaque "+(J.fc==="bloc"?"après chaque bloc":"en fin de travail"):"")}:{ok:null,t:"Pas de leçon du jour pour "+c.nom,d:"Facultatif : consigne, tempo imposé, pas proposés.",fix:{label:"📌 Leçon du jour",go:()=>{ S.clsP=c.nom; aller("jour"); }}}); } }
  return R; };

/* évaluation commune (eps-eval.js) : grille CA5 proposée, à modifier ou à remplacer par la tienne (Évaluation → Grille → 📥) */
window.EVST = window.EPSE ? EPSE.store({ app:"step", nom:"Step", ca:"CA5", color:COL, pfx:"sp", code:"ST1", url:"https://chrisdcqns-cmd.github.io/eps-autonomie-numerique/step/", icon:ICONE,
 isTeacher:()=>estProf(), unlock:()=>Promise.resolve(true),
 grid:{degres:["Degré 1","Degré 2","Degré 3","Degré 4"], degresEl:["Je débute","Je progresse","Je maîtrise","Je suis expert(e)"], criteres:[
  {id:"pro",afl:"AFL1",max:6,nom:"Produire : réaliser ses blocs en rythme et en sécurité",but:"Enchaîner les pas de ses blocs sur le tempo, pied entier sur le step, des deux côtés.",nomEl:"Je réalise mes blocs en rythme",butEl:"J'enchaîne mes pas sur le tempo, le pied entier sur le step, des deux côtés.",
   desc:["Souvent en décalage avec le tempo. Pas incomplets, arrêts fréquents.","En rythme sur les pas simples. Décalages aux changements de pas, quelques arrêts.","En rythme sur tout le bloc, des deux côtés. Pas complets, pied entier sur le step.","En rythme et fluide jusqu'au bout, des deux côtés. Bras coordonnés, posture tenue."]},
  {id:"con",afl:"AFL1",max:6,nom:"Concevoir : choisir ses paramètres selon l'effet recherché",but:"Choisir tempo, pas, durée et récupération en lien avec son projet d'entraînement.",nomEl:"Je choisis mes paramètres",butEl:"Je choisis mon tempo, mes pas, ma durée et mes récupérations selon ce que je veux travailler.",
   desc:["Paramètres choisis au hasard ou recopiés, sans lien avec un effet recherché.","Paramètres en partie adaptés : tempo ou pas trop faciles ou trop difficiles.","Paramètres cohérents avec l'effet recherché : tempo, pas et durée adaptés à ses ressources.","Paramètres cohérents et ajustés en cours de leçon selon ses ressentis."]},
  {id:"ent",afl:"AFL2",max:4,nom:"S'entraîner : relever, analyser, ajuster",but:"Relever ses indicateurs (blocs réalisés, tempo, ressenti, fréquence cardiaque) et ajuster de leçon en leçon.",nomEl:"Je m'entraîne et j'ajuste",butEl:"Je note ce que j'ai fait et ressenti, et je m'en sers pour régler la leçon suivante.",
   desc:["Relevés absents ou incomplets, pas d'ajustement.","Relevés faits, ajustements rares ou proposés par l'enseignant.","Relevés réguliers, ajustements cohérents d'une leçon à l'autre.","Relevés précis, ajustements justifiés par ses indicateurs."]},
  {id:"coo",afl:"AFL3",max:4,nom:"Coopérer : composer ensemble, observer et conseiller",but:"Participer à la composition du bloc, observer un autre groupe avec la fiche et lui donner un conseil utile.",nomEl:"J'aide mon groupe et j'observe",butEl:"Je participe à la création du bloc, j'observe un autre groupe et je le conseille.",
   desc:["Suit le groupe sans proposer. Observation non faite ou au hasard.","Propose parfois. Observation faite, conseil vague.","Propose et aide à mémoriser. Observation fiable, conseil lié à un critère.","Fait progresser son groupe et le groupe observé : conseils précis et suivis d'effet."]}]}}) : null;
/* espace enseignant commun (eps-shell.js) */
window.EPSTST = window.EPST ? EPST.init({app:"step", nom:"Step", color:COL, isTeacher:()=>estProf(), anchor:"header", main:"#vue,nav.onglets", home:"seq",
  tabs:{ seq:{go:()=>aller("jour"), on:()=>["jour","suivi"].includes(S.onglet),
           actions:[{main:1,ico:"📌",label:"Leçon du jour",go:()=>aller("jour")},{main:1,ico:"🖥",label:"Groupes en direct",go:()=>aller("suivi")},{ico:"👣",label:"Créer un pas",go:()=>{ aller("pas"); edOuvrir(null); }}]},
         eval:{panel:el=>{ if(window.EVST) EVST.mount(el,["eval","grille"],S.clsP||(classes()[0]||{}).nom); else el.innerHTML="<p>Évaluation indisponible.</p>"; }},
         cls:{panel:el=>panneauClasses(el)},
         bil:{panel:el=>panneauBilans(el)} },
  biblio:[{ico:"👣",label:"Les pas",sub:"fiches temps par temps, créer et modifier",go:()=>aller("pas")},
          {ico:"🎵",label:"Métronome",sub:"tempo réglable, compte de 1 à 8",go:()=>aller("metro")}],
  reglages:[]
}) : null;
/* écran élève commun « Choisis ta classe » : sans classe, les pas et le métronome */
(window.EPSG_Q=window.EPSG_Q||[]).push({app:"Step", sub:"CA5 · S'entraîner", color:COL, icon:ICONE,
  isTeacher:()=>estProf(), when:()=>!estProf() && !S.classe,
  classes:()=>classes().map(c=>({id:c.id, nom:c.nom, note:(c.el||[]).length+" élèves"+(jourDe(c.nom)?" · leçon aujourd'hui":"")})),
  current:()=>S.classe,
  select:id=>{ S.classe=id; SS.set("classe",id); S.groupe=null; SS.del("groupe"); S.choix=[]; aller("groupe"); },
  resources:[{ico:"👣",label:"Les pas",sub:"fiches temps par temps",open:()=>{ S.classe="-"; SS.set("classe","-"); aller("pas"); }},
             {ico:"🎵",label:"Métronome",sub:"tempo réglable",open:()=>{ S.classe="-"; SS.set("classe","-"); aller("metro"); }}]});
rendre();
</script>
