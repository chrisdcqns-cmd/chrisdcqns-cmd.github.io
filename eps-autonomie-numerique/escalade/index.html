.sub{display:flex;gap:8px;margin-bottom:14px}

textarea{min-height:90px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--ln)}
h2{font-size:26px;margin:18px 0 6px}h3{font-size:21px;margin:14px 0 4px;color:var(--ac)}
p{margin:6px 0;white-space:pre-wrap}
video{width:100%;max-height:60vh;background:#000;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.row .fix{flex:none}
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;padding:0}.step output{min-width:44px;text-align:center;font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}

.tb{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}

table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--ln);padding:6px;text-align:left}
.qrs{display:flex;gap:14px;flex-wrap:wrap}.qrs figure{margin:0;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border:0;border-radius:18px;color:#fff;text-align:left;padding:22px;min-height:min(30vh,220px);display:flex;flex-direction:column;justify-content:center;font:inherit}
.tile b{font-size:30px;line-height:1.15}.tile span{opacity:.85;font-size:16px}
.tile.wide{grid-column:1/-1;min-height:120px}

.role{max-width:900px;margin:4vh auto 0;text-align:center}.role h2{font-size:40px;margin:0 0 6px}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.rbtns .tile{min-height:min(42vh,300px);text-align:center;align-items:center}
.rbtns .tile b{font-size:34px}.rbtns .tile span{margin-top:10px}
.rbtns.cl .tile{min-height:min(24vh,170px)}.rbtns .tile.cur{outline:4px solid var(--hi);outline-offset:-8px}
.chcl{min-height:40px;padding:6px 14px;font-size:15px;margin-left:8px;vertical-align:middle}
@media(max-width:700px){.rbtns{grid-template-columns:1fr}}
.vg{grid-template-columns:repeat(5,1fr)}.vg .b{font-size:26px;min-height:64px}
.colb{display:flex;align-items:center;gap:12px;font-size:22px;min-height:64px;text-align:left}
.colb .dot,.vl .dot{width:30px;height:30px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conf{display:flex;align-items:center;gap:18px;border:4px solid var(--ln);border-radius:16px;padding:18px;margin:12px 0;font-size:24px}
.conf .dot{width:56px;height:56px;margin:0}
.cot{font-size:34px;font-weight:700;color:var(--ac)}
.sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#E4F1E8;border-radius:10px;padding:10px 12px;font-weight:700}
.sum .b{min-height:38px;padding:4px 12px;margin-left:auto}
.crit{border-top:1px solid var(--ln);padding:14px 0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.nr{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mut);background:#f1f4f5;padding:6px 12px;border-radius:999px;cursor:pointer}
.nr input{width:22px;height:22px;min-height:0;margin:0;padding:0}
.crit.off .cv{opacity:.3;pointer-events:none}
.stp{margin:0 0 4px;font-size:15px}
.vl{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--ln);font-size:22px}
.vl b{margin-left:auto;font-size:30px;color:var(--ac)}
.ok{text-align:center;padding:28px 16px}.ok b{font-size:28px;display:block;margin-bottom:16px}
@media(max-width:600px){.tiles{grid-template-columns:1fr}}
small,.mut{color:var(--mut)}
.blk{border-left:4px solid var(--ln);padding-left:10px;margin:10px 0}
@media(max-width:600px){body{font-size:16px}.grid{grid-template-columns:repeat(4,1fr)}}
#logo{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:default}
#tm{display:flex;gap:8px;flex-wrap:wrap}
#tm .b{min-height:40px;padding:6px 12px;font-size:15px}
.prof{background:#fff8e1;border:2px dashed var(--hi)}
.fiche h3{margin-top:0;font-size:24px}
.fiche video{margin:8px 0}
.pick{display:block;text-align:center;cursor:pointer}
.clsb{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;min-height:64px}
.clsb small{color:inherit;opacity:.7;font-weight:400;font-size:14px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--ln);font-weight:700}
.ckl{display:flex;align-items:center;gap:14px;flex:1;cursor:pointer;min-height:44px}
.rq{flex:none;border:2px solid var(--ln);background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--mut);min-height:40px}
.rq.on{background:var(--bad);border-color:var(--bad);color:#fff}
.rq:disabled{opacity:.35}
.ob{font-size:15px;font-weight:700;color:#fff;background:var(--bad);padding:6px 12px;border-radius:999px}
.crit.miss{background:#fdecea;border-radius:12px;padding:14px 10px;outline:3px solid var(--bad)}
.ck input{width:28px;height:28px;min-height:0;flex:none;margin:0;accent-color:var(--ac)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.names .b{text-align:left;min-height:56px}
.g10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.goal{border-radius:18px;padding:26px 18px;margin:0 0 18px;font-size:clamp(26px,5.2vw,40px);line-height:1.2;font-weight:700;color:#fff;background:var(--ac)}
.goal .n{display:block;font-size:clamp(70px,16vw,130px);line-height:1;margin:6px 0}
.goal.win{background:#2e9e4f}
.ok>.lab{font-size:22px;display:block;margin-bottom:14px}
.ok .lab b{display:inline;font-size:inherit;margin:0}
.dlg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dbox{background:#fff;border-radius:16px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px #0005}
.dbox p{font-size:19px;margin:0 0 14px}.dbox input,.dbox textarea{margin-bottom:14px}
.big{width:100%;min-height:70px;font-size:clamp(20px,4.5vw,28px)}
.lock{text-align:center;padding:40px 16px}.lock h2{margin-bottom:18px}
.vl .cn{font-weight:700}
.ltabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}.ltabs .b{flex:none;min-height:44px;padding:8px 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 4px}
.st{background:#F3F8F4;border:1px solid var(--ln);border-radius:12px;padding:12px}
.st b{display:block;font-size:30px;line-height:1.1;color:var(--ac)}.st span{font-size:14px;color:var(--mut)}
.tw{overflow-x:auto}.tw table{font-size:15px;white-space:nowrap}.tw td,.tw th{padding:8px 6px}
.hb{display:inline-block;width:56px;height:10px;background:#e3e9eb;border-radius:5px;vertical-align:middle;margin-right:6px;overflow:hidden}.hb i{display:block;height:100%;background:var(--ac)}
.top{color:#1f7a3d;font-weight:700}
.dr{display:grid;grid-template-columns:58px 1fr;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.dr>b{font-size:20px}.dr small{grid-column:2}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;min-width:16px}.bar i{background:#2e9e4f}.bar u{background:#A9D3B7}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 10px}
.g9{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.g11{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.g9 .tp{font-weight:700}
@media(max-width:600px){.g9{grid-template-columns:repeat(5,1fr)}}
.rl{padding:2px 0 6px}.rl.miss{background:#fdecea;border-radius:12px;padding:4px 10px 10px;outline:3px solid var(--bad)}
.rpm{display:flex;flex-direction:column;gap:2px;border-radius:12px;padding:12px 14px;margin:6px 0 4px;background:#f1f4f5;border-left:6px solid var(--ln)}
.rpm b{font-size:20px}.rpm span{font-size:15px;color:var(--mut)}
.rpm.bad{background:#fdecea;border-color:#b3261e}.rpm.bad b{color:#b3261e}
.rpm.mid{background:#fff4e0;border-color:#c77700}.rpm.mid b{color:#9a5c00}
.rpm.good{background:#e6f4ea;border-color:#2e9e4f}.rpm.good b{color:#1f7a3d}
.st.rp-bad b,.rpt.rp-bad{color:#b3261e}.st.rp-mid b,.rpt.rp-mid{color:#9a5c00}.st.rp-good b,.rpt.rp-good{color:#1f7a3d}.rpt{font-weight:700}
.sea{display:inline-block;background:#E4F1E8;border-radius:999px;padding:4px 14px;font-weight:700;color:var(--ac);margin-bottom:10px}

/* ================= habillage : granite, magnésie, corde ================= */
:root{--bg:#eef2f4;--ink:#1d2a31;--card:#fff;--ac:#2E7D4F;--ac2:#21603B;--hi:#ffc93c;--mut:#5b6a72;--ln:#d5dee2;--bad:#c92a2a;--ok:#2b8a3e;--r:16px}
body{font:17px/1.5 "Avenir Next","Segoe UI","Nunito",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
header{background:var(--ink);padding:12px 18px;gap:12px}
header b{font-size:21px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mk{width:30px;height:30px;flex:none}
nav{padding:0 14px 10px;gap:6px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{padding:9px 16px;border:0;border-radius:999px;color:#c3d0d6;font-weight:700;font-size:16px}
nav button.on{background:#fff;color:var(--ink)}
main{padding:18px 16px 40px}
h2{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:8px 0 10px}
h3{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.card{border:0;border-radius:var(--r);padding:20px;box-shadow:0 1px 0 #d5dee2,0 6px 18px -12px #1d2a3155}
.b{border-radius:14px;padding:12px 20px;font-weight:800;min-height:52px;transition:transform .08s,background .15s}
.b:active{transform:scale(.97)}
.b:focus-visible,.chip:focus-visible,.tile:focus-visible,nav button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.b{background:var(--ac)}.b:hover{background:var(--ac2)}
.b.g{background:#fff;border:2px solid var(--ln);color:var(--ink)}.b.g:hover{border-color:#aebcc2;background:#fff}
.b.on,.b.on:hover{background:var(--hi);color:var(--ink);border-color:var(--hi)}
.b.d,.b.d:hover{background:var(--bad)}
.b:disabled{background:#c9d3d7;color:#6b7a81;transform:none}
input,select,textarea{border-radius:12px;border:2px solid var(--ln)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #2E7D4F22}
/* accueil : grandes tuiles avec une « prise » */
.tiles{gap:14px}
.tile{position:relative;overflow:hidden;background:var(--c,#2E7D4F);border-radius:22px;padding:22px 24px;min-height:min(26vh,190px);justify-content:flex-end;box-shadow:0 10px 24px -16px var(--c,#000)}
.tile::after{content:"";position:absolute;right:-26px;top:-30px;width:150px;height:130px;background:#ffffff26;border-radius:58% 42% 63% 37%/46% 58% 42% 54%;transform:rotate(-14deg)}
.tile::before{content:"";position:absolute;right:38px;top:34px;width:16px;height:16px;border-radius:50%;background:#ffffff40}
.tile b{font-size:clamp(24px,3.4vw,32px);font-weight:800;letter-spacing:-.02em;position:relative}
.tile span{position:relative;margin-top:4px;font-size:16px;opacity:.9}
.tile.wide{min-height:110px}
.tile.tprof{outline:3px dashed #ffffff66;outline-offset:-8px}
/* écrans de démarrage */
.role h2{font-size:clamp(32px,6vw,46px)}
.rbtns .tile{justify-content:center}
.sea{background:#DCEEE2;color:var(--ac2);padding:6px 16px;font-size:15px}
.chcl{min-height:40px;padding:6px 14px;font-size:15px}
/* badges prénom */
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.names.big{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.chip{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px 8px 8px;background:#fff;border:2px solid var(--ln);border-radius:999px;font:inherit;font-weight:700;text-align:left;color:var(--ink);cursor:pointer;transition:transform .08s,border-color .15s}
.chip:active{transform:scale(.97)}
.chip i{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:19px;color:#fff;background:hsl(var(--h) 55% 42%)}
.chip span{line-height:1.2}
.names.big .chip{min-height:70px;font-size:20px}.names.big .chip i{width:52px;height:52px;font-size:22px}
.chip.on{border-color:var(--ink);background:var(--hi);box-shadow:0 0 0 2px var(--ink) inset}
.chip.dis{opacity:.38}
.chip.none{padding-left:18px;color:var(--mut)}.chip.none.on{color:var(--ink)}
.chip.mini{min-height:40px;padding:4px 12px 4px 4px;font-size:15px;cursor:default;border-width:1px}.chip.mini i{width:30px;height:30px;font-size:14px}
.grpline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 16px}.grpline>span{font-weight:800;margin-right:4px}
.gbar{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:18px;background:linear-gradient(transparent,var(--bg) 30%)}
.gbar .b:last-child{flex:1;max-width:420px;font-size:19px}
.grpS{max-width:980px;text-align:left}.grpS h2,.grpS>p{text-align:center}
.lnk{background:none;border:0;color:var(--ac2);font:inherit;font-weight:700;padding:10px 2px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* saisie d'une grimpe */
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}.prog i{height:6px;border-radius:3px;background:var(--ln)}.prog i.d{background:var(--ac)}.prog i.c{background:var(--hi)}
.sum{background:#E4F1E8;border-radius:14px;padding:12px 14px;font-size:18px}
.crit{border-top:1px solid #e3e9ec;padding:18px 0}
.ch b{font-size:18px}
.cordee .rl{padding:6px 0 10px}.rlh{display:flex;align-items:center;gap:10px;margin:6px 0 10px}.rlh b{font-size:17px}
.ob{font-size:13px;padding:3px 10px}
.swap{min-height:40px;padding:6px 14px;font-size:15px}
.rl.miss,.crit.miss{outline-offset:4px}
.conf{border-radius:20px}
.vg .b{border-radius:16px}
/* dialogues */
.dlg{background:#1d2a31b3;backdrop-filter:blur(3px)}
.dbox{border-radius:22px;padding:24px;box-shadow:0 24px 60px -20px #000}
.dbox p{font-size:19px;font-weight:600}
.st{background:#f3f7f8;border:0;border-radius:14px}
.goal{border-radius:22px}
@media(max-width:600px){main{padding:14px 12px 30px}.card{padding:16px}.names.big{grid-template-columns:1fr 1fr}.names{grid-template-columns:1fr 1fr}.chip{gap:8px}.chip i{width:36px;height:36px;font-size:16px}.gbar .b{font-size:16px}}
.grid .b,.g9 .b,.g10 .b,.g11 .b,.vg .b{padding:0;min-width:0}
@media(max-width:600px){.g11{grid-template-columns:repeat(4,1fr)}}

/* --- accueil sur un seul écran --- */
body[data-t=home] main{padding-top:12px;padding-bottom:0}
.homeW{display:flex;flex-direction:column;gap:10px;height:calc(100dvh - var(--hh,64px) - 12px - env(safe-area-inset-bottom));padding-bottom:64px}
.homeW .hline{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.homeW .hline:empty{display:none}.homeW .sea,.homeW .chcl{margin:0}
.homeW .grpline{margin:0}
.homeW .tiles{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);gap:12px}
.homeW .tile{min-height:0;padding:16px 20px}
.homeW .tile b{font-size:clamp(19px,min(3.4vw,4.2vh),32px)}
.homeW .tile span{font-size:clamp(13px,1.9vh,16px)}
@media(max-width:600px){.homeW .tiles{grid-template-columns:1fr 1fr;gap:10px}.homeW .tile{padding:12px 14px;border-radius:18px}.homeW .tile::after{width:90px;height:80px;right:-20px;top:-24px}.homeW .tile::before{display:none}}
@media(max-height:620px){.homeW .tile span{display:none}}
/* --- vignettes vidéo --- */
.vigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:12px 0 18px}
.vig{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:0;border-radius:18px;padding:0 0 14px;overflow:hidden;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 0 #d5dee2,0 8px 20px -14px #1d2a3166}
.vig .vth{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,#1d2a31,#2E7D4F);margin-bottom:10px}
.vig .vth video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:0;max-height:none;background:none;pointer-events:none}
.vig .vth em{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;color:var(--ink);background:var(--hi);box-shadow:0 4px 14px #0006}
.vig b{font-size:20px;padding:0 16px;line-height:1.2}.vig small{padding:0 16px;font-size:15px;color:var(--mut)}
.vig.nov .vth{background:repeating-linear-gradient(135deg,#dfe7ea 0 12px,#eef2f4 12px 24px)}.vig.nov em{background:#c9d3d7;box-shadow:none}
.vigs.ed{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.vige{border:2px dashed var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.vmod{position:fixed;inset:0;z-index:60;background:#0d1418e6;display:grid;place-items:center;padding:12px}
.vbox{width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
.vh{display:flex;align-items:center;gap:12px;color:#fff}.vh b{flex:1;font-size:20px}.vh small{color:#c3d0d6;font-weight:400}
.vbox video{width:100%;max-height:calc(100dvh - 110px);border-radius:14px;background:#000}
/* --- leçons --- */
