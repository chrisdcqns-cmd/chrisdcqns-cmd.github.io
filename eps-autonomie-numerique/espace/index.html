<!DOCTYPE html>
<!-- eps-source-directe : cette page est LA source de l'appli, modifiée directement. Ne jamais la remplacer par une page fabriquée ailleurs (autre conversation, anciens fichiers) : repartir de cette page. Voir CLAUDE.md. -->
<html lang="fr">
<head>
<script src="../eps-lists.js"></script><!-- commun : garde de la simulation, listes -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace élève (réglages) – EPS</title>
<meta name="theme-color" content="#14171C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<style>
:root{--bg:#F5F3EE;--ink:#14171C;--muted:#6A6F78;--line:#E6E1D6;--app:#0369A1;--ok:#1E6B3A;--no:#B3261E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#eps-home{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
.hd{background:var(--ink);color:#fff;box-shadow:inset 0 -4px 0 var(--app);padding:10px 14px;display:flex;align-items:center;gap:10px}
.hd .ic{width:36px;height:36px;border-radius:10px;background:var(--app);display:flex;align-items:center;justify-content:center;flex:none}
.hd h1{margin:0;font-size:20px;font-weight:800;flex:1}
.hb{color:#D5D8DE;text-decoration:none;font-weight:700;font-size:14px;border:1.5px solid #3A3F47;border-radius:10px;padding:0 14px;height:40px;display:inline-flex;align-items:center}
.wrap{max-width:900px;margin:0 auto;padding:12px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card h2{margin:0 0 6px;font-size:18px;font-weight:800}
.mut{color:var(--muted);font-size:14px;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;font-weight:800;cursor:pointer}
.btn.p{background:var(--app);border-color:var(--app);color:#fff}
.btn.d{border-color:var(--no);color:var(--no)}
.btn[disabled]{opacity:.45}
.in{min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}
.tk .ty{font-weight:800;min-width:92px}
.msg{font-weight:800;font-size:14px;min-height:20px}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:center}
th:first-child,td:first-child{text-align:left}
th{background:#FAF8F3;font-size:13px}
</style>
</head>
<body>
<div class="hd">
  <div class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2M10 7h4M10 10.5h4"/></svg></div>
  <h1>Espace élève</h1>
  <span data-eps-upd-slot></span>
  <a class="hb" href="../">← Accueil</a>
</div>
<div class="wrap" id="lock"><div class="card"><h2>Outil réservé à l'enseignant</h2><div class="row"><button class="btn p" id="unlock" type="button">Saisir le code</button></div></div></div>
<div class="wrap" id="pg" hidden></div>
<script>
(function () {
  "use strict";
  /* Réglage de l'espace élève (page mon-bilan/ sur le téléphone des élèves). Magasin « eps.espace.v1 » (ep|) :
     t|<classe> {k:"todo", cls, todo:[{id, ty:'quiz'|'lien'|'txt', t, qz, url}], pub} ; r|<classe>|<clé> = retours relevés (eps-home.js espRelever). */
  var DIRS = { acrosport: "Acrosport", escalade: "Escalade", orientation: "OrienRun", relais: "Relais Vitesse", volley: "Volley-ball", badminton: "Badminton", danse: "Danse", crosstraining: "Cross-training", basket: "Basket-ball", step: "Step", ccf: "CCF" };
  /* Activités pratiquées par la classe : codes comme eps-home.js (edtApply/off). On ne publie dans « Mes activités » que ce que l'élève va réaliser,
     c'est-à-dire ce que l'emploi du temps attribue à la classe (ou ce qui a été coché à la main) : off = codes des activités NON pratiquées. CCF n'est pas une activité sportive. */
  var ACODE = { acrosport: "acro", escalade: "esc", orientation: "ori", relais: "rel", volley: "vol", badminton: "bad", danse: "dan", crosstraining: "ct", basket: "bk", step: "step" };
  var LCODE = {}; Object.keys(DIRS).forEach(function (d) { if (ACODE[d]) LCODE[DIRS[d]] = ACODE[d]; });
  var CODEL = {}, BASE8 = ["esc", "rel", "ori", "vol", "bad", "dan", "acro", "ct"]; Object.keys(LCODE).forEach(function (l) { CODEL[LCODE[l]] = l; });
  function classOff(cls) { try { var it = (window.EPSL ? EPSL.items() : []).filter(function (o) { return o && !o.del && ck(o.nom) === ck(cls); })[0]; return (it && Array.isArray(it.off)) ? it.off : []; } catch (e) { return []; } }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function flat(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase(); }
  function nk(s) { return flat(s).split(/[^A-Z0-9]+/).filter(Boolean).sort().join(" "); }
  function ck(s) { return flat(s).replace(/[^A-Z0-9]+/g, ""); }
  function jget(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } }
  function teach() { try { return Date.now() < +(localStorage.getItem("eps.teach.until") || 0); } catch (e) { return false; } }
  function classes() { var L = []; try { L = (window.EPSL && EPSL.items()) || []; } catch (e) {} return L.filter(function (o) { return o && o.nom; }).sort(function (a, b) { return String(a.nom).localeCompare(String(b.nom), "fr", { numeric: true }); }); }
  function eleves(o) { var P = []; try { P = EPSL.people(o) || []; } catch (e) {} return P.map(function (p) { return p.full || ((p.prenom || "") + " " + (p.nom || "")).trim(); }).filter(Boolean).sort(function (a, b) { return a.localeCompare(b, "fr"); }); }
  function quizzes() { var I = (jget("eps.quiz.v1", {}) || {}).items || {}; return Object.keys(I).map(function (k) { return I[k]; }).filter(function (x) { return x && x.k === "quiz" && !x.del && Array.isArray(x.q) && x.q.length; }).sort(function (a, b) { return String(a.nom).localeCompare(String(b.nom), "fr"); }); }
  /* ce que l'élève voit de ses activités : même lecture que le carnet (année en cours) */
  function activites(cls, full) { var k = nk(full), A = {}, get = function (n) { var key = ck(n); return A[key] || (A[key] = { nom: n, lec: 0, pc: null, n: 0, comm: "", apr: "", apm: "" }); };
    Object.keys(DIRS).forEach(function (d) { var I = (jget("eps.lecres." + d + ".v1", {}) || {}).items || {}, days = 0, s = 0, t = 0;
      Object.keys(I).forEach(function (id) { var r = I[id], p = String(id).split("|"); if (!r || !r.r || typeof r.r !== "object" || p.length < 3 || ck(p[0]) !== ck(cls) || nk(p.slice(2).join(" ")) !== k) return; var any = false;
        Object.keys(r.r).forEach(function (x) { if (/@auto$/.test(x)) return; var v = +r.r[x]; if (v >= 0 && v <= 2) { s += v; t += 2; any = true; } }); if (any) days++; });
      if (days) { var a = get(DIRS[d]); a.lec = days; a.pc = t ? Math.round(s / t * 100) : null; } });
    var E = []; try { E = (window.EPSD && EPSD.evalsOf && EPSD.evalsOf(full, cls)) || []; } catch (e) {}
    E.forEach(function (e) { if (!e || !e.app) return; var a = get(e.app); a.n = Math.max(a.n, +e.n || 0); if (e.comm) a.comm = String(e.comm).slice(0, 600); if (e.apr) a.apr = String(e.apr).slice(0, 300); if (e.apm) a.apm = String(e.apm).slice(0, 300); });
    /* Step : la chorégraphie du groupe de l'élève (blocs + pas utilisés) part dans son espace : il la revoit animée et l'exporte en PDF ou en vidéo (step/export.js) */
    try { var SP = (jget("step.v1", {}) || {}).items || {}, BL = [], PS = {}, NG = [];
      Object.keys(SP).forEach(function (id) { var b = SP[id]; if (id.indexOf("b|") !== 0 || !b || b.del || ck(b.c) !== ck(cls) || !Array.isArray(b.noms) || !Array.isArray(b.items) || !b.items.length || !b.noms.some(function (n) { return nk(n) === k; })) return; BL.push(b); });
      BL.sort(function (a, b) { return String(a.id) < String(b.id) ? -1 : 1; });
      if (BL.length) { BL.forEach(function (b) { NG = b.noms; b.items.forEach(function (x) { var p = x && SP["p|" + x.p]; if (p && !p.del && Array.isArray(p.c)) PS[x.p] = { nom: p.nom, n: p.n, c: p.c }; }); });
        get(DIRS.step).step = { titre: "Ma chorégraphie", noms: NG.map(function (n) { return String(n).trim().split(/\s+/)[0]; }), classe: cls, blocs: BL.map(function (b) { return { nom: b.nom, bpm: b.bpm, sym: b.sym ? 1 : 0, items: b.items.filter(function (x) { return x && PS[x.p]; }).map(function (x) { return { p: x.p, m: x.m ? 1 : 0 }; }) }; }), pas: PS }; } } catch (e) {}
    var off = classOff(cls); /* uniquement les activités que la classe pratique (emploi du temps + cochage). Rien d'attribué → on n'enlève rien (repli). */
    if (off.length) { /* classe attribuée : ajouter « à venir » les activités pratiquées pas encore commencées (pas de résultat ni d'évaluation) */
      var union = {}; try { (window.EPSL ? EPSL.items() : []).forEach(function (o) { ((o && o.off) || []).forEach(function (c) { union[c] = 1; }); }); } catch (e) {}
      BASE8.concat(["bk", "step"].filter(function (c) { return union[c]; })).forEach(function (c) { if (off.indexOf(c) < 0) { var lab = CODEL[c]; if (lab && !A[ck(lab)]) A[ck(lab)] = { nom: lab, lec: 0, pc: null, n: 0, comm: "", apr: "", apm: "", soon: 1 }; } });
    }
    return Object.keys(A).map(function (x) { return A[x]; }).filter(function (a) { var c = LCODE[a.nom]; return !c || off.indexOf(c) < 0; }).sort(function (a, b) { return a.nom.localeCompare(b.nom, "fr"); }); }

  /* Missions individuelles (dispensés, rôles) : m|<classe>|<clé> {k:"mis", cls, nom, m:[{id, ty:'cpt'|'role', t, l:[lignes], d:[phrases]}]} ; publiées dans l'espace de l'élève (champ mis). */
  var MOD = [
    { ty: "cpt", t: "Observateur : volley-ball", l: ["Service réussi", "Service raté", "Attaque gagnante", "Faute"] },
    { ty: "cpt", t: "Observateur : badminton", l: ["Point gagné au fond", "Point gagné au filet", "Faute directe"] },
    { ty: "cpt", t: "Observateur : sports collectifs", l: ["Tir réussi", "Tir raté", "Passe réussie", "Balle perdue"] },
    { ty: "cpt", t: "Observateur : réussi / raté", l: ["Réussi", "Raté"] },
    { ty: "role", t: "Coach", l: ["Où tombe le ballon chez nous", "Qui fait la deuxième touche", "La zone vide en face"], d: ["Vise la zone vide.", "Annonce « j'ai » avant de toucher."] },
    { ty: "role", t: "Arbitre", l: ["Les fautes de filet et de ligne", "Le score annoncé à chaque point", "Le respect des décisions"], d: ["J'annonce le score avant chaque service.", "J'explique ma décision en une phrase."] },
    { ty: "role", t: "Chronométreur", l: ["Le départ au signal", "Le temps de chaque passage"], d: ["J'annonce le temps tout de suite."] }];
  function mget(cls, full) { var id = "m|" + cls + "|" + nk(full), m = EPSD.espace.get(id); return (m && Array.isArray(m.m)) ? m : { id: id, k: "mis", cls: cls, nom: full, m: [] }; }
  function lignes(v) { return String(v || "").split("\n").map(function (x) { return x.trim().slice(0, 80); }).filter(Boolean).slice(0, 8); }
  var UI = { cls: (new URLSearchParams(location.search).get("cls")) || null, el: null }, TY = { quiz: "❓ Quiz", lien: "🔗 Vidéo ou lien", txt: "✏ Autre" };
  function tget(cls) { var t = EPSD.espace.get("t|" + cls); return (t && Array.isArray(t.todo)) ? t : { id: "t|" + cls, k: "todo", cls: cls, todo: [], pub: "" }; }
  function render() { var C = classes(), E = window.EPSD && EPSD.espace;
    if (!E) { $("#pg").innerHTML = '<div class="card"><p class="mut">Chargement…</p></div>'; return; }
    var h = '<div class="card"><h2>L\'espace de tes élèves, sur leur téléphone</h2><p class="mut">Un seul lien pour tous ; chacun entre son code personnel de 6 caractères. Il y trouve ce qu\'il a à faire et ses activités (progression, bilans publiés).</p>' +
      (E.pret() ? '<div class="row"><input class="in" readonly value="' + esc(E.lien()) + '" style="flex:1;min-width:220px" aria-label="Lien de l\'espace élève"><button class="btn" id="cp" type="button">📋 Copier le lien</button></div><div id="qr" style="margin-top:10px"></div>' : '<p class="msg" style="color:var(--no)">Règle d\'abord le partage entre tablettes (accueil → Réglages communs).</p>') + "</div>" +
      '<div class="card"><h2>Classe</h2>' + (C.length ? '<div class="chips">' + C.map(function (o, i) { return '<button type="button" class="chip' + (UI.cls === o.nom ? " on" : "") + '" data-c="' + i + '">' + esc(o.nom) + "</button>"; }).join("") + "</div>" : '<p class="mut">Aucune liste de classe sur cet appareil.</p>') + "</div>";
    var o = C.filter(function (x) { return x.nom === UI.cls; })[0];
    if (o) { var T = tget(o.nom), Q = quizzes(), EL = eleves(o);
      h += '<div class="card"><h2>À faire · ' + esc(o.nom) + '</h2><p class="mut">Ce que les élèves verront dans l\'onglet « À faire ». Publie après chaque changement.</p>' +
        (T.todo.length ? T.todo.map(function (t, i) { return '<div class="tk"><span class="ty">' + TY[t.ty] + "</span>" +
            (t.ty === "quiz" ? '<select class="in" data-q="' + i + '" style="flex:1;min-width:180px" aria-label="Quiz">' + (Q.length ? Q.map(function (q) { return '<option value="' + esc(q.id) + '"' + (q.id === t.qz ? " selected" : "") + ">" + esc(q.nom) + "</option>"; }).join("") : "<option value=''>Aucun quiz : crée-en dans Quiz</option>") + "</select>"
              : '<input class="in" data-t="' + i + '" value="' + esc(t.t || "") + '" maxlength="120" placeholder="' + (t.ty === "lien" ? "Titre : Regarde la vidéo du service" : "Auto-positionne-toi en volley avec le QR code de ta fiche") + '" style="flex:1;min-width:180px" aria-label="Intitulé">' + (t.ty === "lien" ? '<input class="in" data-u="' + i + '" value="' + esc(t.url || "") + '" maxlength="400" placeholder="https://…" inputmode="url" style="flex:1;min-width:180px" aria-label="Adresse du lien">' : "")) +
            '<button class="btn d" data-rm="' + i + '" type="button" aria-label="Retirer">🗑</button></div>'; }).join("") : '<p class="mut">Rien à faire pour l\'instant.</p>') +
        '<div class="row"><button class="btn" data-add="quiz" type="button">＋ Quiz</button><button class="btn" data-add="lien" type="button">＋ Vidéo ou lien</button><button class="btn" data-add="txt" type="button">＋ Autre (auto-positionnement, consigne…)</button></div>' +
        '<div class="row"><button class="btn p" id="pub" type="button"' + (E.pret() && EL.length ? "" : " disabled") + '>🌐 Publier l\'espace de ' + EL.length + ' élèves</button><button class="btn" id="codes" type="button">🔑 Codes des élèves</button><span class="msg" id="pm" role="status"></span></div>' +
        '<p class="mut">' + (T.pub ? "Dernière publication : " + esc(T.pub) + "." : "Pas encore publié.") + " La publication envoie aussi la progression de chaque élève (chiffrée avec son code).</p></div>";
      var DI = E.dispenses(o.nom).map(nk), ELS = EL.slice().sort(function (a, b) { return (DI.indexOf(nk(b)) >= 0) - (DI.indexOf(nk(a)) >= 0) || a.localeCompare(b, "fr"); });
      var R = E.retours(o.nom), by = {}; R.forEach(function (r) { by[nk(r.nom)] = r; });
      h += '<div class="card" id="missions"><h2>🎯 Missions individuelles</h2><p class="mut">Pour un élève dispensé ou un rôle du jour : une mission sur son téléphone (ou une tablette), par le même lien et son code. Les dispensés du jour sont en tête.</p><div class="chips">' + ELS.map(function (n, i) { var has = mget(o.nom, n).m.length; return '<button type="button" class="chip' + (UI.el === n ? " on" : "") + '" data-el="' + i + '">' + (DI.indexOf(nk(n)) >= 0 ? "🩹 " : "") + esc(n) + (has ? " · " + has + " 🎯" : "") + "</button>"; }).join("") + "</div>";
      if (UI.el && EL.indexOf(UI.el) >= 0) { var M = mget(o.nom, UI.el), rr = by[nk(UI.el)], ob = (rr && rr.obs) || {};
        h += '<h2 style="margin-top:16px">' + esc(UI.el) + "</h2>" + (M.m.length ? M.m.map(function (m, i) { var x = ob[m.id];
            return '<div class="tk" style="align-items:flex-start"><span class="ty">' + (m.ty === "cpt" ? "🔢 Compteur" : "🎭 Rôle") + '</span><span style="flex:1;min-width:220px"><input class="in" data-mt="' + i + '" value="' + esc(m.t) + '" maxlength="60" style="width:100%;font-weight:800" aria-label="Titre de la mission"><textarea class="in" data-ml="' + i + '" rows="' + Math.max(3, m.l.length) + '" style="width:100%;margin-top:6px" aria-label="' + (m.ty === "cpt" ? "Ce qu\'il compte, un par ligne" : "Ce qu\'il regarde, un par ligne") + '">' + esc(m.l.join("\n")) + "</textarea>" +
              (m.ty === "role" ? '<textarea class="in" data-md="' + i + '" rows="2" style="width:100%;margin-top:6px" aria-label="Ce qu\'il dit, une phrase par ligne">' + esc((m.d || []).join("\n")) + "</textarea>" : "") +
              (x ? '<p class="msg" style="color:var(--ok);margin:6px 0 0">Retour : ' + (m.ty === "cpt" ? esc((x.who ? x.who + " · " : "") + m.l.map(function (l, k) { return l + " " + ((x.c || [])[k] || 0); }).join(" · ")) : "rôle tenu : " + (x.r === "o" ? "oui" : x.r === "p" ? "en partie" : "–") + " · " + ((x.v || []).length) + " / " + m.l.length + " repères vus") + "</p>" : "") +
              '</span><button class="btn d" data-mrm="' + i + '" type="button" aria-label="Retirer la mission">🗑</button></div>'; }).join("") : '<p class="mut">Aucune mission pour cet élève.</p>') +
          '<div class="row"><select class="in" id="mmod" aria-label="Modèle de mission">' + MOD.map(function (m, i) { return '<option value="' + i + '">' + (m.ty === "cpt" ? "🔢 " : "🎭 ") + esc(m.t) + "</option>"; }).join("") + '</select><button class="btn" id="madd" type="button">＋ Ajouter</button><span style="flex:1"></span><button class="btn p" id="mpub" type="button"' + (E.pret() ? "" : " disabled") + '>🌐 Publier pour cet élève</button><span class="msg" id="mm" role="status"></span></div><p class="mut">Titres et lignes sont modifiables. L\'élève ouvre le lien de l\'espace (QR code en haut) avec son code : ' + esc(E.code(o.nom, UI.el) || "créé à la publication") + ".</p>"; }
      h += "</div>";
      var QI = (jget("eps.quiz.v1", {}) || {}).items || {};
      h += '<div class="card"><h2>Retours des élèves</h2><div class="row" style="margin-top:0"><button class="btn" id="rel" type="button">📥 Relever les retours</button><span class="msg" id="rm" role="status"></span></div>' +
        (T.todo.length ? '<table><tr><th>Élève</th>' + T.todo.map(function (t, i) { return "<th>" + (i + 1) + " · " + TY[t.ty].slice(0, 2) + "</th>"; }).join("") + "</tr>" + EL.map(function (n) { var r = by[nk(n)];
            return "<tr><td>" + esc(n) + "</td>" + T.todo.map(function (t) { var done = r && r.fait && r.fait[t.id], sc = ""; if (t.ty === "quiz") { Object.keys(QI).forEach(function (id) { var x = QI[id]; if (x && x.k === "res" && x.qz === t.qz && ck(x.cls) === ck(o.nom) && nk(x.nom) === nk(n)) sc = x.s + "/" + x.n; }); }
              return "<td>" + (sc ? "<b>" + sc + "</b>" : done ? "✓" : "–") + "</td>"; }).join("") + "</tr>"; }).join("") + "</table>" : '<p class="mut">Ajoute des choses à faire pour suivre les retours.</p>') + "</div>"; }
